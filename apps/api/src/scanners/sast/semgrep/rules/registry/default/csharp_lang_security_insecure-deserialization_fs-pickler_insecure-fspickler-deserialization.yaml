rules:
  - id: >-
      csharp.lang.security.insecure-deserialization.fs-pickler.insecure-fspickler-deserialization
    severity: WARNING
    languages:
      - C#
    metadata:
      cwe:
        - 'CWE-502: Deserialization of Untrusted Data'
      owasp:
        - A08:2017 - Insecure Deserialization
        - A08:2021 - Software and Data Integrity Failures
        - A08:2025 - Software or Data Integrity Failures
      references:
        - >-
          https://mbraceproject.github.io/FsPickler/tutorial.html#Disabling-Subtype-Resolution
      category: security
      technology:
        - .net
      confidence: MEDIUM
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: LOW
      impact: HIGH
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - 'Insecure Deserialization '
      source: >-
        https://semgrep.dev/r/csharp.lang.security.insecure-deserialization.fs-pickler.insecure-fspickler-deserialization
      shortlink: https://sg.run/E5e5
      semgrep.dev:
        rule:
          r_id: 11137
          rv_id: 1262638
          rule_id: kxURnR
          version_id: LjTkgPk
          url: >-
            https://semgrep.dev/playground/r/LjTkgPk/csharp.lang.security.insecure-deserialization.fs-pickler.insecure-fspickler-deserialization
          origin: community
    message: >-
      The FsPickler is dangerous and is not recommended for data processing.
      Default configuration tend to insecure deserialization vulnerability.
    patterns:
      - pattern-inside: |
          using MBrace.FsPickler.Json;
          ...
      - pattern: |
          FsPickler.CreateJsonSerializer();
