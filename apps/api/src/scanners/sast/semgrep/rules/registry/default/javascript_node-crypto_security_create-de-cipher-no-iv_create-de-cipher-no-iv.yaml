rules:
  - id: >-
      javascript.node-crypto.security.create-de-cipher-no-iv.create-de-cipher-no-iv
    message: >-
      The deprecated functions 'createCipher' and 'createDecipher' generate the
      same initialization vector every time. For counter modes such as CTR, GCM,
      or CCM this leads to break of both confidentiality and integrity, if the
      key is used more than once. Other modes are still affected in their
      strength, though they're not completely broken. Use 'createCipheriv' or
      'createDecipheriv' instead.
    metadata:
      cwe:
        - 'CWE-1204: Generation of Weak Initialization Vector (IV)'
      category: security
      subcategory:
        - vuln
      technology:
        - node-crypto
      likelihood: HIGH
      impact: MEDIUM
      confidence: HIGH
      references:
        - >-
          https://nodejs.org/api/crypto.html#cryptocreatecipheralgorithm-password-options
        - >-
          https://nodejs.org/api/crypto.html#cryptocreatedecipheralgorithm-password-options
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Other
      source: >-
        https://semgrep.dev/r/javascript.node-crypto.security.create-de-cipher-no-iv.create-de-cipher-no-iv
      shortlink: https://sg.run/bw33r
      semgrep.dev:
        rule:
          r_id: 146570
          rv_id: 945898
          rule_id: X5UQRR7
          version_id: ZRT3510
          url: >-
            https://semgrep.dev/playground/r/ZRT3510/javascript.node-crypto.security.create-de-cipher-no-iv.create-de-cipher-no-iv
          origin: community
    languages:
      - javascript
      - typescript
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: |
              $CRYPTO.createCipher(...)
          - pattern: |
              $CRYPTO.createDecipher(...)
