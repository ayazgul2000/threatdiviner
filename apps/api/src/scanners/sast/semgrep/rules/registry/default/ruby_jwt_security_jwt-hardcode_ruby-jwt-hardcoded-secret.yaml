rules:
  - id: ruby.jwt.security.jwt-hardcode.ruby-jwt-hardcoded-secret
    message: >-
      Hardcoded JWT secret or private key is used. This is a Insufficiently
      Protected Credentials weakness:
      https://cwe.mitre.org/data/definitions/522.html Consider using an
      appropriate security mechanism to protect the credentials (e.g. keeping
      secrets in environment variables)
    metadata:
      cwe:
        - 'CWE-522: Insufficiently Protected Credentials'
      owasp:
        - A02:2017 - Broken Authentication
        - A04:2021 - Insecure Design
        - A06:2025 - Insecure Design
      source-rule-url: >-
        https://semgrep.dev/blog/2020/hardcoded-secrets-unverified-tokens-and-other-common-jwt-mistakes/
      category: security
      technology:
        - jwt
      references:
        - https://owasp.org/Top10/A04_2021-Insecure_Design
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/ruby.jwt.security.jwt-hardcode.ruby-jwt-hardcoded-secret
      shortlink: https://sg.run/GW2B
      semgrep.dev:
        rule:
          r_id: 9704
          rv_id: 1263590
          rule_id: WAUZz5
          version_id: 7ZTE3d7
          url: >-
            https://semgrep.dev/playground/r/7ZTE3d7/ruby.jwt.security.jwt-hardcode.ruby-jwt-hardcoded-secret
          origin: community
    patterns:
      - pattern-inside: |
          require 'jwt'
          ...
      - pattern-either:
          - pattern: |
              JWT.encode($PAYLOAD,"...",...)
          - pattern: |
              JWT.decode($PAYLOAD,"...",...)
          - pattern: |
              JWT.encode($PAYLOAD,nil,...)
          - pattern: |
              JWT.decode($PAYLOAD,nil,...)
          - pattern: |
              $SECRET = "..."
              ...
              JWT.encode($PAYLOAD,$SECRET,...)
          - pattern: |
              $SECRET = "..."
              ...
              JWT.decode($PAYLOAD,$SECRET,...)
      - pattern-not: |
          JWT.encode($PAYLOAD, nil, ... , jwks: ..., ...)
      - pattern-not: |
          JWT.decode($PAYLOAD, nil, ..., jwks: ..., ...)
    languages:
      - ruby
    severity: ERROR
