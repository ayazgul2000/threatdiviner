rules:
  - id: go.lang.security.zip.path-traversal-inside-zip-extraction
    message: File traversal when extracting zip archive
    metadata:
      cwe:
        - >-
          CWE-22: Improper Limitation of a Pathname to a Restricted Directory
          ('Path Traversal')
      source_rule_url: https://github.com/securego/gosec/issues/205
      category: security
      technology:
        - go
      confidence: LOW
      owasp:
        - A05:2017 - Broken Access Control
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      references:
        - https://owasp.org/Top10/A01_2021-Broken_Access_Control
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Path Traversal
      source: >-
        https://semgrep.dev/r/go.lang.security.zip.path-traversal-inside-zip-extraction
      shortlink: https://sg.run/Av64
      semgrep.dev:
        rule:
          r_id: 9106
          rv_id: 1262971
          rule_id: zdUkoR
          version_id: rxTAK1Z
          url: >-
            https://semgrep.dev/playground/r/rxTAK1Z/go.lang.security.zip.path-traversal-inside-zip-extraction
          origin: community
    languages:
      - go
    severity: WARNING
    pattern: |
      reader, $ERR := zip.OpenReader($ARCHIVE)
      ...
      for _, $FILE := range reader.File {
        ...
        path := filepath.Join($TARGET, $FILE.Name)
        ...
      }
