rules:
  - id: python.django.security.audit.csrf-exempt.no-csrf-exempt
    pattern: |
      @django.views.decorators.csrf.csrf_exempt
      def $R(...):
        ...
    message: >-
      Detected usage of @csrf_exempt, which indicates that there is no CSRF
      token set for this route. This could lead to an attacker manipulating the
      user's account and exfiltration of private data. Instead, create a
      function without this decorator.
    metadata:
      cwe:
        - 'CWE-352: Cross-Site Request Forgery (CSRF)'
      owasp:
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      category: security
      technology:
        - django
      references:
        - https://owasp.org/Top10/A01_2021-Broken_Access_Control
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cross-Site Request Forgery (CSRF)
      source: >-
        https://semgrep.dev/r/python.django.security.audit.csrf-exempt.no-csrf-exempt
      shortlink: https://sg.run/rd5e
      semgrep.dev:
        rule:
          r_id: 9469
          rv_id: 1263361
          rule_id: v8UnqO
          version_id: K3TKk9W
          url: >-
            https://semgrep.dev/playground/r/K3TKk9W/python.django.security.audit.csrf-exempt.no-csrf-exempt
          origin: community
    languages:
      - python
    severity: WARNING
