rules:
  - id: >-
      generic.secrets.security.detected-aws-session-token.detected-aws-session-token
    patterns:
      - pattern-regex: ((?i)AWS_SESSION_TOKEN)\s*(:|=>|=)\s*(?P<TOKEN>[A-Za-z0-9/+=]{16,})
      - pattern-not-regex: (?i)example|sample|test|fake
      - metavariable-analysis:
          analyzer: entropy
          metavariable: $TOKEN
    languages:
      - regex
    message: AWS Session Token detected
    severity: ERROR
    metadata:
      cwe:
        - 'CWE-798: Use of Hard-coded Credentials'
      source-rule-url: >-
        https://github.com/grab/secret-scanner/blob/master/scanner/signatures/pattern.go
      category: security
      technology:
        - secrets
        - aws
      confidence: LOW
      owasp:
        - A07:2021 - Identification and Authentication Failures
        - A07:2025 - Authentication Failures
      references:
        - >-
          https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: HIGH
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Hard-coded Secrets
      source: >-
        https://semgrep.dev/r/generic.secrets.security.detected-aws-session-token.detected-aws-session-token
      shortlink: https://sg.run/DoRW
      semgrep.dev:
        rule:
          r_id: 9052
          rv_id: 1262863
          rule_id: X5U8Er
          version_id: pZT03Lx
          url: >-
            https://semgrep.dev/playground/r/pZT03Lx/generic.secrets.security.detected-aws-session-token.detected-aws-session-token
          origin: community
