rules:
  - id: >-
      python.django.security.injection.email.xss-send-mail-html-message.xss-send-mail-html-message
    message: >-
      Found request data in 'send_mail(...)' that uses 'html_message'. This is
      dangerous because HTML emails are susceptible to XSS. An attacker could
      inject data into this HTML email, causing XSS.
    metadata:
      cwe:
        - >-
          CWE-74: Improper Neutralization of Special Elements in Output Used by
          a Downstream Component ('Injection')
      owasp:
        - A03:2021 - Injection
        - A05:2025 - Injection
      references:
        - https://www.damonkohler.com/2008/12/email-injection.html
      category: security
      technology:
        - django
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Other
      source: >-
        https://semgrep.dev/r/python.django.security.injection.email.xss-send-mail-html-message.xss-send-mail-html-message
      shortlink: https://sg.run/Avx8
      semgrep.dev:
        rule:
          r_id: 9506
          rv_id: 1263391
          rule_id: lBU9Ll
          version_id: gETB7Gn
          url: >-
            https://semgrep.dev/playground/r/gETB7Gn/python.django.security.injection.email.xss-send-mail-html-message.xss-send-mail-html-message
          origin: community
    languages:
      - python
    severity: WARNING
    patterns:
      - pattern-inside: |
          def $FUNC(...):
            ...
      - pattern-either:
          - pattern: >-
              django.core.mail.send_mail(..., html_message=request.$W.get(...),
              ...)
          - pattern: |
              $DATA = request.$W.get(...)
              ...
              django.core.mail.send_mail(..., html_message=$DATA, ...)
          - pattern: |
              $DATA = request.$W.get(...)
              ...
              $INTERM = $DATA
              ...
              django.core.mail.send_mail(..., html_message=$INTERM, ...)
          - pattern: >
              $DATA = request.$W.get(...)

              ...

              django.core.mail.send_mail(..., html_message=$STR.format(...,
              $DATA, ...), ...)
          - pattern: |
              $DATA = request.$W.get(...)
              ...
              $INTERM = $STR.format(..., $DATA, ...)
              ...
              django.core.mail.send_mail(..., html_message=$INTERM, ...)
          - pattern: |
              $DATA = request.$W.get(...)
              ...
              django.core.mail.send_mail(..., html_message=$STR % $DATA, ...)
          - pattern: |
