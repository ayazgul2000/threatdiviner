rules:
  - id: go.lang.security.audit.md5-used-as-password.md5-used-as-password
    languages:
      - go
    severity: WARNING
    message: >-
      It looks like MD5 is used as a password hash. MD5 is not considered a
      secure password hash because it can be cracked by an attacker in a short
      amount of time. Use a suitable password hashing function such as bcrypt.
      You can use the `golang.org/x/crypto/bcrypt` package.
    options:
      interfile: true
    metadata:
      category: security
      technology:
        - md5
      references:
        - >-
          https://tools.ietf.org/id/draft-lvelvindron-tls-md5-sha1-deprecate-01.html
        - >-
          https://security.stackexchange.com/questions/211/how-to-securely-hash-passwords
        - https://github.com/returntocorp/semgrep-rules/issues/1609
        - https://pkg.go.dev/golang.org/x/crypto/bcrypt
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      cwe:
        - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
      confidence: MEDIUM
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      interfile: true
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/go.lang.security.audit.md5-used-as-password.md5-used-as-password
      shortlink: https://sg.run/4eOE
      semgrep.dev:
        rule:
          r_id: 14688
          rv_id: 1262938
          rule_id: 4bU1Wj
          version_id: nWT2L9r
          url: >-
            https://semgrep.dev/playground/r/nWT2L9r/go.lang.security.audit.md5-used-as-password.md5-used-as-password
          origin: community
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: md5.New
              - pattern: md5.Sum
    pattern-sinks:
      - patterns:
          - pattern: $FUNCTION(...)
          - metavariable-regex:
              metavariable: $FUNCTION
              regex: (?i)(.*password.*)
