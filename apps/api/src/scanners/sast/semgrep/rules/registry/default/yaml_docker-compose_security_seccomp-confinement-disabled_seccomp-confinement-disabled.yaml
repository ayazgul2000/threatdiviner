rules:
  - id: >-
      yaml.docker-compose.security.seccomp-confinement-disabled.seccomp-confinement-disabled
    patterns:
      - pattern-inside: |
          version: ...
          ...
          services:
            ...
      - pattern: |
          $SERVICE:
            ...
            image: ...
            ...
            security_opt:
              - ...
              - seccomp:unconfined
    message: >-
      Service '$SERVICE' is explicitly disabling seccomp confinement. This runs
      the service in an unrestricted state. Remove 'seccomp:unconfined' to
      prevent this.
    metadata:
      cwe:
        - 'CWE-284: Improper Access Control'
      references:
        - https://docs.docker.com/engine/security/seccomp/
      category: security
      technology:
        - docker-compose
      owasp:
        - A05:2017 - Broken Access Control
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      subcategory:
        - audit
      likelihood: LOW
      impact: HIGH
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authorization
      source: >-
        https://semgrep.dev/r/yaml.docker-compose.security.seccomp-confinement-disabled.seccomp-confinement-disabled
      shortlink: https://sg.run/KWkY
      semgrep.dev:
        rule:
          r_id: 10055
          rv_id: 1263923
          rule_id: lBUdW3
          version_id: K3TKkXA
          url: >-
            https://semgrep.dev/playground/r/K3TKkXA/yaml.docker-compose.security.seccomp-confinement-disabled.seccomp-confinement-disabled
          origin: community
    languages:
      - yaml
    severity: WARNING
