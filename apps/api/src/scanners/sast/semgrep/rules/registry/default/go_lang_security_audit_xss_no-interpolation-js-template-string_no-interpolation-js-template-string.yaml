rules:
  - id: >-
      go.lang.security.audit.xss.no-interpolation-js-template-string.no-interpolation-js-template-string
    message: >-
      Detected template variable interpolation in a JavaScript template string.
      This is potentially vulnerable to cross-site scripting (XSS) attacks
      because a malicious actor has control over JavaScript but without the need
      to use escaped characters. Instead, obtain this variable outside of the
      template string and ensure your template is properly escaped.
    metadata:
      cwe:
        - >-
          CWE-79: Improper Neutralization of Input During Web Page Generation
          ('Cross-site Scripting')
      owasp:
        - A07:2017 - Cross-Site Scripting (XSS)
        - A03:2021 - Injection
        - A05:2025 - Injection
      references:
        - https://github.com/golang/go/issues/9200#issuecomment-66100328
        - >-
          https://blogtitle.github.io/robn-go-security-pearls-cross-site-scripting-xss/
      category: security
      technology:
        - generic
      confidence: LOW
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cross-Site-Scripting (XSS)
      source: >-
        https://semgrep.dev/r/go.lang.security.audit.xss.no-interpolation-js-template-string.no-interpolation-js-template-string
      shortlink: https://sg.run/8yl7
      semgrep.dev:
        rule:
          r_id: 9140
          rv_id: 1262960
          rule_id: BYUNR6
          version_id: YDTZeEB
          url: >-
            https://semgrep.dev/playground/r/YDTZeEB/go.lang.security.audit.xss.no-interpolation-js-template-string.no-interpolation-js-template-string
          origin: community
    languages:
      - generic
    severity: WARNING
    paths:
      include:
        - '*.html'
        - '*.thtml'
        - '*.gohtml'
        - '*.tmpl'
        - '*.tpl'
    patterns:
      - pattern-inside: <script ...> ... ... ... ... ... </script>
      - pattern: '` ... {{ ... }} ...`'
