rules:
  - id: >-
      python.pycryptodome.security.insecure-hash-algorithm-md4.insecure-hash-algorithm-md4
    message: >-
      Detected MD4 hash algorithm which is considered insecure. MD4 is not
      collision resistant and is therefore not suitable as a cryptographic
      signature. Use a modern hash algorithm from the SHA-2, SHA-3, or BLAKE2
      family instead.
    metadata:
      source-rule-url: >-
        https://github.com/PyCQA/bandit/blob/d5f8fa0d89d7b11442fc6ec80ca42953974354c8/bandit/blacklists/calls.py#L59
      cwe:
        - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      references:
        - https://www.pycryptodome.org/src/hash/hash#modern-hash-algorithms
        - https://www.schneier.com/blog/archives/2012/10/when_will_we_se.html
        - >-
          https://www.trendmicro.com/vinfo/us/security/news/vulnerabilities-and-exploits/sha-1-collision-signals-the-end-of-the-algorithm-s-viability
        - http://2012.sharcs.org/slides/stevens.pdf
        - https://pycryptodome.readthedocs.io/en/latest/src/hash/sha3_256.html
      category: security
      technology:
        - pycryptodome
      subcategory:
        - vuln
      likelihood: LOW
      impact: MEDIUM
      confidence: HIGH
      functional-categories:
        - crypto::search::hash-algorithm::pycryptodome
        - crypto::search::hash-algorithm::pycryptodomex
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/python.pycryptodome.security.insecure-hash-algorithm-md4.insecure-hash-algorithm-md4
      shortlink: https://sg.run/Lve6
      semgrep.dev:
        rule:
          r_id: 33639
          rv_id: 1263551
          rule_id: BYUJy4
          version_id: 3ZT4Xnp
          url: >-
            https://semgrep.dev/playground/r/3ZT4Xnp/python.pycryptodome.security.insecure-hash-algorithm-md4.insecure-hash-algorithm-md4
          origin: community
    options:
      symbolic_propagation: true
    severity: WARNING
    languages:
      - python
    pattern-either:
      - pattern: Crypto.Hash.MD4.new(...)
      - pattern: Cryptodome.Hash.MD4.new (...)
