rules:
  - id: >-
      python.lang.security.audit.insecure-transport.urllib.insecure-urlopener-retrieve.insecure-urlopener-retrieve
    message: >-
      Detected an unsecured transmission channel. 'URLopener.retrieve(...)' is
      being used with 'http://'. Use 'https://' instead to secure the channel.
    metadata:
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      cwe:
        - 'CWE-319: Cleartext Transmission of Sensitive Information'
      references:
        - >-
          https://docs.python.org/3/library/urllib.request.html#urllib.request.URLopener.retrieve
      category: security
      technology:
        - urllib
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Mishandled Sensitive Information
      source: >-
        https://semgrep.dev/r/python.lang.security.audit.insecure-transport.urllib.insecure-urlopener-retrieve.insecure-urlopener-retrieve
      shortlink: https://sg.run/XBGK
      semgrep.dev:
        rule:
          r_id: 9664
          rv_id: 1263497
          rule_id: bwUw0n
          version_id: JdTzxBj
          url: >-
            https://semgrep.dev/playground/r/JdTzxBj/python.lang.security.audit.insecure-transport.urllib.insecure-urlopener-retrieve.insecure-urlopener-retrieve
          origin: community
    severity: WARNING
    languages:
      - python
    fix-regex:
      regex: '[Hh][Tt][Tt][Pp]://'
      replacement: https://
      count: 1
    pattern-either:
      - pattern: >-
          urllib.request.URLopener(...).retrieve("=~/[Hh][Tt][Tt][Pp]://.*/",
          ...)
      - patterns:
          - pattern-inside: |
              $OPENERDIRECTOR = urllib.request.URLopener(...)
              ...
          - pattern: $OPENERDIRECTOR.retrieve("=~/[Hh][Tt][Tt][Pp]://.*/", ...)
      - patterns:
          - pattern-inside: |
              $OPENERDIRECTOR = urllib.request.URLopener(...)
              ...
          - pattern: |
              $URL = "=~/[Hh][Tt][Tt][Pp]://.*/"
              ...
              $OPENERDIRECTOR.retrieve($URL, ...)
      - pattern: |
          $URL = "=~/[Hh][Tt][Tt][Pp]://.*/"
          ...
          urllib.request.URLopener(...).retrieve($URL, ...)
      - patterns:
          - pattern-inside: |
              def $FUNC(..., $URL = "=~/[Hh][Tt][Tt][Pp]://.*/", ...):
                ...
          - pattern-either:
              - pattern: urllib.request.URLopener(...).retrieve($URL, ...)
              - patterns:
                  - pattern-inside: |
                      $OPENERDIRECTOR = urllib.request.URLopener(...)
                      ...
                  - pattern: $OPENERDIRECTOR.retrieve($URL, ...)
