rules:
  - id: c.lang.security.double-free.double-free
    patterns:
      - pattern-not: |
          free($VAR);
          ...
          $VAR = NULL;
          ...
          free($VAR);
      - pattern-not: |
          free($VAR);
          ...
          $VAR = malloc(...);
          ...
          free($VAR);
      - pattern-inside: |
          free($VAR);
          ...
          $FREE($VAR);
      - metavariable-pattern:
          metavariable: $FREE
          pattern: free
      - focus-metavariable: $FREE
    message: Variable '$VAR' was freed twice. This can lead to undefined behavior.
    metadata:
      cwe:
        - 'CWE-415: Double Free'
      owasp:
        - A03:2021 - Injection
        - A01:2017 - Injection
        - A05:2025 - Injection
      references:
        - https://cwe.mitre.org/data/definitions/415.html
        - https://owasp.org/www-community/vulnerabilities/Doubly_freeing_memory
      category: security
      technology:
        - c
      confidence: LOW
      subcategory:
        - vuln
      likelihood: LOW
      impact: HIGH
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Memory Issues
      source: https://semgrep.dev/r/c.lang.security.double-free.double-free
      shortlink: https://sg.run/eLl0
      semgrep.dev:
        rule:
          r_id: 8832
          rv_id: 1262604
          rule_id: JDUyw8
          version_id: RGT0L3W
          url: >-
            https://semgrep.dev/playground/r/RGT0L3W/c.lang.security.double-free.double-free
          origin: community
    languages:
      - c
    severity: ERROR
