rules:
  - id: python.django.security.injection.tainted-sql-string.tainted-sql-string
    message: >-
      Detected user input used to manually construct a SQL string. This is
      usually bad practice because manual construction could accidentally result
      in a SQL injection. An attacker could use a SQL injection to steal or
      modify contents of the database. Instead, use a parameterized query which
      is available by default in most database engines. Alternatively, consider
      using the Django object-relational mappers (ORM) instead of raw SQL
      queries.
    metadata:
      cwe:
        - >-
          CWE-915: Improperly Controlled Modification of Dynamically-Determined
          Object Attributes
      owasp:
        - A08:2021 - Software and Data Integrity Failures
        - A08:2025 - Software or Data Integrity Failures
      references:
        - >-
          https://docs.djangoproject.com/en/3.0/topics/security/#sql-injection-protection
      category: security
      technology:
        - django
      subcategory:
        - audit
      impact: LOW
      likelihood: MEDIUM
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Mass Assignment
      source: >-
        https://semgrep.dev/r/python.django.security.injection.tainted-sql-string.tainted-sql-string
      shortlink: https://sg.run/PbZp
      semgrep.dev:
        rule:
          r_id: 14701
          rv_id: 1263408
          rule_id: lBU8Ad
          version_id: YDTZeje
          url: >-
            https://semgrep.dev/playground/r/YDTZeje/python.django.security.injection.tainted-sql-string.tainted-sql-string
          origin: community
    severity: ERROR
    languages:
      - python
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: request.$ANYTHING
          - pattern-not: request.build_absolute_uri
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: |
                  "$SQLSTR" + ...
              - pattern: |
                  "$SQLSTR" % ...
              - pattern: |
                  "$SQLSTR".format(...)
              - pattern: |
                  f"$SQLSTR{...}..."
          - metavariable-regex:
              metavariable: $SQLSTR
              regex: \s*(?i)(select|delete|insert|create|update|alter|drop)\b.*
