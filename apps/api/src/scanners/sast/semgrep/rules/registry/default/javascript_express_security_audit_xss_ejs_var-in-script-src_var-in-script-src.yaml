rules:
  - id: >-
      javascript.express.security.audit.xss.ejs.var-in-script-src.var-in-script-src
    message: >-
      Detected a template variable used as the 'src' in a script tag. Although
      template variables are HTML escaped, HTML escaping does not always prevent
      malicious URLs from being injected and could results in a cross-site
      scripting (XSS) vulnerability. Prefer not to dynamically generate the
      'src' attribute and use static URLs instead. If you must do this,
      carefully check URLs against an allowlist and be sure to URL-encode the
      result.
    metadata:
      cwe:
        - >-
          CWE-79: Improper Neutralization of Input During Web Page Generation
          ('Cross-site Scripting')
      owasp:
        - A07:2017 - Cross-Site Scripting (XSS)
        - A03:2021 - Injection
        - A05:2025 - Injection
      references:
        - >-
          https://www.veracode.com/blog/secure-development/nodejs-template-engines-why-default-encoders-are-not-enough
        - https://github.com/ESAPI/owasp-esapi-js
      category: security
      technology:
        - express
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cross-Site-Scripting (XSS)
      source: >-
        https://semgrep.dev/r/javascript.express.security.audit.xss.ejs.var-in-script-src.var-in-script-src
      shortlink: https://sg.run/ndxZ
      semgrep.dev:
        rule:
          r_id: 9280
          rv_id: 1263153
          rule_id: JDUyrJ
          version_id: RGT0LwD
          url: >-
            https://semgrep.dev/playground/r/RGT0LwD/javascript.express.security.audit.xss.ejs.var-in-script-src.var-in-script-src
          origin: community
    languages:
      - generic
    severity: WARNING
    patterns:
      - pattern-inside: <script ...>
      - pattern-either:
          - pattern-inside: src = '...'
          - pattern-inside: src = "..."
      - pattern: <% ... >
    paths:
      include:
        - '*.ejs'
        - '*.html'
