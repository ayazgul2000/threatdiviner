rules:
  - id: >-
      java.lang.security.audit.xxe.documentbuilderfactory-external-parameter-entities-true.documentbuilderfactory-external-parameter-entities-true
    severity: ERROR
    metadata:
      cwe:
        - 'CWE-611: Improper Restriction of XML External Entity Reference'
      owasp:
        - A04:2017 - XML External Entities (XXE)
        - A05:2021 - Security Misconfiguration
        - A02:2025 - Security Misconfiguration
      asvs:
        section: V5 Validation, Sanitization and Encoding
        control_id: 5.5.2 Insecue XML Deserialization
        control_url: >-
          https://github.com/OWASP/ASVS/blob/master/4.0/en/0x13-V5-Validation-Sanitization-Encoding.md#v55-deserialization-prevention
        version: '4'
      references:
        - https://semgrep.dev/blog/2022/xml-security-in-java
        - https://semgrep.dev/docs/cheat-sheets/java-xxe/
        - https://blog.sonarsource.com/secure-xml-processor
      category: security
      technology:
        - java
        - xml
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: LOW
      impact: HIGH
      confidence: HIGH
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - XML Injection
      source: >-
        https://semgrep.dev/r/java.lang.security.audit.xxe.documentbuilderfactory-external-parameter-entities-true.documentbuilderfactory-external-parameter-entities-true
      shortlink: https://sg.run/5Lv0
      semgrep.dev:
        rule:
          r_id: 18247
          rv_id: 1263060
          rule_id: yyUNeo
          version_id: l4TJRoL
          url: >-
            https://semgrep.dev/playground/r/l4TJRoL/java.lang.security.audit.xxe.documentbuilderfactory-external-parameter-entities-true.documentbuilderfactory-external-parameter-entities-true
          origin: community
    message: >-
      External entities are allowed for $DBFACTORY. This is vulnerable to XML
      external entity attacks. Disable this by setting the feature
      "http://xml.org/sax/features/external-parameter-entities" to false.
    pattern: >-
      $DBFACTORY.setFeature("http://xml.org/sax/features/external-parameter-entities",
      true);
    fix: >-
      $DBFACTORY.setFeature("http://xml.org/sax/features/external-parameter-entities",
      false);
    languages:
      - java
