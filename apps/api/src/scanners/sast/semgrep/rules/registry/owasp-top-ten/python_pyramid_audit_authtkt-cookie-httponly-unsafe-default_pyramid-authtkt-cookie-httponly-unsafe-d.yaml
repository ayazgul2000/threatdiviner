rules:
  - id: >-
      python.pyramid.audit.authtkt-cookie-httponly-unsafe-default.pyramid-authtkt-cookie-httponly-unsafe-default
    patterns:
      - pattern: pyramid.authentication.$FUNC($...PARAMS)
      - metavariable-pattern:
          metavariable: $FUNC
          pattern-either:
            - pattern: AuthTktCookieHelper
            - pattern: AuthTktAuthenticationPolicy
      - pattern-not: pyramid.authentication.$FUNC(..., httponly=$HTTPONLY, ...)
      - pattern-not: pyramid.authentication.$FUNC(..., **$PARAMS, ...)
      - focus-metavariable: $...PARAMS
    fix: |
      $...PARAMS, httponly=True
    message: >-
      Found a Pyramid Authentication Ticket cookie without the httponly option
      correctly set. Pyramid cookies should be handled securely by setting
      httponly=True. If this parameter is not properly set, your cookies are not
      properly protected and are at risk of being stolen by an attacker.
    metadata:
      cwe:
        - 'CWE-1004: Sensitive Cookie Without ''HttpOnly'' Flag'
      owasp:
        - A05:2021 - Security Misconfiguration
        - A02:2025 - Security Misconfiguration
      category: security
      technology:
        - pyramid
      references:
        - https://owasp.org/Top10/A05_2021-Security_Misconfiguration
      subcategory:
        - vuln
      likelihood: LOW
      impact: LOW
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cookie Security
      source: >-
        https://semgrep.dev/r/python.pyramid.audit.authtkt-cookie-httponly-unsafe-default.pyramid-authtkt-cookie-httponly-unsafe-default
      shortlink: https://sg.run/EprB
      semgrep.dev:
        rule:
          r_id: 21437
          rv_id: 1263557
          rule_id: bwUXKB
          version_id: RGT0L7K
          url: >-
            https://semgrep.dev/playground/r/RGT0L7K/python.pyramid.audit.authtkt-cookie-httponly-unsafe-default.pyramid-authtkt-cookie-httponly-unsafe-default
          origin: community
    languages:
      - python
    severity: WARNING
