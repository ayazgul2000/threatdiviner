rules:
  - id: >-
      javascript.angular.security.detect-angular-trust-as-resourceurl-method.detect-angular-trust-as-resourceurl-method
    message: >-
      The use of $sce.trustAsResourceUrl can be dangerous if unsanitized user
      input flows through this API.
    metadata:
      cwe:
        - >-
          CWE-79: Improper Neutralization of Input During Web Page Generation
          ('Cross-site Scripting')
      owasp:
        - A07:2017 - Cross-Site Scripting (XSS)
        - A03:2021 - Injection
        - A05:2025 - Injection
      references:
        - https://docs.angularjs.org/api/ng/service/$sce#trustAsResourceUrl
        - >-
          https://owasp.org/www-chapter-london/assets/slides/OWASPLondon20170727_AngularJS.pdf
      category: security
      technology:
        - angular
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cross-Site-Scripting (XSS)
      source: >-
        https://semgrep.dev/r/javascript.angular.security.detect-angular-trust-as-resourceurl-method.detect-angular-trust-as-resourceurl-method
      shortlink: https://sg.run/eLOd
      semgrep.dev:
        rule:
          r_id: 9232
          rv_id: 1263099
          rule_id: QrUzeq
          version_id: DkTRb7y
          url: >-
            https://semgrep.dev/playground/r/DkTRb7y/javascript.angular.security.detect-angular-trust-as-resourceurl-method.detect-angular-trust-as-resourceurl-method
          origin: community
    languages:
      - javascript
      - typescript
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: |
              $SOURCE = $scope.$INPUT;
              $sce.trustAsResourceUrl($SOURCE);
          - pattern: |
              $sce.trustAsResourceUrl($scope.$INPUT);
      - pattern-inside: |
          app.controller(..., function($scope,$sce){
          ...
          });
