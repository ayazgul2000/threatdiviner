rules:
  - id: >-
      terraform.aws.security.aws-fsx-lustre-files-ystem.aws-fsx-lustre-filesystem-encrypted-with-cmk
    patterns:
      - pattern: |
          resource "aws_fsx_lustre_file_system" $ANYTHING {
            ...
          }
      - pattern-not-inside: |
          resource "aws_fsx_lustre_file_system" $ANYTHING {
            ...
            kms_key_id = ...
            ...
          }
      - pattern-regex: (^aws_kms_key\.(.*))
    message: >-
      Ensure FSX Lustre file system is encrypted at rest using KMS CMKs. CMKs
      gives you control over the encryption key in terms of access and rotation.
    metadata:
      category: security
      technology:
        - terraform
        - aws
      owasp:
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      cwe:
        - 'CWE-200: Exposure of Sensitive Information to an Unauthorized Actor'
      references:
        - https://owasp.org/Top10/A01_2021-Broken_Access_Control
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Mishandled Sensitive Information
      source: >-
        https://semgrep.dev/r/terraform.aws.security.aws-fsx-lustre-files-ystem.aws-fsx-lustre-filesystem-encrypted-with-cmk
      shortlink: https://sg.run/oNG9
      semgrep.dev:
        rule:
          r_id: 17360
          rv_id: 1263721
          rule_id: JDU6gw
          version_id: K3TKk1l
          url: >-
            https://semgrep.dev/playground/r/K3TKk1l/terraform.aws.security.aws-fsx-lustre-files-ystem.aws-fsx-lustre-filesystem-encrypted-with-cmk
          origin: community
    languages:
      - hcl
    severity: WARNING
