rules:
  - id: python.lang.compatibility.python37.python37-compatibility-os1
    pattern: os.preadv(...)
    message: >-
      os.preadv() is only available on Python 3.7+ and is therefore not
      backwards compatible. Instead, use a combination of os.readv() and
      os.pread().
    languages:
      - python
    severity: ERROR
    metadata:
      category: compatibility
      technology:
        - python
