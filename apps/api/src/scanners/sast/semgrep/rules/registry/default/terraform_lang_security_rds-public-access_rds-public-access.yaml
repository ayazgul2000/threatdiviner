rules:
  - id: terraform.lang.security.rds-public-access.rds-public-access
    patterns:
      - pattern: publicly_accessible = true
      - pattern-inside: |
          resource "aws_db_instance" "..." {
            ...
          }
    languages:
      - hcl
    severity: WARNING
    message: RDS instance accessible from the Internet detected.
    metadata:
      references:
        - >-
          https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/db_instance#publicly_accessible
        - >-
          https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_VPC.WorkingWithRDSInstanceinaVPC.html#USER_VPC.Hiding
      cwe:
        - 'CWE-1220: Insufficient Granularity of Access Control'
      category: security
      technology:
        - terraform
        - aws
      owasp:
        - A05:2017 - Broken Access Control
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Other
      source: >-
        https://semgrep.dev/r/terraform.lang.security.rds-public-access.rds-public-access
      shortlink: https://sg.run/Oye2
      semgrep.dev:
        rule:
          r_id: 15831
          rv_id: 1263897
          rule_id: eqUrzK
          version_id: QkTGqqJ
          url: >-
            https://semgrep.dev/playground/r/QkTGqqJ/terraform.lang.security.rds-public-access.rds-public-access
          origin: community
