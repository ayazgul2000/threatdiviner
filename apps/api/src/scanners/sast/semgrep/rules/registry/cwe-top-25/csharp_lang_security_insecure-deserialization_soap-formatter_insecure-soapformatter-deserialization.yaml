rules:
  - id: >-
      csharp.lang.security.insecure-deserialization.soap-formatter.insecure-soapformatter-deserialization
    severity: WARNING
    languages:
      - C#
    metadata:
      cwe:
        - 'CWE-502: Deserialization of Untrusted Data'
      owasp:
        - A08:2017 - Insecure Deserialization
        - A08:2021 - Software and Data Integrity Failures
        - A08:2025 - Software or Data Integrity Failures
      references:
        - >-
          https://docs.microsoft.com/en-us/dotnet/api/system.runtime.serialization.formatters.soap.soapformatter?view=netframework-4.8#remarks
      category: security
      technology:
        - .net
      confidence: MEDIUM
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: LOW
      impact: HIGH
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - 'Insecure Deserialization '
      source: >-
        https://semgrep.dev/r/csharp.lang.security.insecure-deserialization.soap-formatter.insecure-soapformatter-deserialization
      shortlink: https://sg.run/gJnR
      semgrep.dev:
        rule:
          r_id: 11141
          rv_id: 1262644
          rule_id: eqUvND
          version_id: PkTR30n
          url: >-
            https://semgrep.dev/playground/r/PkTR30n/csharp.lang.security.insecure-deserialization.soap-formatter.insecure-soapformatter-deserialization
          origin: community
    message: >-
      The SoapFormatter type is dangerous and is not recommended for data
      processing. Applications should stop using SoapFormatter as soon as
      possible, even if they believe the data they're processing to be
      trustworthy. SoapFormatter is insecure and can't be made secure
    patterns:
      - pattern-inside: |
          using System.Runtime.Serialization.Formatters.Soap;
          ...
      - pattern: |
          new SoapFormatter();
