rules:
  - id: terraform.gcp.security.gcp-sql-public-database.gcp-sql-public-database
    patterns:
      - pattern: resource
      - pattern-either:
          - pattern-inside: |
              resource "google_sql_database_instance" "..." {
              ...
              ip_configuration {
                ...
                authorized_networks {
                  ...
                  value = "0.0.0.0/0"
                  ...
                }
                ...
              }
              ...
              }
          - pattern-inside: |
              resource "google_sql_database_instance" "..." {
              ...
              ip_configuration {
                ...
                dynamic "authorized_networks" {
                  ...
                  content {
                    ...
                    value = "0.0.0.0/0"
                    ...
                  }
                  ...
                }
                ...
              }
              ...
              }
    message: Ensure that Cloud SQL database Instances are not open to the world
    metadata:
      owasp:
        - A05:2017 - Broken Access Control
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      cwe:
        - 'CWE-1220: Insufficient Granularity of Access Control'
      category: security
      technology:
        - terraform
        - gcp
      references:
        - https://owasp.org/Top10/A01_2021-Broken_Access_Control
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Other
      source: >-
        https://semgrep.dev/r/terraform.gcp.security.gcp-sql-public-database.gcp-sql-public-database
      shortlink: https://sg.run/0Xv5
      semgrep.dev:
        rule:
          r_id: 33710
          rv_id: 1263876
          rule_id: d8U7Ll
          version_id: jQTn559
          url: >-
            https://semgrep.dev/playground/r/jQTn559/terraform.gcp.security.gcp-sql-public-database.gcp-sql-public-database
          origin: community
    languages:
      - hcl
    severity: WARNING
