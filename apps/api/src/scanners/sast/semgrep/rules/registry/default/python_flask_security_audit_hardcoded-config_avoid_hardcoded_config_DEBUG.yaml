rules:
  - id: python.flask.security.audit.hardcoded-config.avoid_hardcoded_config_DEBUG
    message: >-
      Hardcoded variable `DEBUG` detected. Set this by using FLASK_DEBUG
      environment variable
    severity: WARNING
    metadata:
      likelihood: LOW
      impact: LOW
      confidence: LOW
      category: security
      cwe:
        - 'CWE-489: Active Debug Code'
      owasp:
        - A05:2021 - Security Misconfiguration
        - A02:2025 - Security Misconfiguration
      references:
        - https://bento.dev/checks/flask/avoid-hardcoded-config/
        - >-
          https://flask.palletsprojects.com/en/1.1.x/config/?highlight=configuration#builtin-configuration-values
        - >-
          https://flask.palletsprojects.com/en/1.1.x/config/?highlight=configuration#environment-and-debug-features
      subcategory:
        - audit
      technology:
        - flask
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Active Debug Code
      source: >-
        https://semgrep.dev/r/python.flask.security.audit.hardcoded-config.avoid_hardcoded_config_DEBUG
      shortlink: https://sg.run/LwPo
      semgrep.dev:
        rule:
          r_id: 9539
          rv_id: 1263422
          rule_id: JDUyJR
          version_id: 6xT29w6
          url: >-
            https://semgrep.dev/playground/r/6xT29w6/python.flask.security.audit.hardcoded-config.avoid_hardcoded_config_DEBUG
          origin: community
    languages:
      - python
    pattern-either:
      - pattern: $M.update(DEBUG=True)
      - pattern: $M.update(DEBUG=False)
      - pattern: $M.config['DEBUG'] = True
      - pattern: $M.config['DEBUG'] = False
