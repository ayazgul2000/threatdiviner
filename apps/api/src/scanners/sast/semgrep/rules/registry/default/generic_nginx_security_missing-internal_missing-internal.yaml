rules:
  - id: generic.nginx.security.missing-internal.missing-internal
    options:
      generic_ellipsis_max_span: 0
      generic_engine: aliengrep
    patterns:
      - pattern-inside: |
          location ... {
            ....
            ....
          }
      - pattern-not-inside: |
          location ... {
            ....
            internal;
            ....
          }
      - pattern: proxy_pass $...URL;
      - metavariable-regex:
          metavariable: $...URL
          regex: (.*\$.*)
    paths:
      include:
        - '*.conf'
        - '*.vhost'
        - '**/sites-available/*'
        - '**/sites-enabled/*'
    languages:
      - generic
    severity: WARNING
    message: >-
      This location block contains a 'proxy_pass' directive but does not contain
      the 'internal' directive. The 'internal' directive restricts access to
      this location to internal requests. Without 'internal', an attacker could
      use your server for server-side request forgeries (SSRF). Include the
      'internal' directive in this block to limit exposure.
    metadata:
      cwe:
        - 'CWE-16: CWE CATEGORY: Configuration'
      references:
        - https://github.com/yandex/gixy/blob/master/docs/en/plugins/ssrf.md
        - https://nginx.org/en/docs/http/ngx_http_core_module.html#internal
      category: security
      technology:
        - nginx
      confidence: LOW
      owasp:
        - A06:2017 - Security Misconfiguration
        - A05:2021 - Security Misconfiguration
        - A02:2025 - Security Misconfiguration
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Other
      source: >-
        https://semgrep.dev/r/generic.nginx.security.missing-internal.missing-internal
      shortlink: https://sg.run/Q5px
      semgrep.dev:
        rule:
          r_id: 9042
          rv_id: 1262677
          rule_id: 0oU5BZ
          version_id: d6TyxKK
          url: >-
            https://semgrep.dev/playground/r/d6TyxKK/generic.nginx.security.missing-internal.missing-internal
          origin: community
