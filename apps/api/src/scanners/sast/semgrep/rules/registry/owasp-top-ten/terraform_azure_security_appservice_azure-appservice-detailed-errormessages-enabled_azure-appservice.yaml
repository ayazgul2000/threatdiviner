rules:
  - id: >-
      terraform.azure.security.appservice.azure-appservice-detailed-errormessages-enabled.azure-appservice-detailed-errormessages-enabled
    message: Ensure that App service enables detailed error messages
    patterns:
      - pattern: resource
      - pattern-not-inside: |
          resource "azurerm_app_service" "..." {
          ...
          logs {
            ...
            detailed_error_messages_enabled = true
            ...
          }
          ...
          }
      - pattern-inside: |
          resource "azurerm_app_service" "..." {
          ...
          }
    metadata:
      owasp:
        - A10:2017 - Insufficient Logging & Monitoring
        - A09:2021 - Security Logging and Monitoring Failures
        - A09:2025 - Security Logging & Alerting Failures
      cwe:
        - 'CWE-778: Insufficient Logging'
      category: security
      technology:
        - terraform
        - azure
      references:
        - >-
          https://owasp.org/Top10/A09_2021-Security_Logging_and_Monitoring_Failures
      subcategory:
        - vuln
      likelihood: LOW
      impact: LOW
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Insufficient Logging
      source: >-
        https://semgrep.dev/r/terraform.azure.security.appservice.azure-appservice-detailed-errormessages-enabled.azure-appservice-detailed-errormessages-enabled
      shortlink: https://sg.run/pA1g
      semgrep.dev:
        rule:
          r_id: 23962
          rv_id: 1263762
          rule_id: bwU1Eg
          version_id: DkTRbr5
          url: >-
            https://semgrep.dev/playground/r/DkTRbr5/terraform.azure.security.appservice.azure-appservice-detailed-errormessages-enabled.azure-appservice-detailed-errormessages-enabled
          origin: community
    languages:
      - hcl
    severity: WARNING
