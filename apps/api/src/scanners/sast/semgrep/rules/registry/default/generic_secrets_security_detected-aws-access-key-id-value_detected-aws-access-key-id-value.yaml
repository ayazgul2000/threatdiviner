rules:
  - id: >-
      generic.secrets.security.detected-aws-access-key-id-value.detected-aws-access-key-id-value
    patterns:
      - pattern-regex: \b(A3T[A-Z0-9]|AKIA|AGPA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}\b
      - pattern-not-regex: (?i)example|sample|test|fake
    languages:
      - regex
    message: >-
      AWS Access Key ID Value detected. This is a sensitive credential and
      should not be hardcoded here. Instead, read this value from an environment
      variable or keep it in a separate, private file.
    severity: ERROR
    metadata:
      cwe:
        - 'CWE-798: Use of Hard-coded Credentials'
      source-rule-url: >-
        https://github.com/grab/secret-scanner/blob/master/scanner/signatures/pattern.go
      category: security
      technology:
        - secrets
        - aws
      confidence: LOW
      owasp:
        - A07:2021 - Identification and Authentication Failures
        - A07:2025 - Authentication Failures
      references:
        - >-
          https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: HIGH
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Hard-coded Secrets
      source: >-
        https://semgrep.dev/r/generic.secrets.security.detected-aws-access-key-id-value.detected-aws-access-key-id-value
      shortlink: https://sg.run/GeD1
      semgrep.dev:
        rule:
          r_id: 9048
          rv_id: 1262859
          rule_id: oqUevO
          version_id: YDTZenE
          url: >-
            https://semgrep.dev/playground/r/YDTZenE/generic.secrets.security.detected-aws-access-key-id-value.detected-aws-access-key-id-value
          origin: community
