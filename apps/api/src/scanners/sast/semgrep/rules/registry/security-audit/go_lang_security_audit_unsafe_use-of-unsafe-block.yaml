rules:
  - id: go.lang.security.audit.unsafe.use-of-unsafe-block
    message: >-
      Using the unsafe package in Go gives you low-level memory management and
      many of the strengths of the C language, but also steps around the type
      safety of Go and can lead to buffer overflows and possible arbitrary code
      execution by an attacker. Only use this package if you absolutely know
      what you're doing.
    languages:
      - go
    severity: WARNING
    metadata:
      cwe:
        - 'CWE-242: Use of Inherently Dangerous Function'
      source_rule_url: https://github.com/securego/gosec/blob/master/rules/unsafe.go
      category: security
      technology:
        - go
      confidence: LOW
      references:
        - https://cwe.mitre.org/data/definitions/242.html
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Dangerous Method or Function
      source: https://semgrep.dev/r/go.lang.security.audit.unsafe.use-of-unsafe-block
      shortlink: https://sg.run/qxEx
      semgrep.dev:
        rule:
          r_id: 9112
          rv_id: 945595
          rule_id: 9AU1p1
          version_id: ZRT35Wd
          url: >-
            https://semgrep.dev/playground/r/ZRT35Wd/go.lang.security.audit.unsafe.use-of-unsafe-block
          origin: community
    pattern: unsafe.$FUNC(...)
