rules:
  - id: scala.lang.security.audit.path-traversal-fromfile.path-traversal-fromfile
    metadata:
      cwe:
        - >-
          CWE-22: Improper Limitation of a Pathname to a Restricted Directory
          ('Path Traversal')
      owasp:
        - A05:2017 - Broken Access Control
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      category: security
      technology:
        - scala
      resources:
        - https://find-sec-bugs.github.io/bugs.htm
      confidence: LOW
      references:
        - https://owasp.org/Top10/A01_2021-Broken_Access_Control
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Path Traversal
      source: >-
        https://semgrep.dev/r/scala.lang.security.audit.path-traversal-fromfile.path-traversal-fromfile
      shortlink: https://sg.run/5D1A
      semgrep.dev:
        rule:
          r_id: 15191
          rv_id: 1263676
          rule_id: QrUdOZ
          version_id: 9lT4bpj
          url: >-
            https://semgrep.dev/playground/r/9lT4bpj/scala.lang.security.audit.path-traversal-fromfile.path-traversal-fromfile
          origin: community
    message: >-
      Flags cases of possible path traversal. If an unfiltered parameter is
      passed into 'fromFile', file from an arbitrary filesystem location could
      be read. This could lead to sensitive data exposure and other provles.
      Instead, sanitize the user input instead of performing direct string
      concatenation.
    severity: WARNING
    languages:
      - scala
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $FILENAME = "..." + $VAR
                      ...
                  - pattern-inside: |
                      $FILENAME = $VAR + "..."
                      ...
                  - pattern-inside: |
                      $FILENAME = $STR.concat($VAR)
                      ...
                  - pattern-inside: |
                      $FILENAME = "...".format(..., $VAR, ...)
                      ...
              - pattern: Source.fromFile($FILENAME, ...)
          - patterns:
              - pattern-either:
                  - pattern: Source.fromFile("..." + $VAR, ...)
                  - pattern: Source.fromFile($VAR + "...", ...)
                  - pattern: Source.fromFile($STR.concat($VAR), ...)
                  - pattern: Source.fromFile("...".format(..., $VAR, ...), ...)
      - pattern-inside: |
          def $FUNC(..., $VAR: $TYPE, ...) = Action {
            ...
          }
