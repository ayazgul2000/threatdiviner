rules:
  - id: java.lang.security.audit.java-reverse-shell.java-reverse-shell
    patterns:
      - pattern-either:
          - pattern: |
              Socket $S=new Socket(...);
              ...
              InputStream $SI = $S.getInputStream();
              ...
              while(!$S.isClosed())
              {
                ...
                while($SI.available()>0)$PO.write($SI.read());
                ...
                $SO.flush();
                ...
              }
