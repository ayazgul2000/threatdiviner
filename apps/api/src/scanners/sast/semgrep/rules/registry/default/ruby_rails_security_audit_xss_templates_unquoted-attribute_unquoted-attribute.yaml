rules:
  - id: >-
      ruby.rails.security.audit.xss.templates.unquoted-attribute.unquoted-attribute
    message: >-
      Detected a unquoted template variable as an attribute. If unquoted, a
      malicious actor could inject custom JavaScript handlers. To fix this, add
      quotes around the template expression, like this: "<%= expr %>".
    metadata:
      cwe:
        - >-
          CWE-79: Improper Neutralization of Input During Web Page Generation
          ('Cross-site Scripting')
      owasp:
        - A07:2017 - Cross-Site Scripting (XSS)
        - A03:2021 - Injection
        - A05:2025 - Injection
      references:
        - >-
          https://brakemanpro.com/2017/09/08/cross-site-scripting-in-rails#unquoted-attributes
        - >-
          https://flask.palletsprojects.com/en/1.1.x/security/#cross-site-scripting-xss
      category: security
      technology:
        - rails
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cross-Site-Scripting (XSS)
      source: >-
        https://semgrep.dev/r/ruby.rails.security.audit.xss.templates.unquoted-attribute.unquoted-attribute
      shortlink: https://sg.run/PpeN
      semgrep.dev:
        rule:
          r_id: 9745
          rv_id: 1263644
          rule_id: AbUW9y
          version_id: ZRTKAbG
          url: >-
            https://semgrep.dev/playground/r/ZRTKAbG/ruby.rails.security.audit.xss.templates.unquoted-attribute.unquoted-attribute
          origin: community
    languages:
      - generic
    paths:
      include:
        - '*.erb'
    severity: WARNING
    patterns:
      - pattern-inside: <$TAG ...>
      - pattern-not-inside: '="..."'
      - pattern-not-inside: '="<%= ... %>"'
      - pattern-not-inside: '=''...'''
      - pattern-not-inside: '=''<%= ... %>'''
      - pattern: <%= ... %>
    fix-regex:
      regex: <%=(.*?)%>
      replacement: '"<%=\1%>"'
