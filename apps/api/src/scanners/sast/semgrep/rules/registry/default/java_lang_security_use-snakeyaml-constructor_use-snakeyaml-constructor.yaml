rules:
  - id: java.lang.security.use-snakeyaml-constructor.use-snakeyaml-constructor
    languages:
      - java
    metadata:
      owasp:
        - A08:2017 - Insecure Deserialization
        - A08:2021 - Software and Data Integrity Failures
        - A08:2025 - Software or Data Integrity Failures
      cwe:
        - 'CWE-502: Deserialization of Untrusted Data'
      references:
        - >-
          https://securitylab.github.com/research/swagger-yaml-parser-vulnerability/#snakeyaml-deserialization-vulnerability
      category: security
      technology:
        - snakeyaml
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: HIGH
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - 'Insecure Deserialization '
      source: >-
        https://semgrep.dev/r/java.lang.security.use-snakeyaml-constructor.use-snakeyaml-constructor
      shortlink: https://sg.run/L8qY
      semgrep.dev:
        rule:
          r_id: 12683
          rv_id: 1263067
          rule_id: 6JU67x
          version_id: X0Tzynw
          url: >-
            https://semgrep.dev/playground/r/X0Tzynw/java.lang.security.use-snakeyaml-constructor.use-snakeyaml-constructor
          origin: community
    message: >-
      Used SnakeYAML org.yaml.snakeyaml.Yaml() constructor with no arguments,
      which is vulnerable to deserialization attacks. Use the one-argument
      Yaml(...) constructor instead, with SafeConstructor or a custom
      Constructor as the argument.
    patterns:
      - pattern: |
          $Y = new org.yaml.snakeyaml.Yaml();
          ...
          $Y.load(...);
    severity: WARNING
