rules:
  - id: >-
      terraform.aws.security.aws-s3-bucket-object-encrypted-with-cmk.aws-s3-bucket-object-encrypted-with-cmk
    patterns:
      - pattern: |
          resource "aws_s3_bucket_object" $ANYTHING {
            ...
          }
      - pattern-not-inside: |
          resource "aws_s3_bucket_object" $ANYTHING {
            ...
            kms_key_id = ...
            ...
          }
    message: >-
      Ensure S3 bucket object is encrypted at rest using KMS CMKs. CMKs gives
      you control over the encryption key in terms of access and rotation.
    metadata:
      category: security
      technology:
        - terraform
        - aws
      owasp:
        - A03:2017 - Sensitive Data Exposure
      cwe:
        - 'CWE-320: CWE CATEGORY: Key Management Errors'
      references:
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/terraform.aws.security.aws-s3-bucket-object-encrypted-with-cmk.aws-s3-bucket-object-encrypted-with-cmk
      shortlink: https://sg.run/veKA
      semgrep.dev:
        rule:
          r_id: 17377
          rv_id: 946721
          rule_id: AbUeYR
          version_id: A8TJWj0
          url: >-
            https://semgrep.dev/playground/r/A8TJWj0/terraform.aws.security.aws-s3-bucket-object-encrypted-with-cmk.aws-s3-bucket-object-encrypted-with-cmk
          origin: community
    languages:
      - hcl
    severity: WARNING
