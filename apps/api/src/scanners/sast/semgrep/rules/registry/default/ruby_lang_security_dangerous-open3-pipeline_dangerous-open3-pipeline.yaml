rules:
  - id: ruby.lang.security.dangerous-open3-pipeline.dangerous-open3-pipeline
    patterns:
      - pattern: |
          Open3.$PIPE(...)
      - pattern-not: |
          Open3.$PIPE(...,"...",...)
      - metavariable-regex:
          metavariable: $PIPE
          regex: ^(pipeline|pipeline_r|pipeline_rw|pipeline_start|pipeline_w)$
    message: >-
      Detected non-static command inside $PIPE. Audit the input to '$PIPE'. If
      unverified user data can reach this call site, this is a code injection
      vulnerability. A malicious actor can inject a malicious script to execute
      arbitrary code.
    metadata:
      cwe:
        - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
      owasp:
        - A03:2021 - Injection
        - A05:2025 - Injection
      category: security
      technology:
        - ruby
      references:
        - https://owasp.org/Top10/A03_2021-Injection
      cwe2022-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: HIGH
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Code Injection
      source: >-
        https://semgrep.dev/r/ruby.lang.security.dangerous-open3-pipeline.dangerous-open3-pipeline
      shortlink: https://sg.run/B4jv
      semgrep.dev:
        rule:
          r_id: 9807
          rv_id: 1263600
          rule_id: KxU4nd
          version_id: GxTkeNz
          url: >-
            https://semgrep.dev/playground/r/GxTkeNz/ruby.lang.security.dangerous-open3-pipeline.dangerous-open3-pipeline
          origin: community
    severity: WARNING
    languages:
      - ruby
