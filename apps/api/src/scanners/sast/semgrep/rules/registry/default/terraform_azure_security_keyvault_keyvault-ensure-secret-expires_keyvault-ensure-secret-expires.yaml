rules:
  - id: >-
      terraform.azure.security.keyvault.keyvault-ensure-secret-expires.keyvault-ensure-secret-expires
    message: Ensure that the expiration date is set on all secrets
    patterns:
      - pattern: resource
      - pattern-not-inside: |
          resource "azurerm_key_vault_secret" "..." {
          ...
          expiration_date = "..."
          ...
          }
      - pattern-not-inside: |
          resource "azurerm_key_vault_secret" "..." {
            ...
            expiration_date = ...
            ...
          }
      - pattern-inside: |
          resource "azurerm_key_vault_secret" "..." {
          ...
          }
    metadata:
      cwe:
        - 'CWE-262: Not Using Password Aging'
      category: security
      technology:
        - terraform
        - azure
      references:
        - >-
          https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/key_vault_secret#expiration_date
        - https://docs.microsoft.com/en-us/azure/key-vault/secrets/about-secrets
      subcategory:
        - vuln
      likelihood: LOW
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authentication
      source: >-
        https://semgrep.dev/r/terraform.azure.security.keyvault.keyvault-ensure-secret-expires.keyvault-ensure-secret-expires
      shortlink: https://sg.run/d2RZ
      semgrep.dev:
        rule:
          r_id: 15134
          rv_id: 1028693
          rule_id: QrUdNy
          version_id: 0bTl7og
          url: >-
            https://semgrep.dev/playground/r/0bTl7og/terraform.azure.security.keyvault.keyvault-ensure-secret-expires.keyvault-ensure-secret-expires
          origin: community
    languages:
      - hcl
    severity: INFO
