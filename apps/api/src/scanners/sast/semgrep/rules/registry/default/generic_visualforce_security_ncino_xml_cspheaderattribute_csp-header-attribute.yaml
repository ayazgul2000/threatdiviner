rules:
  - id: >-
      generic.visualforce.security.ncino.xml.cspheaderattribute.csp-header-attribute
    languages:
      - generic
    severity: INFO
    message: >-
      Visualforce Pages must have the cspHeader attribute set to true. This
      attribute is available in API version 55 or higher.
    metadata:
      cwe:
        - >-
          CWE-79: Improper Neutralization of Input During Web Page Generation
          ('Cross-site Scripting')
      owasp:
        - A07:2017 - Cross-Site Scripting (XSS)
        - A03:2021 - Injection
        - A05:2025 - Injection
      references:
        - >-
          https://help.salesforce.com/s/articleView?id=sf.csp_trusted_sites.htm&type=5
      category: security
      subcategory:
        - vuln
      technology:
        - salesforce
        - visualforce
      cwe2022-top25: true
      cwe2021-top25: true
      likelihood: HIGH
      impact: MEDIUM
      confidence: HIGH
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cross-Site-Scripting (XSS)
      source: >-
        https://semgrep.dev/r/generic.visualforce.security.ncino.xml.cspheaderattribute.csp-header-attribute
      shortlink: https://sg.run/yoj8
      semgrep.dev:
        rule:
          r_id: 72424
          rv_id: 1262907
          rule_id: DbUj7d
          version_id: RGT0L0r
          url: >-
            https://semgrep.dev/playground/r/RGT0L0r/generic.visualforce.security.ncino.xml.cspheaderattribute.csp-header-attribute
          origin: community
    patterns:
      - pattern: <apex:page...>...</apex:page>
      - pattern-not: <apex:page...cspHeader="true"...>...</apex:page>
      - pattern-not: <apex:page...>...<!--deprecated-->...</apex:page>
      - pattern-not: <apex:page...>...<!-- deprecated -->...</apex:page>
    paths:
      include:
        - '*.page'
