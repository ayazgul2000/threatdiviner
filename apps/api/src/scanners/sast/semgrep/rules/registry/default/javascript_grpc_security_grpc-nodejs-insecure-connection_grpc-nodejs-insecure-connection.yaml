rules:
  - id: >-
      javascript.grpc.security.grpc-nodejs-insecure-connection.grpc-nodejs-insecure-connection
    message: >-
      Found an insecure gRPC connection. This creates a connection without
      encryption to a gRPC client/server. A malicious attacker could tamper with
      the gRPC message, which could compromise the machine.
    metadata:
      owasp:
        - A08:2017 - Insecure Deserialization
        - A08:2021 - Software and Data Integrity Failures
        - A08:2025 - Software or Data Integrity Failures
      cwe:
        - 'CWE-502: Deserialization of Untrusted Data'
      category: security
      technology:
        - grpc
      references:
        - >-
          https://blog.gopheracademy.com/advent-2017/go-grpc-beyond-basics/#:~:text=disables%20transport%20security
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - 'Insecure Deserialization '
      source: >-
        https://semgrep.dev/r/javascript.grpc.security.grpc-nodejs-insecure-connection.grpc-nodejs-insecure-connection
      shortlink: https://sg.run/5QkD
      semgrep.dev:
        rule:
          r_id: 9291
          rv_id: 1263180
          rule_id: lBU9D8
          version_id: e1TyjAl
          url: >-
            https://semgrep.dev/playground/r/e1TyjAl/javascript.grpc.security.grpc-nodejs-insecure-connection.grpc-nodejs-insecure-connection
          origin: community
    languages:
      - javascript
      - typescript
    severity: ERROR
    pattern-either:
      - pattern: |
          require('grpc');
          ...
          $GRPC($ADDR,...,$CREDENTIALS.createInsecure(),...);
      - pattern: |
          require('grpc');
          ...
          new $GRPC($ADDR,...,$CREDENTIALS.createInsecure(),...);
      - pattern: |-
          require('grpc');
          ...
          $CREDS = <... $CREDENTIALS.createInsecure() ...>;
          ...
          $GRPC($ADDR,...,$CREDS,...);
      - pattern: |-
          require('grpc');
          ...
          $CREDS = <... $CREDENTIALS.createInsecure() ...>;
          ...
          new $GRPC($ADDR,...,$CREDS,...);
