rules:
  - id: php.lang.security.phpinfo-use.phpinfo-use
    pattern: phpinfo(...);
    message: >-
      The 'phpinfo' function may reveal sensitive information about your
      environment.
    metadata:
      cwe:
        - 'CWE-200: Exposure of Sensitive Information to an Unauthorized Actor'
      references:
        - https://www.php.net/manual/en/function.phpinfo
        - >-
          https://github.com/FloeDesignTechnologies/phpcs-security-audit/blob/master/Security/Sniffs/BadFunctions/PhpinfosSniff.php
      category: security
      technology:
        - php
      owasp:
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Mishandled Sensitive Information
      source: https://semgrep.dev/r/php.lang.security.phpinfo-use.phpinfo-use
      shortlink: https://sg.run/W82E
      semgrep.dev:
        rule:
          r_id: 9397
          rv_id: 1263298
          rule_id: ReUglY
          version_id: RGT0LN0
          url: >-
            https://semgrep.dev/playground/r/RGT0LN0/php.lang.security.phpinfo-use.phpinfo-use
          origin: community
    languages:
      - php
    severity: ERROR
