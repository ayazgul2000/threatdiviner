rules:
  - id: python.lang.security.deserialization.pickle.avoid-pickle
    metadata:
      owasp:
        - A08:2017 - Insecure Deserialization
        - A08:2021 - Software and Data Integrity Failures
        - A08:2025 - Software or Data Integrity Failures
      cwe:
        - 'CWE-502: Deserialization of Untrusted Data'
      references:
        - https://docs.python.org/3/library/pickle.html
      category: security
      technology:
        - python
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - 'Insecure Deserialization '
      source: >-
        https://semgrep.dev/r/python.lang.security.deserialization.pickle.avoid-pickle
      shortlink: https://sg.run/OPwB
      semgrep.dev:
        rule:
          r_id: 9675
          rv_id: 1263532
          rule_id: EwU2BJ
          version_id: yeTxpEE
          url: >-
            https://semgrep.dev/playground/r/yeTxpEE/python.lang.security.deserialization.pickle.avoid-pickle
          origin: community
    languages:
      - python
    message: >-
      Avoid using `pickle`, which is known to lead to code execution
      vulnerabilities. When unpickling, the serialized data could be manipulated
      to run arbitrary code. Instead, consider serializing the relevant data as
      JSON or a similar text-based serialization format.
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: pickle.$FUNC(...)
          - pattern: _pickle.$FUNC(...)
      - pattern-not: pickle.$FUNC("...")
      - pattern-not: _pickle.$FUNC("...")
