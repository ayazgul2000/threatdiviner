rules:
  - id: >-
      generic.secrets.security.detected-npm-registry-auth-token.detected-npm-registry-auth-token
    patterns:
      - pattern: $AUTHTOKEN = $VALUE
      - metavariable-regex:
          metavariable: $AUTHTOKEN
          regex: _(authToken|auth|password)
      - pattern-not: $AUTHTOKEN = ${...}
    languages:
      - generic
    message: NPM registry authentication token detected
    paths:
      include:
        - '*npmrc*'
    severity: ERROR
    metadata:
      cwe:
        - 'CWE-798: Use of Hard-coded Credentials'
      category: security
      technology:
        - secrets
        - npm
      confidence: LOW
      owasp:
        - A07:2021 - Identification and Authentication Failures
        - A07:2025 - Authentication Failures
      references:
        - >-
          https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Hard-coded Secrets
      source: >-
        https://semgrep.dev/r/generic.secrets.security.detected-npm-registry-auth-token.detected-npm-registry-auth-token
      shortlink: https://sg.run/Ppg3
      semgrep.dev:
        rule:
          r_id: 10045
          rv_id: 1262883
          rule_id: 5rU4pe
          version_id: 7ZTE3n2
          url: >-
            https://semgrep.dev/playground/r/7ZTE3n2/generic.secrets.security.detected-npm-registry-auth-token.detected-npm-registry-auth-token
          origin: community
