rules:
  - id: kotlin.lang.security.cookie-missing-httponly.cookie-missing-httponly
    metadata:
      cwe:
        - 'CWE-1004: Sensitive Cookie Without ''HttpOnly'' Flag'
      owasp:
        - A05:2021 - Security Misconfiguration
        - A02:2025 - Security Misconfiguration
      source-rule-url: https://find-sec-bugs.github.io/bugs.htm#HTTPONLY_COOKIE
      category: security
      technology:
        - kt
      references:
        - https://owasp.org/Top10/A05_2021-Security_Misconfiguration
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cookie Security
      source: >-
        https://semgrep.dev/r/kotlin.lang.security.cookie-missing-httponly.cookie-missing-httponly
      shortlink: https://sg.run/ox7X
      semgrep.dev:
        rule:
          r_id: 9360
          rv_id: 1263260
          rule_id: r6UrKQ
          version_id: K3TKkRO
          url: >-
            https://semgrep.dev/playground/r/K3TKkRO/kotlin.lang.security.cookie-missing-httponly.cookie-missing-httponly
          origin: community
    message: >-
      A cookie was detected without setting the 'HttpOnly' flag. The 'HttpOnly'
      flag for cookies instructs the browser to forbid client-side scripts from
      reading the cookie. Set the 'HttpOnly' flag by calling
      'cookie.setHttpOnly(true);'
    severity: WARNING
    languages:
      - kt
    patterns:
      - pattern-not-inside: |
          $COOKIE.setValue("")
          ...
      - pattern-either:
          - pattern: $COOKIE.setHttpOnly(false)
          - patterns:
              - pattern-not-inside: |
                  $COOKIE.setHttpOnly(...)
                  ...
              - pattern: $RESPONSE.addCookie($COOKIE)
