rules:
  - id: >-
      terraform.aws.security.aws-elasticsearch-nodetonode-encryption.aws-elasticsearch-nodetonode-encryption-not-enabled
    patterns:
      - pattern-either:
          - pattern: |
              resource "aws_elasticsearch_domain" $ANYTHING {
                ...
                node_to_node_encryption {
                  ...
                  enabled = false
                  ...
                }
                ...
              }
          - pattern: |
              resource "aws_elasticsearch_domain" $ANYTHING {
                ...
                cluster_config {
                  ...
                  instance_count = $COUNT
                  ...
                }
              }
      - pattern-not-inside: |
          resource "aws_elasticsearch_domain" $ANYTHING {
            ...
            cluster_config {
              ...
              instance_count = $COUNT
              ...
            }
            node_to_node_encryption {
              ...
              enabled = true
              ...
            }
          }
      - metavariable-comparison:
          metavariable: $COUNT
          comparison: $COUNT > 1
    message: "Ensure all Elasticsearch has node-to-node encryption enabled.\t"
    metadata:
      category: security
      technology:
        - terraform
        - aws
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      cwe:
        - 'CWE-326: Inadequate Encryption Strength'
      references:
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
      subcategory:
        - vuln
      likelihood: LOW
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/terraform.aws.security.aws-elasticsearch-nodetonode-encryption.aws-elasticsearch-nodetonode-encryption-not-enabled
      shortlink: https://sg.run/lp3y
      semgrep.dev:
        rule:
          r_id: 17357
          rv_id: 1263719
          rule_id: 3qU6J7
          version_id: WrTqK0v
          url: >-
            https://semgrep.dev/playground/r/WrTqK0v/terraform.aws.security.aws-elasticsearch-nodetonode-encryption.aws-elasticsearch-nodetonode-encryption-not-enabled
          origin: community
    languages:
      - hcl
    severity: WARNING
