rules:
  - id: go.lang.security.audit.crypto.use_of_weak_crypto.use-of-rc4
    message: >-
      Detected RC4 cipher algorithm which is insecure. The algorithm has many
      known vulnerabilities. Use AES instead.
    languages:
      - go
    severity: WARNING
    metadata:
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      cwe:
        - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
      source-rule-url: https://github.com/securego/gosec#available-rules
      category: security
      technology:
        - go
      references:
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/go.lang.security.audit.crypto.use_of_weak_crypto.use-of-rc4
      shortlink: https://sg.run/1ZAD
      semgrep.dev:
        rule:
          r_id: 9122
          rv_id: 1262931
          rule_id: v8Unl0
          version_id: w8TRoRQ
          url: >-
            https://semgrep.dev/playground/r/w8TRoRQ/go.lang.security.audit.crypto.use_of_weak_crypto.use-of-rc4
          origin: community
    patterns:
      - pattern-inside: |
          import "crypto/rc4"
          ...
      - pattern: rc4.NewCipher(...)
