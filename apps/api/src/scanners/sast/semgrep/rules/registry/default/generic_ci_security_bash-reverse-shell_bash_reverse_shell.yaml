rules:
  - id: generic.ci.security.bash-reverse-shell.bash_reverse_shell
    metadata:
      cwe:
        - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
      category: security
      technology:
        - ci
      confidence: HIGH
      owasp:
        - A03:2021 - Injection
        - A05:2025 - Injection
      references:
        - https://owasp.org/Top10/A03_2021-Injection
      cwe2022-top25: true
      subcategory:
        - audit
      likelihood: MEDIUM
      impact: HIGH
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Code Injection
      source: >-
        https://semgrep.dev/r/generic.ci.security.bash-reverse-shell.bash_reverse_shell
      shortlink: https://sg.run/4l9l
      semgrep.dev:
        rule:
          r_id: 16200
          rv_id: 1262664
          rule_id: gxUJrJ
          version_id: jQTn5QE
          url: >-
            https://semgrep.dev/playground/r/jQTn5QE/generic.ci.security.bash-reverse-shell.bash_reverse_shell
          origin: community
    message: Semgrep found a bash reverse shell
    severity: ERROR
    languages:
      - generic
    pattern-either:
      - pattern: |
          sh -i >& /dev/udp/.../... 0>&1
      - pattern: |
          <...>/dev/tcp/.../...; sh <&... >&... 2>&
      - pattern: >
          <...>/dev/tcp/.../...; cat <&... | while read line; do $line 2>&...
          >&...;done
      - pattern: |
          sh -i ...<...> /dev/tcp/.../... ...<&... 1>&... 2>&
