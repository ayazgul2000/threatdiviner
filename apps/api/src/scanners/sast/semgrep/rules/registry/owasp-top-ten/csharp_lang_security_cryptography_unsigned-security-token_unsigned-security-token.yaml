rules:
  - id: >-
      csharp.lang.security.cryptography.unsigned-security-token.unsigned-security-token
    patterns:
      - pattern: RequireSignedTokens = false
      - pattern-inside: |
          new TokenValidationParameters {
            ...
          }
    fix: RequireSignedTokens = true
    message: >-
      Accepting unsigned security tokens as valid security tokens allows an
      attacker to remove its signature and potentially forge an identity. As a
      fix, set RequireSignedTokens to be true.
    metadata:
      category: security
      technology:
        - csharp
      owasp:
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      cwe:
        - 'CWE-347: Improper Verification of Cryptographic Signature'
      references:
        - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures/
        - https://cwe.mitre.org/data/definitions/347
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/csharp.lang.security.cryptography.unsigned-security-token.unsigned-security-token
      shortlink: https://sg.run/pqzN
      semgrep.dev:
        rule:
          r_id: 26718
          rv_id: 1262631
          rule_id: KxUGLw
          version_id: e1Tyjrz
          url: >-
            https://semgrep.dev/playground/r/e1Tyjrz/csharp.lang.security.cryptography.unsigned-security-token.unsigned-security-token
          origin: community
    languages:
      - csharp
    severity: ERROR
