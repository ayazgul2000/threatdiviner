rules:
  - id: >-
      python.pyramid.audit.set-cookie-samesite-unsafe-value.pyramid-set-cookie-samesite-unsafe-value
    patterns:
      - pattern-either:
          - pattern-inside: |
              @pyramid.view.view_config(...)
              def $VIEW($REQUEST):
                  ...
                  $RESPONSE = $REQUEST.response
                  ...
          - pattern-inside: |
              def $VIEW(...):
                  ...
                  $RESPONSE = pyramid.httpexceptions.HTTPFound(...)
                  ...
      - pattern-not: $RESPONSE.set_cookie(..., **$PARAMS)
      - pattern: $RESPONSE.set_cookie(..., samesite=$SAMESITE, ...)
      - pattern: $SAMESITE
      - metavariable-regex:
          metavariable: $SAMESITE
          regex: (?!'Lax')
    fix: |
      'Lax'
    message: >-
      Found a Pyramid cookie without the samesite option correctly set. Pyramid
      cookies should be handled securely by setting samesite='Lax' in
      response.set_cookie(...). If this parameter is not properly set, your
      cookies are not properly protected and are at risk of being stolen by an
      attacker.
    metadata:
      cwe:
        - 'CWE-1275: Sensitive Cookie with Improper SameSite Attribute'
      owasp:
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      category: security
      technology:
        - pyramid
      references:
        - https://owasp.org/Top10/A01_2021-Broken_Access_Control
      subcategory:
        - vuln
      likelihood: LOW
      impact: LOW
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cookie Security
      source: >-
        https://semgrep.dev/r/python.pyramid.audit.set-cookie-samesite-unsafe-value.pyramid-set-cookie-samesite-unsafe-value
      shortlink: https://sg.run/GXR6
      semgrep.dev:
        rule:
          r_id: 21448
          rv_id: 1263568
          rule_id: EwUgpY
          version_id: o5TbDv5
          url: >-
            https://semgrep.dev/playground/r/o5TbDv5/python.pyramid.audit.set-cookie-samesite-unsafe-value.pyramid-set-cookie-samesite-unsafe-value
          origin: community
    languages:
      - python
    severity: WARNING
