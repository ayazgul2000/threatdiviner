rules:
  - id: java.lang.security.do-privileged-use.do-privileged-use
    severity: WARNING
    languages:
      - java
    metadata:
      cwe:
        - 'CWE-269: Improper Privilege Management'
      references:
        - >-
          https://docs.oracle.com/javase/8/docs/technotes/guides/security/doprivileged.html
        - https://wiki.sei.cmu.edu/confluence/display/java/Privilege+Escalation
        - http://phrack.org/papers/escaping_the_java_sandbox.html
      category: security
      technology:
        - java
      owasp:
        - A04:2021 - Insecure Design
        - A06:2025 - Insecure Design
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authorization
      source: >-
        https://semgrep.dev/r/java.lang.security.do-privileged-use.do-privileged-use
      shortlink: https://sg.run/6n76
      semgrep.dev:
        rule:
          r_id: 9159
          rv_id: 1263063
          rule_id: bwUw28
          version_id: o5TbDoY
          url: >-
            https://semgrep.dev/playground/r/o5TbDoY/java.lang.security.do-privileged-use.do-privileged-use
          origin: community
    message: >-
      Marking code as privileged enables a piece of trusted code to temporarily
      enable access to more resources than are available directly to the code
      that called it. Be very careful in your use of the privileged construct,
      and always remember to make the privileged code section as small as
      possible.
    patterns:
      - pattern-inside: |
          import java.security.*;
          ...
      - pattern-either:
          - pattern: AccessController.doPrivileged(...);
          - pattern: class $ACTION implements PrivilegedAction<Void> { ... }
