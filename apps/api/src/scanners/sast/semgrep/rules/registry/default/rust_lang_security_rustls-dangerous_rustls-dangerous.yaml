rules:
  - id: rust.lang.security.rustls-dangerous.rustls-dangerous
    message: Dangerous client config used, ensure SSL verification
    pattern-either:
      - pattern: rustls::client::DangerousClientConfig
      - pattern: $CLIENT.dangerous().set_certificate_verifier(...)
      - pattern: |
          let $CLIENT = rustls::client::ClientConfig::dangerous(...);
          ...
          $CLIENT.set_certificate_verifier(...);
    metadata:
      references:
        - >-
          https://docs.rs/rustls/latest/rustls/client/struct.DangerousClientConfig.html
        - >-
          https://docs.rs/rustls/latest/rustls/client/struct.ClientConfig.html#method.dangerous
      technology:
        - rustls
      category: security
      cwe: 'CWE-295: Improper Certificate Validation'
      confidence: HIGH
      likelihood: LOW
      impact: MEDIUM
      subcategory: vuln
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authentication
      source: >-
        https://semgrep.dev/r/rust.lang.security.rustls-dangerous.rustls-dangerous
      shortlink: https://sg.run/01Rw
      semgrep.dev:
        rule:
          r_id: 40110
          rv_id: 946553
          rule_id: YGU8LK
          version_id: 8KTKjdO
          url: >-
            https://semgrep.dev/playground/r/8KTKjdO/rust.lang.security.rustls-dangerous.rustls-dangerous
          origin: community
    languages:
      - rust
    severity: WARNING
