rules:
  - id: >-
      python.flask.security.audit.hardcoded-config.avoid_hardcoded_config_TESTING
    message: >-
      Hardcoded variable `TESTING` detected. Use environment variables or config
      files instead
    severity: WARNING
    metadata:
      likelihood: LOW
      impact: LOW
      confidence: LOW
      category: security
      cwe:
        - 'CWE-489: Active Debug Code'
      owasp:
        - A05:2021 - Security Misconfiguration
        - A02:2025 - Security Misconfiguration
      references:
        - https://bento.dev/checks/flask/avoid-hardcoded-config/
        - >-
          https://flask.palletsprojects.com/en/1.1.x/config/?highlight=configuration#builtin-configuration-values
        - >-
          https://flask.palletsprojects.com/en/1.1.x/config/?highlight=configuration#environment-and-debug-features
      subcategory:
        - audit
      technology:
        - flask
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Active Debug Code
      source: >-
        https://semgrep.dev/r/python.flask.security.audit.hardcoded-config.avoid_hardcoded_config_TESTING
      shortlink: https://sg.run/ndZ2
      semgrep.dev:
        rule:
          r_id: 9536
          rv_id: 1263419
          rule_id: 3qUPoy
          version_id: qkTR7P1
          url: >-
            https://semgrep.dev/playground/r/qkTR7P1/python.flask.security.audit.hardcoded-config.avoid_hardcoded_config_TESTING
          origin: community
    languages:
      - python
    pattern-either:
      - pattern: $M.config['TESTING'] = True
      - pattern: $M.config['TESTING'] = False
      - pattern: $M.update(TESTING=True, ...)
      - pattern: $M.update(TESTING=False, ...)
