rules:
  - id: >-
      generic.secrets.security.detected-aws-secret-access-key.detected-aws-secret-access-key
    patterns:
      - pattern-regex: >-
          (("|'|`)?((?i)aws)_?\w*((?i)secret)_?\w*("|'|`)?\s{0,50}(:|=>|=)\s{0,50}("|'|`)?[A-Za-z0-9/+=]{40}("|'|`)?)
      - pattern-not-regex: (?i)example|sample|test|fake|xxxxxx
    languages:
      - regex
    message: AWS Secret Access Key detected
    severity: ERROR
    metadata:
      cwe:
        - 'CWE-798: Use of Hard-coded Credentials'
      source-rule-url: >-
        https://github.com/grab/secret-scanner/blob/master/scanner/signatures/pattern.go
      category: security
      technology:
        - secrets
        - aws
      confidence: LOW
      owasp:
        - A07:2021 - Identification and Authentication Failures
        - A07:2025 - Authentication Failures
      references:
        - >-
          https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: HIGH
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Hard-coded Secrets
      source: >-
        https://semgrep.dev/r/generic.secrets.security.detected-aws-secret-access-key.detected-aws-secret-access-key
      shortlink: https://sg.run/Bk39
      semgrep.dev:
        rule:
          r_id: 9051
          rv_id: 1262862
          rule_id: 2ZUbe8
          version_id: zyTb2Dr
          url: >-
            https://semgrep.dev/playground/r/zyTb2Dr/generic.secrets.security.detected-aws-secret-access-key.detected-aws-secret-access-key
          origin: community
