rules:
  - id: kotlin.lang.security.weak-rsa.use-of-weak-rsa-key
    message: RSA keys should be at least 2048 bits based on NIST recommendation.
    languages:
      - kt
    severity: WARNING
    metadata:
      cwe:
        - 'CWE-326: Inadequate Encryption Strength'
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      source-rule-url: https://find-sec-bugs.github.io/bugs.htm#RSA_KEY_SIZE
      asvs:
        section: V6 Stored Cryptography Verification Requirements
        control_id: 6.2.5 Insecure Algorithm
        control_url: >-
          https://github.com/OWASP/ASVS/blob/master/4.0/en/0x14-V6-Cryptography.md#v62-algorithms
        version: '4'
      references:
        - >-
          https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html#algorithms
      category: security
      technology:
        - kotlin
      subcategory:
        - audit
      likelihood: HIGH
      impact: MEDIUM
      confidence: HIGH
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: https://semgrep.dev/r/kotlin.lang.security.weak-rsa.use-of-weak-rsa-key
      shortlink: https://sg.run/krq7
      semgrep.dev:
        rule:
          r_id: 15128
          rv_id: 1263269
          rule_id: nJUZNL
          version_id: X0TzypE
          url: >-
            https://semgrep.dev/playground/r/X0TzypE/kotlin.lang.security.weak-rsa.use-of-weak-rsa-key
          origin: community
    patterns:
      - pattern-either:
          - pattern: |
              $KEY = $G.getInstance("RSA")
              ...
              $KEY.initialize($BITS)
      - metavariable-comparison:
          metavariable: $BITS
          comparison: $BITS < 2048
