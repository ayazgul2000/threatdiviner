rules:
  - id: >-
      terraform.aws.security.aws-documentdb-auditing-disabled.aws-documentdb-auditing-disabled
    patterns:
      - pattern: |
          resource "aws_docdb_cluster" $ANYTHING {
            ...
          }
      - pattern-not-inside: |
          resource "aws_docdb_cluster" $ANYTHING {
            ...
            enabled_cloudwatch_logs_exports = [..., "audit", ...]
            ...
          }
    message: >-
      Auditing is not enabled for DocumentDB. To ensure that you are able to
      accurately audit the usage of your DocumentDB cluster, you should enable
      auditing and export logs to CloudWatch.
    languages:
      - hcl
    severity: INFO
    metadata:
      category: security
      technology:
        - terraform
        - aws
      owasp:
        - A09:2021 - Security Logging and Monitoring Failures
        - A09:2025 - Security Logging & Alerting Failures
      cwe:
        - 'CWE-778: Insufficient Logging'
      references:
        - >-
          https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/docdb_cluster#enabled_cloudwatch_logs_exports
        - >-
          https://owasp.org/Top10/A09_2021-Security_Logging_and_Monitoring_Failures/
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Insufficient Logging
      source: >-
        https://semgrep.dev/r/terraform.aws.security.aws-documentdb-auditing-disabled.aws-documentdb-auditing-disabled
      shortlink: https://sg.run/xJYP
      semgrep.dev:
        rule:
          r_id: 48630
          rv_id: 1263705
          rule_id: AbU1WN
          version_id: DkTRbA4
          url: >-
            https://semgrep.dev/playground/r/DkTRbA4/terraform.aws.security.aws-documentdb-auditing-disabled.aws-documentdb-auditing-disabled
          origin: community
