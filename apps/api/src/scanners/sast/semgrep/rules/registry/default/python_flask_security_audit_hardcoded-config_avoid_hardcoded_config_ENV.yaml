rules:
  - id: python.flask.security.audit.hardcoded-config.avoid_hardcoded_config_ENV
    message: >-
      Hardcoded variable `ENV` detected. Set this by using FLASK_ENV environment
      variable
    severity: WARNING
    metadata:
      likelihood: LOW
      impact: LOW
      confidence: LOW
      category: security
      cwe:
        - 'CWE-489: Active Debug Code'
      owasp:
        - A05:2021 - Security Misconfiguration
        - A02:2025 - Security Misconfiguration
      references:
        - https://bento.dev/checks/flask/avoid-hardcoded-config/
        - >-
          https://flask.palletsprojects.com/en/1.1.x/config/?highlight=configuration#builtin-configuration-values
        - >-
          https://flask.palletsprojects.com/en/1.1.x/config/?highlight=configuration#environment-and-debug-features
      subcategory:
        - audit
      technology:
        - flask
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Active Debug Code
      source: >-
        https://semgrep.dev/r/python.flask.security.audit.hardcoded-config.avoid_hardcoded_config_ENV
      shortlink: https://sg.run/7oXW
      semgrep.dev:
        rule:
          r_id: 9538
          rv_id: 1263421
          rule_id: PeUZpr
          version_id: YDTZeKr
          url: >-
            https://semgrep.dev/playground/r/YDTZeKr/python.flask.security.audit.hardcoded-config.avoid_hardcoded_config_ENV
          origin: community
    languages:
      - python
    pattern-either:
      - pattern: $M.update(ENV="=~/^development|production$/")
      - pattern: $M.config['ENV'] = "=~/^development|production$/"
