rules:
  - id: >-
      python.django.security.audit.xss.context-autoescape-off.context-autoescape-off
    message: >-
      Detected a Context with autoescape disabled. If you are rendering any web
      pages, this exposes your application to cross-site scripting (XSS)
      vulnerabilities. Remove 'autoescape: False' or set it to 'True'.
    metadata:
      cwe:
        - >-
          CWE-79: Improper Neutralization of Input During Web Page Generation
          ('Cross-site Scripting')
      owasp:
        - A07:2017 - Cross-Site Scripting (XSS)
        - A03:2021 - Injection
        - A05:2025 - Injection
      references:
        - https://docs.djangoproject.com/en/3.1/ref/settings/#templates
        - >-
          https://docs.djangoproject.com/en/3.1/topics/templates/#django.template.backends.django.DjangoTemplates
      category: security
      technology:
        - django
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cross-Site-Scripting (XSS)
      source: >-
        https://semgrep.dev/r/python.django.security.audit.xss.context-autoescape-off.context-autoescape-off
      shortlink: https://sg.run/nd7Y
      semgrep.dev:
        rule:
          r_id: 9480
          rv_id: 1263370
          rule_id: 4bUknY
          version_id: X0Tzye3
          url: >-
            https://semgrep.dev/playground/r/X0Tzye3/python.django.security.audit.xss.context-autoescape-off.context-autoescape-off
          origin: community
    languages:
      - python
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: |
              {..., "autoescape": $FALSE, ...}
          - pattern: |
              $D["autoescape"] = $FALSE
      - metavariable-pattern:
          metavariable: $FALSE
          pattern: |
            False
      - focus-metavariable: $FALSE
    fix: |
      True
