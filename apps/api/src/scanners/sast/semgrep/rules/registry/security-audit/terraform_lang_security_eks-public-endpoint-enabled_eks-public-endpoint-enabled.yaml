rules:
  - id: >-
      terraform.lang.security.eks-public-endpoint-enabled.eks-public-endpoint-enabled
    patterns:
      - pattern: |
          resource
      - pattern-inside: |
          resource "aws_eks_cluster" "..." {...}
      - pattern-not-inside: |
          resource "aws_eks_cluster" "..."{
            ...
            vpc_config{
              ...
              endpoint_public_access = false
              ...
            }
            ...
          }
    languages:
      - hcl
    message: >-
      The vpc_config resource inside the eks cluster has not explicitly disabled
      public endpoint access
    severity: WARNING
    metadata:
      category: security
      cwe:
        - 'CWE-200: Exposure of Sensitive Information to an Unauthorized Actor'
      technology:
        - terraform
        - aws
      owasp:
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      references:
        - https://owasp.org/Top10/A01_2021-Broken_Access_Control
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Mishandled Sensitive Information
      source: >-
        https://semgrep.dev/r/terraform.lang.security.eks-public-endpoint-enabled.eks-public-endpoint-enabled
      shortlink: https://sg.run/Albg
      semgrep.dev:
        rule:
          r_id: 9750
          rv_id: 1263887
          rule_id: KxU4v6
          version_id: e1TyjjB
