rules:
  - id: python.flask.security.audit.secure-set-cookie.secure-set-cookie
    patterns:
      - pattern-either:
          - pattern-inside: |
              $RESP = flask.make_response(...)
              ...
          - pattern-inside: |
              $RESP = flask.Response(...)
              ...
      - pattern-not: $RESP.set_cookie(..., secure=$A, httponly=$B, samesite=$C, ...)
      - pattern-not: $RESP.set_cookie(..., **$A)
      - pattern: $RESP.set_cookie(...)
    message: >-
      Found a Flask cookie with insecurely configured properties.  By default
      the secure, httponly and samesite ar configured insecurely. cookies should
      be handled securely by setting `secure=True`, `httponly=True`, and
      `samesite='Lax'` in response.set_cookie(...). If these parameters are not
      properly set, your cookies are not properly protected and are at risk of
      being stolen by an attacker. Include the `secure=True`, `httponly=True`,
      `samesite='Lax'` arguments or set these to be true in the Flask
      configuration.
    metadata:
      cwe:
        - 'CWE-614: Sensitive Cookie in HTTPS Session Without ''Secure'' Attribute'
      owasp:
        - A05:2021 - Security Misconfiguration
        - A02:2025 - Security Misconfiguration
      references:
        - >-
          https://flask.palletsprojects.com/en/3.0.x/api/#flask.Response.set_cookie
        - >-
          https://flask.palletsprojects.com/en/3.0.x/security/#set-cookie-options
      category: security
      technology:
        - python
        - flask
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      functional-categories:
        - web::search::cookie-config::flask
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cookie Security
      source: >-
        https://semgrep.dev/r/python.flask.security.audit.secure-set-cookie.secure-set-cookie
      shortlink: https://sg.run/gLkZ
      semgrep.dev:
        rule:
          r_id: 9541
          rv_id: 1263424
          rule_id: GdU7GR
          version_id: zyTb20n
          url: >-
            https://semgrep.dev/playground/r/zyTb20n/python.flask.security.audit.secure-set-cookie.secure-set-cookie
          origin: community
    languages:
      - python
    severity: WARNING
