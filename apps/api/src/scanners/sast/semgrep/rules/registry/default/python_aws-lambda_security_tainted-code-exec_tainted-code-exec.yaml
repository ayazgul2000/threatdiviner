rules:
  - id: python.aws-lambda.security.tainted-code-exec.tainted-code-exec
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: event
          - pattern-inside: |
              def $HANDLER(event, context):
                ...
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($CODE, ...)
              - pattern: exec($CODE, ...)
    message: >-
      Detected the use of `exec/eval`.This can be dangerous if used to evaluate
      dynamic content. If this content can be input from outside the program,
      this may be a code injection vulnerability. Ensure evaluated content is
      not definable by external sources.
    metadata:
      cwe:
        - >-
          CWE-95: Improper Neutralization of Directives in Dynamically Evaluated
          Code ('Eval Injection')
      owasp:
        - A03:2021 - Injection
        - A05:2025 - Injection
      asvs:
        section: 'V5: Validation, Sanitization and Encoding Verification Requirements'
        control_id: 5.2.4 Dyanmic Code Execution Features
        control_url: >-
          https://github.com/OWASP/ASVS/blob/master/4.0/en/0x13-V5-Validation-Sanitization-Encoding.md#v52-sanitization-and-sandboxing-requirements
        version: '4'
      category: security
      technology:
        - python
      references:
        - https://owasp.org/Top10/A03_2021-Injection
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Code Injection
      source: >-
        https://semgrep.dev/r/python.aws-lambda.security.tainted-code-exec.tainted-code-exec
      shortlink: https://sg.run/Ng7y
      semgrep.dev:
        rule:
          r_id: 18271
          rv_id: 1263342
          rule_id: GdUDJP
          version_id: nWT2LD2
          url: >-
            https://semgrep.dev/playground/r/nWT2LD2/python.aws-lambda.security.tainted-code-exec.tainted-code-exec
          origin: community
    languages:
      - python
    severity: WARNING
