rules:
  - id: c.lang.security.use-after-free.use-after-free
    patterns:
      - pattern-either:
          - pattern: $VAR->$ACCESSOR
          - pattern: (*$VAR).$ACCESSOR
          - pattern: $VAR[$NUM]
      - pattern-inside: free($VAR); ...
      - pattern-not-inside: $VAR = NULL; ...
      - pattern-not-inside: free($VAR); ... $VAR = malloc(...); ...
    message: >-
      Variable '$VAR' was used after being freed. This can lead to undefined
      behavior.
    metadata:
      cwe:
        - 'CWE-416: Use After Free'
      references:
        - https://cwe.mitre.org/data/definitions/416.html
        - >-
          https://ctf-wiki.github.io/ctf-wiki/pwn/linux/glibc-heap/use_after_free/
      category: security
      technology:
        - c
      confidence: LOW
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: LOW
      impact: HIGH
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Memory Issues
      source: https://semgrep.dev/r/c.lang.security.use-after-free.use-after-free
      shortlink: https://sg.run/gL6e
      semgrep.dev:
        rule:
          r_id: 8841
          rv_id: 945178
          rule_id: KxUb9l
          version_id: 1QToKPy
          url: >-
            https://semgrep.dev/playground/r/1QToKPy/c.lang.security.use-after-free.use-after-free
          origin: community
    languages:
      - c
    severity: WARNING
