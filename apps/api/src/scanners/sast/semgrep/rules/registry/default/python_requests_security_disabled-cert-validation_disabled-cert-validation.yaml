rules:
  - id: python.requests.security.disabled-cert-validation.disabled-cert-validation
    message: >-
      Certificate verification has been explicitly disabled. This permits
      insecure connections to insecure servers. Re-enable certification
      validation.
    metadata:
      cwe:
        - 'CWE-295: Improper Certificate Validation'
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A07:2021 - Identification and Authentication Failures
        - A07:2025 - Authentication Failures
      references:
        - >-
          https://stackoverflow.com/questions/41740361/is-it-safe-to-disable-ssl-certificate-verification-in-pythonss-requests-lib
      category: security
      technology:
        - requests
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authentication
      source: >-
        https://semgrep.dev/r/python.requests.security.disabled-cert-validation.disabled-cert-validation
      shortlink: https://sg.run/AlYp
      semgrep.dev:
        rule:
          r_id: 9694
          rv_id: 1263574
          rule_id: qNUoYR
          version_id: 1QTypBw
          url: >-
            https://semgrep.dev/playground/r/1QTypBw/python.requests.security.disabled-cert-validation.disabled-cert-validation
          origin: community
    languages:
      - python
    severity: ERROR
    pattern-either:
      - pattern: requests.put(..., verify=False, ...)
      - pattern: requests.patch(..., verify=False, ...)
      - pattern: requests.delete(..., verify=False, ...)
      - pattern: requests.head(..., verify=False, ...)
      - pattern: requests.options(..., verify=False, ...)
      - pattern: requests.request(..., verify=False, ...)
      - pattern: requests.get(..., verify=False, ...)
      - pattern: requests.post(..., verify=False, ...)
    fix-regex:
      regex: verify(\s)*=(\s)*False
      replacement: verify=True
