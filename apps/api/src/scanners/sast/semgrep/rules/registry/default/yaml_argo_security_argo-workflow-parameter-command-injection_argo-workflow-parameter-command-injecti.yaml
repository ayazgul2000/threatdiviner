rules:
  - id: >-
      yaml.argo.security.argo-workflow-parameter-command-injection.argo-workflow-parameter-command-injection
    message: >-
      Using input or workflow parameters in here-scripts can lead to command
      injection or code injection. Convert the parameters to env variables
      instead.
    languages:
      - yaml
    metadata:
      category: security
      cwe:
        - >-
          CWE-78: Improper Neutralization of Special Elements used in an OS
          Command ('OS Command Injection')
        - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
      owasp:
        - A03:2021 - Injection
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://github.com/argoproj/argo-workflows/issues/5061
        - https://github.com/argoproj/argo-workflows/issues/5114#issue-808865370
      technology:
        - ci
        - argo
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Code Injection
        - Command Injection
      source: >-
        https://semgrep.dev/r/yaml.argo.security.argo-workflow-parameter-command-injection.argo-workflow-parameter-command-injection
      shortlink: https://sg.run/yqeZ
      semgrep.dev:
        rule:
          r_id: 40768
          rv_id: 1151472
          rule_id: 10U0zW
          version_id: xyTp17z
          url: >-
            https://semgrep.dev/playground/r/xyTp17z/yaml.argo.security.argo-workflow-parameter-command-injection.argo-workflow-parameter-command-injection
          origin: community
    severity: ERROR
    patterns:
      - pattern-inside: |
          apiVersion: $VERSION
          ...
      - metavariable-regex:
          metavariable: $VERSION
          regex: (argoproj.io.*)
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  command:
                    ...
                    - $LANG
                    ...
                  ...
                  source:
                    $SCRIPT
              - metavariable-regex:
                  metavariable: $LANG
                  regex: >-
                    .*(sh|bash|ksh|csh|tcsh|zsh|python|python3|node|perl|ruby|php|lua|awk|sed|powershell|fish|dash|R|grooby|scala|clj|elixir|coffee|dart|haskell|ocaml).*
              - metavariable-pattern:
                  metavariable: $SCRIPT
                  pattern-either:
                    - pattern-regex: (.*{{.*inputs.parameters.*}}.*)
                    - pattern-regex: (.*{{.*workflow.parameters.*}}.*)
              - focus-metavariable: $SCRIPT
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      container:
                        ...
                        command: $LANG
                        ...
                        args: $PARAM
                  - pattern-inside: |
                      containerSet:
                        ...
                        containers:
                          - ...
                            command: $LANG
                            ...
                            args: $PARAM
              - metavariable-regex:
                  metavariable: $LANG
                  regex: >-
                    .*(sh|bash|ksh|csh|tcsh|zsh|python|python3|node|perl|ruby|php|lua|awk|sed|powershell|fish|dash|R|grooby|scala|clj|elixir|coffee|dart|haskell|ocaml).*
              - metavariable-pattern:
                  metavariable: $PARAM
                  pattern-either:
                    - pattern-regex: (.*{{.*inputs.parameters.*}}.*)
                    - pattern-regex: (.*{{.*workflow.parameters.*}}.*)
              - focus-metavariable: $PARAM
