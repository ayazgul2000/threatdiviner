rules:
  - id: >-
      problem-based-packs.insecure-transport.js-node.rest-http-client-support.rest-http-client-support
    message: >-
      Checks for requests to http (unencrypted) sites using some of node js's
      most popular REST/HTTP libraries, including node-rest-client, axios, and
      got.
    severity: WARNING
    metadata:
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      category: security
      cwe: 'CWE-319: Cleartext Transmission of Sensitive Information'
      owasp: A03:2017 - Sensitive Data Exposure
      references:
        - https://www.npmjs.com/package/axios
        - https://www.npmjs.com/package/got
        - https://www.npmjs.com/package/node-rest-client
      subcategory:
        - vuln
      technology:
        - node.js
      vulnerability: Insecure Transport
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Mishandled Sensitive Information
      source: >-
        https://semgrep.dev/r/problem-based-packs.insecure-transport.js-node.rest-http-client-support.rest-http-client-support
      shortlink: https://sg.run/kXGP
      semgrep.dev:
        rule:
          r_id: 9428
          rv_id: 946072
          rule_id: nJUzKP
          version_id: BjT1N5l
          url: >-
            https://semgrep.dev/playground/r/BjT1N5l/problem-based-packs.insecure-transport.js-node.rest-http-client-support.rest-http-client-support
          origin: community
    languages:
      - javascript
    patterns:
      - pattern-either:
          - pattern-inside: |
              $CLIENT = require('node-rest-client').Client;
              ...
              $C = new $CLIENT();
              ...
          - pattern-inside: |
              $C = require('axios');
              ...
          - pattern-inside: |
              $C = require('got');
              ...
      - pattern-either:
          - pattern: |
              $C.$REQ("=~/http://.*/", ...)
          - pattern: |
              $C("=~/http://.*/", ...)
          - pattern: |
              $C({...,url: "=~/http://.*/"})
          - pattern: |
              $C.$REQ({...,url: "=~/http://.*/"})
