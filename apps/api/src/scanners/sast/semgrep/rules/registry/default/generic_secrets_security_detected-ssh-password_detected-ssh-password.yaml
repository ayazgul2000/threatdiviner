rules:
  - id: generic.secrets.security.detected-ssh-password.detected-ssh-password
    pattern-regex: sshpass -p\s*['|\\\"][^%]
    languages:
      - regex
    message: SSH Password detected
    severity: ERROR
    metadata:
      cwe:
        - 'CWE-798: Use of Hard-coded Credentials'
      source-rule-url: >-
        https://github.com/grab/secret-scanner/blob/master/scanner/signatures/pattern.go
      category: security
      technology:
        - secrets
        - ssh
      confidence: LOW
      owasp:
        - A07:2021 - Identification and Authentication Failures
        - A07:2025 - Authentication Failures
      references:
        - >-
          https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Hard-coded Secrets
      source: >-
        https://semgrep.dev/r/generic.secrets.security.detected-ssh-password.detected-ssh-password
      shortlink: https://sg.run/vzDR
      semgrep.dev:
        rule:
          r_id: 9077
          rv_id: 1262898
          rule_id: PeUZ4d
          version_id: WrTqKqY
          url: >-
            https://semgrep.dev/playground/r/WrTqKqY/generic.secrets.security.detected-ssh-password.detected-ssh-password
          origin: community
