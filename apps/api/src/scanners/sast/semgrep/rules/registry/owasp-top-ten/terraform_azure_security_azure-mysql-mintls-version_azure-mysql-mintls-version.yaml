rules:
  - id: >-
      terraform.azure.security.azure-mysql-mintls-version.azure-mysql-mintls-version
    message: Ensure MySQL is using the latest version of TLS encryption
    patterns:
      - pattern-either:
          - pattern: |
              "TLS1_0"
          - pattern: |
              "TLS1_1"
      - pattern-inside: ssl_minimal_tls_version_enforced = ...
      - pattern-inside: |
          $RESOURCE "azurerm_mysql_server" "..." {
          ...
          }
    metadata:
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      cwe:
        - 'CWE-326: Inadequate Encryption Strength'
      category: security
      technology:
        - terraform
        - azure
      references:
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
      subcategory:
        - vuln
      likelihood: LOW
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/terraform.azure.security.azure-mysql-mintls-version.azure-mysql-mintls-version
      shortlink: https://sg.run/WR44
      semgrep.dev:
        rule:
          r_id: 23997
          rv_id: 1263785
          rule_id: zdU8NN
          version_id: O9TpxWE
          url: >-
            https://semgrep.dev/playground/r/O9TpxWE/terraform.azure.security.azure-mysql-mintls-version.azure-mysql-mintls-version
          origin: community
    languages:
      - hcl
    severity: WARNING
