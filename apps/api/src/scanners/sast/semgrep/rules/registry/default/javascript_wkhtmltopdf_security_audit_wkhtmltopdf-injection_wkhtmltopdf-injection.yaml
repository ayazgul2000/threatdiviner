rules:
  - id: >-
      javascript.wkhtmltopdf.security.audit.wkhtmltopdf-injection.wkhtmltopdf-injection
    message: >-
      If unverified user data can reach the `wkhtmltopdf` it can result in
      Server-Side Request Forgery vulnerabilities
    metadata:
      owasp:
        - A10:2021 - Server-Side Request Forgery (SSRF)
        - A01:2025 - Broken Access Control
      cwe:
        - 'CWE-918: Server-Side Request Forgery (SSRF)'
      category: security
      technology:
        - wkhtmltopdf
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      references:
        - >-
          https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Server-Side Request Forgery (SSRF)
      source: >-
        https://semgrep.dev/r/javascript.wkhtmltopdf.security.audit.wkhtmltopdf-injection.wkhtmltopdf-injection
      shortlink: https://sg.run/qx8O
      semgrep.dev:
        rule:
          r_id: 9356
          rv_id: 1263252
          rule_id: j2Uv58
          version_id: 5PTo1xA
          url: >-
            https://semgrep.dev/playground/r/5PTo1xA/javascript.wkhtmltopdf.security.audit.wkhtmltopdf-injection.wkhtmltopdf-injection
          origin: community
    languages:
      - javascript
      - typescript
    severity: WARNING
    patterns:
      - pattern-inside: |
          $WK = require('wkhtmltopdf');
          ...
      - pattern-not-inside: |
          var $INPUT = "...";
          ...
      - pattern: $WK($INPUT,...)
      - pattern-not: $WK("...",...)
