rules:
  - id: >-
      generic.secrets.security.detected-onfido-live-api-token.detected-onfido-live-api-token
    pattern-regex: (?:api_live(?:_[a-zA-Z]{2})?\.[a-zA-Z0-9-_]{11}\.[-_a-zA-Z0-9]{32})
    languages:
      - regex
    message: Onfido live API Token detected
    severity: ERROR
    metadata:
      cwe:
        - 'CWE-798: Use of Hard-coded Credentials'
      category: security
      technology:
        - secrets
        - onfido
      confidence: HIGH
      references:
        - https://documentation.onfido.com/api/latest/#api-tokens
      subcategory:
        - audit
      likelihood: HIGH
      impact: HIGH
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Hard-coded Secrets
      source: >-
        https://semgrep.dev/r/generic.secrets.security.detected-onfido-live-api-token.detected-onfido-live-api-token
      shortlink: https://sg.run/lBoKD
      semgrep.dev:
        rule:
          r_id: 141957
          rv_id: 945509
