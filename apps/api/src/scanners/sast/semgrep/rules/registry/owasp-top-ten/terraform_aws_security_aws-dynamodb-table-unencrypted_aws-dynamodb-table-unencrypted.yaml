rules:
  - id: >-
      terraform.aws.security.aws-dynamodb-table-unencrypted.aws-dynamodb-table-unencrypted
    patterns:
      - pattern: |
          resource "aws_dynamodb_table" $ANYTHING {
            ...
          }
      - pattern-not-inside: |
          resource "aws_dynamodb_table" $ANYTHING {
            ...
            server_side_encryption {
              enabled = true
              kms_key_arn = ...
            }
            ...
          }
    message: >-
      By default, AWS DynamoDB Table is encrypted using AWS-managed keys.
      However, for added security, it's recommended to configure your own AWS
      KMS encryption key to protect your data in the DynamoDB table. You can
      either create a new aws_kms_key resource or use the ARN of an existing key
      in your AWS account to do so.
    languages:
      - hcl
    severity: WARNING
    metadata:
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      cwe:
        - 'CWE-326: Inadequate Encryption Strength'
      technology:
        - aws
        - terraform
      category: security
      references:
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/terraform.aws.security.aws-dynamodb-table-unencrypted.aws-dynamodb-table-unencrypted
      shortlink: https://sg.run/Ay4p
      semgrep.dev:
        rule:
          r_id: 17350
          rv_id: 1263707
          rule_id: nJUGe2
          version_id: 0bTKzj8
