rules:
  - id: java.lang.security.audit.permissive-cors.permissive-cors
    message: >-
      https://find-sec-bugs.github.io/bugs.htm#PERMISSIVE_CORS Permissive CORS
      policy will allow a malicious application to communicate with the victim
      application in an inappropriate way, leading to spoofing, data theft,
      relay and other attacks.
    metadata:
      cwe:
        - 'CWE-183: Permissive List of Allowed Inputs'
      asvs:
        section: 'V14: Configuration Verification Requirements'
        control_id: 14.4.8 Permissive CORS
        control_url: >-
          https://github.com/OWASP/ASVS/blob/master/4.0/en/0x22-V14-Config.md#v144-http-security-headers-requirements
        version: '4'
      category: security
      technology:
        - java
      owasp:
        - A04:2021 - Insecure Design
        - A06:2025 - Insecure Design
      references:
        - https://owasp.org/Top10/A04_2021-Insecure_Design
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Validation
      source: >-
        https://semgrep.dev/r/java.lang.security.audit.permissive-cors.permissive-cors
      shortlink: https://sg.run/8y77
      semgrep.dev:
        rule:
          r_id: 9184
          rv_id: 1263033
          rule_id: BYUN66
          version_id: xyTjz0p
          url: >-
            https://semgrep.dev/playground/r/xyTjz0p/java.lang.security.audit.permissive-cors.permissive-cors
          origin: community
    severity: WARNING
    languages:
      - java
    pattern-either:
      - pattern: |
          HttpServletResponse $RES = ...;
          ...
          $RES.addHeader("=~/access-control-allow-origin/i", "=~/^\*|null$/i");
      - pattern: |
          HttpServletResponse $RES = ...;
          ...
          $RES.setHeader("=~/access-control-allow-origin/i", "=~/^\*|null$/i");
      - pattern: >
          ServerHttpResponse $RES = ...;

          ...

          $RES.getHeaders().add("=~/access-control-allow-origin/i",
          "=~/^\*|null$/i");
      - pattern: |
          HttpHeaders $HEADERS = ...;
          ...
          $HEADERS.set("=~/access-control-allow-origin/i", "=~/^\*|null$/i");
      - pattern: >
          ServerWebExchange $SWE = ...;

          ...

          $SWE.getResponse().getHeaders().add("Access-Control-Allow-Origin",
          "*");
      - pattern: |
          $X $METHOD(...,HttpServletResponse $RES,...) {
            ...
            $RES.addHeader("=~/access-control-allow-origin/i", "=~/^\*|null$/i");
            ...
          }
      - pattern: |
          $X $METHOD(...,HttpServletResponse $RES,...) {
            ...
            $RES.setHeader("=~/access-control-allow-origin/i", "=~/^\*|null$/i");
            ...
          }
      - pattern: |
          $X $METHOD(...,ServerHttpResponse $RES,...) {
            ...
            $RES.getHeaders().add("=~/access-control-allow-origin/i", "=~/^\*|null$/i");
            ...
          }
      - pattern: |
          $X $METHOD(...,ServerWebExchange $SWE,...) {
            ...
            $SWE.getResponse().getHeaders().add("=~/access-control-allow-origin/i", "=~/^\*|null$/i");
            ...
          }
      - pattern: >-
          ResponseEntity.$RES().header("=~/access-control-allow-origin/i",
          "=~/^\*|null$/i")
      - pattern: >-
          ServerResponse.$RES().header("=~/access-control-allow-origin/i",
          "=~/^\*|null$/i")
