rules:
  - id: ruby.lang.security.weak-hashes-sha1.weak-hashes-sha1
    message: >-
      Should not use SHA1 to generate hashes. There is a proven SHA1 hash
      collision by Google, which could lead to vulnerabilities. Use SHA256, SHA3
      or other hashing functions instead.
    metadata:
      cwe:
        - 'CWE-328: Use of Weak Hash'
      references:
        - >-
          https://security.googleblog.com/2017/02/announcing-first-sha1-collision.html
        - https://shattered.io/
      category: security
      technology:
        - ruby
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      subcategory:
        - vuln
      likelihood: LOW
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Insecure Hashing Algorithm
      source: >-
        https://semgrep.dev/r/ruby.lang.security.weak-hashes-sha1.weak-hashes-sha1
      shortlink: https://sg.run/e4qX
      semgrep.dev:
        rule:
          r_id: 9732
          rv_id: 1263620
          rule_id: EwU4jq
          version_id: K3TKkEZ
          url: >-
            https://semgrep.dev/playground/r/K3TKkEZ/ruby.lang.security.weak-hashes-sha1.weak-hashes-sha1
          origin: community
    languages:
      - ruby
    severity: WARNING
    pattern-either:
      - pattern: Digest::SHA1.$FUNC
      - pattern: OpenSSL::Digest::SHA1.$FUNC
      - pattern: OpenSSL::HMAC.$FUNC("sha1",...)
