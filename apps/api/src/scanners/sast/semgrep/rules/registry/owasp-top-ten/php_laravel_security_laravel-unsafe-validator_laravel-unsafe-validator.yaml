rules:
  - id: php.laravel.security.laravel-unsafe-validator.laravel-unsafe-validator
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: |
              public function $F(...,Request $R,...){...}
          - focus-metavariable: $R
      - patterns:
          - pattern-either:
              - pattern: |
                  $this->$PROPERTY
              - pattern: |
                  $this->$PROPERTY->$GET
          - metavariable-pattern:
              metavariable: $PROPERTY
              patterns:
                - pattern-either:
                    - pattern: query
                    - pattern: request
                    - pattern: headers
                    - pattern: cookies
                    - pattern: cookie
                    - pattern: files
                    - pattern: file
                    - pattern: allFiles
                    - pattern: input
                    - pattern: all
                    - pattern: post
                    - pattern: json
          - pattern-either:
              - pattern-inside: |
                  class $CL extends Illuminate\Http\Request {...}
              - pattern-inside: |
                  class $CL extends Illuminate\Foundation\Http\FormRequest {...}
    pattern-sinks:
      - patterns:
          - pattern: |
              Illuminate\Validation\Rule::unique(...)->ignore(...,$IGNORE,...)
          - focus-metavariable: $IGNORE
    message: >-
      Found a request argument passed to an `ignore()` definition in a Rule
      constraint. This can lead to SQL injection.
    languages:
      - php
    severity: ERROR
    metadata:
      category: security
      cwe:
        - >-
          CWE-89: Improper Neutralization of Special Elements used in an SQL
          Command ('SQL Injection')
      owasp:
        - A01:2017 - Injection
        - A03:2021 - Injection
        - A05:2025 - Injection
      technology:
        - php
        - laravel
      references:
        - https://laravel.com/docs/9.x/validation#rule-unique
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: HIGH
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - SQL Injection
      source: >-
        https://semgrep.dev/r/php.laravel.security.laravel-unsafe-validator.laravel-unsafe-validator
      shortlink: https://sg.run/vkeb
      semgrep.dev:
        rule:
          r_id: 21677
          rv_id: 1263314
          rule_id: X5ULgE
          version_id: DkTRbBl
          url: >-
            https://semgrep.dev/playground/r/DkTRbBl/php.laravel.security.laravel-unsafe-validator.laravel-unsafe-validator
          origin: community
