rules:
  - id: python.flask.security.injection.user-exec.exec-injection
    languages:
      - python
    severity: ERROR
    message: >-
      Detected user data flowing into exec. This is code injection and should be
      avoided.
    metadata:
      cwe:
        - >-
          CWE-95: Improper Neutralization of Directives in Dynamically Evaluated
          Code ('Eval Injection')
      owasp:
        - A03:2021 - Injection
        - A05:2025 - Injection
      references:
        - https://nedbatchelder.com/blog/201206/exec_really_is_dangerous.html
      category: security
      technology:
        - flask
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: HIGH
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Code Injection
      source: >-
        https://semgrep.dev/r/python.flask.security.injection.user-exec.exec-injection
      shortlink: https://sg.run/Ge42
      semgrep.dev:
        rule:
          r_id: 9548
          rv_id: 1263437
          rule_id: KxUbl2
          version_id: xyTjzD9
          url: >-
            https://semgrep.dev/playground/r/xyTjzD9/python.flask.security.injection.user-exec.exec-injection
          origin: community
    pattern-either:
      - patterns:
          - pattern: exec(...)
          - pattern-either:
              - pattern-inside: |
                  @$APP.route($ROUTE, ...)
                  def $FUNC(..., $ROUTEVAR, ...):
                    ...
                    exec(..., <... $ROUTEVAR ...>, ...)
              - pattern-inside: |
                  @$APP.route($ROUTE, ...)
                  def $FUNC(..., $ROUTEVAR, ...):
                    ...
                    $INTERM = <... $ROUTEVAR ...>
                    ...
                    exec(..., <... $INTERM ...>, ...)
      - pattern: exec(..., <... flask.request.$W.get(...) ...>, ...)
      - pattern: exec(..., <... flask.request.$W[...] ...>, ...)
      - pattern: exec(..., <... flask.request.$W(...) ...>, ...)
      - pattern: exec(..., <... flask.request.$W ...>, ...)
      - patterns:
          - pattern-inside: |
              $INTERM = <... flask.request.$W.get(...) ...>
              ...
              exec(..., <... $INTERM ...>, ...)
          - pattern: exec(...)
      - patterns:
          - pattern-inside: |
              $INTERM = <... flask.request.$W[...] ...>
              ...
              exec(..., <... $INTERM ...>, ...)
          - pattern: exec(...)
      - patterns:
          - pattern-inside: |
              $INTERM = <... flask.request.$W(...) ...>
              ...
              exec(..., <... $INTERM ...>, ...)
          - pattern: exec(...)
      - patterns:
          - pattern-inside: |
              $INTERM = <... flask.request.$W ...>
              ...
              exec(..., <... $INTERM ...>, ...)
          - pattern: exec(...)
