rules:
  - id: php.lang.security.unlink-use.unlink-use
    patterns:
      - pattern: unlink(...)
      - pattern-not: unlink("...",...)
    message: >-
      Using user input when deleting files with `unlink()` is potentially
      dangerous. A malicious actor could use this to modify or access files they
      have no right to.
    metadata:
      references:
        - https://www.php.net/manual/en/function.unlink
        - >-
          https://owasp.org/www-project-top-ten/2017/A5_2017-Broken_Access_Control.html
      category: security
      technology:
        - php
      owasp:
        - A05:2017 - Broken Access Control
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      cwe:
        - >-
          CWE-22: Improper Limitation of a Pathname to a Restricted Directory
          ('Path Traversal')
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Path Traversal
      source: https://semgrep.dev/r/php.lang.security.unlink-use.unlink-use
      shortlink: https://sg.run/rYeR
      semgrep.dev:
        rule:
          r_id: 13969
          rv_id: 1263301
          rule_id: eqUzDE
          version_id: DkTRbBX
          url: >-
            https://semgrep.dev/playground/r/DkTRbBX/php.lang.security.unlink-use.unlink-use
          origin: community
    languages:
      - php
    severity: WARNING
