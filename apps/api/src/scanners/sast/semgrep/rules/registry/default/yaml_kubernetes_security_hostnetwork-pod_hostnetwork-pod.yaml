rules:
  - id: yaml.kubernetes.security.hostnetwork-pod.hostnetwork-pod
    patterns:
      - pattern-inside: |
          spec:
            ...
      - pattern: |
          hostNetwork: true
    message: >-
      Pod may use the node network namespace. This gives the pod access to the
      loopback device, services listening on localhost, and could be used to
      snoop on network activity of other pods on the same node. Remove the
      'hostNetwork' key to disable this functionality.
    metadata:
      cwe:
        - >-
          CWE-406: Insufficient Control of Network Message Volume (Network
          Amplification)
      references:
        - >-
          https://kubernetes.io/docs/concepts/policy/pod-security-policy/#host-namespaces
      category: security
      technology:
        - kubernetes
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Other
      source: >-
        https://semgrep.dev/r/yaml.kubernetes.security.hostnetwork-pod.hostnetwork-pod
      shortlink: https://sg.run/E51A
      semgrep.dev:
        rule:
          r_id: 10237
          rv_id: 947056
          rule_id: EwU4NO
          version_id: 7ZTreWz
          url: >-
            https://semgrep.dev/playground/r/7ZTreWz/yaml.kubernetes.security.hostnetwork-pod.hostnetwork-pod
          origin: community
    languages:
      - yaml
    severity: WARNING
