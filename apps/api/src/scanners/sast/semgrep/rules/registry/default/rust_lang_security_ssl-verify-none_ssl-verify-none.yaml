rules:
  - id: rust.lang.security.ssl-verify-none.ssl-verify-none
    message: SSL verification disabled, this allows for MitM attacks
    pattern: $BUILDER.set_verify(openssl::ssl::SSL_VERIFY_NONE)
    metadata:
      references:
        - >-
          https://docs.rs/openssl/latest/openssl/ssl/struct.SslContextBuilder.html#method.set_verify
      technology:
        - openssl
      category: security
      cwe: 'CWE-295: Improper Certificate Validation'
      confidence: HIGH
      likelihood: LOW
      impact: MEDIUM
      subcategory: vuln
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authentication
      source: https://semgrep.dev/r/rust.lang.security.ssl-verify-none.ssl-verify-none
      shortlink: https://sg.run/K2Pn
      semgrep.dev:
        rule:
          r_id: 40111
          rv_id: 946554
          rule_id: 6JU0Bl
          version_id: gETe1bo
          url: >-
            https://semgrep.dev/playground/r/gETe1bo/rust.lang.security.ssl-verify-none.ssl-verify-none
          origin: community
    languages:
      - rust
    severity: WARNING
