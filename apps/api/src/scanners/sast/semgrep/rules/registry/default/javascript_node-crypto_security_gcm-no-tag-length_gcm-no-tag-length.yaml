rules:
  - id: javascript.node-crypto.security.gcm-no-tag-length.gcm-no-tag-length
    message: >-
      The call to 'createDecipheriv' with the Galois Counter Mode (GCM) mode of
      operation is missing an expected authentication tag length. If the
      expected authentication tag length is not specified or otherwise checked,
      the application might be tricked into verifying a shorter-than-expected
      authentication tag. This can be abused by an attacker to spoof ciphertexts
      or recover the implicit authentication key of GCM, allowing arbitrary
      forgeries.
    metadata:
      cwe:
        - 'CWE-310: CWE CATEGORY: Cryptographic Issues'
      owasp:
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      category: security
      subcategory:
        - vuln
      technology:
        - node-crypto
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      references:
        - >-
          https://www.securesystems.de/blog/forging_ciphertexts_under_Galois_Counter_Mode_for_the_Node_js_crypto_module/
        - >-
          https://nodejs.org/api/crypto.html#cryptocreatedecipherivalgorithm-key-iv-options
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures/
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/javascript.node-crypto.security.gcm-no-tag-length.gcm-no-tag-length
      shortlink: https://sg.run/NbGG1
      semgrep.dev:
        rule:
          r_id: 146571
          rv_id: 1263223
          rule_id: j2UgPP3
          version_id: pZT03qd
          url: >-
            https://semgrep.dev/playground/r/pZT03qd/javascript.node-crypto.security.gcm-no-tag-length.gcm-no-tag-length
          origin: community
    languages:
      - javascript
      - typescript
    severity: ERROR
    patterns:
      - pattern: |
          $CRYPTO.createDecipheriv('$ALGO', $KEY, $IV)
      - metavariable-regex:
          metavariable: $ALGO
          regex: .*(-gcm)$
