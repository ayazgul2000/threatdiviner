rules:
  - id: go.lang.security.audit.crypto.use_of_weak_crypto.use-of-sha1
    message: >-
      Detected SHA1 hash algorithm which is considered insecure. SHA1 is not
      collision resistant and is therefore not suitable as a cryptographic
      signature. Use SHA256 or SHA3 instead.
    languages:
      - go
    severity: WARNING
    metadata:
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      cwe:
        - 'CWE-328: Use of Weak Hash'
      source-rule-url: https://github.com/securego/gosec#available-rules
      category: security
      technology:
        - go
      references:
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Insecure Hashing Algorithm
      source: >-
        https://semgrep.dev/r/go.lang.security.audit.crypto.use_of_weak_crypto.use-of-sha1
      shortlink: https://sg.run/XBYA
      semgrep.dev:
        rule:
          r_id: 9120
          rv_id: 1262929
          rule_id: OrU31O
          version_id: NdTzyz1
          url: >-
            https://semgrep.dev/playground/r/NdTzyz1/go.lang.security.audit.crypto.use_of_weak_crypto.use-of-sha1
          origin: community
    patterns:
      - pattern-inside: |
          import "crypto/sha1"
          ...
      - pattern-either:
          - pattern: |
              sha1.New()
          - pattern: |
              sha1.Sum(...)
