rules:
  - id: >-
      python.pyramid.audit.authtkt-cookie-samesite.pyramid-authtkt-cookie-samesite
    patterns:
      - pattern-either:
          - pattern: >-
              pyramid.authentication.AuthTktCookieHelper(...,
              samesite=$SAMESITE, ...)
          - pattern: >-
              pyramid.authentication.AuthTktAuthenticationPolicy(...,
              samesite=$SAMESITE, ...)
      - pattern: $SAMESITE
      - metavariable-regex:
          metavariable: $SAMESITE
          regex: (?!'Lax')
    fix: |
      'Lax'
    message: >-
      Found a Pyramid Authentication Ticket without the samesite option
      correctly set. Pyramid cookies should be handled securely by setting
      samesite='Lax'. If this parameter is not properly set, your cookies are
      not properly protected and are at risk of being stolen by an attacker.
    metadata:
      cwe:
        - 'CWE-1275: Sensitive Cookie with Improper SameSite Attribute'
      owasp:
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      category: security
      technology:
        - pyramid
      references:
        - https://owasp.org/Top10/A01_2021-Broken_Access_Control
      subcategory:
        - vuln
      likelihood: LOW
      impact: LOW
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cookie Security
      source: >-
        https://semgrep.dev/r/python.pyramid.audit.authtkt-cookie-samesite.pyramid-authtkt-cookie-samesite
      shortlink: https://sg.run/LYrY
      semgrep.dev:
        rule:
          r_id: 21439
          rv_id: 1263559
          rule_id: kxUYjY
          version_id: BjTkZ51
          url: >-
            https://semgrep.dev/playground/r/BjTkZ51/python.pyramid.audit.authtkt-cookie-samesite.pyramid-authtkt-cookie-samesite
          origin: community
    languages:
      - python
    severity: WARNING
