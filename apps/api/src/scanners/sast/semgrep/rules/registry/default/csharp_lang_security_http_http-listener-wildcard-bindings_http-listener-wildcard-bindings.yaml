rules:
  - id: >-
      csharp.lang.security.http.http-listener-wildcard-bindings.http-listener-wildcard-bindings
    severity: WARNING
    languages:
      - C#
    metadata:
      cwe:
        - 'CWE-706: Use of Incorrectly-Resolved Name or Reference'
      owasp:
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      references:
        - >-
          https://docs.microsoft.com/en-us/dotnet/api/system.net.httplistener?view=net-6.0
      category: security
      technology:
        - .net
      confidence: MEDIUM
      subcategory:
        - vuln
      likelihood: LOW
      impact: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authorization
      source: >-
        https://semgrep.dev/r/csharp.lang.security.http.http-listener-wildcard-bindings.http-listener-wildcard-bindings
      shortlink: https://sg.run/9LJr
      semgrep.dev:
        rule:
          r_id: 18223
          rv_id: 1262633
          rule_id: 4bUQ81
          version_id: d6Tyx4K
          url: >-
            https://semgrep.dev/playground/r/d6Tyx4K/csharp.lang.security.http.http-listener-wildcard-bindings.http-listener-wildcard-bindings
          origin: community
    message: >-
      The top level wildcard bindings $PREFIX leaves your application open to
      security vulnerabilities and give attackers more control over where
      traffic is routed. If you must use wildcards, consider using subdomain
      wildcard binding. For example, you can use "*.asdf.gov" if you own all of
      "asdf.gov".
    patterns:
      - pattern-inside: |
          using System.Net;
          ...
      - pattern: $LISTENER.Prefixes.Add("$PREFIX")
      - metavariable-regex:
          metavariable: $PREFIX
          regex: (http|https)://(\*|\+)(.[a-zA-Z]{2,})?:[0-9]+
