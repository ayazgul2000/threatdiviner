rules:
  - id: >-
      java.java-jwt.security.audit.jwt-decode-without-verify.java-jwt-decode-without-verify
    message: >-
      Detected the decoding of a JWT token without a verify step. JWT tokens
      must be verified before use, otherwise the token's integrity is unknown.
      This means a malicious actor could forge a JWT token with any claims. Call
      '.verify()' before using the token.
    metadata:
      cwe:
        - 'CWE-345: Insufficient Verification of Data Authenticity'
      owasp:
        - A08:2021 - Software and Data Integrity Failures
        - A08:2025 - Software or Data Integrity Failures
      source-rule-url: >-
        https://semgrep.dev/blog/2020/hardcoded-secrets-unverified-tokens-and-other-common-jwt-mistakes/
      category: security
      technology:
        - jwt
      confidence: MEDIUM
      references:
        - https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures
      subcategory:
        - vuln
      likelihood: LOW
      impact: HIGH
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authentication
      source: >-
        https://semgrep.dev/r/java.java-jwt.security.audit.jwt-decode-without-verify.java-jwt-decode-without-verify
      shortlink: https://sg.run/Bk95
      semgrep.dev:
        rule:
          r_id: 9151
          rv_id: 1262979
          rule_id: pKUOE9
          version_id: vdT06Lp
          url: >-
            https://semgrep.dev/playground/r/vdT06Lp/java.java-jwt.security.audit.jwt-decode-without-verify.java-jwt-decode-without-verify
          origin: community
    languages:
      - java
    severity: WARNING
    patterns:
      - pattern: |
          com.auth0.jwt.JWT.decode(...);
      - pattern-not-inside: |-
          class $CLASS {
            ...
            $RETURNTYPE $FUNC (...) {
              ...
              $VERIFIER.verify(...);
              ...
            }
          }
