rules:
  - id: >-
      javascript.jsonwebtoken.security.audit.jwt-decode-without-verify.jwt-decode-without-verify
    message: >-
      Detected the decoding of a JWT token without a verify step. JWT tokens
      must be verified before use, otherwise the token's integrity is unknown.
      This means a malicious actor could forge a JWT token with any claims. Call
      '.verify()' before using the token.
    metadata:
      cwe:
        - 'CWE-345: Insufficient Verification of Data Authenticity'
      owasp:
        - A08:2021 - Software and Data Integrity Failures
        - A08:2025 - Software or Data Integrity Failures
      source-rule-url: >-
        https://semgrep.dev/blog/2020/hardcoded-secrets-unverified-tokens-and-other-common-jwt-mistakes/
      asvs:
        section: 'V3: Session Management Verification Requirements'
        control_id: 3.5.3 Insecue Stateless Session Tokens
        control_url: >-
          https://github.com/OWASP/ASVS/blob/master/4.0/en/0x12-V3-Session-management.md#v35-token-based-session-management
        version: '4'
      category: security
      technology:
        - jwt
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      references:
        - https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authentication
      source: >-
        https://semgrep.dev/r/javascript.jsonwebtoken.security.audit.jwt-decode-without-verify.jwt-decode-without-verify
      shortlink: https://sg.run/J9YP
      semgrep.dev:
        rule:
          r_id: 9302
          rv_id: 1263187
          rule_id: KxUbL3
          version_id: LjTkgpe
          url: >-
            https://semgrep.dev/playground/r/LjTkgpe/javascript.jsonwebtoken.security.audit.jwt-decode-without-verify.jwt-decode-without-verify
          origin: community
    languages:
      - javascript
      - typescript
    severity: WARNING
    patterns:
      - pattern-inside: |
          $JWT = require('jsonwebtoken');
          ...
      - pattern-not-inside: |
          ...
          $JWT.verify($TOKEN, ...)
          ...
      - pattern-not-inside: |
          ...
          if (<... $JWT.verify($TOKEN, ...) ...>) { ... }
          ...
      - pattern: $JWT.decode($TOKEN, ...)
