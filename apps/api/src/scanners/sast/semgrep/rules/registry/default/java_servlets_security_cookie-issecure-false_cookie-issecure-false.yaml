rules:
  - id: java.servlets.security.cookie-issecure-false.cookie-issecure-false
    patterns:
      - pattern: $COOKIE = new Cookie($...ARGS);
      - pattern-not-inside: |
          $COOKIE = new Cookie(...);
          ...
          $COOKIE.setSecure(...);
    message: >-
      Default session middleware settings: `setSecure` not set to true. This
      ensures that the cookie is sent only over HTTPS to prevent cross-site
      scripting attacks.
    fix: |
      $COOKIE = new Cookie($...ARGS);
      $COOKIE.setSecure(true);
    metadata:
      vulnerability: Insecure Transport
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      cwe:
        - 'CWE-319: Cleartext Transmission of Sensitive Information'
      references:
        - >-
          https://docs.oracle.com/javaee/6/api/javax/servlet/http/Cookie.html#setSecure(boolean)
        - https://owasp.org/www-community/controls/SecureCookieAttribute
      category: security
      technology:
        - java
        - cookie
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Mishandled Sensitive Information
      source: >-
        https://semgrep.dev/r/java.servlets.security.cookie-issecure-false.cookie-issecure-false
      shortlink: https://sg.run/pxn0
      semgrep.dev:
        rule:
          r_id: 9218
          rv_id: 1263073
          rule_id: kxUkn9
          version_id: bZT53lB
          url: >-
            https://semgrep.dev/playground/r/bZT53lB/java.servlets.security.cookie-issecure-false.cookie-issecure-false
          origin: community
    languages:
      - java
    severity: WARNING
