rules:
  - id: >-
      javascript.playwright.security.audit.playwright-addinitscript-code-injection.playwright-addinitscript-code-injection
    message: >-
      If unverified user data can reach the `addInitScript` method it can result
      in Server-Side Request Forgery vulnerabilities
    metadata:
      owasp:
        - A10:2021 - Server-Side Request Forgery (SSRF)
        - A01:2025 - Broken Access Control
      cwe:
        - 'CWE-918: Server-Side Request Forgery (SSRF)'
      category: security
      technology:
        - playwright
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: HIGH
      confidence: LOW
      references:
        - >-
          https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Server-Side Request Forgery (SSRF)
      source: >-
        https://semgrep.dev/r/javascript.playwright.security.audit.playwright-addinitscript-code-injection.playwright-addinitscript-code-injection
      shortlink: https://sg.run/Zv94
      semgrep.dev:
        rule:
          r_id: 9335
          rv_id: 1263227
          rule_id: 4bUkj1
          version_id: 1QTyp0G
          url: >-
            https://semgrep.dev/playground/r/1QTyp0G/javascript.playwright.security.audit.playwright-addinitscript-code-injection.playwright-addinitscript-code-injection
          origin: community
    languages:
      - javascript
      - typescript
    severity: WARNING
    patterns:
      - pattern-inside: |
          require('playwright');
          ...
      - pattern-not-inside: |
          var $INPUT = function $FNAME(...){...};
          ...
      - pattern: $CONTEXT.addInitScript($INPUT,...)
      - pattern-not: $CONTEXT.addInitScript("...",...)
      - pattern-not: $CONTEXT.addInitScript(function(...){...},...)
