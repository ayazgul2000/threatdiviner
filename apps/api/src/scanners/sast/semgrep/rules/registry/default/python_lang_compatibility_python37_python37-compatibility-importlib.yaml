rules:
  - id: python.lang.compatibility.python37.python37-compatibility-importlib
    pattern: importlib.source_hash()
    message: >-
      source_hash' is only available on Python 3.7+. This does not work in lower
      versions, and therefore is not backwards compatible. Instead, use another
      hash function.
    languages:
      - python
    severity: ERROR
    metadata:
      category: compatibility
      technology:
        - python
