rules:
  - id: go.lang.security.audit.net.fs-directory-listing.fs-directory-listing
    message: >-
      Detected usage of 'http.FileServer' as handler: this allows directory
      listing and an attacker could navigate through directories looking for
      sensitive files. Be sure to disable directory listing or restrict access
      to specific directories/files.
    severity: WARNING
    languages:
      - go
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  $FS := http.FileServer(...)
                  ...
              - pattern-either:
                  - pattern: |
                      http.ListenAndServe(..., $FS)
                  - pattern: |
                      http.ListenAndServeTLS(..., $FS)
                  - pattern: |
                      http.Handle(..., $FS)
                  - pattern: |
                      http.HandleFunc(..., $FS)
          - patterns:
              - pattern: |
                  http.$FN(..., http.FileServer(...))
              - metavariable-regex:
                  metavariable: $FN
                  regex: (ListenAndServe|ListenAndServeTLS|Handle|HandleFunc)
    metadata:
      category: security
      cwe:
        - 'CWE-548: Exposure of Information Through Directory Listing'
      owasp:
        - A06:2017 - Security Misconfiguration
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      references:
        - https://github.com/OWASP/Go-SCP
        - https://cwe.mitre.org/data/definitions/548.html
      confidence: MEDIUM
      technology:
        - go
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Mishandled Sensitive Information
      source: >-
        https://semgrep.dev/r/go.lang.security.audit.net.fs-directory-listing.fs-directory-listing
      shortlink: https://sg.run/4R8x
