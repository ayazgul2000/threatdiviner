rules:
  - id: >-
      csharp.dotnet.security.use_deprecated_cipher_algorithm.use_deprecated_cipher_algorithm
    message: >-
      Usage of deprecated cipher algorithm detected. Use Aes or ChaCha20Poly1305
      instead.
    severity: ERROR
    metadata:
      likelihood: HIGH
      impact: MEDIUM
      confidence: MEDIUM
      category: security
      cwe:
        - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
      owasp:
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      references:
        - >-
          https://learn.microsoft.com/en-gb/dotnet/api/system.security.cryptography.des?view=net-6.0#remarks
        - >-
          https://learn.microsoft.com/en-gb/dotnet/api/system.security.cryptography.rc2?view=net-6.0#remarks
        - >-
          https://learn.microsoft.com/en-gb/dotnet/api/system.security.cryptography.aes?view=net-6.0
        - >-
          https://learn.microsoft.com/en-gb/dotnet/api/system.security.cryptography.chacha20poly1305?view=net-6.0
      subcategory:
        - vuln
      technology:
        - .net
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/csharp.dotnet.security.use_deprecated_cipher_algorithm.use_deprecated_cipher_algorithm
      shortlink: https://sg.run/k8Qo
      semgrep.dev:
        rule:
          r_id: 36772
          rv_id: 1262622
          rule_id: WAUJr0
          version_id: 9lT4bRK
          url: >-
            https://semgrep.dev/playground/r/9lT4bRK/csharp.dotnet.security.use_deprecated_cipher_algorithm.use_deprecated_cipher_algorithm
          origin: community
    languages:
      - csharp
    patterns:
      - pattern: $KEYTYPE.Create(...);
      - metavariable-pattern:
          metavariable: $KEYTYPE
          pattern-either:
            - pattern: DES
            - pattern: RC2
