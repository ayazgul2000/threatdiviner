rules:
  - id: html.security.plaintext-http-link.plaintext-http-link
    metadata:
      category: security
      technology:
        - html
      cwe:
        - 'CWE-319: Cleartext Transmission of Sensitive Information'
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      confidence: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/319.html
      likelihood: LOW
      impact: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Mishandled Sensitive Information
      source: >-
        https://semgrep.dev/r/html.security.plaintext-http-link.plaintext-http-link
      shortlink: https://sg.run/RA5q
      semgrep.dev:
        rule:
          r_id: 39193
          rv_id: 1262976
          rule_id: AbUnNo
          version_id: xyTjzRL
          url: >-
            https://semgrep.dev/playground/r/xyTjzRL/html.security.plaintext-http-link.plaintext-http-link
          origin: community
    patterns:
      - pattern: <a href="$URL">...</a>
      - metavariable-regex:
          metavariable: $URL
          regex: ^(?i)http://
    message: >-
      This link points to a plaintext HTTP URL. Prefer an encrypted HTTPS URL if
      possible.
    severity: WARNING
    languages:
      - html
