rules:
  - id: kotlin.lang.security.use-of-md5.use-of-md5
    message: >-
      Detected MD5 hash algorithm which is considered insecure. MD5 is not
      collision resistant and is therefore not suitable as a cryptographic
      signature. Use SHA256 or SHA3 instead.
    languages:
      - kt
    severity: WARNING
    metadata:
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      cwe:
        - 'CWE-328: Use of Weak Hash'
      source-rule-url: https://find-sec-bugs.github.io/bugs.htm#WEAK_MESSAGE_DIGEST_MD5
      category: security
      technology:
        - kotlin
      references:
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
      subcategory:
        - vuln
      likelihood: LOW
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Insecure Hashing Algorithm
      source: https://semgrep.dev/r/kotlin.lang.security.use-of-md5.use-of-md5
      shortlink: https://sg.run/4eQx
      semgrep.dev:
        rule:
          r_id: 14700
          rv_id: 1263267
          rule_id: qNUXPj
          version_id: pZT03Jd
          url: >-
            https://semgrep.dev/playground/r/pZT03Jd/kotlin.lang.security.use-of-md5.use-of-md5
          origin: community
    pattern-either:
      - pattern: |
          java.security.MessageDigest.getInstance("MD5")
      - pattern: |
          org.apache.commons.codec.digest.DigestUtils.getMd5Digest()
