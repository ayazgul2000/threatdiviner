rules:
  - id: >-
      python.lang.security.audit.network.http-not-https-connection.http-not-https-connection
    message: >-
      Detected HTTPConnectionPool. This will transmit data in cleartext. It is
      recommended to use HTTPSConnectionPool instead for to encrypt
      communications.
    metadata:
      cwe:
        - 'CWE-319: Cleartext Transmission of Sensitive Information'
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      references:
        - >-
          https://urllib3.readthedocs.io/en/1.2.1/pools.html#urllib3.connectionpool.HTTPSConnectionPool
      category: security
      technology:
        - python
      subcategory:
        - audit
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Mishandled Sensitive Information
      source: >-
        https://semgrep.dev/r/python.lang.security.audit.network.http-not-https-connection.http-not-https-connection
      shortlink: https://sg.run/N4Np
      semgrep.dev:
        rule:
          r_id: 9671
          rv_id: 1263507
          rule_id: v8UnWQ
          version_id: qkTR7E1
          url: >-
            https://semgrep.dev/playground/r/qkTR7E1/python.lang.security.audit.network.http-not-https-connection.http-not-https-connection
          origin: community
    languages:
      - python
    severity: ERROR
    pattern-either:
      - pattern: urllib3.HTTPConnectionPool(...)
      - pattern: urllib3.connectionpool.HTTPConnectionPool(...)
