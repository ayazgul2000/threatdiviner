rules:
  - id: typescript.react.security.react-insecure-request.react-insecure-request
    message: Unencrypted request over HTTP detected.
    metadata:
      vulnerability: Insecure Transport
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      cwe:
        - 'CWE-319: Cleartext Transmission of Sensitive Information'
      references:
        - https://www.npmjs.com/package/axios
      category: security
      technology:
        - react
      subcategory:
        - vuln
      likelihood: LOW
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Mishandled Sensitive Information
      source: >-
        https://semgrep.dev/r/typescript.react.security.react-insecure-request.react-insecure-request
      shortlink: https://sg.run/1n0b
      semgrep.dev:
        rule:
          r_id: 9766
          rv_id: 1263918
          rule_id: NbUA3O
          version_id: A8Tgd2p
          url: >-
            https://semgrep.dev/playground/r/A8Tgd2p/typescript.react.security.react-insecure-request.react-insecure-request
          origin: community
    languages:
      - typescript
      - javascript
    severity: ERROR
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      import $AXIOS from 'axios';
                      ...
                      $AXIOS.$METHOD(...)
                  - pattern-inside: |
                      $AXIOS = require('axios');
                      ...
                      $AXIOS.$METHOD(...)
              - pattern: $AXIOS.$VERB("$URL",...)
              - metavariable-regex:
                  metavariable: $VERB
                  regex: ^(get|post|delete|head|patch|put|options)
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      import $AXIOS from 'axios';
                      ...
                      $AXIOS(...)
                  - pattern-inside: |
                      $AXIOS = require('axios');
                      ...
                      $AXIOS(...)
              - pattern-either:
                  - pattern: '$AXIOS({url: "$URL"}, ...)'
                  - pattern: |
                      $OPTS = {url: "$URL"}
                      ...
                      $AXIOS($OPTS, ...)
          - pattern: fetch("$URL", ...)
      - metavariable-regex:
          metavariable: $URL
          regex: ^([Hh][Tt][Tt][Pp]:\/\/(?!localhost).*)
