rules:
  - id: >-
      generic.visualforce.security.ncino.vf.xssfromunescapedurlparam.xss-from-unescaped-url-param
    languages:
      - generic
    severity: ERROR
    message: >-
      To remediate this issue, ensure that all URL parameters are properly
      escaped before including them in scripts. Please update your code to use
      either the JSENCODE method to escape URL parameters or the escape="true"
      attribute on <apex:outputText> tags. Passing URL parameters directly into
      scripts and DOM sinks creates an opportunity for Cross-Site Scripting
      attacks. Cross-Site Scripting (XSS) attacks are a type of injection, in
      which malicious scripts are injected into otherwise benign and trusted
      websites. To remediate this issue, ensure that all URL parameters are
      properly escaped before including them in scripts.
    metadata:
      cwe:
        - >-
          CWE-79: Improper Neutralization of Input During Web Page Generation
          ('Cross-site Scripting')
      owasp:
        - A07:2017 - Cross-Site Scripting (XSS)
        - A03:2021 - Injection
        - A05:2025 - Injection
      references:
        - >-
          https://developer.salesforce.com/docs/atlas.en-us.apexcode.meta/apexcode/pages_security_tips_xss.htm
      category: security
      subcategory:
        - vuln
      technology:
        - salesforce
        - visualforce
      cwe2022-top25: true
      cwe2021-top25: true
      likelihood: HIGH
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cross-Site-Scripting (XSS)
      source: >-
        https://semgrep.dev/r/generic.visualforce.security.ncino.vf.xssfromunescapedurlparam.xss-from-unescaped-url-param
      shortlink: https://sg.run/9bGk
      semgrep.dev:
        rule:
          r_id: 72423
          rv_id: 1262906
          rule_id: BYUAJ2
          version_id: GxTkekB
          url: >-
            https://semgrep.dev/playground/r/GxTkekB/generic.visualforce.security.ncino.vf.xssfromunescapedurlparam.xss-from-unescaped-url-param
          origin: community
    patterns:
      - pattern-either:
          - pattern: >-
              <apex:outputText...escape="false"...value="{!...CurrentPage.parameters.$URL_PARAM}".../>
          - pattern: >-
              <apex:outputText...value="{!...CurrentPage.parameters.$URL_PARAM}"...escape="false".../>
          - pattern: <script>...'{!...CurrentPage.parameters.$URL_PARAM}'...</script>
      - pattern-not: >-
          <script>...'{!...JSENCODE(...CurrentPage.parameters.$URL_PARAM})'...</script>
    paths:
      include:
        - '*.component'
        - '*.page'
