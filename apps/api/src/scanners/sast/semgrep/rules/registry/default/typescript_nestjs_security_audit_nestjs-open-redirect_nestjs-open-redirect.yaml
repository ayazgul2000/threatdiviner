rules:
  - id: typescript.nestjs.security.audit.nestjs-open-redirect.nestjs-open-redirect
    message: >-
      Untrusted user input in {url: ...} can result in Open Redirect
      vulnerability.
    metadata:
      cwe:
        - 'CWE-601: URL Redirection to Untrusted Site (''Open Redirect'')'
      category: security
      technology:
        - nestjs
      owasp:
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      references:
        - https://owasp.org/Top10/A01_2021-Broken_Access_Control
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Open Redirect
      source: >-
        https://semgrep.dev/r/typescript.nestjs.security.audit.nestjs-open-redirect.nestjs-open-redirect
      shortlink: https://sg.run/6rJw
      semgrep.dev:
        rule:
          r_id: 9759
          rv_id: 1263911
          rule_id: X5UZQK
          version_id: qkTR7y4
          url: >-
            https://semgrep.dev/playground/r/qkTR7y4/typescript.nestjs.security.audit.nestjs-open-redirect.nestjs-open-redirect
          origin: community
    languages:
      - typescript
    severity: WARNING
    patterns:
      - pattern: |
          return {url: $URL}
      - pattern-inside: |
          class $CN {
              @Redirect(...)
              $FN(...) {
                  ...
              }
          }
      - pattern-not: |
          return {url: "..."}
