rules:
  - id: php.lang.security.deserialization.extract-user-data
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $_GET[...]
          - pattern: $_FILES[...]
          - pattern: $_POST[...]
    pattern-sinks:
      - pattern: extract(...)
    pattern-sanitizers:
      - pattern: extract($VAR, EXTR_SKIP,...)
    message: >-
      Do not call 'extract()' on user-controllable data. If you must, then you
      must also provide the EXTR_SKIP flag to prevent overwriting existing
      variables.
    languages:
      - php
    metadata:
      category: security
      cwe:
        - 'CWE-502: Deserialization of Untrusted Data'
      owasp:
        - A08:2017 - Insecure Deserialization
        - A08:2021 - Software and Data Integrity Failures
        - A08:2025 - Software or Data Integrity Failures
      technology:
        - php
      references:
        - >-
          https://www.php.net/manual/en/function.extract.php#refsect1-function.extract-notes
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - 'Insecure Deserialization '
      source: >-
        https://semgrep.dev/r/php.lang.security.deserialization.extract-user-data
      shortlink: https://sg.run/6bv1
      semgrep.dev:
        rule:
          r_id: 18259
          rv_id: 1263278
          rule_id: nJUykq
          version_id: w8TRovw
          url: >-
            https://semgrep.dev/playground/r/w8TRovw/php.lang.security.deserialization.extract-user-data
          origin: community
    severity: ERROR
