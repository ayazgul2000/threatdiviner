rules:
  - id: >-
      python.pyramid.audit.set-cookie-httponly-unsafe-value.pyramid-set-cookie-httponly-unsafe-value
    patterns:
      - pattern-either:
          - pattern-inside: |
              @pyramid.view.view_config(...)
              def $VIEW($REQUEST):
                  ...
                  $RESPONSE = $REQUEST.response
                  ...
          - pattern-inside: |
              def $VIEW(...):
                  ...
                  $RESPONSE = pyramid.httpexceptions.HTTPFound(...)
                  ...
      - pattern-not: $RESPONSE.set_cookie(..., **$PARAMS)
      - pattern: $RESPONSE.set_cookie(..., httponly=$HTTPONLY, ...)
      - pattern: $HTTPONLY
      - metavariable-pattern:
          metavariable: $HTTPONLY
          pattern: |
            False
    fix: |
      True
    message: >-
      Found a Pyramid cookie without the httponly option correctly set. Pyramid
      cookies should be handled securely by setting httponly=True in
      response.set_cookie(...). If this parameter is not properly set, your
      cookies are not properly protected and are at risk of being stolen by an
      attacker.
    metadata:
      cwe:
        - 'CWE-1004: Sensitive Cookie Without ''HttpOnly'' Flag'
      owasp:
        - A05:2021 - Security Misconfiguration
        - A02:2025 - Security Misconfiguration
      references:
        - https://owasp.org/www-community/controls/SecureCookieAttribute
        - https://owasp.org/www-community/HttpOnly
        - >-
          https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html#httponly-attribute
      category: security
      technology:
        - pyramid
      subcategory:
        - vuln
      likelihood: LOW
      impact: LOW
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cookie Security
      source: >-
        https://semgrep.dev/r/python.pyramid.audit.set-cookie-httponly-unsafe-value.pyramid-set-cookie-httponly-unsafe-value
      shortlink: https://sg.run/JbqP
      semgrep.dev:
        rule:
          r_id: 21446
          rv_id: 1263566
          rule_id: ZqU37W
          version_id: YDTZe54
          url: >-
            https://semgrep.dev/playground/r/YDTZe54/python.pyramid.audit.set-cookie-httponly-unsafe-value.pyramid-set-cookie-httponly-unsafe-value
          origin: community
    languages:
      - python
    severity: WARNING
