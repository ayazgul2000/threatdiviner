rules:
  - id: >-
      terraform.azure.security.appservice.azure-appservice-min-tls-version.azure-appservice-min-tls-version
    message: Ensure web app is using the latest version of TLS encryption
    patterns:
      - pattern-either:
          - pattern: |
              "1.0"
          - pattern: |
              "1.1"
      - pattern-inside: min_tls_version = ...
      - pattern-inside: |
          $RESOURCE "azurerm_app_service" "..." {
          ...
          }
    metadata:
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      cwe:
        - 'CWE-326: Inadequate Encryption Strength'
      category: security
      technology:
        - terraform
        - azure
      references:
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/terraform.azure.security.appservice.azure-appservice-min-tls-version.azure-appservice-min-tls-version
      shortlink: https://sg.run/rDwn
      semgrep.dev:
        rule:
          r_id: 23969
          rv_id: 1263769
