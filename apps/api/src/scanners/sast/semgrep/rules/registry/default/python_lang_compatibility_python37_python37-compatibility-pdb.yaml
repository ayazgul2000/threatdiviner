rules:
  - id: python.lang.compatibility.python37.python37-compatibility-pdb
    pattern: pdb.set_trace(header=$X, ...)
    message: >-
      pdb.set_trace() with the header argument is only available on Python 3.7+
      and is therefore not backwards compatible. Instead, use set_trace()
      without the header argument.
    languages:
      - python
    severity: ERROR
    metadata:
      category: compatibility
      technology:
        - python
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      source: >-
        https://semgrep.dev/r/python.lang.compatibility.python37.python37-compatibility-pdb
      shortlink: https://sg.run/GeA2
