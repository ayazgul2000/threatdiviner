rules:
  - id: >-
      php.lang.security.injection.tainted-object-instantiation.tainted-object-instantiation
    languages:
      - php
    severity: WARNING
    message: >-
      <- A new object is created where the class name is based on user input.
      This could lead to remote code execution, as it allows to instantiate any
      class in the application.
    metadata:
      cwe:
        - >-
          CWE-470: Use of Externally-Controlled Input to Select Classes or Code
          ('Unsafe Reflection')
      category: security
      technology:
        - php
      owasp:
        - A03:2021 - Injection
        - A05:2025 - Injection
      references:
        - https://owasp.org/Top10/A03_2021-Injection
      subcategory:
        - vuln
      impact: MEDIUM
      likelihood: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authorization
      source: >-
        https://semgrep.dev/r/php.lang.security.injection.tainted-object-instantiation.tainted-object-instantiation
      shortlink: https://sg.run/7ndw
      semgrep.dev:
        rule:
          r_id: 16438
          rv_id: 1263288
          rule_id: v8U4DA
          version_id: LjTkgLy
          url: >-
            https://semgrep.dev/playground/r/LjTkgLy/php.lang.security.injection.tainted-object-instantiation.tainted-object-instantiation
          origin: community
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $_GET
              - pattern: $_POST
              - pattern: $_COOKIE
              - pattern: $_REQUEST
              - pattern: $_SERVER
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern-inside: new $SINK(...)
          - pattern: $SINK
