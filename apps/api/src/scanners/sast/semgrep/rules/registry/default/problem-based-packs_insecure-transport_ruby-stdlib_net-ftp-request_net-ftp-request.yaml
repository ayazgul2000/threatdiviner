rules:
  - id: >-
      problem-based-packs.insecure-transport.ruby-stdlib.net-ftp-request.net-ftp-request
    message: >-
      Checks for outgoing connections to ftp servers with the 'net/ftp' package.
      FTP does not encrypt traffic, possibly leading to PII being sent plaintext
      over the network. Instead, connect via the SFTP protocol.
    severity: WARNING
    metadata:
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      category: security
      cwe: 'CWE-319: Cleartext Transmission of Sensitive Information'
      owasp: A03:2017 - Sensitive Data Exposure
      references:
        - https://docs.ruby-lang.org/en/2.0.0/Net/FTP.html
      subcategory:
        - vuln
      technology:
        - ruby
      vulnerability: Insecure Transport
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Mishandled Sensitive Information
      source: >-
        https://semgrep.dev/r/problem-based-packs.insecure-transport.ruby-stdlib.net-ftp-request.net-ftp-request
      shortlink: https://sg.run/eLQ8
      semgrep.dev:
        rule:
          r_id: 9432
          rv_id: 946076
          rule_id: 8GUj13
          version_id: K3TJbe1
          url: >-
            https://semgrep.dev/playground/r/K3TJbe1/problem-based-packs.insecure-transport.ruby-stdlib.net-ftp-request.net-ftp-request
          origin: community
    languages:
      - ruby
    pattern-either:
      - pattern: |
          $FTP = Net::FTP.new('...')
          ...
          $FTP.login
      - pattern: |
          Net::FTP.open('...') do |ftp|
            ...
            ftp.login
          end
