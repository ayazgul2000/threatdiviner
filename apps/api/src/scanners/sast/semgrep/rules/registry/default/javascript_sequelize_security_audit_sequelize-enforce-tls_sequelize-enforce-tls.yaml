rules:
  - id: >-
      javascript.sequelize.security.audit.sequelize-enforce-tls.sequelize-enforce-tls
    message: >-
      If TLS is disabled on server side (Postgresql server), Sequelize
      establishes connection without TLS and no error will be thrown. To prevent
      MITN (Man In The Middle) attack, TLS must be enforce by Sequelize. Set
      "ssl: true" or define settings "ssl: {...}"
    metadata:
      cwe:
        - 'CWE-319: Cleartext Transmission of Sensitive Information'
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      references:
        - https://node-postgres.com/features/ssl
        - https://nodejs.org/api/tls.html#tls_class_tls_tlssocket
        - https://nodejs.org/api/tls.html#tls_tls_createsecurecontext_options
        - https://nodejs.org/api/tls.html#tls_tls_default_min_version
      category: security
      technology:
        - sequelize
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Mishandled Sensitive Information
      source: >-
        https://semgrep.dev/r/javascript.sequelize.security.audit.sequelize-enforce-tls.sequelize-enforce-tls
      shortlink: https://sg.run/yz6Z
      semgrep.dev:
        rule:
          r_id: 9968
          rv_id: 1263240
          rule_id: NbUAYW
          version_id: ZRTKAJ4
          url: >-
            https://semgrep.dev/playground/r/ZRTKAJ4/javascript.sequelize.security.audit.sequelize-enforce-tls.sequelize-enforce-tls
          origin: community
    languages:
      - javascript
      - typescript
    severity: WARNING
    patterns:
      - pattern: |
          {
            host: $HOST,
            database: $DATABASE,
            dialect: $DIALECT
           }
      - pattern-not: |
          {
            host: $HOST,
            database: $DATABASE,
            dialect: "postgres",
            dialectOptions: {
                ssl: true
            }
          }
      - pattern-not: |
          {
            host: $HOST,
            database: $DATABASE,
            dialect: $DIALECT,
            dialectOptions: {
              ssl: { ... }
            }
          }
      - metavariable-regex:
          metavariable: $DIALECT
          regex: '[''"](mariadb|mysql|postgres)[''"]'
