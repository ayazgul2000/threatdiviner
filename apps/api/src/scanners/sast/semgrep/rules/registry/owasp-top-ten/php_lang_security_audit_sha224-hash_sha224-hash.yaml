rules:
  - id: php.lang.security.audit.sha224-hash.sha224-hash
    pattern-either:
      - pattern: hash('sha224', ...);
      - pattern: hash('sha512/224', ...);
      - pattern: hash('sha3-224', ...);
      - pattern: hash_hmac('sha224', ...);
      - pattern: hash_hmac('sha512/224', ...);
      - pattern: hash_hmac('sha3-224', ...);
    message: >-
      This code uses a 224-bit hash function, which is deprecated or disallowed
      in some security policies. Consider updating to a stronger hash function
      such as SHA-384 or higher to ensure compliance and security.
    metadata:
      cwe:
        - 'CWE-328: Use of Weak Hash'
      references:
        - >-
          https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-131Ar3.ipd.pdf
        - >-
          https://www.cyber.gov.au/resources-business-and-government/essential-cyber-security/ism/cyber-security-guidelines/guidelines-cryptography
      category: security
      technology:
        - php
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: HIGH
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Insecure Hashing Algorithm
      source: https://semgrep.dev/r/php.lang.security.audit.sha224-hash.sha224-hash
      shortlink: https://sg.run/BYXqv
      semgrep.dev:
        rule:
          r_id: 151751
          rv_id: 1263275
          rule_id: AbU97EA
          version_id: bZT53Jo
          url: >-
            https://semgrep.dev/playground/r/bZT53Jo/php.lang.security.audit.sha224-hash.sha224-hash
          origin: community
    languages:
      - php
    severity: WARNING
