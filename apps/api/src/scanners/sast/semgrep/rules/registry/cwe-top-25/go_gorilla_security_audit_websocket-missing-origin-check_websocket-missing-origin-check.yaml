rules:
  - id: >-
      go.gorilla.security.audit.websocket-missing-origin-check.websocket-missing-origin-check
    patterns:
      - pattern-inside: |
          import ("github.com/gorilla/websocket")
          ...
      - patterns:
          - pattern-not-inside: |
              $UPGRADER = websocket.Upgrader{..., CheckOrigin: $FN ,...}
              ...
          - pattern-not-inside: |
              $UPGRADER.CheckOrigin = $FN2
              ...
          - pattern: |
              $UPGRADER.Upgrade(...)
    message: >-
      The Origin header in the HTTP WebSocket handshake is used to guarantee
      that the connection accepted by the WebSocket is from a trusted origin
      domain. Failure to enforce can lead to Cross Site Request Forgery (CSRF).
      As per "gorilla/websocket" documentation: "A CheckOrigin function should
      carefully validate the request origin to prevent cross-site request
      forgery."
    languages:
      - go
    severity: WARNING
    metadata:
      category: security
      cwe:
        - 'CWE-352: Cross-Site Request Forgery (CSRF)'
      owasp:
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      references:
        - https://pkg.go.dev/github.com/gorilla/websocket#Upgrader
      technology:
        - gorilla
      confidence: MEDIUM
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cross-Site Request Forgery (CSRF)
      source: >-
        https://semgrep.dev/r/go.gorilla.security.audit.websocket-missing-origin-check.websocket-missing-origin-check
      shortlink: https://sg.run/xXpz
      semgrep.dev:
        rule:
          r_id: 18430
          rv_id: 1262914
          rule_id: ReUKdz
          version_id: qkTR7RP
