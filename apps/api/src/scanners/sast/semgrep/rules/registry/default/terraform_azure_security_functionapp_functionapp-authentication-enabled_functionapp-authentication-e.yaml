rules:
  - id: >-
      terraform.azure.security.functionapp.functionapp-authentication-enabled.functionapp-authentication-enabled
    message: >-
      Enabling authentication ensures that all communications in the application
      are authenticated. The `auth_settings` block needs to be filled out with
      the appropriate auth backend settings
    patterns:
      - pattern: resource
      - pattern-not-inside: |
          resource "azurerm_function_app" "..." {
          ...
            auth_settings {
              ...
              enabled = true
              ...
            }
          ...
          }
      - pattern-either:
          - pattern-inside: |
              resource "azurerm_function_app" "..." {
              ...
              }
          - pattern-inside: |
              resource "azurerm_function_app" "..." {
              ...
                auth_settings {
                  ...
                  enabled = false
                  ...
                }
              ...
              }
    metadata:
      cwe:
        - 'CWE-287: Improper Authentication'
      category: security
      technology:
        - terraform
        - azure
      references:
        - >-
          https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/function_app#enabled
      owasp:
        - A02:2017 - Broken Authentication
        - A07:2021 - Identification and Authentication Failures
        - A07:2025 - Authentication Failures
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authentication
      source: >-
        https://semgrep.dev/r/terraform.azure.security.functionapp.functionapp-authentication-enabled.functionapp-authentication-enabled
      shortlink: https://sg.run/B6AW
      semgrep.dev:
        rule:
          r_id: 15107
          rv_id: 1263800
          rule_id: 6JU1X8
          version_id: JdTzxr8
          url: >-
            https://semgrep.dev/playground/r/JdTzxr8/terraform.azure.security.functionapp.functionapp-authentication-enabled.functionapp-authentication-enabled
          origin: community
    languages:
      - hcl
    severity: INFO
