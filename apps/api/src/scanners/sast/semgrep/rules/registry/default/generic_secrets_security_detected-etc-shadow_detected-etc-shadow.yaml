rules:
  - id: generic.secrets.security.detected-etc-shadow.detected-etc-shadow
    patterns:
      - pattern-regex: ^(\s*)(?P<ROOT>root:[x!*]*:[0-9]*:[0-9]*)
      - focus-metavariable: $ROOT
    languages:
      - regex
    message: linux shadow file detected
    severity: ERROR
    metadata:
      cwe:
        - 'CWE-798: Use of Hard-coded Credentials'
      category: security
      technology:
        - secrets
      confidence: LOW
      owasp:
        - A07:2021 - Identification and Authentication Failures
        - A07:2025 - Authentication Failures
      references:
        - >-
          https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Hard-coded Secrets
      source: >-
        https://semgrep.dev/r/generic.secrets.security.detected-etc-shadow.detected-etc-shadow
      shortlink: https://sg.run/4ylL
      semgrep.dev:
        rule:
          r_id: 10044
          rv_id: 1262866
          rule_id: JDUP6p
          version_id: jQTn5yp
          url: >-
            https://semgrep.dev/playground/r/jQTn5yp/generic.secrets.security.detected-etc-shadow.detected-etc-shadow
          origin: community
