rules:
  - id: ruby.rails.security.brakeman.check-unscoped-find.check-unscoped-find
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: |
              cookies[...]
          - patterns:
              - pattern: |
                  cookies. ... .$PROPERTY[...]
              - metavariable-regex:
                  metavariable: $PROPERTY
                  regex: (?!signed|encrypted)
          - pattern: |
              params[...]
          - pattern: |
              request.env[...]
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $MODEL.find(...)
              - pattern: $MODEL.find_by_id(...)
              - pattern: $MODEL.find_by_id!(...)
          - metavariable-regex:
              metavariable: $MODEL
              regex: '[A-Z]\S+'
    message: >-
      Found an unscoped `find(...)` with user-controllable input. If the
      ActiveRecord model being searched against is sensitive, this may lead to
      Insecure Direct Object Reference (IDOR) behavior and allow users to read
      arbitrary records. Scope the find to the current user, e.g.
      `current_user.accounts.find(params[:id])`.
    languages:
      - ruby
    severity: WARNING
    metadata:
      source-rule-url: >-
        https://github.com/presidentbeef/brakeman/blob/main/lib/brakeman/checks/check_unscoped_find.rb
      category: security
      cwe:
        - 'CWE-639: Authorization Bypass Through User-Controlled Key'
      owasp:
        - A05:2017 - Broken Access Control
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      technology:
        - ruby
        - rails
      references:
        - https://brakemanscanner.org/docs/warning_types/unscoped_find/
        - >-
          https://github.com/presidentbeef/brakeman/blob/main/test/apps/rails3.1/app/controllers/users_controller.rb
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: HIGH
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authorization
      source: >-
        https://semgrep.dev/r/ruby.rails.security.brakeman.check-unscoped-find.check-unscoped-find
      shortlink: https://sg.run/dPbP
      semgrep.dev:
        rule:
          r_id: 20734
          rv_id: 1263664
          rule_id: x8Ud6d
          version_id: K3TKkxZ
          url: >-
            https://semgrep.dev/playground/r/K3TKkxZ/ruby.rails.security.brakeman.check-unscoped-find.check-unscoped-find
          origin: community
