rules:
  - id: >-
      terraform.aws.security.aws-kinesis-stream-unencrypted.aws-kinesis-stream-unencrypted
    patterns:
      - pattern: |
          resource "aws_kinesis_stream" $ANYTHING {
            ...
          }
      - pattern-not: |
          resource "aws_kinesis_stream" $ANYTHING {
            ...
            encryption_type = "KMS"
            ...
          }
    message: >-
      The AWS Kinesis stream does not encrypt data at rest. The data could be
      read if the Kinesis stream storage layer is compromised. Enable Kinesis
      stream server-side encryption.
    languages:
      - hcl
    severity: WARNING
    metadata:
      category: security
      technology:
        - terraform
        - aws
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A04:2021 - Insecure Design
        - A06:2025 - Insecure Design
      cwe:
        - 'CWE-311: Missing Encryption of Sensitive Data'
      references:
        - https://owasp.org/Top10/A04_2021-Insecure_Design
        - >-
          https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/kinesis_stream#encryption_type
        - >-
          https://docs.aws.amazon.com/streams/latest/dev/server-side-encryption.html
      subcategory:
        - audit
      likelihood: LOW
      impact: HIGH
      confidence: MEDIUM
      rule-origin-note: published from /src/aws-kinesis-stream-unencrypted.yml in None
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/terraform.aws.security.aws-kinesis-stream-unencrypted.aws-kinesis-stream-unencrypted
      shortlink: https://sg.run/KZ0L
      semgrep.dev:
        rule:
          r_id: 52199
          rv_id: 1263728
          rule_id: 8GU72N
          version_id: pZT037O
          url: >-
            https://semgrep.dev/playground/r/pZT037O/terraform.aws.security.aws-kinesis-stream-unencrypted.aws-kinesis-stream-unencrypted
          origin: community
