rules:
  - id: javascript.node-crypto.security.aead-no-final.aead-no-final
    message: >-
      The 'final' call of a Decipher object checks the authentication tag in a
      mode for authenticated encryption. Failing to call 'final' will invalidate
      all integrity guarantees of the released ciphertext.
    metadata:
      cwe:
        - 'CWE-310: CWE CATEGORY: Cryptographic Issues'
      owasp:
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      category: security
      subcategory:
        - vuln
      technology:
        - node-crypto
      likelihood: HIGH
      impact: MEDIUM
      confidence: HIGH
      references:
        - https://nodejs.org/api/crypto.html#deciphersetauthtagbuffer-encoding
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures/
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/javascript.node-crypto.security.aead-no-final.aead-no-final
      shortlink: https://sg.run/r6EEA
      semgrep.dev:
        rule:
          r_id: 146569
          rv_id: 1263222
          rule_id: 2ZUz884
          version_id: zyTb2X0
          url: >-
            https://semgrep.dev/playground/r/zyTb2X0/javascript.node-crypto.security.aead-no-final.aead-no-final
          origin: community
    languages:
      - javascript
      - typescript
    severity: ERROR
    patterns:
      - pattern: |
          $DECIPHER = $CRYPTO.createDecipheriv('$ALGO', ...)
          ...
          $DECIPHER.update(...)
      - pattern-not-inside: |
          $DECIPHER = $CRYPTO.createDecipheriv('$ALGO', ...)
          ...
          $DECIPHER.final(...)
      - metavariable-regex:
          metavariable: $ALGO
          regex: .*(-gcm|-ccm|-ocb|chacha20-poly1305)$
