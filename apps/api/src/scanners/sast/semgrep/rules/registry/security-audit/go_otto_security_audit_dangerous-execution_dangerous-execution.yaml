rules:
  - id: go.otto.security.audit.dangerous-execution.dangerous-execution
    message: >-
      Detected non-static script inside otto VM. Audit the input to 'VM.Run'. If
      unverified user data can reach this call site, this is a code injection
      vulnerability. A malicious actor can inject a malicious script to execute
      arbitrary code.
    metadata:
      cwe:
        - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
      owasp:
        - A03:2021 - Injection
        - A05:2025 - Injection
      category: security
      technology:
        - otto
        - vm
      confidence: LOW
      references:
        - https://owasp.org/Top10/A03_2021-Injection
      cwe2022-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: HIGH
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Code Injection
      source: >-
        https://semgrep.dev/r/go.otto.security.audit.dangerous-execution.dangerous-execution
      shortlink: https://sg.run/4xWE
      semgrep.dev:
        rule:
          r_id: 9144
          rv_id: 1262972
          rule_id: KxUbxk
          version_id: bZT53ZY
          url: >-
            https://semgrep.dev/playground/r/bZT53ZY/go.otto.security.audit.dangerous-execution.dangerous-execution
          origin: community
    severity: ERROR
    patterns:
      - pattern-inside: |
          $VM = otto.New(...)
          ...
      - pattern-not: $VM.Run("...", ...)
      - pattern: $VM.Run(...)
    languages:
      - go
