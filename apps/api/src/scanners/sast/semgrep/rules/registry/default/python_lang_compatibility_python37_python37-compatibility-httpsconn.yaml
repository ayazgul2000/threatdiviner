rules:
  - id: python.lang.compatibility.python37.python37-compatibility-httpsconn
    pattern: http.client.HTTPSConnection(blocksize=$X,...)
    message: >-
      Found usage of the 'blocksize' argument in a HTTPSConnection call. This is
      only available on Python 3.7+ and is therefore not backwards compatible.
      Remove this in order for this code to work in Python 3.6 and below.
    languages:
      - python
    severity: ERROR
    metadata:
      category: compatibility
      technology:
        - python
