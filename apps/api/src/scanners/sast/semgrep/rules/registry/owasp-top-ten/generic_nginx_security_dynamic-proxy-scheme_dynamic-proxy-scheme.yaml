rules:
  - id: generic.nginx.security.dynamic-proxy-scheme.dynamic-proxy-scheme
    paths:
      include:
        - '*.conf'
        - '*.vhost'
        - '**/sites-available/*'
        - '**/sites-enabled/*'
    languages:
      - generic
    severity: WARNING
    message: >-
      The protocol scheme for this proxy is dynamically determined. This can be
      dangerous if the scheme can be injected by an attacker because it may
      forcibly alter the connection scheme. Consider hardcoding a scheme for
      this proxy.
    metadata:
      cwe:
        - 'CWE-16: CWE CATEGORY: Configuration'
      references:
        - https://github.com/yandex/gixy/blob/master/docs/en/plugins/ssrf.md
      category: security
      technology:
        - nginx
      confidence: MEDIUM
      owasp:
        - A06:2017 - Security Misconfiguration
        - A05:2021 - Security Misconfiguration
        - A02:2025 - Security Misconfiguration
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Other
      source: >-
        https://semgrep.dev/r/generic.nginx.security.dynamic-proxy-scheme.dynamic-proxy-scheme
      shortlink: https://sg.run/EkAo
      semgrep.dev:
        rule:
          r_id: 9037
          rv_id: 1262672
          rule_id: ReUg7n
          version_id: w8TRoAJ
          url: >-
            https://semgrep.dev/playground/r/w8TRoAJ/generic.nginx.security.dynamic-proxy-scheme.dynamic-proxy-scheme
          origin: community
    pattern: proxy_pass $$SCHEME:// ...;
