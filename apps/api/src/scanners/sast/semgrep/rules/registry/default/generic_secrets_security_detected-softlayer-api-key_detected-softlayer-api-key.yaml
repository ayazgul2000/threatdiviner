rules:
  - id: >-
      generic.secrets.security.detected-softlayer-api-key.detected-softlayer-api-key
    pattern-regex: (?i)softlayer.{0,50}["|'|`]?[a-z0-9]{64}["|'|`]?
    languages:
      - regex
    message: SoftLayer API Key detected
    severity: ERROR
    metadata:
      cwe:
        - 'CWE-798: Use of Hard-coded Credentials'
      source-rule-url: >-
        https://github.com/Yelp/detect-secrets/blob/master/detect_secrets/plugins/softlayer.py
      category: security
      technology:
        - secrets
        - softlayer
      confidence: LOW
      owasp:
        - A07:2021 - Identification and Authentication Failures
        - A07:2025 - Authentication Failures
      references:
        - >-
          https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Hard-coded Secrets
      source: >-
        https://semgrep.dev/r/generic.secrets.security.detected-softlayer-api-key.detected-softlayer-api-key
      shortlink: https://sg.run/YXq4
      semgrep.dev:
        rule:
          r_id: 12858
          rv_id: 1262894
          rule_id: eqUplZ
          version_id: RGT0L0o
