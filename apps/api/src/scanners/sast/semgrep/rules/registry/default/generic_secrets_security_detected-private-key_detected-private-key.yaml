rules:
  - id: generic.secrets.security.detected-private-key.detected-private-key
    patterns:
      - pattern-either:
          - patterns:
              - pattern: '-----BEGIN $TYPE PRIVATE KEY----- $KEY'
              - metavariable-regex:
                  metavariable: $TYPE
                  regex: (?i)([dr]sa|ec|openssh|encrypted)?
          - patterns:
              - pattern: |
                  -----BEGIN PRIVATE KEY-----
                  $KEY
      - metavariable-analysis:
          metavariable: $KEY
          analyzer: entropy
    languages:
      - generic
    message: >-
      Private Key detected. This is a sensitive credential and should not be
      hardcoded here. Instead, store this in a separate, private file.
    severity: ERROR
    metadata:
      cwe:
        - 'CWE-798: Use of Hard-coded Credentials'
      source-rule-url: >-
        https://github.com/grab/secret-scanner/blob/master/scanner/signatures/pattern.go
      category: security
      technology:
        - secrets
      confidence: LOW
      owasp:
        - A07:2021 - Identification and Authentication Failures
        - A07:2025 - Authentication Failures
      references:
        - >-
          https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Hard-coded Secrets
      source: >-
        https://semgrep.dev/r/generic.secrets.security.detected-private-key.detected-private-key
      shortlink: https://sg.run/b7dr
      semgrep.dev:
        rule:
          r_id: 9070
          rv_id: 1262888
          rule_id: 7KUQ0p
          version_id: 3ZT4X4Y
          url: >-
            https://semgrep.dev/playground/r/3ZT4X4Y/generic.secrets.security.detected-private-key.detected-private-key
          origin: community
