rules:
  - id: >-
      terraform.aws.security.aws-fsx-windows-encrypted-with-cmk.aws-fsx-windows-encrypted-with-cmk
    patterns:
      - pattern: |
          resource "aws_fsx_windows_file_system" $ANYTHING {
            ...
          }
      - pattern-not-inside: |
          resource "aws_fsx_windows_file_system" $ANYTHING {
            ...
            kms_key_id = ...
            ...
          }
    message: >-
      Ensure FSX Windows file system is encrypted at rest using KMS CMKs. CMKs
      gives you control over the encryption key in terms of access and rotation.
    metadata:
      category: security
      technology:
        - terraform
        - aws
      owasp:
        - A03:2017 - Sensitive Data Exposure
      cwe:
        - 'CWE-320: CWE CATEGORY: Key Management Errors'
      references:
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/terraform.aws.security.aws-fsx-windows-encrypted-with-cmk.aws-fsx-windows-encrypted-with-cmk
      shortlink: https://sg.run/2pN0
      semgrep.dev:
        rule:
          r_id: 17363
          rv_id: 946698
          rule_id: ReUqv6
          version_id: NdTqknl
          url: >-
            https://semgrep.dev/playground/r/NdTqknl/terraform.aws.security.aws-fsx-windows-encrypted-with-cmk.aws-fsx-windows-encrypted-with-cmk
          origin: community
    languages:
      - hcl
    severity: WARNING
