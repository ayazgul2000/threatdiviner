rules:
  - id: >-
      javascript.lang.security.audit.incomplete-sanitization.incomplete-sanitization
    message: >-
      `$STR.replace` method will only replace the first occurrence when used
      with a string argument ($CHAR). If this method is used for escaping of
      dangerous data then there is a possibility for a bypass. Try to use
      sanitization library instead or use a Regex with a global flag.
    metadata:
      cwe:
        - 'CWE-116: Improper Encoding or Escaping of Output'
      category: security
      technology:
        - javascript
      owasp:
        - A03:2021 - Injection
        - A05:2025 - Injection
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      references:
        - https://owasp.org/Top10/A03_2021-Injection
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Encoding
      source: >-
        https://semgrep.dev/r/javascript.lang.security.audit.incomplete-sanitization.incomplete-sanitization
      shortlink: https://sg.run/1GbQ
      semgrep.dev:
        rule:
          r_id: 13466
          rv_id: 1263199
          rule_id: d8UlRq
          version_id: BjTkZQD
          url: >-
            https://semgrep.dev/playground/r/BjTkZQD/javascript.lang.security.audit.incomplete-sanitization.incomplete-sanitization
          origin: community
    languages:
      - javascript
      - typescript
    severity: WARNING
    patterns:
      - pattern: |
          $STR.replace(($CHAR: string), ...)
      - metavariable-regex:
          metavariable: $CHAR
          regex: ^[\"\']([\'\"\<\>\*\|\{\}\[\]\%\$]{1}|\\n|\\r|\\t|\\&)[\"\']$
