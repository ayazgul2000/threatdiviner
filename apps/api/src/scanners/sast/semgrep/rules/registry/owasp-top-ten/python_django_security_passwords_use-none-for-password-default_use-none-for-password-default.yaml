rules:
  - id: >-
      python.django.security.passwords.use-none-for-password-default.use-none-for-password-default
    message: >-
      '$VAR' is using the empty string as its default and is being used to set
      the password on '$MODEL'. If you meant to set an unusable password, set
      the default value to 'None' or call 'set_unusable_password()'.
    metadata:
      cwe:
        - 'CWE-521: Weak Password Requirements'
      owasp:
        - A07:2021 - Identification and Authentication Failures
        - A07:2025 - Authentication Failures
      references:
        - >-
          https://docs.djangoproject.com/en/3.0/ref/contrib/auth/#django.contrib.auth.models.User.set_password
      category: security
      technology:
        - django
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authentication
      source: >-
        https://semgrep.dev/r/python.django.security.passwords.use-none-for-password-default.use-none-for-password-default
      shortlink: https://sg.run/zvBW
      semgrep.dev:
        rule:
          r_id: 9517
          rv_id: 1263412
          rule_id: yyUn6Z
          version_id: RGT0LYX
          url: >-
            https://semgrep.dev/playground/r/RGT0LYX/python.django.security.passwords.use-none-for-password-default.use-none-for-password-default
          origin: community
    languages:
      - python
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: |
              $VAR = request.$W.get($X, $EMPTY)
              ...
              $MODEL.set_password($VAR)
              ...
              $MODEL.save(...)
          - pattern: |
              def $F(..., $VAR=$EMPTY, ...):
                ...
                $MODEL.set_password($VAR)
      - metavariable-pattern:
          metavariable: $EMPTY
          pattern: '""'
      - focus-metavariable: $EMPTY
    fix: |
      None
