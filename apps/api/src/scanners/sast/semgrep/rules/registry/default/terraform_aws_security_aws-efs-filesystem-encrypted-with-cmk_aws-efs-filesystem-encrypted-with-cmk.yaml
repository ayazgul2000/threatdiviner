rules:
  - id: >-
      terraform.aws.security.aws-efs-filesystem-encrypted-with-cmk.aws-efs-filesystem-encrypted-with-cmk
    patterns:
      - pattern: |
          resource "aws_efs_file_system" $ANYTHING {
            ...
            encrypted  = true
            ...
          }
      - pattern-not-inside: |
          resource "aws_efs_file_system" $ANYTHING {
            ...
            encrypted  = true
            kms_key_id = ...
            ...
          }
    message: >-
      Ensure EFS filesystem is encrypted at rest using KMS CMKs. CMKs gives you
      control over the encryption key in terms of access and rotation.
    metadata:
      category: security
      technology:
        - terraform
        - aws
      owasp:
        - A03:2017 - Sensitive Data Exposure
      cwe:
        - 'CWE-320: CWE CATEGORY: Key Management Errors'
      references:
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
      subcategory:
        - audit
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/terraform.aws.security.aws-efs-filesystem-encrypted-with-cmk.aws-efs-filesystem-encrypted-with-cmk
      shortlink: https://sg.run/Kk07
      semgrep.dev:
        rule:
          r_id: 17355
          rv_id: 946690
          rule_id: gxUJ4n
          version_id: 2KTYbWy
          url: >-
            https://semgrep.dev/playground/r/2KTYbWy/terraform.aws.security.aws-efs-filesystem-encrypted-with-cmk.aws-efs-filesystem-encrypted-with-cmk
          origin: community
    languages:
      - hcl
    severity: WARNING
