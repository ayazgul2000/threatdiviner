rules:
  - id: >-
      terraform.lang.security.rds-insecure-password-storage-in-source-code.rds-insecure-password-storage-in-source-code
    pattern-either:
      - patterns:
          - pattern: password = "..."
          - pattern-inside: |
              resource "aws_db_instance" "..." {
                ...
              }
      - patterns:
          - pattern: master_password = "..."
          - pattern-inside: |
              resource "aws_rds_cluster" "..." {
                ...
              }
    languages:
      - hcl
    severity: WARNING
    message: >-
      RDS instance or cluster with hardcoded credentials in source code. It is
      recommended to pass the credentials at runtime, or generate random
      credentials using the random_password resource.
    metadata:
      references:
        - >-
          https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/db_instance#master_password
        - >-
          https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/rds_cluster#master_password
        - >-
          https://registry.terraform.io/providers/hashicorp/random/latest/docs/resources/password
      cwe:
        - 'CWE-522: Insufficiently Protected Credentials'
      category: security
      technology:
        - terraform
        - aws
        - secrets
      owasp:
        - A02:2017 - Broken Authentication
        - A04:2021 - Insecure Design
        - A06:2025 - Insecure Design
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/terraform.lang.security.rds-insecure-password-storage-in-source-code.rds-insecure-password-storage-in-source-code
      shortlink: https://sg.run/x4qA
      semgrep.dev:
        rule:
          r_id: 15830
          rv_id: 1263896
          rule_id: OrUl6W
          version_id: gETB77b
          url: >-
            https://semgrep.dev/playground/r/gETB77b/terraform.lang.security.rds-insecure-password-storage-in-source-code.rds-insecure-password-storage-in-source-code
          origin: community
