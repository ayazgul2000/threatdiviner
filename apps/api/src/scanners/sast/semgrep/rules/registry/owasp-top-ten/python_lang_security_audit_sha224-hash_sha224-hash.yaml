rules:
  - id: python.lang.security.audit.sha224-hash.sha224-hash
    message: >-
      This code uses a 224-bit hash function, which is deprecated or disallowed
      in some security policies. Consider updating to a stronger hash function
      such as SHA-384 or higher to ensure compliance and security.
    metadata:
      cwe:
        - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      references:
        - >-
          https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-131Ar3.ipd.pdf
        - >-
          https://www.cyber.gov.au/resources-business-and-government/essential-cyber-security/ism/cyber-security-guidelines/guidelines-cryptography
      category: security
      technology:
        - python
      subcategory:
        - vuln
      likelihood: LOW
      impact: LOW
      confidence: HIGH
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: https://semgrep.dev/r/python.lang.security.audit.sha224-hash.sha224-hash
      shortlink: https://sg.run/Db1Yv
      semgrep.dev:
        rule:
          r_id: 151752
          rv_id: 1263511
          rule_id: BYUX0y9
          version_id: 5PTo1QL
          url: >-
            https://semgrep.dev/playground/r/5PTo1QL/python.lang.security.audit.sha224-hash.sha224-hash
          origin: community
    severity: WARNING
    languages:
      - python
    pattern-either:
      - pattern: hashlib.sha224(...)
      - pattern: hashlib.sha3_224(...)
