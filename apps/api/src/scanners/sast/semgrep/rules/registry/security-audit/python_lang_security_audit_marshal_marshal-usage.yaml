rules:
  - id: python.lang.security.audit.marshal.marshal-usage
    languages:
      - python
    message: >-
      The marshal module is not intended to be secure against erroneous or
      maliciously constructed data. Never unmarshal data received from an
      untrusted or unauthenticated source. See more details:
      https://docs.python.org/3/library/marshal.html?highlight=security
    metadata:
      cwe:
        - 'CWE-502: Deserialization of Untrusted Data'
      owasp:
        - A08:2017 - Insecure Deserialization
        - A08:2021 - Software and Data Integrity Failures
        - A08:2025 - Software or Data Integrity Failures
      references:
        - https://docs.python.org/3/library/marshal.html?highlight=security
      category: security
      technology:
        - python
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - 'Insecure Deserialization '
      source: https://semgrep.dev/r/python.lang.security.audit.marshal.marshal-usage
      shortlink: https://sg.run/3xor
      semgrep.dev:
        rule:
          r_id: 9643
          rv_id: 1263503
          rule_id: ReUg13
          version_id: DkTRbPz
          url: >-
            https://semgrep.dev/playground/r/DkTRbPz/python.lang.security.audit.marshal.marshal-usage
          origin: community
    pattern-either:
      - pattern: marshal.dump(...)
      - pattern: marshal.dumps(...)
      - pattern: marshal.load(...)
      - pattern: marshal.loads(...)
    severity: WARNING
