rules:
  - id: >-
      javascript.puppeteer.security.audit.puppeteer-setcontent-injection.puppeteer-setcontent-injection
    message: >-
      If unverified user data can reach the `setContent` method it can result in
      Server-Side Request Forgery vulnerabilities
    metadata:
      owasp:
        - A10:2021 - Server-Side Request Forgery (SSRF)
        - A01:2025 - Broken Access Control
      cwe:
        - 'CWE-918: Server-Side Request Forgery (SSRF)'
      category: security
      technology:
        - puppeteer
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      references:
        - >-
          https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Server-Side Request Forgery (SSRF)
      source: >-
        https://semgrep.dev/r/javascript.puppeteer.security.audit.puppeteer-setcontent-injection.puppeteer-setcontent-injection
      shortlink: https://sg.run/PJlv
      semgrep.dev:
        rule:
          r_id: 9345
          rv_id: 1263237
          rule_id: 0oU5zg
          version_id: e1TyjEx
          url: >-
            https://semgrep.dev/playground/r/e1TyjEx/javascript.puppeteer.security.audit.puppeteer-setcontent-injection.puppeteer-setcontent-injection
          origin: community
    languages:
      - javascript
      - typescript
    severity: WARNING
    patterns:
      - pattern-inside: |
          require('puppeteer');
          ...
      - pattern-not-inside: |
          require('puppeteer');
          ...
          var $INPUT = "...";
          ...
      - pattern: $PAGE.setContent($INPUT,...)
      - pattern-not: $PAGE.setContent("...",...)
