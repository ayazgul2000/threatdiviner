rules:
  - id: >-
      kotlin.gradle.security.build-gradle-password-hardcoded.build-gradle-password-hardcoded
    message: >-
      A secret is hard-coded in the application. Secrets stored in source code,
      such as credentials, identifiers, and other types of sensitive data, can
      be leaked and used by internal or external malicious actors. It is
      recommended to rotate the secret and retrieve them from a secure secret
      vault or Hardware Security Module (HSM), alternatively environment
      variables can be used if allowed by your company policy.
    severity: WARNING
    metadata:
      likelihood: LOW
      impact: HIGH
      confidence: MEDIUM
      category: security
      subcategory:
        - vuln
      cwe:
        - 'CWE-798: Use of Hard-coded Credentials'
      cwe2020-top25: true
      cwe2021-top25: true
      cwe2022-top25: true
      owasp:
        - A07:2021 - Identification and Authentication Failures
        - A07:2025 - Authentication Failures
      references:
        - >-
          https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures
      technology:
        - secrets
      vulnerability_class:
        - Hard-coded Secrets
      source_rule_url: >-
        https://semgrep.dev/playground/r/d8Ur5BA/achufistov6_personal_org.build-gradle-password-hardcoded
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      source: >-
        https://semgrep.dev/r/kotlin.gradle.security.build-gradle-password-hardcoded.build-gradle-password-hardcoded
      shortlink: https://sg.run/qN29x
      semgrep.dev:
        rule:
          r_id: 137856
          rv_id: 1263257
          rule_id: ReUD6Kg
          version_id: DkTRbLX
          url: >-
            https://semgrep.dev/playground/r/DkTRbLX/kotlin.gradle.security.build-gradle-password-hardcoded.build-gradle-password-hardcoded
          origin: community
    languages:
      - kotlin
    options:
      symbolic_propagation: true
    patterns:
      - pattern-either:
          - pattern: '$PASS = env[...] ?: $VALUE'
      - metavariable-regex:
          metavariable: $PASS
          regex: (password|pass|passwd|loginPassword)
      - metavariable-pattern:
          language: generic
          metavariable: $VALUE
          patterns:
            - pattern-either:
                - pattern-regex: ^[A-Za-z0-9/+=]+$
    paths:
      include:
        - '*build.gradle.kts'
