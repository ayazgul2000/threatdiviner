rules:
  - id: ruby.rails.security.audit.avoid-tainted-ftp-call.avoid-tainted-ftp-call
    metadata:
      owasp:
        - A05:2017 - Broken Access Control
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      cwe:
        - >-
          CWE-22: Improper Limitation of a Pathname to a Restricted Directory
          ('Path Traversal')
      references:
        - >-
          https://github.com/presidentbeef/brakeman/blob/main/docs/warning_types/file_access/index.markdown
      category: security
      technology:
        - rails
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: HIGH
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Path Traversal
      source: >-
        https://semgrep.dev/r/ruby.rails.security.audit.avoid-tainted-ftp-call.avoid-tainted-ftp-call
      shortlink: https://sg.run/Q9gP
      semgrep.dev:
        rule:
          r_id: 13586
          rv_id: 1263623
          rule_id: WAUyzp
          version_id: YDTZeWL
          url: >-
            https://semgrep.dev/playground/r/YDTZeWL/ruby.rails.security.audit.avoid-tainted-ftp-call.avoid-tainted-ftp-call
          origin: community
    message: >-
      Using user input when accessing files is potentially dangerous. A
      malicious actor could use this to modify or access files they have no
      right to.
    languages:
      - ruby
    severity: WARNING
    mode: taint
    pattern-sources:
      - pattern: params
      - pattern: cookies
      - pattern: request.env
    pattern-sinks:
      - pattern-either:
          - pattern: Net::FTP.$X(...)
          - patterns:
              - pattern-inside: |
                  $FTP = Net::FTP.$OPEN(...)
                  ...
                  $FTP.$METHOD(...)
              - pattern: $FTP.$METHOD(...)
