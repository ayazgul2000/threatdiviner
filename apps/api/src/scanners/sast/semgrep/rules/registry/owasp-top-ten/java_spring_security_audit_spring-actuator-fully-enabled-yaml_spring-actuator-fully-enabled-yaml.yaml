rules:
  - id: >-
      java.spring.security.audit.spring-actuator-fully-enabled-yaml.spring-actuator-fully-enabled-yaml
    patterns:
      - pattern-inside: |
          management:
            ...
            endpoints:
              ...
              web:
                ...
                exposure:
                  ...
      - pattern: |
          include: "*"
    message: >-
      Spring Boot Actuator is fully enabled. This exposes sensitive endpoints
      such as /actuator/env, /actuator/logfile, /actuator/heapdump and others.
      Unless you have Spring Security enabled or another means to protect these
      endpoints, this functionality is available without authentication, causing
      a severe security risk.
    severity: WARNING
    languages:
      - yaml
    metadata:
      cwe:
        - 'CWE-200: Exposure of Sensitive Information to an Unauthorized Actor'
      owasp:
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      references:
        - >-
          https://docs.spring.io/spring-boot/docs/current/reference/html/production-ready-features.html#production-ready-endpoints-exposing-endpoints
        - >-
          https://medium.com/walmartglobaltech/perils-of-spring-boot-actuators-misconfiguration-185c43a0f785
        - >-
          https://blog.maass.xyz/spring-actuator-security-part-1-stealing-secrets-using-spring-actuators
      category: security
      technology:
        - spring
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: HIGH
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Mishandled Sensitive Information
      source: >-
        https://semgrep.dev/r/java.spring.security.audit.spring-actuator-fully-enabled-yaml.spring-actuator-fully-enabled-yaml
      shortlink: https://sg.run/1Bzw
      semgrep.dev:
        rule:
          r_id: 29422
          rv_id: 1263076
          rule_id: eqUerQ
          version_id: w8TRo5n
          url: >-
            https://semgrep.dev/playground/r/w8TRo5n/java.spring.security.audit.spring-actuator-fully-enabled-yaml.spring-actuator-fully-enabled-yaml
          origin: community
