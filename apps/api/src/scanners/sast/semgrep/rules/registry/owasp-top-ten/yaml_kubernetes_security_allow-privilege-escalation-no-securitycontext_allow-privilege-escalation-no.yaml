rules:
  - id: >-
      yaml.kubernetes.security.allow-privilege-escalation-no-securitycontext.allow-privilege-escalation-no-securitycontext
    patterns:
      - pattern-inside: |
          containers:
            ...
      - pattern-inside: |
          - $NAME: $CONTAINER
            ...
      - pattern: |
          image: ...
          ...
      - pattern-not: |
          image: ...
          ...
          securityContext:
            ...
      - metavariable-regex:
          metavariable: $NAME
          regex: name
      - focus-metavariable: $NAME
    fix: |
      securityContext:
        allowPrivilegeEscalation: false
      $NAME
    message: >-
      In Kubernetes, each pod runs in its own isolated environment with its own
      set of security policies. However, certain container images may contain
      `setuid` or `setgid` binaries that could allow an attacker to perform
      privilege escalation and gain access to sensitive resources. To mitigate
      this risk, it's recommended to add a `securityContext` to the container in
      the pod, with the parameter `allowPrivilegeEscalation` set to `false`.
      This will prevent the container from running any privileged processes and
      limit the impact of any potential attacks. By adding a `securityContext`
      to your Kubernetes pod, you can help to ensure that your containerized
      applications are more secure and less vulnerable to privilege escalation
      attacks.
    metadata:
      cwe:
        - 'CWE-732: Incorrect Permission Assignment for Critical Resource'
      owasp:
        - A05:2021 - Security Misconfiguration
        - A06:2017 - Security Misconfiguration
        - A02:2025 - Security Misconfiguration
      references:
        - >-
          https://kubernetes.io/docs/concepts/policy/pod-security-policy/#privilege-escalation
        - >-
          https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
        - https://www.kernel.org/doc/Documentation/prctl/no_new_privs.txt
        - >-
          https://cheatsheetseries.owasp.org/cheatsheets/Docker_Security_Cheat_Sheet.html#rule-4-add-no-new-privileges-flag
      category: security
      technology:
        - kubernetes
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authorization
      source: >-
        https://semgrep.dev/r/yaml.kubernetes.security.allow-privilege-escalation-no-securitycontext.allow-privilege-escalation-no-securitycontext
      shortlink: https://sg.run/eleR
      semgrep.dev:
        rule:
          r_id: 47276
          rv_id: 1263931
          rule_id: WAU5J6
          version_id: 2KTv2j8
          url: >-
            https://semgrep.dev/playground/r/2KTv2j8/yaml.kubernetes.security.allow-privilege-escalation-no-securitycontext.allow-privilege-escalation-no-securitycontext
          origin: community
    languages:
      - yaml
    severity: WARNING
