rules:
  - id: >-
      csharp.lang.security.insecure-deserialization.javascript-serializer.insecure-javascriptserializer-deserialization
    severity: ERROR
    languages:
      - C#
    metadata:
      cwe:
        - 'CWE-502: Deserialization of Untrusted Data'
      owasp:
        - A08:2017 - Insecure Deserialization
        - A08:2021 - Software and Data Integrity Failures
        - A08:2025 - Software or Data Integrity Failures
      references:
        - >-
          https://docs.microsoft.com/en-us/dotnet/api/system.web.script.serialization.simpletyperesolver?view=netframework-4.8#remarks
      category: security
      technology:
        - .net
      confidence: LOW
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - 'Insecure Deserialization '
      source: >-
        https://semgrep.dev/r/csharp.lang.security.insecure-deserialization.javascript-serializer.insecure-javascriptserializer-deserialization
      shortlink: https://sg.run/0nJq
      semgrep.dev:
        rule:
          r_id: 11198
          rv_id: 1262640
          rule_id: PeUkrK
          version_id: gETB7Jr
          url: >-
            https://semgrep.dev/playground/r/gETB7Jr/csharp.lang.security.insecure-deserialization.javascript-serializer.insecure-javascriptserializer-deserialization
          origin: community
    message: >-
      The SimpleTypeResolver class is insecure and should not be used. Using
      SimpleTypeResolver to deserialize JSON could allow the remote client to
      execute malicious code within the app and take control of the web server.
    patterns:
      - pattern-inside: |
          using System.Web.Script.Serialization;
          ...
      - pattern: |
          new JavaScriptSerializer((SimpleTypeResolver $RESOLVER))
