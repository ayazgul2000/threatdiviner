rules:
  - id: >-
      python.pyramid.security.direct-use-of-response.pyramid-direct-use-of-response
    message: >-
      Detected data rendered directly to the end user via 'Response'. This
      bypasses Pyramid's built-in cross-site scripting (XSS) defenses and could
      result in an XSS vulnerability. Use Pyramid's template engines to safely
      render HTML.
    metadata:
      cwe:
        - >-
          CWE-79: Improper Neutralization of Input During Web Page Generation
          ('Cross-site Scripting')
      owasp:
        - A07:2017 - Cross-Site Scripting (XSS)
        - A03:2021 - Injection
        - A05:2025 - Injection
      category: security
      technology:
        - pyramid
      references:
        - https://owasp.org/Top10/A03_2021-Injection
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: LOW
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cross-Site-Scripting (XSS)
      source: >-
        https://semgrep.dev/r/python.pyramid.security.direct-use-of-response.pyramid-direct-use-of-response
      shortlink: https://sg.run/DX8G
      semgrep.dev:
        rule:
          r_id: 21452
          rv_id: 1263572
          rule_id: gxUeA8
          version_id: X0TzyEe
          url: >-
            https://semgrep.dev/playground/r/X0TzyEe/python.pyramid.security.direct-use-of-response.pyramid-direct-use-of-response
          origin: community
    languages:
      - python
    severity: ERROR
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: |
              @pyramid.view.view_config( ... )
              def $VIEW($REQ):
                ...
          - pattern: $REQ.$ANYTHING
          - pattern-not: $REQ.dbsession
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: |
                  pyramid.request.Response.text($SINK)
              - pattern: |
                  pyramid.request.Response($SINK)
              - pattern: |
                  $REQ.response.body = $SINK
              - pattern: |
                  $REQ.response.text = $SINK
              - pattern: |
                  $REQ.response.ubody = $SINK
              - pattern: |
                  $REQ.response.unicode_body = $SINK
          - pattern: $SINK
