rules:
  - id: php.symfony.security.audit.symfony-permissive-cors.symfony-permissive-cors
    patterns:
      - pattern-inside: |
          use Symfony\Component\HttpFoundation\Response;
          ...
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: >
                      new Symfony\Component\HttpFoundation\Response($X, $Y,
                      $HEADERS, ...)
                  - pattern: new Response($X, $Y, $HEADERS, ...)
              - pattern-either:
                  - pattern: new $R($X, $Y, [$KEY => $VALUE], ...)
                  - pattern-inside: |
                      $HEADERS = [$KEY => $VALUE];
                      ...
          - patterns:
              - pattern: $RES->headers->set($KEY, $VALUE)
      - metavariable-regex:
          metavariable: $KEY
          regex: >-
            (\'|\")\s*(Access-Control-Allow-Origin|access-control-allow-origin)\s*(\'|\")
      - metavariable-regex:
          metavariable: $VALUE
          regex: (\'|\")\s*(\*)\s*(\'|\")
    message: >-
      Access-Control-Allow-Origin response header is set to "*". This will
      disable CORS Same Origin Policy restrictions.
    metadata:
      references:
        - >-
          https://developer.mozilla.org/ru/docs/Web/HTTP/Headers/Access-Control-Allow-Origin
      owasp:
        - A07:2021 - Identification and Authentication Failures
        - A07:2025 - Authentication Failures
      cwe:
        - 'CWE-346: Origin Validation Error'
      category: security
      technology:
        - symfony
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authentication
      source: >-
        https://semgrep.dev/r/php.symfony.security.audit.symfony-permissive-cors.symfony-permissive-cors
      shortlink: https://sg.run/kr92
      semgrep.dev:
        rule:
          r_id: 13972
          rv_id: 1263317
          rule_id: ZqUOlR
          version_id: K3TKkAW
          url: >-
            https://semgrep.dev/playground/r/K3TKkAW/php.symfony.security.audit.symfony-permissive-cors.symfony-permissive-cors
          origin: community
    languages:
      - php
    severity: WARNING
