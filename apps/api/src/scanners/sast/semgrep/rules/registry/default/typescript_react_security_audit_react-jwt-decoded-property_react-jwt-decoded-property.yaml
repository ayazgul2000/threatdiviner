rules:
  - id: >-
      typescript.react.security.audit.react-jwt-decoded-property.react-jwt-decoded-property
    message: >-
      Property decoded from JWT token without verifying and cannot be
      trustworthy.
    metadata:
      cwe:
        - 'CWE-922: Insecure Storage of Sensitive Information'
      references:
        - >-
          https://pragmaticwebsecurity.com/articles/oauthoidc/localstorage-xss.html
      category: security
      owasp:
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      technology:
        - react
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Mishandled Sensitive Information
      source: >-
        https://semgrep.dev/r/typescript.react.security.audit.react-jwt-decoded-property.react-jwt-decoded-property
      shortlink: https://sg.run/wx8x
      semgrep.dev:
        rule:
          r_id: 9773
          rv_id: 1263914
          rule_id: d8Uzqz
          version_id: JdTzxjz
          url: >-
            https://semgrep.dev/playground/r/JdTzxjz/typescript.react.security.audit.react-jwt-decoded-property.react-jwt-decoded-property
          origin: community
    languages:
      - typescript
      - javascript
    severity: INFO
    patterns:
      - pattern-inside: |
          import jwt_decode from "jwt-decode";
          ...
      - pattern-inside: |
          $DECODED = jwt_decode($TOKEN,...);
          ...
      - pattern: $DECODED.$PROPERTY
