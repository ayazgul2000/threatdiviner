rules:
  - id: >-
      javascript.lang.security.detect-no-csrf-before-method-override.detect-no-csrf-before-method-override
    message: >-
      Detected use of express.csrf() middleware before express.methodOverride().
      This can allow GET requests (which are not checked by csrf) to turn into
      POST requests later.
    metadata:
      cwe:
        - 'CWE-352: Cross-Site Request Forgery (CSRF)'
      source-rule-url: >-
        https://github.com/nodesecurity/eslint-plugin-security/blob/master/rules/detect-no-csrf-before-method-override.js
      references:
        - >-
          https://github.com/nodesecurity/eslint-plugin-security/blob/master/docs/bypass-connect-csrf-protection-by-abusing.md
      category: security
      technology:
        - javascript
      owasp:
        - A01:2021 - Broken Access Control
        - A05:2017 - Broken Access Control
        - A01:2025 - Broken Access Control
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cross-Site Request Forgery (CSRF)
      source: >-
        https://semgrep.dev/r/javascript.lang.security.detect-no-csrf-before-method-override.detect-no-csrf-before-method-override
      shortlink: https://sg.run/oxoX
      semgrep.dev:
        rule:
          r_id: 9316
          rv_id: 1263216
          rule_id: r6UrvQ
          version_id: K3TKkPO
          url: >-
            https://semgrep.dev/playground/r/K3TKkPO/javascript.lang.security.detect-no-csrf-before-method-override.detect-no-csrf-before-method-override
          origin: community
    languages:
      - javascript
      - typescript
    severity: WARNING
    pattern: |
      express.csrf();
      ...
      express.methodOverride();
