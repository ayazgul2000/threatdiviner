rules:
  - id: python.lang.security.unverified-ssl-context.unverified-ssl-context
    patterns:
      - pattern-either:
          - pattern: ssl._create_unverified_context(...)
          - pattern: ssl._create_default_https_context = ssl._create_unverified_context
    fix-regex:
      regex: _create_unverified_context
      replacement: create_default_context
    message: >-
      Unverified SSL context detected. This will permit insecure connections
      without verifying SSL certificates. Use 'ssl.create_default_context'
      instead.
    metadata:
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A07:2021 - Identification and Authentication Failures
        - A07:2025 - Authentication Failures
      cwe:
        - 'CWE-295: Improper Certificate Validation'
      references:
        - https://docs.python.org/3/library/ssl.html#ssl-security
        - >-
          https://docs.python.org/3/library/http.client.html#http.client.HTTPSConnection
      category: security
      technology:
        - python
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authentication
      source: >-
        https://semgrep.dev/r/python.lang.security.unverified-ssl-context.unverified-ssl-context
      shortlink: https://sg.run/N4lp
      semgrep.dev:
        rule:
          r_id: 9627
          rv_id: 1263540
          rule_id: v8UnkQ
          version_id: e1Tyjlj
          url: >-
            https://semgrep.dev/playground/r/e1Tyjlj/python.lang.security.unverified-ssl-context.unverified-ssl-context
          origin: community
    severity: ERROR
    languages:
      - python
