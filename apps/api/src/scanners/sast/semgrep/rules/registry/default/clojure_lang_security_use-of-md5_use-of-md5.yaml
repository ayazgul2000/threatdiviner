rules:
  - id: clojure.lang.security.use-of-md5.use-of-md5
    languages:
      - clojure
    severity: WARNING
    message: >-
      MD5 hash algorithm detected. This is not collision resistant and leads to
      easily-cracked password hashes. Replace with current recommended hashing
      algorithms.
    metadata:
      references:
        - >-
          https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html
        - >-
          https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
      technology:
        - clojure
      source-rule-url: >-
        https://github.com/clj-holmes/clj-holmes-rules/blob/main/security/weak-hash-function-md5.yml
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      cwe:
        - 'CWE-328: Use of Weak Hash'
      author: Gabriel Marquet <gab.marquet@gmail.com>
      category: security
      subcategory:
        - vuln
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Insecure Hashing Algorithm
      source: https://semgrep.dev/r/clojure.lang.security.use-of-md5.use-of-md5
      shortlink: https://sg.run/BgPx
      semgrep.dev:
        rule:
          r_id: 52195
          rv_id: 1262609
          rule_id: nJU1ep
          version_id: 0bTKz2B
          url: >-
            https://semgrep.dev/playground/r/0bTKz2B/clojure.lang.security.use-of-md5.use-of-md5
          origin: community
    pattern-either:
      - pattern: (MessageDigest/getInstance "MD5")
      - pattern: (MessageDigest/getInstance MessageDigestAlgorithms/MD5)
      - pattern: >-
          (MessageDigest/getInstance
          org.apache.commons.codec.digest.MessageDigestAlgorithms/MD5)
      - pattern: (java.security.MessageDigest/getInstance "MD5")
      - pattern: (java.security.MessageDigest/getInstance MessageDigestAlgorithms/MD5)
      - pattern: >-
          (java.security.MessageDigest/getInstance
          org.apache.commons.codec.digest.MessageDigestAlgorithms/MD5)
