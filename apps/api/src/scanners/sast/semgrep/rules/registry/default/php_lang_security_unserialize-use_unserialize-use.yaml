rules:
  - id: php.lang.security.unserialize-use.unserialize-use
    patterns:
      - pattern: unserialize(...)
      - pattern-not: unserialize("...",...)
    message: >-
      Calling `unserialize()` with user input in the pattern can lead to
      arbitrary code execution. Consider using JSON or structured data
      approaches (e.g. Google Protocol Buffers).
    metadata:
      references:
        - https://www.php.net/manual/en/function.unserialize.php
        - >-
          https://owasp.org/www-project-top-ten/2017/A8_2017-Insecure_Deserialization.html
      category: security
      technology:
        - php
      owasp:
        - A08:2017 - Insecure Deserialization
        - A08:2021 - Software and Data Integrity Failures
        - A08:2025 - Software or Data Integrity Failures
      cwe:
        - 'CWE-502: Deserialization of Untrusted Data'
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - 'Insecure Deserialization '
      source: https://semgrep.dev/r/php.lang.security.unserialize-use.unserialize-use
      shortlink: https://sg.run/b24E
      semgrep.dev:
        rule:
          r_id: 13970
          rv_id: 1263302
          rule_id: v8U9OJ
          version_id: WrTqKeJ
          url: >-
            https://semgrep.dev/playground/r/WrTqKeJ/php.lang.security.unserialize-use.unserialize-use
          origin: community
    languages:
      - php
    severity: WARNING
