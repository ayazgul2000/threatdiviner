rules:
  - id: python.sqlalchemy.performance.performance-improvements.len-all-count
    pattern: len($X.all())
    message: >-
      Using QUERY.count() instead of len(QUERY.all()) sends less data to the
      client since the SQLAlchemy method is performed server-side.
    languages:
      - python
    severity: WARNING
    metadata:
      category: performance
      technology:
        - sqlalchemy
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      source: >-
        https://semgrep.dev/r/python.sqlalchemy.performance.performance-improvements.len-all-count
      shortlink: https://sg.run/4y8g
