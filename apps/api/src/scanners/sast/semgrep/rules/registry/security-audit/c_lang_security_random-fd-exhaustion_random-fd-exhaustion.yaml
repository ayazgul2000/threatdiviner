rules:
  - id: c.lang.security.random-fd-exhaustion.random-fd-exhaustion
    pattern-either:
      - patterns:
          - pattern: |
              $FD = open("/dev/urandom", ...);
              ...
              read($FD, ...);
          - pattern-not: |
              $FD = open("/dev/urandom", ...);
              ...
              $BYTES_READ = read($FD, ...);
      - patterns:
          - pattern: |
              $FD = open("/dev/random", ...);
              ...
              read($FD, ...);
          - pattern-not: |
              $FD = open("/dev/random", ...);
              ...
              $BYTES_READ = read($FD, ...);
    message: >-
      Call to 'read()' without error checking is susceptible to file descriptor
      exhaustion. Consider using the 'getrandom()' function.
    metadata:
      cwe:
        - >-
          CWE-774: Allocation of File Descriptors or Handles Without Limits or
          Throttling
      references:
        - https://lwn.net/Articles/606141/
      category: security
      technology:
        - c
      confidence: MEDIUM
      subcategory:
        - audit
      likelihood: LOW
      impact: HIGH
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Denial-of-Service (DoS)
      source: >-
        https://semgrep.dev/r/c.lang.security.random-fd-exhaustion.random-fd-exhaustion
      shortlink: https://sg.run/8yNj
