rules:
  - id: javascript.phantom.security.audit.phantom-injection.phantom-injection
    message: >-
      If unverified user data can reach the `phantom` page methods it can result
      in Server-Side Request Forgery vulnerabilities
    metadata:
      owasp:
        - A10:2021 - Server-Side Request Forgery (SSRF)
        - A01:2025 - Broken Access Control
      cwe:
        - 'CWE-918: Server-Side Request Forgery (SSRF)'
      category: security
      technology:
        - phantom
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      references:
        - >-
          https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Server-Side Request Forgery (SSRF)
      source: >-
        https://semgrep.dev/r/javascript.phantom.security.audit.phantom-injection.phantom-injection
      shortlink: https://sg.run/dKv0
      semgrep.dev:
        rule:
          r_id: 9334
          rv_id: 1263226
          rule_id: 3qUPXE
          version_id: jQTn5Ld
          url: >-
            https://semgrep.dev/playground/r/jQTn5Ld/javascript.phantom.security.audit.phantom-injection.phantom-injection
          origin: community
    languages:
      - javascript
      - typescript
    severity: WARNING
    patterns:
      - pattern-inside: |
          $PHANTOM = require('phantom');
          ...
      - pattern-either:
          - pattern: $PAGE.open($INPUT,...)
          - pattern: $PAGE.property("content",$INPUT,...)
          - pattern: $PAGE.setContent($INPUT,...)
          - pattern: $PAGE.openUrl($INPUT,...)
          - pattern: $PAGE.evaluateJavaScript($INPUT,...)
      - pattern-not: $PAGE.open("...",...)
      - pattern-not: $PAGE.property("content","...",...)
      - pattern-not: $PAGE.setContent("...",...)
      - pattern-not: $PAGE.openUrl("...",...)
      - pattern-not: $PAGE.evaluateJavaScript("...",...)
