rules:
  - id: ruby.rails.security.audit.xss.avoid-content-tag.avoid-content-tag
    metadata:
      source-rule-url: >-
        https://github.com/presidentbeef/brakeman/blob/main/lib/brakeman/checks/check_content_tag.rb
      owasp:
        - A07:2017 - Cross-Site Scripting (XSS)
        - A03:2021 - Injection
        - A05:2025 - Injection
      cwe:
        - >-
          CWE-79: Improper Neutralization of Input During Web Page Generation
          ('Cross-site Scripting')
      references:
        - >-
          https://github.com/presidentbeef/brakeman/blob/main/docs/warning_types/template_injection/index.markdown
        - >-
          https://www.netsparker.com/blog/web-security/preventing-xss-ruby-on-rails-web-applications/
      category: security
      technology:
        - rails
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cross-Site-Scripting (XSS)
      source: >-
        https://semgrep.dev/r/ruby.rails.security.audit.xss.avoid-content-tag.avoid-content-tag
      shortlink: https://sg.run/dg8P
      semgrep.dev:
        rule:
          r_id: 9734
          rv_id: 1263629
          rule_id: L1U4qz
          version_id: X0TzyDq
          url: >-
            https://semgrep.dev/playground/r/X0TzyDq/ruby.rails.security.audit.xss.avoid-content-tag.avoid-content-tag
          origin: community
    message: >-
      'content_tag()' bypasses HTML escaping for some portion of the content. If
      external data can reach here, this exposes your application to cross-site
      scripting (XSS) attacks. Ensure no external data reaches here. If you must
      do this, create your HTML manually and use 'html_safe'. Ensure no external
      data enters the HTML-safe string!
    languages:
      - ruby
    severity: WARNING
    pattern: content_tag(...)
