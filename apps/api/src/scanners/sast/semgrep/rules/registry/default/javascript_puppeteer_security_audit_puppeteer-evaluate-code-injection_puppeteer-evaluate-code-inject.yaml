rules:
  - id: >-
      javascript.puppeteer.security.audit.puppeteer-evaluate-code-injection.puppeteer-evaluate-code-injection
    message: >-
      If unverified user data can reach the `evaluate` method it can result in
      Server-Side Request Forgery vulnerabilities
    metadata:
      owasp:
        - A10:2021 - Server-Side Request Forgery (SSRF)
        - A01:2025 - Broken Access Control
      cwe:
        - 'CWE-918: Server-Side Request Forgery (SSRF)'
      category: security
      technology:
        - puppeteer
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      references:
        - >-
          https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Server-Side Request Forgery (SSRF)
      source: >-
        https://semgrep.dev/r/javascript.puppeteer.security.audit.puppeteer-evaluate-code-injection.puppeteer-evaluate-code-injection
      shortlink: https://sg.run/Q5Yq
      semgrep.dev:
        rule:
          r_id: 9342
          rv_id: 1263234
          rule_id: BYUNZk
          version_id: w8TRo4w
          url: >-
            https://semgrep.dev/playground/r/w8TRo4w/javascript.puppeteer.security.audit.puppeteer-evaluate-code-injection.puppeteer-evaluate-code-injection
          origin: community
    languages:
      - javascript
      - typescript
    severity: WARNING
    patterns:
      - pattern-inside: |
          require('puppeteer');
          ...
      - pattern-not-inside: |
          var $INPUT = function $FNAME(...){...};
          ...
      - pattern-either:
          - pattern: $PAGE.evaluate($INPUT,...)
          - pattern: $PAGE.evaluateHandle($INPUT,...)
          - pattern: $PAGE.evaluateOnNewDocument($INPUT,...)
      - pattern-not: $PAGE.evaluate("...",...)
      - pattern-not: $PAGE.evaluate(function(...){...},...)
      - pattern-not: $PAGE.evaluateHandle("...",...)
      - pattern-not: $PAGE.evaluateHandle(function(...){...},...)
      - pattern-not: $PAGE.evaluateOnNewDocument("...",...)
      - pattern-not: $PAGE.evaluateOnNewDocument(function(...){...},...)
