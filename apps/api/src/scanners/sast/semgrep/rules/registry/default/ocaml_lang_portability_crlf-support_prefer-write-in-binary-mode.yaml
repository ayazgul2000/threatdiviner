rules:
  - id: ocaml.lang.portability.crlf-support.prefer-write-in-binary-mode
    pattern: open_out
    fix: open_out_bin
    message: >-
      'open_out' behaves differently on Windows and on Unix-like systems with
      respect to line endings. To get the same behavior everywhere, use
      'open_out_bin' or 'open_out_gen [Open_binary]'. If you really want
      LF-to-CRLF translations to take place when running on Windows, use
      'open_out_gen [Open_text]'.
    languages:
      - ocaml
    severity: WARNING
    metadata:
      category: portability
      technology:
        - ocaml
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      source: >-
        https://semgrep.dev/r/ocaml.lang.portability.crlf-support.prefer-write-in-binary-mode
      shortlink: https://sg.run/ZkGw
      semgrep.dev:
        rule:
          r_id: 12779
          rv_id: 945973
          rule_id: 0oUJY9
