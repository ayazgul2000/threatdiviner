rules:
  - id: >-
      solidity.security.erc721-arbitrary-transferfrom.erc721-arbitrary-transferfrom
    message: Custom ERC721 implementation lacks access control checks in _transfer()
    metadata:
      category: security
      technology:
        - solidity
      cwe: 'CWE-284: Improper Access Control'
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://twitter.com/BlockSecAlert/status/1516289618605654024
        - >-
          https://etherscan.io/address/0xf3821adaceb6500c0a202971aecf840a033f236b
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authorization
      source: >-
        https://semgrep.dev/r/solidity.security.erc721-arbitrary-transferfrom.erc721-arbitrary-transferfrom
      shortlink: https://sg.run/D17G
      semgrep.dev:
        rule:
          r_id: 67652
          rv_id: 946614
          rule_id: 8GUkbo
          version_id: 44TZko3
          url: >-
            https://semgrep.dev/playground/r/44TZko3/solidity.security.erc721-arbitrary-transferfrom.erc721-arbitrary-transferfrom
          origin: community
    patterns:
      - pattern-inside: |
          function _transfer(...) {
          ...
          }
      - pattern-inside: |
          require(prevOwnership.addr == $FROM, ...);
          ...
      - pattern-not-inside: |
          (<... _msgSender() == $FROM ...>);
          ...
      - pattern-not-inside: |
          (<... _msgSender() == $PREV.$ADDR ...>);
          ...
      - pattern-not-inside: |
          (<... msg.sender == $FROM ...>);
          ...
      - pattern-not-inside: |
          require(_isApprovedOrOwner(...), ...);
          ...
      - pattern: _approve(...);
    languages:
      - solidity
    severity: WARNING
