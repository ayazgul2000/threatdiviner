rules:
  - id: >-
      solidity.security.balancer-readonly-reentrancy-getpooltokens.balancer-readonly-reentrancy-getpooltokens
    message: >-
      $VAULT.getPoolTokens() call on a Balancer pool is not protected from the
      read-only reentrancy.
    metadata:
      category: security
      technology:
        - solidity
      cwe: 'CWE-841: Improper Enforcement of Behavioral Workflow'
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      subcategory:
        - vuln
      references:
        - >-
          https://quillaudits.medium.com/decoding-sentiment-protocols-1-million-exploit-quillaudits-f36bee77d376
        - https://hackmd.io/@sentimentxyz/SJCySo1z2
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Other
      source: >-
        https://semgrep.dev/r/solidity.security.balancer-readonly-reentrancy-getpooltokens.balancer-readonly-reentrancy-getpooltokens
      shortlink: https://sg.run/803Q
      semgrep.dev:
        rule:
          r_id: 67640
          rv_id: 946602
          rule_id: kxUl7x
          version_id: e1T98xQ
          url: >-
            https://semgrep.dev/playground/r/e1T98xQ/solidity.security.balancer-readonly-reentrancy-getpooltokens.balancer-readonly-reentrancy-getpooltokens
          origin: community
    patterns:
      - pattern-either:
          - pattern: |
              function $F(...) {
                ...
                $RETURN = $VAULT.getPoolTokens(...);
                ...
              }
      - metavariable-pattern:
          metavariable: $RETURN
          pattern-regex: .*uint256\[].*
      - pattern-not-inside: |
          contract $C {
            ...
            function $CHECKFUNC(...) {
              ...
              VaultReentrancyLib.ensureNotInVaultContext(...);
              ...
            }
            ...
            function $F(...) {
              ...
              $CHECKFUNC(...);
              ...
              $RETURN = $VAULT.getPoolTokens(...);
              ...
            }
            ...
          }
      - pattern-not-inside: |
          contract $C {
            ...
            function $CHECKFUNC(...) {
              ...
              VaultReentrancyLib.ensureNotInVaultContext(...);
              ...
            }
            ...
            function $F(...) {
              ...
              $RETURN = $VAULT.getPoolTokens(...);
              ...
              $CHECKFUNC(...);
              ...
            }
            ...
          }
      - pattern-not-inside: |
          contract $C {
            ...
            function $CHECKFUNC(...) {
              ...
              $VAULT.manageUserBalance(...);
              ...
            }
            ...
            function $F(...) {
              ...
              $RETURN = $VAULT.getPoolTokens(...);
              ...
              $CHECKFUNC(...);
              ...
            }
            ...
          }
      - pattern-not-inside: |
          contract $C {
            ...
            function $CHECKFUNC(...) {
              ...
              $VAULT.manageUserBalance(...);
              ...
            }
            ...
            function $F(...) {
              ...
              $CHECKFUNC(...);
              ...
              $RETURN = $VAULT.getPoolTokens(...);
              ...
            }
            ...
          }
      - pattern-not: |
          function $F(...) {
            ...
            VaultReentrancyLib.ensureNotInVaultContext(...);
            ...
          }
      - pattern-not: |
          function $F(...) {
            ...
            $VAULT.manageUserBalance(...);
            ...
          }
      - pattern-not-inside: |
          contract LinearPool {
            ...
          }
      - pattern-not-inside: |
          contract ComposableStablePool {
            ...
          }
      - pattern-not-inside: |
          contract BalancerQueries {
            ...
          } 
      - pattern-not-inside: |
          contract ManagedPool {
            ...
          }
      - pattern-not-inside: |
          contract BaseWeightedPool {
            ...
          } 
      - pattern-not-inside: |
          contract ComposableStablePoolStorage {
            ...
          }
      - pattern-not-inside: |
          contract RecoveryModeHelper {
            ...
          }
      - focus-metavariable:
          - $VAULT
    languages:
      - solidity
    severity: ERROR
