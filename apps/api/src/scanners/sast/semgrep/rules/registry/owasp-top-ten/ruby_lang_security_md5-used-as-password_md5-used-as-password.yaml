rules:
  - id: ruby.lang.security.md5-used-as-password.md5-used-as-password
    languages:
      - ruby
    severity: WARNING
    message: >-
      It looks like MD5 is used as a password hash. MD5 is not considered a
      secure password hash because it can be cracked by an attacker in a short
      amount of time. Instead, use a suitable password hashing function such as
      bcrypt. You can use the `bcrypt` gem.
    metadata:
      category: security
      technology:
        - md5
      references:
        - >-
          https://tools.ietf.org/id/draft-lvelvindron-tls-md5-sha1-deprecate-01.html
        - >-
          https://security.stackexchange.com/questions/211/how-to-securely-hash-passwords
        - https://github.com/returntocorp/semgrep-rules/issues/1609
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      cwe:
        - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
      subcategory:
        - vuln
      likelihood: HIGH
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/ruby.lang.security.md5-used-as-password.md5-used-as-password
      shortlink: https://sg.run/GOZy
      semgrep.dev:
        rule:
          r_id: 14704
          rv_id: 1263611
          rule_id: oqU4p2
          version_id: JdTzx0e
          url: >-
            https://semgrep.dev/playground/r/JdTzx0e/ruby.lang.security.md5-used-as-password.md5-used-as-password
          origin: community
    mode: taint
    pattern-sources:
      - pattern: Digest::MD5
    pattern-sinks:
      - patterns:
          - pattern: $FUNCTION(...);
          - metavariable-regex:
              metavariable: $FUNCTION
              regex: (?i)(.*password.*)
