rules:
  - id: php.lang.security.eval-use.eval-use
    patterns:
      - pattern: eval(...);
      - pattern-not: eval('...');
    message: Evaluating non-constant commands. This can lead to command injection.
    metadata:
      cwe:
        - >-
          CWE-78: Improper Neutralization of Special Elements used in an OS
          Command ('OS Command Injection')
      references:
        - https://www.php.net/manual/en/function.eval
        - >-
          https://github.com/FloeDesignTechnologies/phpcs-security-audit/blob/master/Security/Sniffs/BadFunctions/NoEvalsSniff.php
      category: security
      technology:
        - php
      owasp:
        - A01:2017 - Injection
        - A03:2021 - Injection
        - A05:2025 - Injection
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: HIGH
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Command Injection
      source: https://semgrep.dev/r/php.lang.security.eval-use.eval-use
      shortlink: https://sg.run/J9AP
      semgrep.dev:
        rule:
          r_id: 9390
          rv_id: 1263279
          rule_id: KxUbX3
          version_id: xyTjz1X
          url: >-
            https://semgrep.dev/playground/r/xyTjz1X/php.lang.security.eval-use.eval-use
          origin: community
    languages:
      - php
    severity: ERROR
