rules:
  - id: python.lang.security.audit.conn_recv.multiprocessing-recv
    languages:
      - python
    message: >-
      The Connection.recv() method automatically unpickles the data it receives,
      which can be a security risk unless you can trust the process which sent
      the message. Therefore, unless the connection object was produced using
      Pipe() you should only use the recv() and send() methods after performing
      some sort of authentication. See more dettails:
      https://docs.python.org/3/library/multiprocessing.html?highlight=security#multiprocessing.connection.Connection
    metadata:
      cwe:
        - 'CWE-502: Deserialization of Untrusted Data'
      owasp:
        - A08:2017 - Insecure Deserialization
        - A08:2021 - Software and Data Integrity Failures
        - A08:2025 - Software or Data Integrity Failures
      references:
        - >-
          https://docs.python.org/3/library/multiprocessing.html?highlight=security#multiprocessing.connection.Connection
      category: security
      technology:
        - python
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - 'Insecure Deserialization '
      source: >-
        https://semgrep.dev/r/python.lang.security.audit.conn_recv.multiprocessing-recv
      shortlink: https://sg.run/x1lz
      semgrep.dev:
        rule:
          r_id: 9630
          rv_id: 1263455
          rule_id: nJUzeK
          version_id: GxTkeKQ
          url: >-
            https://semgrep.dev/playground/r/GxTkeKQ/python.lang.security.audit.conn_recv.multiprocessing-recv
          origin: community
    pattern-either:
      - pattern: multiprocessing.connection.Connection.recv(...)
      - pattern: multiprocessing.connection.Client.recv(...)
      - pattern: |
          $C = multiprocessing.connection.Client(...)
          ...
          $C.recv(...)
    severity: WARNING
