rules:
  - id: python.lang.compatibility.python37.python37-compatibility-importlib2
    pattern: import importlib.resources
    message: >-
      Found 'importlib.resources', which is a module only available on Python
      3.7+. This does not work in lower versions, and therefore is not backwards
      compatible. Use importlib_resources instead for older Python versions.
    languages:
      - python
    severity: ERROR
    metadata:
      category: compatibility
      technology:
