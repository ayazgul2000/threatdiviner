rules:
  - id: python.flask.security.hashids-with-flask-secret.hashids-with-flask-secret
    languages:
      - python
    message: >-
      The Flask secret key is used as salt in HashIDs. The HashID mechanism is
      not secure. By observing sufficient HashIDs, the salt used to construct
      them can be recovered. This means the Flask secret key can be obtained by
      attackers, through the HashIDs.
    metadata:
      category: security
      subcategory:
        - vuln
      cwe:
        - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
      owasp:
        - A02:2021 - Cryptographic Failures
      references:
        - https://flask.palletsprojects.com/en/2.2.x/config/#SECRET_KEY
        - http://carnage.github.io/2015/08/cryptanalysis-of-hashids
      technology:
        - flask
      likelihood: LOW
      impact: HIGH
      confidence: HIGH
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/python.flask.security.hashids-with-flask-secret.hashids-with-flask-secret
      shortlink: https://sg.run/N0Rx
      semgrep.dev:
        rule:
          r_id: 72427
          rv_id: 946220
          rule_id: KxUX3z
          version_id: 0bT15Px
          url: >-
            https://semgrep.dev/playground/r/0bT15Px/python.flask.security.hashids-with-flask-secret.hashids-with-flask-secret
          origin: community
    pattern-either:
      - pattern: hashids.Hashids(..., salt=flask.current_app.config['SECRET_KEY'], ...)
      - pattern: hashids.Hashids(flask.current_app.config['SECRET_KEY'], ...)
      - patterns:
          - pattern-inside: |
              $APP = flask.Flask(...)
              ...
          - pattern-either:
              - pattern: hashids.Hashids(..., salt=$APP.config['SECRET_KEY'], ...)
              - pattern: hashids.Hashids($APP.config['SECRET_KEY'], ...)
    severity: ERROR
