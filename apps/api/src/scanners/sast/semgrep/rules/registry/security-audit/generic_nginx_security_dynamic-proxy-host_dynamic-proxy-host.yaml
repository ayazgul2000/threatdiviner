rules:
  - id: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
    paths:
      include:
        - '*.conf'
        - '*.vhost'
        - '**/sites-available/*'
        - '**/sites-enabled/*'
    languages:
      - generic
    severity: WARNING
    message: >-
      The host for this proxy URL is dynamically determined. This can be
      dangerous if the host can be injected by an attacker because it may
      forcibly alter destination of the proxy. Consider hardcoding acceptable
      destinations and retrieving them with 'map' or something similar.
    metadata:
      source-rule-url: https://github.com/yandex/gixy/blob/master/docs/en/plugins/ssrf.md
      references:
        - https://nginx.org/en/docs/http/ngx_http_map_module.html
      category: security
      technology:
        - nginx
      confidence: MEDIUM
      cwe:
        - 'CWE-441: Unintended Proxy or Intermediary (''Confused Deputy'')'
      owasp:
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Server-Side Request Forgery (SSRF)
      source: >-
        https://semgrep.dev/r/generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
      shortlink: https://sg.run/ndpb
      semgrep.dev:
        rule:
          r_id: 9036
          rv_id: 1262671
          rule_id: GdU7yl
          version_id: kbTzG2j
          url: >-
            https://semgrep.dev/playground/r/kbTzG2j/generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
          origin: community
    pattern-either:
      - pattern: proxy_pass $SCHEME://$$HOST ...;
      - pattern: proxy_pass $$SCHEME://$$HOST ...;
