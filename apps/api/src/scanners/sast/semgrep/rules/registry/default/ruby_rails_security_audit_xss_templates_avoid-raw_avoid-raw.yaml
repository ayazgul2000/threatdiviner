rules:
  - id: ruby.rails.security.audit.xss.templates.avoid-raw.avoid-raw
    message: >-
      'raw' renders raw HTML, as the name implies. This means that normal HTML
      escaping is bypassed. If user data can be controlled here, this exposes
      your application to cross-site scripting (XSS). If you need to do this, be
      sure to correctly sanitize the data using a library such as DOMPurify.
    metadata:
      cwe:
        - >-
          CWE-79: Improper Neutralization of Input During Web Page Generation
          ('Cross-site Scripting')
      source-rule-url: >-
        https://github.com/presidentbeef/brakeman/blob/main/lib/brakeman/checks/check_cross_site_scripting.rb
      references:
        - >-
          https://stackoverflow.com/questions/4251284/raw-vs-html-safe-vs-h-to-unescape-html#:~:text===
        - >-
          https://medium.com/sumone-technical-blog/a-pretty-way-to-unescape-html-in-a-ruby-on-rails-application-efc22b850027
      category: security
      technology:
        - rails
      owasp:
        - A07:2017 - Cross-Site Scripting (XSS)
        - A03:2021 - Injection
        - A05:2025 - Injection
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cross-Site-Scripting (XSS)
      source: >-
        https://semgrep.dev/r/ruby.rails.security.audit.xss.templates.avoid-raw.avoid-raw
      shortlink: https://sg.run/3Aqg
      semgrep.dev:
        rule:
          r_id: 9743
          rv_id: 1263642
          rule_id: GdU0vJ
          version_id: vdT06lj
          url: >-
            https://semgrep.dev/playground/r/vdT06lj/ruby.rails.security.audit.xss.templates.avoid-raw.avoid-raw
          origin: community
    languages:
      - generic
    paths:
      include:
        - '*.erb'
    severity: WARNING
    patterns:
      - pattern-inside: <%= ... %>
      - pattern: raw
