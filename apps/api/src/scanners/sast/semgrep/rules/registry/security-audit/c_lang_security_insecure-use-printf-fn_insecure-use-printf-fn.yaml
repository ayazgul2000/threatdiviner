rules:
  - id: c.lang.security.insecure-use-printf-fn.insecure-use-printf-fn
    message: >-
      Avoid using user-controlled format strings passed into 'sprintf', 'printf'
      and 'vsprintf'. These functions put you at risk of buffer overflow
      vulnerabilities through the use of format string exploits. Instead, use
      'snprintf' and 'vsnprintf'.
    metadata:
      cwe:
        - 'CWE-134: Use of Externally-Controlled Format String'
      references:
        - >-
          https://doc.castsoftware.com/display/SBX/Never+use+sprintf%28%29+or+vsprintf%28%29+functions
        - >-
          https://www.cvedetails.com/cwe-details/134/Uncontrolled-Format-String.html
      category: security
      technology:
        - c
      confidence: LOW
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: HIGH
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Validation
      source: >-
        https://semgrep.dev/r/c.lang.security.insecure-use-printf-fn.insecure-use-printf-fn
      shortlink: https://sg.run/ZvJx
      semgrep.dev:
        rule:
          r_id: 8835
          rv_id: 945172
          rule_id: ReUgWx
          version_id: o5TZeB2
          url: >-
            https://semgrep.dev/playground/r/o5TZeB2/c.lang.security.insecure-use-printf-fn.insecure-use-printf-fn
          origin: community
    languages:
      - c
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: |
              $FUNC($BUFFER, argv[$NUM], ...);
              ...
              vsprintf(..., $BUFFER, ...);
          - pattern: vsprintf(..., argv[$NUM], ...)
          - pattern: |
              $FUNC($BUFFER, argv[$NUM], ...);
              ...
              sprintf(..., $BUFFER, ...);
          - pattern: sprintf(...,argv[$NUM],...)
          - pattern: |
              $FUNC($BUFFER, argv[$NUM], ...);
              ...
              printf(..., $BUFFER, ...);
          - pattern: printf(...,argv[$NUM],...)
      - metavariable-comparison:
          metavariable: $NUM
          comparison: int($NUM) > 0
