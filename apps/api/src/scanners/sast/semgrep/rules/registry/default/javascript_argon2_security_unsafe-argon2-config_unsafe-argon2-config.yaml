rules:
  - id: javascript.argon2.security.unsafe-argon2-config.unsafe-argon2-config
    message: >-
      Prefer Argon2id where possible. Per RFC9016, section 4 IETF recommends
      selecting Argon2id unless you can guarantee an adversary has no direct
      access to the computing environment.
    metadata:
      references:
        - >-
          https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
        - https://eprint.iacr.org/2016/759.pdf
        - https://www.cs.tau.ac.il/~tromer/papers/cache-joc-20090619.pdf
        - https://datatracker.ietf.org/doc/html/rfc9106#section-4
      category: security
      cwe:
        - 'CWE-916: Use of Password Hash With Insufficient Computational Effort'
      technology:
        - argon2
        - cryptography
      owasp:
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      subcategory:
        - vuln
      impact: LOW
      likelihood: HIGH
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Insecure Hashing Algorithm
      source: >-
        https://semgrep.dev/r/javascript.argon2.security.unsafe-argon2-config.unsafe-argon2-config
      shortlink: https://sg.run/ALq4
      semgrep.dev:
        rule:
          r_id: 20150
          rv_id: 1263103
          rule_id: DbU2X8
          version_id: qkTR7Jk
          url: >-
            https://semgrep.dev/playground/r/qkTR7Jk/javascript.argon2.security.unsafe-argon2-config.unsafe-argon2-config
          origin: community
    languages:
      - javascript
      - typescript
    severity: WARNING
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: |
              $ARGON = require('argon2');
              ...
          - pattern: |
              {type: ...}
    pattern-sinks:
      - patterns:
          - pattern: |
              $Y
          - pattern-inside: |
              $ARGON.hash(...,$Y)
    pattern-sanitizers:
      - patterns:
          - pattern: '{type: $ARGON.argon2id}'
