rules:
  - id: >-
      terraform.azure.security.storage.storage-enforce-https.storage-enforce-https
    message: >-
      Detected a Storage that was not configured to deny action by default. Add
      `enable_https_traffic_only = true` in your resource block.
    patterns:
      - pattern-not-inside: |
          resource "azurerm_storage_account" "..." {
          ...
            enable_https_traffic_only = true
          ...
          }
      - pattern-inside: |
          resource "azurerm_storage_account" "..." {
          ...
            enable_https_traffic_only = false
          ...
          }
    metadata:
      cwe:
        - 'CWE-319: Cleartext Transmission of Sensitive Information'
      category: security
      technology:
        - terraform
        - azure
      references:
        - >-
          https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/storage_account#enable_https_traffic_only
        - >-
          https://docs.microsoft.com/en-us/azure/storage/common/storage-require-secure-transfer
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      subcategory:
        - vuln
      likelihood: LOW
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Mishandled Sensitive Information
      source: >-
        https://semgrep.dev/r/terraform.azure.security.storage.storage-enforce-https.storage-enforce-https
      shortlink: https://sg.run/0y9v
      semgrep.dev:
        rule:
          r_id: 15110
          rv_id: 1263805
          rule_id: pKUpDA
          version_id: BjTkZ0A
          url: >-
            https://semgrep.dev/playground/r/BjTkZ0A/terraform.azure.security.storage.storage-enforce-https.storage-enforce-https
          origin: community
    languages:
      - hcl
    severity: WARNING
