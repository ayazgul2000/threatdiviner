rules:
  - id: >-
      python.lang.security.audit.insecure-transport.ftplib.use-ftp-tls.use-ftp-tls
    patterns:
      - pattern: ftplib.FTP(...)
      - pattern-not: ftplib.FTP_TLS(...)
    fix-regex:
      regex: FTP(.*)\)
      replacement: FTP_TLS\1, context=ssl.create_default_context())
    message: >-
      The 'FTP' class sends information unencrypted. Consider using the
      'FTP_TLS' class instead.
    metadata:
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      cwe:
        - 'CWE-319: Cleartext Transmission of Sensitive Information'
      references:
        - https://docs.python.org/3/library/ftplib.html#ftplib.FTP_TLS
      category: security
      technology:
        - ftplib
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Mishandled Sensitive Information
      source: >-
        https://semgrep.dev/r/python.lang.security.audit.insecure-transport.ftplib.use-ftp-tls.use-ftp-tls
      shortlink: https://sg.run/AvPp
      semgrep.dev:
        rule:
          r_id: 9650
          rv_id: 1263483
          rule_id: qNUjlR
          version_id: e1TyjoY
          url: >-
            https://semgrep.dev/playground/r/e1TyjoY/python.lang.security.audit.insecure-transport.ftplib.use-ftp-tls.use-ftp-tls
          origin: community
    severity: INFO
    languages:
      - python
