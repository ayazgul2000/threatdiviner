rules:
  - id: php.lang.security.backticks-use.backticks-use
    pattern: '`...`;'
    message: Backticks use may lead to command injection vulnerabilities.
    metadata:
      cwe:
        - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
      references:
        - https://www.php.net/manual/en/language.operators.execution.php
        - >-
          https://github.com/FloeDesignTechnologies/phpcs-security-audit/blob/master/Security/Sniffs/BadFunctions/BackticksSniff.php
      category: security
      technology:
        - php
      owasp:
        - A03:2021 - Injection
        - A05:2025 - Injection
      cwe2022-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: HIGH
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Code Injection
      source: https://semgrep.dev/r/php.lang.security.backticks-use.backticks-use
      shortlink: https://sg.run/4xj9
      semgrep.dev:
        rule:
          r_id: 9388
          rv_id: 1263276
          rule_id: WAUow7
          version_id: NdTzyEy
          url: >-
            https://semgrep.dev/playground/r/NdTzyEy/php.lang.security.backticks-use.backticks-use
          origin: community
    languages:
      - php
    severity: ERROR
