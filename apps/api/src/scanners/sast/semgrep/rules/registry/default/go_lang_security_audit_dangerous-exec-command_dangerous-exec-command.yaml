rules:
  - id: go.lang.security.audit.dangerous-exec-command.dangerous-exec-command
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: |
                      exec.Command($CMD,...)
                  - pattern: |
                      exec.CommandContext($CTX,$CMD,...)
              - pattern-not: |
                  exec.Command("...",...)
              - pattern-not: |
                  exec.CommandContext($CTX,"...",...)
          - patterns:
              - pattern-either:
                  - pattern: >
                      exec.Command("=~/(sh|bash|ksh|csh|tcsh|zsh)/","-c",$CMD,...)
                  - pattern: >
                      exec.CommandContext($CTX,"=~/(sh|bash|ksh|csh|tcsh|zsh)/","-c",$CMD,...)
              - pattern-not: |
                  exec.Command("...","...","...",...)
              - pattern-not: |
                  exec.CommandContext($CTX,"...","...","...",...)
          - pattern-either:
              - pattern: >
                  exec.Command("=~/\/bin\/env/","=~/(sh|bash|ksh|csh|tcsh|zsh)/","-c",$CMD,...)
              - pattern: >
                  exec.CommandContext($CTX,"=~/\/bin\/env/","=~/(sh|bash|ksh|csh|tcsh|zsh)/","-c",$CMD,...)
      - pattern-inside: |
          import "os/exec"
          ...
      - pattern-not-inside: |
          $CMD,$ERR := exec.LookPath("...");
          ...
      - pattern-not-inside: |
          $CMD = "...";
          ...
    message: >-
      Detected non-static command inside Command. Audit the input to
      'exec.Command'. If unverified user data can reach this call site, this is
      a code injection vulnerability. A malicious actor can inject a malicious
      script to execute arbitrary code.
    metadata:
      cwe:
        - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
      owasp:
        - A03:2021 - Injection
        - A05:2025 - Injection
      category: security
      technology:
        - go
      confidence: LOW
      references:
        - https://owasp.org/Top10/A03_2021-Injection
      cwe2022-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: HIGH
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Code Injection
      source: >-
        https://semgrep.dev/r/go.lang.security.audit.dangerous-exec-command.dangerous-exec-command
      shortlink: https://sg.run/W8lA
      semgrep.dev:
        rule:
          r_id: 9109
          rv_id: 1262935
          rule_id: X5U8RQ
          version_id: vdT06Xp
          url: >-
            https://semgrep.dev/playground/r/vdT06Xp/go.lang.security.audit.dangerous-exec-command.dangerous-exec-command
          origin: community
    severity: ERROR
    languages:
      - go
