rules:
  - id: terraform.lang.security.iam.no-iam-priv-esc-roles.no-iam-priv-esc-roles
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  resource $TYPE "..." {
                    ...
                    policy = jsonencode({
                      ...
                      Statement = [
                        ...
                      ]
                      ...
                    })
                    ...
                  }
              - pattern-not-inside: |
                  resource $TYPE "..." {
                    ...
                    policy = jsonencode({
                      ...
                      Statement = [
                        ...,
                        {... Effect = "Deny" ...},
                        ...
                      ]
                      ...
                    })
                    ...
                  }
              - pattern: |
                  Action = $ACTION
              - metavariable-pattern:
                  metavariable: $TYPE
                  pattern-either:
                    - pattern: |
                        "aws_iam_role_policy"
                    - pattern: |
                        "aws_iam_policy"
                    - pattern: |
                        "aws_iam_user_policy"
                    - pattern: |
                        "aws_iam_group_policy"
          - patterns:
              - pattern-inside: |
                  data aws_iam_policy_document "..." {
                    ...
                    statement {
                      ...
                    }
                    ...
                  }
              - pattern-not-inside: |
                  data aws_iam_policy_document "..." {
                    ...
                    statement {
                      ...
                      effect = "Deny"
                      ...
                    }
                    ...
                  }
              - pattern: |
                  actions = $ACTION
      - metavariable-pattern:
          metavariable: $ACTION
          pattern-either:
            - patterns:
                - pattern: |
                    [..., "sts:AssumeRole", ...]
                - pattern: |
                    [..., "iam:UpdateAssumeRolePolicy", ...]
            - patterns:
                - pattern: |
                    [..., "iam:PassRole", ...]
                - pattern: |
                    [..., "lambda:CreateFunction", ...]
                - pattern: |
                    [..., "lambda:InvokeFunction", ...]
            - patterns:
                - pattern: |
                    [..., "iam:PassRole", ...]
                - pattern: |
                    [..., "lambda:CreateFunction", ...]
                - pattern: |
                    [..., "lambda:CreateEventSourceMapping", ...]
            - pattern: |
                "lambda:UpdateFunctionCode"
            - patterns:
                - pattern: |
                    [..., "iam:PassRole", ...]
                - pattern: |
                    [..., "glue:CreateDevEndpoint", ...]
            - patterns:
                - pattern: |
                    [..., "iam:PassRole", ...]
                - pattern: |
                    [..., "cloudformation:CreateStack", ...]
            - patterns:
                - pattern: |
                    [..., "iam:PassRole", ...]
                - pattern: |
                    [..., "datapipeline:CreatePipeline", ...]
                - pattern: |
                    [..., "datapipeline:PutPipelineDefinition", ...]
    message: >-
      Ensure that groups of actions that include iam:PassRole and could result
      in privilege escalation are not all allowed for the same user. These
      actions could result in an attacker gaining full admin access of an AWS
      account. Try not to use these actions in conjuction.
    metadata:
      references:
        - >-
          https://cloudsplaining.readthedocs.io/en/latest/glossary/privilege-escalation/
        - >-
          https://rhinosecuritylabs.com/aws/aws-privilege-escalation-methods-mitigation/
      category: security
      cwe:
        - 'CWE-269: Improper Privilege Management'
      technology:
        - terraform
        - aws
      owasp:
        - A04:2021 - Insecure Design
        - A06:2025 - Insecure Design
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authorization
      source: >-
        https://semgrep.dev/r/terraform.lang.security.iam.no-iam-priv-esc-roles.no-iam-priv-esc-roles
      shortlink: https://sg.run/jwrA
      semgrep.dev:
        rule:
          r_id: 13565
          rv_id: 1263893
          rule_id: eqUzR3
          version_id: 7ZTE33y
          url: >-
            https://semgrep.dev/playground/r/7ZTE33y/terraform.lang.security.iam.no-iam-priv-esc-roles.no-iam-priv-esc-roles
          origin: community
    languages:
      - hcl
    severity: WARNING
