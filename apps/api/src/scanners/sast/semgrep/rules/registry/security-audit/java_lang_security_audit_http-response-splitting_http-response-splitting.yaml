rules:
  - id: java.lang.security.audit.http-response-splitting.http-response-splitting
    metadata:
      cwe:
        - >-
          CWE-113: Improper Neutralization of CRLF Sequences in HTTP Headers
          ('HTTP Request/Response Splitting')
      owasp:
        - A03:2021 - Injection
        - A05:2025 - Injection
      source-rule-url: https://find-sec-bugs.github.io/bugs.htm#HTTP_RESPONSE_SPLITTING
      references:
        - https://www.owasp.org/index.php/HTTP_Response_Splitting
      category: security
      technology:
        - java
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Validation
      source: >-
        https://semgrep.dev/r/java.lang.security.audit.http-response-splitting.http-response-splitting
      shortlink: https://sg.run/eL0l
      semgrep.dev:
        rule:
          r_id: 9176
          rv_id: 1263023
          rule_id: 3qUPyK
          version_id: X0Tzykw
          url: >-
            https://semgrep.dev/playground/r/X0Tzykw/java.lang.security.audit.http-response-splitting.http-response-splitting
          origin: community
    message: >-
      Older Java application servers are vulnerable to HTTP response splitting,
      which may occur if an HTTP request can be injected with CRLF characters.
      This finding is reported for completeness; it is recommended to ensure
      your environment is not affected by testing this yourself.
    severity: INFO
    languages:
      - java
    pattern-either:
      - pattern: |
          $VAR = $REQ.getParameter(...);
          ...
          $COOKIE = new Cookie(..., $VAR, ...);
          ...
          $RESP.addCookie($COOKIE, ...);
      - patterns:
          - pattern-inside: |
              $RETTYPE $FUNC(...,@PathVariable $TYPE $VAR, ...) {
                ...
              }
          - pattern: |
              $COOKIE = new Cookie(..., $VAR, ...);
              ...
              $RESP.addCookie($COOKIE, ...);
