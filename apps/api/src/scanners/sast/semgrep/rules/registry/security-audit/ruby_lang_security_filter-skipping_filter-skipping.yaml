rules:
  - id: ruby.lang.security.filter-skipping.filter-skipping
    patterns:
      - pattern-not: |
          $CALL "=~/.*(/:action.*).*/", $ACTION
      - pattern: |
          $CALL "=~/.*(/:action.*).*/"
    message: >-
      Checks for use of action in Ruby routes. This can cause Rails to render an
      arbitrary view if an attacker creates an URL accurately. Affects 3.0
      applications. Can avoid the vulnerability by providing additional
      constraints.
    metadata:
      cwe:
        - 'CWE-1021: Improper Restriction of Rendered UI Layers or Frames'
      references:
        - >-
          https://github.com/presidentbeef/brakeman/blob/main/lib/brakeman/checks/check_filter_skipping.rb
        - https://groups.google.com/g/rubyonrails-security/c/NCCsca7TEtY
      category: security
      technology:
        - ruby
      owasp:
        - A04:2021 - Insecure Design
        - A06:2025 - Insecure Design
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Other
      source: https://semgrep.dev/r/ruby.lang.security.filter-skipping.filter-skipping
      shortlink: https://sg.run/ljNL
      semgrep.dev:
        rule:
          r_id: 9713
          rv_id: 1263604
          rule_id: pKUGP7
          version_id: DkTRbln
          url: >-
            https://semgrep.dev/playground/r/DkTRbln/ruby.lang.security.filter-skipping.filter-skipping
          origin: community
    languages:
      - ruby
    severity: ERROR
