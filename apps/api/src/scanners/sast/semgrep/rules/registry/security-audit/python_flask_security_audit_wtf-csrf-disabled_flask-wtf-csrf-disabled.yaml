rules:
  - id: python.flask.security.audit.wtf-csrf-disabled.flask-wtf-csrf-disabled
    message: Setting 'WTF_CSRF_ENABLED' to 'False' explicitly disables CSRF protection.
    options:
      symbolic_propagation: true
    metadata:
      cwe:
        - 'CWE-352: Cross-Site Request Forgery (CSRF)'
      owasp:
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      references:
        - https://flask-wtf.readthedocs.io/en/1.2.x/csrf/
      category: security
      technology:
        - flask
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
      functional-categories:
        - web::search::csrf-config::flask
        - web::search::csrf-config::flask-wtf
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cross-Site Request Forgery (CSRF)
      source: >-
        https://semgrep.dev/r/python.flask.security.audit.wtf-csrf-disabled.flask-wtf-csrf-disabled
      shortlink: https://sg.run/Q5AQ
      semgrep.dev:
        rule:
          r_id: 9542
          rv_id: 1263425
          rule_id: ReUgXz
          version_id: pZT034X
          url: >-
            https://semgrep.dev/playground/r/pZT034X/python.flask.security.audit.wtf-csrf-disabled.flask-wtf-csrf-disabled
          origin: community
    severity: WARNING
    languages:
      - python
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $APP.config["WTF_CSRF_ENABLED"] = $FALSE
                  - pattern: $APP.config.WTF_CSRF_ENABLED = $FALSE
                  - patterns:
                      - pattern: |
                          $APP.config.$UPDATE(
                            ...,
                            WTF_CSRF_ENABLED = $FALSE,
                            ...
                          )
                      - pattern-not-inside: |
                          $APP.config.$UPDATE(
                              ...,
                              TESTING=True,
                              ...
                          )
                      - pattern-not-inside: |
                          $APP.config.$UPDATE(
                              ...,
                              DEBUG=True,
                              ...
                          )
                      - metavariable-regex:
                          metavariable: $UPDATE
                          regex: ^(update|from_mapping)$
                  - pattern: |
                      $OBJ = $CLASS()
                      ...
                      $OBJ.WTF_CSRF_ENABLED = $FALSE
                      ...
                      $APP.config.from_object($OBJ, ...)
                  - pattern: |
                      WTF_CSRF_ENABLED = $FALSE
                      ...
                      $APP.config.from_object(__name__)
              - metavariable-regex:
                  metavariable: $FALSE
                  regex: ^(False)$
              - focus-metavariable: $FALSE
    fix: 'True'
