rules:
  - id: terraform.lang.security.ec2-imdsv1-optional.ec2-imdsv1-optional
    languages:
      - hcl
    message: AWS EC2 Instance allowing use of the IMDSv1
    metadata:
      cwe:
        - 'CWE-918: Server-Side Request Forgery (SSRF)'
      references:
        - >-
          https://aws.amazon.com/blogs/security/defense-in-depth-open-firewalls-reverse-proxies-ssrf-vulnerabilities-ec2-instance-metadata-service
        - >-
          https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/instance#metadata-options
      category: security
      technology:
        - terraform
        - aws
      owasp:
        - A10:2021 - Server-Side Request Forgery (SSRF)
        - A01:2025 - Broken Access Control
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: LOW
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Server-Side Request Forgery (SSRF)
      source: >-
        https://semgrep.dev/r/terraform.lang.security.ec2-imdsv1-optional.ec2-imdsv1-optional
      shortlink: https://sg.run/J3BQ
      semgrep.dev:
        rule:
          r_id: 11302
          rv_id: 1263884
          rule_id: GdU0eA
          version_id: w8TRooE
          url: >-
            https://semgrep.dev/playground/r/w8TRooE/terraform.lang.security.ec2-imdsv1-optional.ec2-imdsv1-optional
          origin: community
    pattern-either:
      - patterns:
          - pattern: http_tokens = "optional"
          - pattern-inside: |
              metadata_options { ... }
      - patterns:
          - pattern: |
              resource "aws_instance" "$NAME" {
                ...
              }
          - pattern-not: |
              resource "aws_instance" "$NAME" {
                ...
                metadata_options {
                  ...
                  http_tokens = "required"
                  ...
                }
                ...
              }
          - pattern-not: |
              resource "aws_instance" "$NAME" {
                ...
                metadata_options {
                  ...
                  http_tokens = "optional"
                  ...
                }
                ...
              }
          - pattern-not: |
              resource "aws_instance" "$NAME" {
                ...
                metadata_options {
                  ...
                  http_endpoint = "disabled"
                  ...
                }
                ...
              }
    severity: ERROR
