rules:
  - id: >-
      ruby.rails.security.brakeman.check-dynamic-render-local-file-include.check-dynamic-render-local-file-include
    mode: search
    paths:
      include:
        - '*.erb'
    patterns:
      - pattern: |
          params[...]
      - pattern-inside: |
          render :file => ...
    message: >-
      Found request parameters in a call to `render` in a dynamic context. This
      can allow end users to request arbitrary local files which may result in
      leaking sensitive information persisted on disk.
    languages:
      - generic
    severity: WARNING
    metadata:
      technology:
        - ruby
        - rails
      category: security
      cwe:
        - >-
          CWE-22: Improper Limitation of a Pathname to a Restricted Directory
          ('Path Traversal')
      owasp:
        - A05:2017 - Broken Access Control
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      source-rule-url: >-
        https://github.com/presidentbeef/brakeman/blob/main/lib/brakeman/checks/check_render.rb
      references:
        - >-
          https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/07-Input_Validation_Testing/11.1-Testing_for_Local_File_Inclusion
        - >-
          https://github.com/presidentbeef/brakeman/blob/f74cb53ead47f0af821d98b5b41e16d63100c240/test/apps/rails2/app/views/home/test_render.html.erb
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Path Traversal
      source: >-
        https://semgrep.dev/r/ruby.rails.security.brakeman.check-dynamic-render-local-file-include.check-dynamic-render-local-file-include
      shortlink: https://sg.run/3QWl
      semgrep.dev:
        rule:
          r_id: 20043
          rv_id: 1263651
          rule_id: JDUokO
          version_id: QkTGq9X
          url: >-
            https://semgrep.dev/playground/r/QkTGq9X/ruby.rails.security.brakeman.check-dynamic-render-local-file-include.check-dynamic-render-local-file-include
          origin: community
