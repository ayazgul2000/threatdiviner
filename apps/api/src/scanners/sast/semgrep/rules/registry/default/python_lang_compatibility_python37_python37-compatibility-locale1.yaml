        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      source: >-
        https://semgrep.dev/r/python.lang.compatibility.python37.python37-compatibility-locale1
      shortlink: https://sg.run/gLeZ
