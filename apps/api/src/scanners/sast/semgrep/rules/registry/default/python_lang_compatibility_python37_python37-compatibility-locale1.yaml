rules:
  - id: python.lang.compatibility.python37.python37-compatibility-locale1
    pattern: locale.format_string(monetary=$X, ...)
    message: >-
      Found usage of the 'monetary' argument in a function call of
      'locale.format_string'. This is only available on Python 3.7+ and is
      therefore not backwards compatible. Instead, remove the 'monetary'
      argument.
    languages:
      - python
    severity: ERROR
    metadata:
      category: compatibility
      technology:
        - python
