rules:
  - id: go.lang.security.audit.reflect-makefunc.reflect-makefunc
    message: >-
      'reflect.MakeFunc' detected. This will sidestep protections that are
      normally afforded by Go's type system. Audit this call and be sure that
      user input cannot be used to affect the code generated by MakeFunc;
      otherwise, you will have a serious security vulnerability.
    metadata:
      owasp:
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      cwe:
        - 'CWE-913: Improper Control of Dynamically-Managed Code Resources'
      category: security
      technology:
        - go
      confidence: LOW
      references:
        - https://owasp.org/Top10/A01_2021-Broken_Access_Control
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Code Injection
      source: >-
        https://semgrep.dev/r/go.lang.security.audit.reflect-makefunc.reflect-makefunc
      shortlink: https://sg.run/KlPd
      semgrep.dev:
        rule:
          r_id: 9111
          rv_id: 1262950
          rule_id: 10UKGb
          version_id: GxTkeqB
          url: >-
            https://semgrep.dev/playground/r/GxTkeqB/go.lang.security.audit.reflect-makefunc.reflect-makefunc
          origin: community
    severity: ERROR
    pattern: reflect.MakeFunc(...)
    languages:
      - go
