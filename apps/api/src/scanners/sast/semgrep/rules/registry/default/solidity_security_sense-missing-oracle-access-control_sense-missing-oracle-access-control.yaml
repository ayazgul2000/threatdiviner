rules:
  - id: >-
      solidity.security.sense-missing-oracle-access-control.sense-missing-oracle-access-control
    message: Oracle update is not restricted in $F()
    metadata:
      category: security
      technology:
        - solidity
      cwe: 'CWE-284: Improper Access Control'
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      author: https://twitter.com/ArbazKiraak
      references:
        - >-
          https://medium.com/immunefi/sense-finance-access-control-issue-bugfix-review-32e0c806b1a0
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authorization
      source: >-
        https://semgrep.dev/r/solidity.security.sense-missing-oracle-access-control.sense-missing-oracle-access-control
      shortlink: https://sg.run/1521
      semgrep.dev:
        rule:
          r_id: 67666
          rv_id: 946629
          rule_id: 0oUbvd
          version_id: 6xTxjKQ
          url: >-
            https://semgrep.dev/playground/r/6xTxjKQ/solidity.security.sense-missing-oracle-access-control.sense-missing-oracle-access-control
          origin: community
    patterns:
      - pattern-either:
          - pattern-inside: |
              function $F(...,$D $REQUEST,...) external {
                  ...
              }
          - pattern-inside: |
              function $F(...,$D $REQUEST,...) public {
                  ...
              }
      - pattern-not-inside: |
          function $F(...,$D $REQUEST,...) external onlyVault(...) {
              ...
          }
      - patterns:
          - pattern: _updateOracle($LASTBLOCK,...,...)
          - pattern-not-inside: |
              ...
              if (msg.sender == $BALANCER) { ... }
              ...
          - pattern-not-inside: |
              ...
              require(msg.sender == address($BALANCER),...);
              ...
          - pattern-not-inside: |
              ...
              if (_msgSender() == $BALANCER) { ... }
              ...
          - pattern-not-inside: |
              ...
              require(_msgSender() == address($BALANCER),...);
              ...
    languages:
      - solidity
    severity: ERROR
