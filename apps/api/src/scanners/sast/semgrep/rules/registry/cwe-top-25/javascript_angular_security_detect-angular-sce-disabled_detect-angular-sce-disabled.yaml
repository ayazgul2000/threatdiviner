rules:
  - id: >-
      javascript.angular.security.detect-angular-sce-disabled.detect-angular-sce-disabled
    message: >-
      $sceProvider is set to false. Disabling Strict Contextual escaping (SCE)
      in an AngularJS application could provide additional attack surface for
      XSS vulnerabilities.
    metadata:
      cwe:
        - >-
          CWE-79: Improper Neutralization of Input During Web Page Generation
          ('Cross-site Scripting')
      references:
        - https://docs.angularjs.org/api/ng/service/$sce
        - >-
          https://owasp.org/www-chapter-london/assets/slides/OWASPLondon20170727_AngularJS.pdf
      category: security
      technology:
        - angular
      owasp:
        - A07:2017 - Cross-Site Scripting (XSS)
        - A03:2021 - Injection
        - A05:2025 - Injection
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: HIGH
      impact: MEDIUM
      confidence: HIGH
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cross-Site-Scripting (XSS)
      source: >-
        https://semgrep.dev/r/javascript.angular.security.detect-angular-sce-disabled.detect-angular-sce-disabled
      shortlink: https://sg.run/N4DG
      semgrep.dev:
        rule:
          r_id: 9227
          rv_id: 1263094
          rule_id: EwU20Z
          version_id: 5PTo1EW
          url: >-
            https://semgrep.dev/playground/r/5PTo1EW/javascript.angular.security.detect-angular-sce-disabled.detect-angular-sce-disabled
          origin: community
    languages:
      - javascript
      - typescript
    severity: ERROR
    pattern: |
      $sceProvider.enabled(false);
