rules:
  - id: yaml.kubernetes.security.privileged-container.privileged-container
    pattern-either:
      - patterns:
          - pattern-inside: |
              containers:
                ...
          - pattern: |
              image: ...
              ...
              securityContext:
                ...
                privileged: true
      - patterns:
          - pattern-inside: |
              spec:
                ...
          - pattern-not-inside: |
              image: ...
              ...
          - pattern: |
              privileged: true
    message: >-
      Container or pod is running in privileged mode. This grants the container
      the equivalent of root capabilities on the host machine. This can lead to
      container escapes, privilege escalation, and other security concerns.
      Remove the 'privileged' key to disable this capability.
    metadata:
      cwe:
        - 'CWE-250: Execution with Unnecessary Privileges'
      references:
        - >-
          https://kubernetes.io/docs/concepts/policy/pod-security-policy/#privileged
        - >-
          https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
        - >-
          https://cheatsheetseries.owasp.org/cheatsheets/Docker_Security_Cheat_Sheet.html
      category: security
      technology:
        - kubernetes
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authorization
      source: >-
        https://semgrep.dev/r/yaml.kubernetes.security.privileged-container.privileged-container
      shortlink: https://sg.run/Ygr5
      semgrep.dev:
        rule:
          r_id: 10058
          rv_id: 947059
          rule_id: oqUz2p
          version_id: gETeWJA
          url: >-
            https://semgrep.dev/playground/r/gETeWJA/yaml.kubernetes.security.privileged-container.privileged-container
          origin: community
    languages:
      - yaml
    severity: WARNING
