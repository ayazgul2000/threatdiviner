rules:
  - id: ruby.lang.security.audit.sha224-hash.sha224-hash
    message: >-
      This code uses a 224-bit hash function, which is deprecated or disallowed
      in some security policies. Consider updating to a stronger hash function
      such as SHA-384 or higher to ensure compliance and security.
    metadata:
      cwe:
        - 'CWE-328: Use of Weak Hash'
      references:
        - >-
          https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-131Ar3.ipd.pdf
        - >-
          https://www.cyber.gov.au/resources-business-and-government/essential-cyber-security/ism/cyber-security-guidelines/guidelines-cryptography
      category: security
      technology:
        - ruby
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      subcategory:
        - vuln
      likelihood: LOW
      impact: LOW
      confidence: HIGH
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Insecure Hashing Algorithm
      source: https://semgrep.dev/r/ruby.lang.security.audit.sha224-hash.sha224-hash
      shortlink: https://sg.run/WABbo
      semgrep.dev:
        rule:
          r_id: 151753
          rv_id: 1263592
          rule_id: DbU60wQ
          version_id: 8KT5rRY
          url: >-
            https://semgrep.dev/playground/r/8KT5rRY/ruby.lang.security.audit.sha224-hash.sha224-hash
          origin: community
    languages:
      - ruby
    severity: WARNING
    pattern-either:
      - pattern: Digest::SHA224.$FUNC
      - pattern: OpenSSL::Digest::SHA224.$FUNC
      - pattern: SHA3::Digest::SHA224(...)
      - patterns:
          - pattern-either:
              - pattern: OpenSSL::HMAC.hexdigest("$ALGO", ...)
              - pattern: OpenSSL::HMAC.digest("$ALGO", ...)
              - pattern: OpenSSL::HMAC.new($KEY, "$ALGO")
              - pattern: OpenSSL::Digest.digest("$ALGO", ...)
              - pattern: OpenSSL::Digest.new("$ALGO", ...)
          - metavariable-regex:
              metavariable: $ALGO
              regex: .*224
