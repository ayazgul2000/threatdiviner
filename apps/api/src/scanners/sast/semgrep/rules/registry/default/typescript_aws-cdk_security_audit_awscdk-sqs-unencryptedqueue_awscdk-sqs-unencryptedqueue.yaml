rules:
  - id: >-
      typescript.aws-cdk.security.audit.awscdk-sqs-unencryptedqueue.awscdk-sqs-unencryptedqueue
    message: >-
      Queue $X is missing encryption at rest. Add "encryption:
      $Y.QueueEncryption.KMS" or "encryption: $Y.QueueEncryption.KMS_MANAGED" to
      the queue props to enable encryption at rest for the queue.
    metadata:
      category: security
      cwe:
        - 'CWE-311: Missing Encryption of Sensitive Data'
      technology:
        - AWS-CDK
      references:
        - >-
          https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-data-protection.html
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A04:2021 - Insecure Design
        - A06:2025 - Insecure Design
      subcategory:
        - vuln
      likelihood: LOW
      impact: HIGH
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/typescript.aws-cdk.security.audit.awscdk-sqs-unencryptedqueue.awscdk-sqs-unencryptedqueue
      shortlink: https://sg.run/d23P
      semgrep.dev:
        rule:
          r_id: 15278
          rv_id: 1263905
          rule_id: kxUwqO
          version_id: A8Tgd2W
          url: >-
            https://semgrep.dev/playground/r/A8Tgd2W/typescript.aws-cdk.security.audit.awscdk-sqs-unencryptedqueue.awscdk-sqs-unencryptedqueue
          origin: community
    languages:
      - ts
    severity: WARNING
    pattern-either:
      - patterns:
          - pattern-inside: |
              import {Queue} from '@aws-cdk/aws-sqs'
              ...
          - pattern: const $X = new Queue(...)
          - pattern-not: >
              const $X = new Queue(..., {..., encryption:
              QueueEncryption.KMS_MANAGED, ...})
          - pattern-not: >
              const $X = new Queue(..., {..., encryption: QueueEncryption.KMS,
              ...})
      - patterns:
          - pattern-inside: |
              import * as $Y from '@aws-cdk/aws-sqs'
              ...
          - pattern: const $X = new $Y.Queue(...)
          - pattern-not: >
              const $X = new $Y.Queue(..., {..., encryption:
              $Y.QueueEncryption.KMS_MANAGED, ...})
          - pattern-not: >
              const $X = new $Y.Queue(..., {..., encryption:
              $Y.QueueEncryption.KMS, ...})
