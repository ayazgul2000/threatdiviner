rules:
  - id: >-
      python.django.security.passwords.password-empty-string.password-empty-string
    message: >-
      '$VAR' is the empty string and is being used to set the password on
      '$MODEL'. If you meant to set an unusable password, set the password to
      None or call 'set_unusable_password()'.
    metadata:
      cwe:
        - 'CWE-521: Weak Password Requirements'
      owasp:
        - A07:2021 - Identification and Authentication Failures
        - A07:2025 - Authentication Failures
      references:
        - >-
          https://docs.djangoproject.com/en/3.0/ref/contrib/auth/#django.contrib.auth.models.User.set_password
      category: security
      technology:
        - django
      subcategory:
        - vuln
      likelihood: LOW
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authentication
      source: >-
        https://semgrep.dev/r/python.django.security.passwords.password-empty-string.password-empty-string
      shortlink: https://sg.run/oxnR
      semgrep.dev:
        rule:
          r_id: 9516
          rv_id: 1263411
          rule_id: 9AU1jW
          version_id: GxTke5Q
          url: >-
            https://semgrep.dev/playground/r/GxTke5Q/python.django.security.passwords.password-empty-string.password-empty-string
          origin: community
    patterns:
      - pattern-either:
          - pattern: |
              $MODEL.set_password($EMPTY)
              ...
              $MODEL.save()
          - pattern: |
              $VAR = $EMPTY
              ...
              $MODEL.set_password($VAR)
              ...
              $MODEL.save()
      - metavariable-regex:
          metavariable: $EMPTY
          regex: (\'\'|\"\")
    languages:
      - python
    severity: ERROR
