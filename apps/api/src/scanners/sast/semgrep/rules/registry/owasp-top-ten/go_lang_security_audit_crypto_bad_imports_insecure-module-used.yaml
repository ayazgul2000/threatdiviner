rules:
  - id: go.lang.security.audit.crypto.bad_imports.insecure-module-used
    message: >-
      The package `net/http/cgi` is on the import blocklist.  The package is
      vulnerable to httpoxy attacks (CVE-2015-5386). It is recommended to use
      `net/http` or a web framework to build a web application instead.
    metadata:
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      cwe:
        - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
      source-rule-url: https://github.com/securego/gosec
      references:
        - https://godoc.org/golang.org/x/crypto/sha3
      category: security
      technology:
        - go
      confidence: MEDIUM
      subcategory:
        - audit
      likelihood: MEDIUM
      impact: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/go.lang.security.audit.crypto.bad_imports.insecure-module-used
      shortlink: https://sg.run/l2gj
      semgrep.dev:
        rule:
          r_id: 9113
          rv_id: 1262921
          rule_id: yyUnov
          version_id: 2KTv2vJ
          url: >-
            https://semgrep.dev/playground/r/2KTv2vJ/go.lang.security.audit.crypto.bad_imports.insecure-module-used
          origin: community
    languages:
      - go
    severity: WARNING
    pattern-either:
      - patterns:
          - pattern-inside: |
              import "net/http/cgi"
              ...
          - pattern: |
              cgi.$FUNC(...)
