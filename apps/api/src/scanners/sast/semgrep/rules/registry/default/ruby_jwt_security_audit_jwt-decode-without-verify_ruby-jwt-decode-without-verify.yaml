rules:
  - id: >-
      ruby.jwt.security.audit.jwt-decode-without-verify.ruby-jwt-decode-without-verify
    message: >-
      Detected the decoding of a JWT token without a verify step. JWT tokens
      must be verified before use, otherwise the token's integrity is unknown.
      This means a malicious actor could forge a JWT token with any claims.
    metadata:
      cwe:
        - 'CWE-345: Insufficient Verification of Data Authenticity'
      owasp:
        - A08:2021 - Software and Data Integrity Failures
        - A08:2025 - Software or Data Integrity Failures
      source-rule-url: >-
        https://semgrep.dev/blog/2020/hardcoded-secrets-unverified-tokens-and-other-common-jwt-mistakes/
      category: security
      technology:
        - jwt
      references:
        - https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authentication
      source: >-
        https://semgrep.dev/r/ruby.jwt.security.audit.jwt-decode-without-verify.ruby-jwt-decode-without-verify
      shortlink: https://sg.run/AlYg
      semgrep.dev:
        rule:
          r_id: 9706
          rv_id: 1263587
          rule_id: KxU426
          version_id: ZRTKAnz
          url: >-
            https://semgrep.dev/playground/r/ZRTKAnz/ruby.jwt.security.audit.jwt-decode-without-verify.ruby-jwt-decode-without-verify
          origin: community
    languages:
      - ruby
    severity: WARNING
    patterns:
      - pattern-inside: |
          require 'jwt'
          ...
      - pattern: JWT.decode($PAYLOAD,$SECRET,false,...)
