rules:
  - id: >-
      terraform.azure.security.appservice.appservice-account-identity-registered.appservice-account-identity-registered
    message: >-
      Registering the identity used by an App with AD allows it to interact with
      other services without using username and password. Set the `identity`
      block in your appservice.
    patterns:
      - pattern: resource
      - pattern-not-inside: |
          resource "azurerm_app_service" "..." {
          ...
            identity {
              type = "..."
              identity_ids = "..."
            }
          ...
          }
      - pattern-not-inside: |
          resource "azurerm_app_service" "..." {
          ...
            identity {
              type = "SystemAssigned"
            }
          ...
          }
      - pattern-inside: |
          resource "azurerm_app_service" "..." {
          ...
          }
    metadata:
      category: security
      owasp:
        - A02:2017 - Broken Authentication
        - A07:2021 - Identification and Authentication Failures
        - A07:2025 - Authentication Failures
      cwe:
        - 'CWE-287: Improper Authentication'
      technology:
        - terraform
        - azure
      references:
        - >-
          https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/app_service#identity
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authentication
      source: >-
        https://semgrep.dev/r/terraform.azure.security.appservice.appservice-account-identity-registered.appservice-account-identity-registered
      shortlink: https://sg.run/PbXY
      semgrep.dev:
        rule:
          r_id: 15101
          rv_id: 1263754
          rule_id: WAUynd
          version_id: 44TEj04
          url: >-
            https://semgrep.dev/playground/r/44TEj04/terraform.azure.security.appservice.appservice-account-identity-registered.appservice-account-identity-registered
          origin: community
    languages:
      - hcl
    severity: INFO
