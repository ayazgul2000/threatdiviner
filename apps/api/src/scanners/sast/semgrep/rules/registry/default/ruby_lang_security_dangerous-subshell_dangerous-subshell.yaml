rules:
  - id: ruby.lang.security.dangerous-subshell.dangerous-subshell
    patterns:
      - pattern: |
          `...#{$VAL}...`
      - pattern-not: |
          `...#{"..."}...`
      - pattern-not-inside: |
          $VAL = "..."
          ...
    message: >-
      Detected non-static command inside `...`. If unverified user data can
      reach this call site, this is a code injection vulnerability. A malicious
      actor can inject a malicious script to execute arbitrary code.
    metadata:
      cwe:
        - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
      owasp:
        - A03:2021 - Injection
        - A05:2025 - Injection
      category: security
      technology:
        - ruby
      references:
        - https://owasp.org/Top10/A03_2021-Injection
      cwe2022-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: HIGH
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Code Injection
      source: >-
        https://semgrep.dev/r/ruby.lang.security.dangerous-subshell.dangerous-subshell
      shortlink: https://sg.run/NrxL
      semgrep.dev:
        rule:
          r_id: 9827
          rv_id: 1263601
          rule_id: OrUGn8
          version_id: RGT0LJK
          url: >-
            https://semgrep.dev/playground/r/RGT0LJK/ruby.lang.security.dangerous-subshell.dangerous-subshell
          origin: community
    severity: WARNING
    languages:
      - ruby
