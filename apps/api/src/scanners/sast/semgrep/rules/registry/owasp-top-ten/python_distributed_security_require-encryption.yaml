rules:
  - id: python.distributed.security.require-encryption
    patterns:
      - pattern: |
          distributed.security.Security(..., require_encryption=$VAL, ...)
      - metavariable-pattern:
          metavariable: $VAL
          pattern: |
            False
      - focus-metavariable: $VAL
    fix: |
      True
    message: >-
      Initializing a security context for Dask (`distributed`) without
      "require_encryption" keyword argument may silently fail to provide
      security.
    severity: WARNING
    metadata:
      cwe:
        - 'CWE-319: Cleartext Transmission of Sensitive Information'
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      references:
        - >-
          https://distributed.dask.org/en/latest/tls.html?highlight=require_encryption#parameters
      category: security
      technology:
        - distributed
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Mishandled Sensitive Information
      source: https://semgrep.dev/r/python.distributed.security.require-encryption
      shortlink: https://sg.run/AvQ2
      semgrep.dev:
        rule:
          r_id: 9450
          rv_id: 1263358
          rule_id: YGURy0
          version_id: DkTRbol
          url: >-
            https://semgrep.dev/playground/r/DkTRbol/python.distributed.security.require-encryption
          origin: community
    languages:
      - python
