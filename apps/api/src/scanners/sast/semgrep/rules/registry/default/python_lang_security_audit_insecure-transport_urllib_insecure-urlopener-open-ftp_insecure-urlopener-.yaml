rules:
  - id: >-
      python.lang.security.audit.insecure-transport.urllib.insecure-urlopener-open-ftp.insecure-urlopener-open-ftp
    message: >-
      Detected an insecure transmission channel. 'URLopener.open(...)' is being
      used with 'ftp://'. Use SFTP instead. urllib does not support SFTP, so
      consider using a library which supports SFTP.
    metadata:
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      cwe:
        - 'CWE-319: Cleartext Transmission of Sensitive Information'
      references:
        - >-
          https://docs.python.org/3/library/urllib.request.html#urllib.request.URLopener.open
      category: security
      technology:
        - urllib
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Mishandled Sensitive Information
      source: >-
        https://semgrep.dev/r/python.lang.security.audit.insecure-transport.urllib.insecure-urlopener-open-ftp.insecure-urlopener-open-ftp
      shortlink: https://sg.run/zvwG
      semgrep.dev:
        rule:
          r_id: 9661
          rv_id: 1263494
          rule_id: 9AU1DY
          version_id: 3ZT4XGA
          url: >-
            https://semgrep.dev/playground/r/3ZT4XGA/python.lang.security.audit.insecure-transport.urllib.insecure-urlopener-open-ftp.insecure-urlopener-open-ftp
          origin: community
    severity: WARNING
    languages:
      - python
    pattern-either:
      - pattern: urllib.request.URLopener(...).open("=~/[Ff][Tt][Pp]://.*/", ...)
      - patterns:
          - pattern-inside: |
              $OPENERDIRECTOR = urllib.request.URLopener(...)
              ...
          - pattern: $OPENERDIRECTOR.open("=~/[Ff][Tt][Pp]://.*/", ...)
      - patterns:
          - pattern-inside: |
              $OPENERDIRECTOR = urllib.request.URLopener(...)
              ...
          - pattern: |
              $URL = "=~/[Ff][Tt][Pp]://.*/"
              ...
              $OPENERDIRECTOR.open($URL, ...)
      - pattern: |
          $URL = "=~/[Ff][Tt][Pp]://.*/"
          ...
          urllib.request.URLopener(...).open($URL, ...)
      - patterns:
          - pattern-inside: |
              def $FUNC(..., $URL = "=~/[Ff][Tt][Pp]://.*/", ...):
                ...
          - pattern-either:
              - pattern: urllib.request.URLopener(...).open($URL, ...)
              - patterns:
                  - pattern-inside: |
                      $OPENERDIRECTOR = urllib.request.URLopener(...)
                      ...
                  - pattern: $OPENERDIRECTOR.open($URL, ...)
