rules:
  - id: ruby.jwt.security.audit.jwt-exposed-data.ruby-jwt-exposed-data
    message: >-
      The object is passed strictly to jsonwebtoken.sign(...) Make sure that
      sensitive information is not exposed through JWT token payload.
    severity: WARNING
    metadata:
      owasp:
        - A02:2017 - Broken Authentication
        - A04:2021 - Insecure Design
        - A06:2025 - Insecure Design
      cwe:
        - 'CWE-522: Insufficiently Protected Credentials'
      source-rule-url: >-
        https://semgrep.dev/blog/2020/hardcoded-secrets-unverified-tokens-and-other-common-jwt-mistakes/
      category: security
      technology:
        - jwt
      references:
        - https://owasp.org/Top10/A04_2021-Insecure_Design
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/ruby.jwt.security.audit.jwt-exposed-data.ruby-jwt-exposed-data
      shortlink: https://sg.run/B4Nb
      semgrep.dev:
        rule:
          r_id: 9707
          rv_id: 1263588
          rule_id: qNUoYd
          version_id: nWT2Lj6
          url: >-
            https://semgrep.dev/playground/r/nWT2Lj6/ruby.jwt.security.audit.jwt-exposed-data.ruby-jwt-exposed-data
          origin: community
    languages:
      - ruby
    patterns:
      - pattern-inside: |
          require 'jwt'
          ...
      - pattern-inside: |
          def $FUNC(...,$INPUT,...)
            ...
          end
      - pattern: |
          JWT.encode($INPUT,...)
