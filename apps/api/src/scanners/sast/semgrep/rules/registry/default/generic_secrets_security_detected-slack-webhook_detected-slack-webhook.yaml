rules:
  - id: generic.secrets.security.detected-slack-webhook.detected-slack-webhook
    patterns:
      - pattern-regex: >-
          https://hooks\.slack\.com/services/T[a-zA-Z0-9_]{8,10}/B[a-zA-Z0-9_]{8,10}/[a-zA-Z0-9_]{24}
      - pattern-not: >-
          https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX
    languages:
      - regex
    message: Slack Webhook detected
    severity: ERROR
    metadata:
      references:
        - https://api.slack.com/messaging/webhooks
      source-rule-url: >-
        https://github.com/dxa4481/truffleHogRegexes/blob/master/truffleHogRegexes/regexes.json
      category: security
      technology:
        - secrets
        - slack
      confidence: LOW
      owasp:
        - A07:2021 - Identification and Authentication Failures
        - A07:2025 - Authentication Failures
      cwe:
        - 'CWE-798: Use of Hard-coded Credentials'
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Hard-coded Secrets
      source: >-
        https://semgrep.dev/r/generic.secrets.security.detected-slack-webhook.detected-slack-webhook
      shortlink: https://sg.run/weWX
      semgrep.dev:
        rule:
          r_id: 9073
          rv_id: 1262892
          rule_id: gxU1dy
          version_id: 5PTo1oO
          url: >-
            https://semgrep.dev/playground/r/5PTo1oO/generic.secrets.security.detected-slack-webhook.detected-slack-webhook
          origin: community
