rules:
  - id: terraform.gcp.security.gcp-cloud-storage-logging.gcp-cloud-storage-logging
    patterns:
      - pattern: |
          resource "google_storage_bucket" $ANYTHING {
            ...
          }
      - pattern-not-inside: |
          resource "google_storage_bucket" $ANYTHING {
            ...
            logging {
                log_bucket = ...
            }          
            ...
          }
    message: Ensure bucket logs access.
    languages:
      - hcl
    severity: WARNING
    metadata:
      owasp:
        - A10:2017 - Insufficient Logging & Monitoring
        - A09:2021 - Security Logging and Monitoring Failures
        - A09:2025 - Security Logging & Alerting Failures
      cwe:
        - 'CWE-778: Insufficient Logging'
      technology:
        - terraform
        - gcp
      category: security
      references:
        - https://docs.bridgecrew.io/docs/google-cloud-policy-index
      subcategory:
        - vuln
      likelihood: LOW
      impact: LOW
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Insufficient Logging
      source: >-
        https://semgrep.dev/r/terraform.gcp.security.gcp-cloud-storage-logging.gcp-cloud-storage-logging
      shortlink: https://sg.run/5g5D
      semgrep.dev:
        rule:
          r_id: 32303
          rv_id: 1263813
          rule_id: gxUrdg
          version_id: JdTzxRN
          url: >-
            https://semgrep.dev/playground/r/JdTzxRN/terraform.gcp.security.gcp-cloud-storage-logging.gcp-cloud-storage-logging
          origin: community
