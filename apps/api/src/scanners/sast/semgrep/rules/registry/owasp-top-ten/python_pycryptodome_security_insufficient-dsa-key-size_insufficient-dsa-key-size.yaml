rules:
  - id: >-
      python.pycryptodome.security.insufficient-dsa-key-size.insufficient-dsa-key-size
    message: >-
      Detected an insufficient key size for DSA. NIST recommends a key size of
      2048 or higher.
    metadata:
      cwe:
        - 'CWE-326: Inadequate Encryption Strength'
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      source-rule-url: >-
        https://github.com/PyCQA/bandit/blob/b1411bfb43795d3ffd268bef17a839dee954c2b1/bandit/plugins/weak_cryptographic_key.py
      references:
        - https://www.pycryptodome.org/src/public_key/dsa
        - >-
          https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-57pt1r5.pdf
      category: security
      technology:
        - pycryptodome
      subcategory:
        - vuln
      likelihood: LOW
      impact: MEDIUM
      confidence: HIGH
      functional-categories:
        - crypto::search::key-length::pycryptodome
        - crypto::search::key-length::pycryptodomex
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/python.pycryptodome.security.insufficient-dsa-key-size.insufficient-dsa-key-size
      shortlink: https://sg.run/4y8l
      semgrep.dev:
        rule:
          r_id: 9688
          rv_id: 1263554
          rule_id: AbUWje
          version_id: JdTzxbQ
          url: >-
            https://semgrep.dev/playground/r/JdTzxbQ/python.pycryptodome.security.insufficient-dsa-key-size.insufficient-dsa-key-size
          origin: community
    options:
      symbolic_propagation: true
    languages:
      - python
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: Crypto.PublicKey.DSA.generate(..., bits=$SIZE, ...)
          - pattern: Crypto.PublicKey.DSA.generate($SIZE, ...)
          - pattern: Cryptodome.PublicKey.DSA.generate(..., bits=$SIZE, ...)
          - pattern: Cryptodome.PublicKey.DSA.generate($SIZE, ...)
      - metavariable-comparison:
          metavariable: $SIZE
          comparison: $SIZE < 2048
