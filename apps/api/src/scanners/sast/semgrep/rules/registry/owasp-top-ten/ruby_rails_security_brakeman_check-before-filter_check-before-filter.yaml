rules:
  - id: ruby.rails.security.brakeman.check-before-filter.check-before-filter
    mode: search
    patterns:
      - pattern-either:
          - pattern: |
              skip_filter ..., :except => $ARGS
          - pattern: |
              skip_before_filter ..., :except => $ARGS
          - pattern: |
              skip_before_action ..., :except => $ARGS
    message: >-
      Disabled-by-default Rails controller checks make it much easier to
      introduce access control mistakes. Prefer an allowlist approach with
      `:only => [...]` rather than `except: => [...]`
    languages:
      - ruby
    severity: ERROR
    metadata:
      source-rule-url: >-
        https://github.com/presidentbeef/brakeman/blob/main/lib/brakeman/checks/check_skip_before_filter.rb
      category: security
      cwe:
        - 'CWE-284: Improper Access Control'
      owasp:
        - A05:2017 - Broken Access Control
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      technology:
        - ruby
        - rails
      references:
        - https://owasp.org/Top10/A01_2021-Broken_Access_Control
      subcategory:
        - vuln
      impact: MEDIUM
      likelihood: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authorization
