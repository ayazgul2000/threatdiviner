rules:
  - id: python.requests.security.no-auth-over-http.no-auth-over-http
    fix-regex:
      regex: http:\/\/
      replacement: https://
      count: 1
    message: >-
      Authentication detected over HTTP. HTTP does not provide any encryption or
      protection for these authentication credentials. This may expose these
      credentials to unauthorized parties. Use 'https://' instead.
    metadata:
      cwe:
        - 'CWE-523: Unprotected Transport of Credentials'
      owasp:
        - A02:2017 - Broken Authentication
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      source-rule-url: https://pypi.org/project/flake8-flask/
      references:
        - https://semgrep.dev/blog/2020/bento-check-no-auth-over-http/
        - https://bento.dev/checks/requests/no-auth-over-http/
      category: security
      technology:
        - requests
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Mishandled Sensitive Information
      source: >-
        https://semgrep.dev/r/python.requests.security.no-auth-over-http.no-auth-over-http
      shortlink: https://sg.run/B4NW
      semgrep.dev:
        rule:
          r_id: 9695
          rv_id: 1263575
          rule_id: lBUdQZ
          version_id: 9lT4b2G
          url: >-
            https://semgrep.dev/playground/r/9lT4b2G/python.requests.security.no-auth-over-http.no-auth-over-http
          origin: community
    languages:
      - python
    severity: ERROR
    pattern-either:
      - pattern: requests.$W("=~/http:\/\/.*/", ..., auth=$X, ...)
      - pattern: |
          $URL = "=~/http:\/\/.../"
          ...
          requests.$W($URL, ..., auth=$X, ...)
