rules:
  - id: >-
      generic.secrets.security.detected-sonarqube-docs-api-key.detected-sonarqube-docs-api-key
    pattern-regex: (?i)sonar.{0,50}(\\\"|'|`)?[0-9a-f]{40}(\\\"|'|`)?
    languages:
      - regex
    message: SonarQube Docs API Key detected
    severity: ERROR
    paths:
      exclude:
        - '*.svg'
        - '*go.sum'
        - '*cargo.lock'
        - '*package.json'
        - '*yarn.lock'
        - '*package-lock.json'
        - '*bundle.js'
        - '*pnpm-lock*'
        - '*Podfile.lock'
        - '**/*/openssl/*.h'
        - '*.xcscmblueprint'
    metadata:
      cwe:
        - 'CWE-798: Use of Hard-coded Credentials'
      source-rule-url: >-
        https://github.com/grab/secret-scanner/blob/master/scanner/signatures/pattern.go
      category: security
      technology:
        - secrets
        - sonarqube
      confidence: LOW
      owasp:
        - A07:2021 - Identification and Authentication Failures
        - A07:2025 - Authentication Failures
      references:
        - >-
          https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Hard-coded Secrets
      source: >-
        https://semgrep.dev/r/generic.secrets.security.detected-sonarqube-docs-api-key.detected-sonarqube-docs-api-key
      shortlink: https://sg.run/x10P
      semgrep.dev:
        rule:
          r_id: 9074
          rv_id: 1262895
          rule_id: QrUzP1
          version_id: A8TgdgQ
          url: >-
            https://semgrep.dev/playground/r/A8TgdgQ/generic.secrets.security.detected-sonarqube-docs-api-key.detected-sonarqube-docs-api-key
          origin: community
