rules:
  - id: >-
      python.jinja2.security.audit.autoescape-disabled-false.incorrect-autoescape-disabled
    patterns:
      - pattern: jinja2.Environment(... , autoescape=$VAL, ...)
      - pattern-not: jinja2.Environment(... , autoescape=True, ...)
      - pattern-not: >-
          jinja2.Environment(... , autoescape=jinja2.select_autoescape(...),
          ...)
      - focus-metavariable: $VAL
    fix: |
      True
    message: >-
      Detected a Jinja2 environment with 'autoescaping' disabled. This is
      dangerous if you are rendering to a browser because this allows for
      cross-site scripting (XSS) attacks. If you are in a web context, enable
      'autoescaping' by setting 'autoescape=True.' You may also consider using
      'jinja2.select_autoescape()' to only enable automatic escaping for certain
      file extensions.
    metadata:
      source-rule-url: >-
        https://bandit.readthedocs.io/en/latest/plugins/b701_jinja2_autoescape_false.html
      cwe:
        - 'CWE-116: Improper Encoding or Escaping of Output'
      owasp:
        - A03:2021 - Injection
        - A05:2025 - Injection
      references:
        - https://jinja.palletsprojects.com/en/2.11.x/api/#basics
      category: security
      technology:
        - jinja2
      subcategory:
        - vuln
      likelihood: LOW
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Encoding
      source: >-
        https://semgrep.dev/r/python.jinja2.security.audit.autoescape-disabled-false.incorrect-autoescape-disabled
      shortlink: https://sg.run/L2L7
      semgrep.dev:
        rule:
          r_id: 20039
          rv_id: 1263448
          rule_id: QrU1Xg
          version_id: gETB7oN
          url: >-
            https://semgrep.dev/playground/r/gETB7oN/python.jinja2.security.audit.autoescape-disabled-false.incorrect-autoescape-disabled
          origin: community
    languages:
      - python
    severity: WARNING
