rules:
  - id: python.lang.security.deserialization.pickle.avoid-shelve
    metadata:
      owasp:
        - A08:2017 - Insecure Deserialization
        - A08:2021 - Software and Data Integrity Failures
        - A08:2025 - Software or Data Integrity Failures
      cwe:
        - 'CWE-502: Deserialization of Untrusted Data'
      references:
        - https://docs.python.org/3/library/pickle.html
      category: security
      technology:
        - python
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - 'Insecure Deserialization '
      source: >-
        https://semgrep.dev/r/python.lang.security.deserialization.pickle.avoid-shelve
      shortlink: https://sg.run/dKkZ
      semgrep.dev:
        rule:
          r_id: 9678
          rv_id: 1263535
          rule_id: 8GUje2
          version_id: NdTzyb4
          url: >-
            https://semgrep.dev/playground/r/NdTzyb4/python.lang.security.deserialization.pickle.avoid-shelve
          origin: community
    languages:
      - python
    message: >-
      Avoid using `shelve`, which uses `pickle`, which is known to lead to code
      execution vulnerabilities. When unpickling, the serialized data could be
      manipulated to run arbitrary code. Instead, consider serializing the
      relevant data as JSON or a similar text-based serialization format.
    severity: WARNING
    pattern: shelve.$FUNC(...)
