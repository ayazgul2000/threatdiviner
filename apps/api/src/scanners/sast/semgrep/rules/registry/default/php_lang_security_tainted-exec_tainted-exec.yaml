rules:
  - id: php.lang.security.tainted-exec.tainted-exec
    mode: taint
    pattern-sources:
      - pattern: $_REQUEST
      - pattern: $_GET
      - pattern: $_POST
      - pattern: $_COOKIE
    pattern-sinks:
      - pattern: exec(...)
      - pattern: system(...)
      - pattern: popen(...)
      - pattern: passthru(...)
      - pattern: shell_exec(...)
      - pattern: pcntl_exec(...)
      - pattern: proc_open(...)
    pattern-sanitizers:
      - pattern: escapeshellarg(...)
    message: >-
      Executing non-constant commands. This can lead to command injection. You
      should use `escapeshellarg()` when using command.
    metadata:
      cwe:
        - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
      references:
        - https://www.stackhawk.com/blog/php-command-injection/
        - https://brightsec.com/blog/code-injection-php/
        - https://www.acunetix.com/websitesecurity/php-security-2/
      category: security
      technology:
        - php
      owasp:
        - A03:2021 - Injection
        - A05:2025 - Injection
      cwe2022-top25: true
      subcategory:
        - vuln
      likelihood: HIGH
      impact: HIGH
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Code Injection
      source: https://semgrep.dev/r/php.lang.security.tainted-exec.tainted-exec
      shortlink: https://sg.run/JAkP
      semgrep.dev:
        rule:
          r_id: 73146
          rv_id: 1263300
          rule_id: 9AUw06
          version_id: BjTkZ4y
          url: >-
            https://semgrep.dev/playground/r/BjTkZ4y/php.lang.security.tainted-exec.tainted-exec
          origin: community
    languages:
      - php
    severity: ERROR
