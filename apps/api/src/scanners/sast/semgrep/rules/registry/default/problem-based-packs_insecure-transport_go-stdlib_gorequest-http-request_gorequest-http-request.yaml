rules:
  - id: >-
      problem-based-packs.insecure-transport.go-stdlib.gorequest-http-request.gorequest-http-request
    message: >-
      Checks for requests to http (unencrypted) sites using gorequest, a popular
      HTTP client library. This is dangerous because it could result in
      plaintext PII being passed around the network.
    severity: WARNING
    metadata:
      likelihood: HIGH
      impact: MEDIUM
      confidence: MEDIUM
      category: security
      cwe: 'CWE-319: Cleartext Transmission of Sensitive Information'
      owasp: A03:2017 - Sensitive Data Exposure
      references:
        - https://github.com/parnurzeal/gorequest
      subcategory:
        - vuln
      technology:
        - gorequest
      vulnerability: Insecure Transport
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Mishandled Sensitive Information
      source: >-
        https://semgrep.dev/r/problem-based-packs.insecure-transport.go-stdlib.gorequest-http-request.gorequest-http-request
      shortlink: https://sg.run/5Q10
      semgrep.dev:
        rule:
          r_id: 9403
          rv_id: 946046
          rule_id: KxUbXx
          version_id: 7ZTrQdD
          url: >-
            https://semgrep.dev/playground/r/7ZTrQdD/problem-based-packs.insecure-transport.go-stdlib.gorequest-http-request.gorequest-http-request
          origin: community
    languages:
      - go
    pattern-either:
      - patterns:
          - pattern-inside: |
              $REQ = gorequest.New()
              ...
              $RES = ...
          - pattern: |
              $REQ.$FUNC("=~/[hH][tT][tT][pP]://.*/")
          - metavariable-regex:
              metavariable: $FUNC
              regex: (Get|Post|Delete|Head|Put|Patch)
      - patterns:
          - pattern: gorequest.New().$FUNC("=~/[hH][tT][tT][pP]://.*/")
          - metavariable-regex:
              metavariable: $FUNC
              regex: (Get|Post|Delete|Head|Put|Patch)
