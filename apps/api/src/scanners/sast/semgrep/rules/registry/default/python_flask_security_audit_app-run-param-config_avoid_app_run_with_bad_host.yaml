rules:
  - id: >-
      python.flask.security.audit.app-run-param-config.avoid_app_run_with_bad_host
    message: Running flask app with host 0.0.0.0 could expose the server publicly.
    metadata:
      cwe:
        - 'CWE-668: Exposure of Resource to Wrong Sphere'
      owasp:
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      category: security
      technology:
        - flask
      references:
        - https://owasp.org/Top10/A01_2021-Broken_Access_Control
      subcategory:
        - vuln
      likelihood: HIGH
      impact: MEDIUM
      confidence: HIGH
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Other
      source: >-
        https://semgrep.dev/r/python.flask.security.audit.app-run-param-config.avoid_app_run_with_bad_host
      shortlink: https://sg.run/eLby
      semgrep.dev:
        rule:
          r_id: 9532
          rv_id: 1263414
          rule_id: L1Uy1n
          version_id: BjTkZOY
          url: >-
            https://semgrep.dev/playground/r/BjTkZOY/python.flask.security.audit.app-run-param-config.avoid_app_run_with_bad_host
          origin: community
    languages:
      - python
    severity: WARNING
    pattern-either:
      - pattern: app.run(..., host="0.0.0.0", ...)
      - pattern: app.run(..., "0.0.0.0", ...)
