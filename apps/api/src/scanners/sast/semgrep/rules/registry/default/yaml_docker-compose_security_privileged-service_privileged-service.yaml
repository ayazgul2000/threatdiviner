rules:
  - id: yaml.docker-compose.security.privileged-service.privileged-service
    patterns:
      - pattern-inside: |
          version: ...
          ...
          services:
            ...
            $SERVICE:
              ...
              privileged: $TRUE
      - focus-metavariable: $TRUE
      - metavariable-regex:
          metavariable: $TRUE
          regex: (true)
    fix: |
      false
    message: >-
      Service '$SERVICE' is running in privileged mode. This grants the
      container the equivalent of root capabilities on the host machine. This
      can lead to container escapes, privilege escalation, and other security
      concerns. Remove the 'privileged' key to disable this capability.
    metadata:
      cwe:
        - 'CWE-250: Execution with Unnecessary Privileges'
      owasp:
        - A06:2017 - Security Misconfiguration
        - A05:2021 - Security Misconfiguration
        - A02:2025 - Security Misconfiguration
      references:
        - >-
          https://www.trendmicro.com/en_us/research/19/l/why-running-a-privileged-container-in-docker-is-a-bad-idea.html
        - >-
          https://containerjournal.com/topics/container-security/why-running-a-privileged-container-is-not-a-good-idea/
      category: security
      technology:
        - docker-compose
      subcategory:
        - vuln
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authorization
      source: >-
        https://semgrep.dev/r/yaml.docker-compose.security.privileged-service.privileged-service
      shortlink: https://sg.run/AlX0
      semgrep.dev:
        rule:
          r_id: 10006
          rv_id: 1263922
          rule_id: DbUW17
          version_id: 0bTKzXZ
          url: >-
            https://semgrep.dev/playground/r/0bTKzXZ/yaml.docker-compose.security.privileged-service.privileged-service
          origin: community
    languages:
      - yaml
    severity: WARNING
