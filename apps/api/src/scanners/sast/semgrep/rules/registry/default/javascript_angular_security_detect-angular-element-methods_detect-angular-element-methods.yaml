rules:
  - id: >-
      javascript.angular.security.detect-angular-element-methods.detect-angular-element-methods
    message: >-
      Use of angular.element can lead to XSS if user-input is treated as part of
      the HTML element within `$SINK`. It is recommended to contextually output
      encode user-input, before inserting into `$SINK`. If the HTML needs to be
      preserved it is recommended to sanitize the input using
      $sce.getTrustedHTML or $sanitize.
    metadata:
      confidence: LOW
      references:
        - https://docs.angularjs.org/api/ng/function/angular.element
        - >-
          https://owasp.org/www-chapter-london/assets/slides/OWASPLondon20170727_AngularJS.pdf
      category: security
      cwe:
        - >-
          CWE-79: Improper Neutralization of Input During Web Page Generation
          ('Cross-site Scripting')
      technology:
        - angularjs
      owasp:
        - A07:2017 - Cross-Site Scripting (XSS)
        - A03:2021 - Injection
        - A05:2025 - Injection
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: LOW
      impact: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cross-Site-Scripting (XSS)
      source: >-
        https://semgrep.dev/r/javascript.angular.security.detect-angular-element-methods.detect-angular-element-methods
      shortlink: https://sg.run/ydnO
      semgrep.dev:
        rule:
          r_id: 9224
          rv_id: 1263090
          rule_id: d8Ujdo
          version_id: 3ZT4Xbz
          url: >-
            https://semgrep.dev/playground/r/3ZT4Xbz/javascript.angular.security.detect-angular-element-methods.detect-angular-element-methods
          origin: community
    languages:
      - javascript
      - typescript
    severity: INFO
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      function(..., $SCOPE, ...) { ... }
                  - focus-metavariable: $SCOPE
                  - metavariable-regex:
                      metavariable: $SCOPE
                      regex: ^\$scope$
              - pattern: $rootScope
              - pattern: $injector.get('$rootScope')
              - pattern: $injector.get('$scope')
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  angular.element(...). ... .$SINK($QUERY)
              - pattern-inside: |
                  $ANGULAR = angular.element(...)
                  ...
                  $ANGULAR. ... .$SINK($QUERY)
          - metavariable-regex:
              metavariable: $SINK
              regex: ^(after|append|html|prepend|replaceWith|wrap)$
          - focus-metavariable: $QUERY
    pattern-sanitizers:
      - patterns:
          - pattern-either:
              - pattern: $sce.getTrustedHtml(...)
              - pattern: $sanitize(...)
              - pattern: DOMPurify.sanitize(...)
