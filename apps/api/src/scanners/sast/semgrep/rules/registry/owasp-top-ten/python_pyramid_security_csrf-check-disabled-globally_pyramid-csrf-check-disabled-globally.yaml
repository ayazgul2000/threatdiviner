rules:
  - id: >-
      python.pyramid.security.csrf-check-disabled-globally.pyramid-csrf-check-disabled-globally
    patterns:
      - pattern-inside: |
          $CONFIG.set_default_csrf_options(..., require_csrf=$REQUIRE_CSRF, ...)
      - pattern: $REQUIRE_CSRF
      - metavariable-comparison:
          metavariable: $REQUIRE_CSRF
          comparison: $REQUIRE_CSRF == False
    message: >-
      Automatic check of cross-site request forgery tokens has been explicitly
      disabled globally, which might leave views unprotected. Use
      'pyramid.config.Configurator.set_default_csrf_options(require_csrf=True)'
      to turn the automatic check for all unsafe methods (per RFC2616).
    languages:
      - python
    severity: ERROR
    fix: |
      True
    metadata:
      cwe:
        - 'CWE-352: Cross-Site Request Forgery (CSRF)'
      owasp:
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      category: security
      technology:
        - pyramid
      references:
        - https://owasp.org/Top10/A01_2021-Broken_Access_Control
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: LOW
      impact: LOW
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cross-Site Request Forgery (CSRF)
      source: >-
        https://semgrep.dev/r/python.pyramid.security.csrf-check-disabled-globally.pyramid-csrf-check-disabled-globally
      shortlink: https://sg.run/Bx2R
      semgrep.dev:
        rule:
          r_id: 21451
          rv_id: 1263571
          rule_id: 8GUKqP
          version_id: 2KTv2en
          url: >-
            https://semgrep.dev/playground/r/2KTv2en/python.pyramid.security.csrf-check-disabled-globally.pyramid-csrf-check-disabled-globally
          origin: community
