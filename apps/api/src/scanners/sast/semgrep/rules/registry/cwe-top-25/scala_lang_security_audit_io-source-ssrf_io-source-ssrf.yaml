rules:
  - id: scala.lang.security.audit.io-source-ssrf.io-source-ssrf
    patterns:
      - pattern-either:
          - pattern: Source.fromURL($URL,...)
          - pattern: Source.fromURI($URL,...)
      - pattern-inside: |
          import scala.io.$SOURCE
          ...
      - pattern-either:
          - pattern-inside: |
              def $FUNC(..., $URL: $T, ...) = $A {
                ...
              }
          - pattern-inside: |
              def $FUNC(..., $URL: $T, ...) = {
                ...
              }
    message: >-
      A parameter being passed directly into `fromURL` most likely lead to SSRF.
      This could allow an attacker to send data to their own server, potentially
      exposing sensitive data sent with this request. They could also probe
      internal servers or other resources that the server running this code can
      access. Do not allow arbitrary hosts. Instead, create an allowlist for
      approved hosts, or hardcode the correct host.
    metadata:
      cwe:
        - 'CWE-918: Server-Side Request Forgery (SSRF)'
      owasp:
        - A10:2021 - Server-Side Request Forgery (SSRF)
        - A01:2025 - Broken Access Control
      references:
        - >-
          https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
        - >-
          https://www.scala-lang.org/api/current/scala/io/Source$.html#fromURL(url:java.net.URL)(implicitcodec:scala.io.Codec):scala.io.BufferedSource
      category: security
      technology:
        - scala
      confidence: MEDIUM
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: HIGH
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Server-Side Request Forgery (SSRF)
      source: >-
        https://semgrep.dev/r/scala.lang.security.audit.io-source-ssrf.io-source-ssrf
      shortlink: https://sg.run/Qbz4
      semgrep.dev:
        rule:
          r_id: 18486
          rv_id: 1263675
          rule_id: GdUDOZ
          version_id: 1QTypG9
          url: >-
            https://semgrep.dev/playground/r/1QTypG9/scala.lang.security.audit.io-source-ssrf.io-source-ssrf
          origin: community
    languages:
      - scala
    severity: WARNING
