rules:
  - id: java.lang.security.audit.insecure-smtp-connection.insecure-smtp-connection
    metadata:
      cwe:
        - 'CWE-297: Improper Validation of Certificate with Host Mismatch'
      owasp:
        - A07:2021 - Identification and Authentication Failures
        - A07:2025 - Authentication Failures
      source-rule-url: https://find-sec-bugs.github.io/bugs.htm#INSECURE_SMTP_SSL
      category: security
      technology:
        - java
      references:
        - >-
          https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures
      subcategory:
        - vuln
      likelihood: LOW
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authentication
      source: >-
        https://semgrep.dev/r/java.lang.security.audit.insecure-smtp-connection.insecure-smtp-connection
      shortlink: https://sg.run/vzN4
      semgrep.dev:
        rule:
          r_id: 9177
          rv_id: 1263024
          rule_id: 4bUkrW
          version_id: jQTn5Dv
          url: >-
            https://semgrep.dev/playground/r/jQTn5Dv/java.lang.security.audit.insecure-smtp-connection.insecure-smtp-connection
          origin: community
    message: >-
      Insecure SMTP connection detected. This connection will trust any SSL
      certificate. Enable certificate verification by setting
      'email.setSSLCheckServerIdentity(true)'.
    severity: WARNING
    patterns:
      - pattern-not-inside: |
          $EMAIL.setSSLCheckServerIdentity(true);
          ...
      - pattern-inside: |
          $EMAIL = new SimpleEmail(...);
          ...
      - pattern: $EMAIL.send(...);
    languages:
      - java
