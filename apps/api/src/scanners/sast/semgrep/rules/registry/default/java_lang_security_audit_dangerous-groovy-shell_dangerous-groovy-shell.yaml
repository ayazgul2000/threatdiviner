rules:
  - id: java.lang.security.audit.dangerous-groovy-shell.dangerous-groovy-shell
    patterns:
      - pattern-either:
          - pattern: |
              $SHELL.parse(...)
          - pattern: |
              $SHELL.evaluate(...)
          - pattern: |
              $SHELL.parseClass(...)
      - pattern-either:
          - pattern-inside: |
              groovy.lang.GroovyShell $SHELL = ...;
              ...
          - pattern-inside: |
              groovy.lang.GroovyClassLoader $SHELL = ...;
              ...
      - pattern-not: |
          $SHELL.parse("...",...)
      - pattern-not: |
          $SHELL.evaluate("...",...)
      - pattern-not: |
          $SHELL.parseClass("...",...)
    message: >-
      A expression is built with a dynamic value. The source of the value(s)
      should be verified to avoid that unfiltered values fall into this risky
      code evaluation.
    metadata:
      cwe:
        - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
      owasp:
        - A03:2021 - Injection
        - A05:2025 - Injection
      source-rule-url: https://find-sec-bugs.github.io/bugs.htm#GROOVY_SHELL
      category: security
      technology:
        - groovy
      references:
        - https://owasp.org/Top10/A03_2021-Injection
      cwe2022-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Code Injection
      source: >-
        https://semgrep.dev/r/java.lang.security.audit.dangerous-groovy-shell.dangerous-groovy-shell
      shortlink: https://sg.run/58LK
      semgrep.dev:
        rule:
          r_id: 10091
          rv_id: 1263020
          rule_id: ReUPKp
          version_id: zyTb2Nq
          url: >-
            https://semgrep.dev/playground/r/zyTb2Nq/java.lang.security.audit.dangerous-groovy-shell.dangerous-groovy-shell
          origin: community
    languages:
      - java
    severity: WARNING
