rules:
  - id: >-
      python.pycryptodome.security.mode-without-authentication.crypto-mode-without-authentication
    message: >-
      An encryption mode of operation is being used without proper message
      authentication. This can potentially result in the encrypted content to be
      decrypted by an attacker. Consider instead use an AEAD mode of operation
      like GCM. 
    languages:
      - python
    severity: ERROR
    metadata:
      category: security
      technology:
        - cryptography
      cwe:
        - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      references:
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
      subcategory:
        - vuln
      likelihood: LOW
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/python.pycryptodome.security.mode-without-authentication.crypto-mode-without-authentication
      shortlink: https://sg.run/k1K1
      semgrep.dev:
        rule:
          r_id: 31872
          rv_id: 1263556
          rule_id: YGUw8w
          version_id: GxTkeyz
          url: >-
            https://semgrep.dev/playground/r/GxTkeyz/python.pycryptodome.security.mode-without-authentication.crypto-mode-without-authentication
          origin: community
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: |
                      AES.new(..., $PYCRYPTODOME_MODE)
              - pattern-not-inside: |
                  AES.new(..., $PYCRYPTODOME_MODE)
                  ...
                  HMAC.new
              - metavariable-pattern:
                  metavariable: $PYCRYPTODOME_MODE
                  patterns:
                    - pattern-either:
                        - pattern: AES.MODE_CBC
                        - pattern: AES.MODE_CTR
                        - pattern: AES.MODE_CFB
                        - pattern: AES.MODE_OFB
