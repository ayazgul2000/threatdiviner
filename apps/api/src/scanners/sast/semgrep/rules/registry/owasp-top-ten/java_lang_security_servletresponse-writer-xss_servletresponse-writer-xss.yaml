rules:
  - id: java.lang.security.servletresponse-writer-xss.servletresponse-writer-xss
    message: >-
      Cross-site scripting detected in HttpServletResponse writer with variable
      '$VAR'. User input was detected going directly from the HttpServletRequest
      into output. Ensure your data is properly encoded using
      org.owasp.encoder.Encode.forHtml: 'Encode.forHtml($VAR)'.
    metadata:
      cwe:
        - >-
          CWE-79: Improper Neutralization of Input During Web Page Generation
          ('Cross-site Scripting')
      owasp:
        - A07:2017 - Cross-Site Scripting (XSS)
        - A03:2021 - Injection
        - A05:2025 - Injection
      source-rule-url: https://find-sec-bugs.github.io/bugs.htm#XSS_SERVLET
      category: security
      technology:
        - java
      references:
        - https://owasp.org/Top10/A03_2021-Injection
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cross-Site-Scripting (XSS)
      source: >-
        https://semgrep.dev/r/java.lang.security.servletresponse-writer-xss.servletresponse-writer-xss
      shortlink: https://sg.run/pxjN
      semgrep.dev:
        rule:
          r_id: 9162
          rv_id: 1263066
          rule_id: wdUJOk
          version_id: 2KTv2EG
          url: >-
            https://semgrep.dev/playground/r/2KTv2EG/java.lang.security.servletresponse-writer-xss.servletresponse-writer-xss
          origin: community
    severity: ERROR
    patterns:
      - pattern-inside: $TYPE $FUNC(..., HttpServletResponse $RESP, ...) { ... }
      - pattern-inside: $VAR = $REQ.getParameter(...); ...
      - pattern-either:
          - pattern: $RESP.getWriter(...).write(..., $VAR, ...);
          - pattern: |
              $WRITER = $RESP.getWriter(...);
              ...
              $WRITER.write(..., $VAR, ...);
    languages:
      - java
