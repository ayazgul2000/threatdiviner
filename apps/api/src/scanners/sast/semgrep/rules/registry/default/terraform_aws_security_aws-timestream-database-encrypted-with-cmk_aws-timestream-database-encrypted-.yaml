rules:
  - id: >-
      terraform.aws.security.aws-timestream-database-encrypted-with-cmk.aws-timestream-database-encrypted-with-cmk
    patterns:
      - pattern: |
          resource "aws_timestreamwrite_database" $ANYTHING {
            ...
          }
      - pattern-not-inside: |
          resource "aws_timestreamwrite_database" $ANYTHING {
            ...
            kms_key_id = ...
            ...
          }
    message: >-
      Ensure Timestream database is encrypted at rest using KMS CMKs. CMKs gives
      you control over the encryption key in terms of access and rotation.
    metadata:
      category: security
      technology:
        - terraform
        - aws
      owasp:
        - A03:2017 - Sensitive Data Exposure
      cwe:
        - 'CWE-320: CWE CATEGORY: Key Management Errors'
      references:
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/terraform.aws.security.aws-timestream-database-encrypted-with-cmk.aws-timestream-database-encrypted-with-cmk
      shortlink: https://sg.run/7nyZ
      semgrep.dev:
        rule:
          r_id: 17382
          rv_id: 946731
          rule_id: KxU5Nn
          version_id: o5TZzX3
          url: >-
            https://semgrep.dev/playground/r/o5TZzX3/terraform.aws.security.aws-timestream-database-encrypted-with-cmk.aws-timestream-database-encrypted-with-cmk
          origin: community
    languages:
      - hcl
    severity: WARNING
