rules:
  - id: javascript.lang.security.detect-pseudorandombytes.detect-pseudoRandomBytes
    message: >-
      Detected usage of crypto.pseudoRandomBytes, which does not produce secure
      random numbers.
    metadata:
      cwe:
        - >-
          CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator
          (PRNG)
      owasp:
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      source-rule-url: >-
        https://github.com/nodesecurity/eslint-plugin-security/blob/master/rules/detect-pseudoRandomBytes.js
      asvs:
        section: 'V6: Stored Cryptography Verification Requirements'
        control_id: 6.3.1 Insecure Randomness
        control_url: >-
          https://github.com/OWASP/ASVS/blob/master/4.0/en/0x14-V6-Cryptography.md#v63-random-values
        version: '4'
      category: security
      technology:
        - javascript
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      references:
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/javascript.lang.security.detect-pseudorandombytes.detect-pseudoRandomBytes
      shortlink: https://sg.run/pxze
      semgrep.dev:
        rule:
          r_id: 9318
          rv_id: 1263217
          rule_id: NbUkR2
          version_id: qkTR799
          url: >-
            https://semgrep.dev/playground/r/qkTR799/javascript.lang.security.detect-pseudorandombytes.detect-pseudoRandomBytes
          origin: community
    languages:
      - javascript
      - typescript
    severity: WARNING
    pattern: crypto.pseudoRandomBytes
