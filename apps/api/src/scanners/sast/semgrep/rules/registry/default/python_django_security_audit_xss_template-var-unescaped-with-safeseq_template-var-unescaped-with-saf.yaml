rules:
  - id: >-
      python.django.security.audit.xss.template-var-unescaped-with-safeseq.template-var-unescaped-with-safeseq
    message: >-
      Detected a template variable where autoescaping is explicitly disabled
      with '| safeseq' filter. This allows rendering of raw HTML in this
      segment. Ensure no user data is rendered here, otherwise this is a
      cross-site scripting (XSS) vulnerability. If you must do this, use
      `mark_safe` in your Python code.
    metadata:
      cwe:
        - >-
          CWE-79: Improper Neutralization of Input During Web Page Generation
          ('Cross-site Scripting')
      owasp:
        - A07:2017 - Cross-Site Scripting (XSS)
        - A03:2021 - Injection
        - A05:2025 - Injection
      references:
        - https://docs.djangoproject.com/en/3.0/ref/templates/builtins/#safeseq
      category: security
      technology:
        - django
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cross-Site-Scripting (XSS)
      source: >-
        https://semgrep.dev/r/python.django.security.audit.xss.template-var-unescaped-with-safeseq.template-var-unescaped-with-safeseq
      shortlink: https://sg.run/5Q30
      semgrep.dev:
        rule:
          r_id: 9491
          rv_id: 1263380
          rule_id: KxUbdx
          version_id: xyTjzyG
          url: >-
            https://semgrep.dev/playground/r/xyTjzyG/python.django.security.audit.xss.template-var-unescaped-with-safeseq.template-var-unescaped-with-safeseq
          origin: community
    languages:
      - regex
    paths:
      include:
        - '*.html'
    severity: WARNING
    pattern-regex: '{{.*?\|\s+safeseq(\s+}})?'
