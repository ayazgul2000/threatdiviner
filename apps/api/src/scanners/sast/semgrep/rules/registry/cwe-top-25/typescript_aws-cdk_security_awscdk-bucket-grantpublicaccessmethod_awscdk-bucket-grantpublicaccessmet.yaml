rules:
  - id: >-
      typescript.aws-cdk.security.awscdk-bucket-grantpublicaccessmethod.awscdk-bucket-grantpublicaccessmethod
    message: >-
      Using the GrantPublicAccess method on bucket contruct $X will make the
      objects in the bucket world accessible. Verify if this is intentional.
    metadata:
      cwe:
        - 'CWE-306: Missing Authentication for Critical Function'
      category: security
      technology:
        - AWS-CDK
      references:
        - >-
          https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-overview.html
      owasp:
        - A07:2021 - Identification and Authentication Failures
        - A07:2025 - Authentication Failures
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: HIGH
      impact: HIGH
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authentication
      source: >-
        https://semgrep.dev/r/typescript.aws-cdk.security.awscdk-bucket-grantpublicaccessmethod.awscdk-bucket-grantpublicaccessmethod
      shortlink: https://sg.run/Z4p7
      semgrep.dev:
        rule:
          r_id: 15279
          rv_id: 1263906
          rule_id: wdUjZK
          version_id: BjTkZA7
          url: >-
            https://semgrep.dev/playground/r/BjTkZA7/typescript.aws-cdk.security.awscdk-bucket-grantpublicaccessmethod.awscdk-bucket-grantpublicaccessmethod
          origin: community
    languages:
      - ts
    severity: WARNING
    pattern-either:
      - patterns:
          - pattern-inside: |
              import {Bucket} from '@aws-cdk/aws-s3'
              ...
          - pattern: |
              const $X = new Bucket(...)
              ...
              $X.grantPublicAccess(...)
      - patterns:
          - pattern-inside: |
              import * as $Y from '@aws-cdk/aws-s3'
              ...
          - pattern: |
              const $X = new $Y.Bucket(...)
              ...
              $X.grantPublicAccess(...)
