rules:
  - id: >-
      javascript.browser.security.insecure-document-method.insecure-document-method
    message: >-
      User controlled data in methods like `innerHTML`, `outerHTML` or
      `document.write` is an anti-pattern that can lead to XSS vulnerabilities
    metadata:
      cwe:
        - >-
          CWE-79: Improper Neutralization of Input During Web Page Generation
          ('Cross-site Scripting')
      owasp:
        - A07:2017 - Cross-Site Scripting (XSS)
        - A03:2021 - Injection
        - A05:2025 - Injection
      category: security
      technology:
        - browser
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      references:
        - https://owasp.org/Top10/A03_2021-Injection
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cross-Site-Scripting (XSS)
      source: >-
        https://semgrep.dev/r/javascript.browser.security.insecure-document-method.insecure-document-method
      shortlink: https://sg.run/LwA9
      semgrep.dev:
        rule:
          r_id: 9239
          rv_id: 1263118
          rule_id: ReUg41
          version_id: YDTZeOY
          url: >-
            https://semgrep.dev/playground/r/YDTZeOY/javascript.browser.security.insecure-document-method.insecure-document-method
          origin: community
    languages:
      - javascript
      - typescript
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: |
              $EL.innerHTML = $HTML;
          - pattern: |
              $EL.outerHTML = $HTML;
          - pattern: document.write(...)
      - pattern-not: |
          $EL.innerHTML = "...";
      - pattern-not: |
          $EL.outerHTML = "...";
      - pattern-not: document.write("...")
