rules:
  - id: >-
      go.grpc.security.grpc-server-insecure-connection.grpc-server-insecure-connection
    metadata:
      cwe:
        - 'CWE-300: Channel Accessible by Non-Endpoint'
      references:
        - >-
          https://blog.gopheracademy.com/advent-2019/go-grps-and-tls/#connection-without-encryption
      category: security
      technology:
        - grpc
      confidence: HIGH
      owasp:
        - A07:2021 - Identification and Authentication Failures
        - A07:2025 - Authentication Failures
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Other
      source: >-
        https://semgrep.dev/r/go.grpc.security.grpc-server-insecure-connection.grpc-server-insecure-connection
      shortlink: https://sg.run/5Q5l
      semgrep.dev:
        rule:
          r_id: 9091
          rv_id: 1262917
          rule_id: JDUy0B
          version_id: 6xT2923
          url: >-
            https://semgrep.dev/playground/r/6xT2923/go.grpc.security.grpc-server-insecure-connection.grpc-server-insecure-connection
          origin: community
    message: >-
      Found an insecure gRPC server without 'grpc.Creds()' or options with
      credentials. This allows for a connection without encryption to this
      server. A malicious attacker could tamper with the gRPC message, which
      could compromise the machine. Include credentials derived from an SSL
      certificate in order to create a secure gRPC connection. You can create
      credentials using 'credentials.NewServerTLSFromFile("cert.pem",
      "cert.key")'.
    languages:
      - go
    severity: ERROR
    mode: taint
    pattern-sinks:
      - requires: OPTIONS and not CREDS
        pattern: grpc.NewServer($OPT, ...)
      - requires: EMPTY_CONSTRUCTOR
        pattern: grpc.NewServer()
    pattern-sources:
      - label: OPTIONS
        pattern: grpc.ServerOption{ ... }
      - label: CREDS
        pattern: grpc.Creds(...)
      - label: EMPTY_CONSTRUCTOR
        pattern: grpc.NewServer()
