rules:
  - id: python.lang.security.audit.eval-detected.eval-detected
    patterns:
      - pattern-not: eval(f"")
      - pattern-not: eval("...")
      - pattern: eval(...)
    message: >-
      Detected the use of eval(). eval() can be dangerous if used to evaluate
      dynamic content. If this content can be input from outside the program,
      this may be a code injection vulnerability. Ensure evaluated content is
      not definable by external sources.
    metadata:
      source-rule-url: >-
        https://bandit.readthedocs.io/en/latest/blacklists/blacklist_calls.html#b307-eval
      cwe:
        - >-
          CWE-95: Improper Neutralization of Directives in Dynamically Evaluated
          Code ('Eval Injection')
      owasp:
        - A03:2021 - Injection
        - A05:2025 - Injection
      asvs:
        section: 'V5: Validation, Sanitization and Encoding Verification Requirements'
        control_id: 5.2.4 Dyanmic Code Execution Features
        control_url: >-
          https://github.com/OWASP/ASVS/blob/master/4.0/en/0x13-V5-Validation-Sanitization-Encoding.md#v52-sanitization-and-sandboxing-requirements
        version: '4'
      category: security
      technology:
        - python
      references:
        - https://owasp.org/Top10/A03_2021-Injection
      subcategory:
        - audit
      likelihood: LOW
      impact: HIGH
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Code Injection
      source: >-
        https://semgrep.dev/r/python.lang.security.audit.eval-detected.eval-detected
      shortlink: https://sg.run/ZvrD
      semgrep.dev:
        rule:
          r_id: 9635
          rv_id: 1263477
          rule_id: gxU149
          version_id: bZT537Q
          url: >-
            https://semgrep.dev/playground/r/bZT537Q/python.lang.security.audit.eval-detected.eval-detected
          origin: community
    languages:
      - python
    severity: WARNING
