rules:
  - id: >-
      terraform.azure.security.appservice.appservice-require-client-cert.appservice-require-client-cert
    message: >-
      Detected an AppService that was not configured to use a client
      certificate. Add `client_cert_enabled = true` in your resource block.
    patterns:
      - pattern: resource
      - pattern-not-inside: |
          resource "azurerm_app_service" "..." {
          ...
            client_cert_enabled = true
          ...
          }
      - pattern-either:
          - pattern-inside: |
              resource "azurerm_app_service" "..." {
              ...
              }
          - pattern-inside: |
              resource "azurerm_app_service" "..." {
              ...
                client_cert_enabled = false
              ...
              }
    metadata:
      cwe:
        - 'CWE-295: Improper Certificate Validation'
      category: security
      technology:
        - terraform
        - azure
      references:
        - >-
          https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/app_service#client_cert_enabled
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A07:2021 - Identification and Authentication Failures
        - A07:2025 - Authentication Failures
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authentication
      source: >-
        https://semgrep.dev/r/terraform.azure.security.appservice.appservice-require-client-cert.appservice-require-client-cert
      shortlink: https://sg.run/RX1O
      semgrep.dev:
        rule:
          r_id: 15105
          rv_id: 1263758
          rule_id: lBU8D6
          version_id: GxTkedE
          url: >-
            https://semgrep.dev/playground/r/GxTkedE/terraform.azure.security.appservice.appservice-require-client-cert.appservice-require-client-cert
          origin: community
    languages:
      - hcl
    severity: INFO
