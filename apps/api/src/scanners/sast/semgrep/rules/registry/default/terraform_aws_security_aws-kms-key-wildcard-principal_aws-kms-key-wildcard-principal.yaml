rules:
  - id: >-
      terraform.aws.security.aws-kms-key-wildcard-principal.aws-kms-key-wildcard-principal
    patterns:
      - pattern-inside: |
          resource "aws_kms_key" $ANYTHING {
            ...
          }
      - pattern: policy = "$STATEMENT"
      - metavariable-pattern:
          metavariable: $STATEMENT
          language: json
          patterns:
            - pattern-not-inside: |
                {..., "Effect": "Deny", ...}
            - pattern-either:
                - pattern: >
                    {..., "Principal": "*", "Action": "kms:*", "Resource": "*",
                    ...}
                - pattern: >
                    {..., "Principal": [..., "*", ...], "Action": "kms:*",
                    "Resource": "*", ...}
                - pattern: >
                    {..., "Principal": { "AWS": "*" }, "Action": "kms:*",
                    "Resource": "*", ...}
                - pattern: >
                    {..., "Principal": { "AWS": [..., "*", ...] }, "Action":
                    "kms:*", "Resource": "*", ...}
    message: >-
      Detected wildcard access granted in your KMS key. This means anyone with
      this policy can perform administrative actions over the keys. Instead,
      limit principals, actions and resources to what you need according to
      least privilege.
    metadata:
      category: security
      technology:
        - aws
        - terraform
      owasp:
        - A05:2021 - Security Misconfiguration
        - A02:2025 - Security Misconfiguration
      cwe:
        - 'CWE-732: Incorrect Permission Assignment for Critical Resource'
      references:
        - https://cwe.mitre.org/data/definitions/732.html
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authorization
      source: >-
        https://semgrep.dev/r/terraform.aws.security.aws-kms-key-wildcard-principal.aws-kms-key-wildcard-principal
      shortlink: https://sg.run/Nwlp
      semgrep.dev:
        rule:
          r_id: 17371
          rv_id: 1263729
          rule_id: lBUWPD
          version_id: 2KTv2J4
          url: >-
            https://semgrep.dev/playground/r/2KTv2J4/terraform.aws.security.aws-kms-key-wildcard-principal.aws-kms-key-wildcard-principal
          origin: community
    languages:
      - hcl
    severity: ERROR
