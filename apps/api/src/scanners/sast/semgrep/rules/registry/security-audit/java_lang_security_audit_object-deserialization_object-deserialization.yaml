rules:
  - id: java.lang.security.audit.object-deserialization.object-deserialization
    metadata:
      cwe:
        - 'CWE-502: Deserialization of Untrusted Data'
      owasp:
        - A08:2017 - Insecure Deserialization
        - A08:2021 - Software and Data Integrity Failures
        - A08:2025 - Software or Data Integrity Failures
      source-rule-url: https://find-sec-bugs.github.io/bugs.htm#OBJECT_DESERIALIZATION
      references:
        - https://www.owasp.org/index.php/Deserialization_of_untrusted_data
        - https://www.oracle.com/java/technologies/javase/seccodeguide.html#8
      category: security
      technology:
        - java
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: HIGH
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - 'Insecure Deserialization '
      source: >-
        https://semgrep.dev/r/java.lang.security.audit.object-deserialization.object-deserialization
      shortlink: https://sg.run/Ek0A
      semgrep.dev:
        rule:
          r_id: 9181
          rv_id: 1263030
          rule_id: GdU7py
          version_id: NdTzyGe
          url: >-
            https://semgrep.dev/playground/r/NdTzyGe/java.lang.security.audit.object-deserialization.object-deserialization
          origin: community
    message: >-
      Found object deserialization using ObjectInputStream. Deserializing entire
      Java objects is dangerous because malicious actors can create Java object
      streams with unintended consequences. Ensure that the objects being
      deserialized are not user-controlled. If this must be done, consider using
      HMACs to sign the data stream to make sure it is not tampered with, or
      consider only transmitting object fields and populating a new object.
    severity: WARNING
    languages:
      - java
    pattern: new ObjectInputStream(...);
