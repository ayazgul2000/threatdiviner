rules:
  - id: >-
      terraform.azure.security.azure-key-no-expiration-date.azure-key-no-expiration-date
    message: Ensure that the expiration date is set on all keys
    patterns:
      - pattern: resource
      - pattern-not-inside: |
          resource "azurerm_key_vault_key" "..." {
          ...
          expiration_date = "..."
          ...
          }
      - pattern-inside: |
          resource "azurerm_key_vault_key" "..." {
          ...
          }
    metadata:
      owasp:
        - A03:2017 - Sensitive Data Exposure
      cwe:
        - 'CWE-320: CWE CATEGORY: Key Management Errors'
      category: security
      technology:
        - terraform
        - azure
      references:
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
      subcategory:
        - vuln
      likelihood: LOW
      impact: LOW
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/terraform.azure.security.azure-key-no-expiration-date.azure-key-no-expiration-date
      shortlink: https://sg.run/J1vw
      semgrep.dev:
        rule:
          r_id: 23990
          rv_id: 946834
          rule_id: 0oUlgp
          version_id: pZTNGkl
          url: >-
            https://semgrep.dev/playground/r/pZTNGkl/terraform.azure.security.azure-key-no-expiration-date.azure-key-no-expiration-date
          origin: community
    languages:
      - hcl
    severity: WARNING
