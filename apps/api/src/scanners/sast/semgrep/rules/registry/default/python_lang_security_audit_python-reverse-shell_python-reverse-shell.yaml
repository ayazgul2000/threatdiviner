rules:
  - id: python.lang.security.audit.python-reverse-shell.python-reverse-shell
    patterns:
      - pattern-either:
          - pattern: pty.spawn("$BINPATH",...)
          - pattern: subprocess.call(["$BINPATH",...],...)
      - metavariable-regex:
          metavariable: $BINPATH
          regex: /bin/.*?sh\b
      - pattern-inside: |
          import socket
          ...
          $S = socket.socket(...)
          ...
          $S.connect(($IP,$PORT),...)
          ...
    message: Semgrep found a Python reverse shell using $BINPATH to $IP at $PORT
    metadata:
      cwe:
        - 'CWE-553: Command Shell in Externally Accessible Directory'
      category: security
      technology:
        - python
      references:
        - https://cwe.mitre.org/data/definitions/553.html
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Command Injection
      source: >-
        https://semgrep.dev/r/python.lang.security.audit.python-reverse-shell.python-reverse-shell
      shortlink: https://sg.run/gYZJ
      semgrep.dev:
        rule:
          r_id: 15185
          rv_id: 946375
          rule_id: nJUZRY
          version_id: BjT1NZ4
          url: >-
            https://semgrep.dev/playground/r/BjT1NZ4/python.lang.security.audit.python-reverse-shell.python-reverse-shell
          origin: community
    languages:
      - python
    severity: WARNING
