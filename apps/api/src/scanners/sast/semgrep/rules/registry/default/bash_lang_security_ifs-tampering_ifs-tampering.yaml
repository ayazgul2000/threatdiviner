rules:
  - id: bash.lang.security.ifs-tampering.ifs-tampering
    languages:
      - bash
    severity: WARNING
    message: >-
      The special variable IFS affects how splitting takes place when expanding
      unquoted variables. Don't set it globally. Prefer a dedicated utility such
      as 'cut' or 'awk' if you need to split input data. If you must use 'read',
      set IFS locally using e.g. 'IFS="," read -a my_array'.
    pattern: IFS=...
    metadata:
      cwe:
        - 'CWE-20: Improper Input Validation'
      category: security
      technology:
        - bash
      confidence: LOW
      owasp:
        - A03:2021 - Injection
        - A05:2025 - Injection
      references:
        - https://owasp.org/Top10/A03_2021-Injection
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Validation
      source: https://semgrep.dev/r/bash.lang.security.ifs-tampering.ifs-tampering
      shortlink: https://sg.run/Q9pq
