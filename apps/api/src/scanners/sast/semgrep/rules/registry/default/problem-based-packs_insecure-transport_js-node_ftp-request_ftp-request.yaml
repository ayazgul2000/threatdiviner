rules:
  - id: problem-based-packs.insecure-transport.js-node.ftp-request.ftp-request
    message: >-
      Checks for lack of usage of the "secure: true" option when sending ftp
      requests through the nodejs ftp module. This leads to unencrypted traffic
      being sent to the ftp server. There are other options such as "implicit"
      that still does not encrypt all traffic. ftp is the most utilized npm ftp
      module.
    severity: WARNING
    metadata:
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      category: security
      cwe: 'CWE-319: Cleartext Transmission of Sensitive Information'
      owasp: A03:2017 - Sensitive Data Exposure
      references:
        - https://www.npmjs.com/package/ftp
        - https://openbase.io/js/ftp
      subcategory:
        - vuln
      technology:
        - node.js
      vulnerability: Insecure Transport
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Mishandled Sensitive Information
      source: >-
        https://semgrep.dev/r/problem-based-packs.insecure-transport.js-node.ftp-request.ftp-request
      shortlink: https://sg.run/b7QW
      semgrep.dev:
        rule:
          r_id: 9426
          rv_id: 946070
          rule_id: d8UjZ6
          version_id: RGTAg7Z
          url: >-
            https://semgrep.dev/playground/r/RGTAg7Z/problem-based-packs.insecure-transport.js-node.ftp-request.ftp-request
          origin: community
    languages:
      - javascript
      - typescript
    patterns:
      - pattern-inside: |
          $X = require('ftp');
          ...
          $C = new $X();
          ...
      - pattern-not-inside: |
          $OPTIONS = {secure: true};
          ...
      - pattern: |
          $C.connect($OPTIONS,...);
      - pattern-not: |
          $C.connect({...,secure: true});
