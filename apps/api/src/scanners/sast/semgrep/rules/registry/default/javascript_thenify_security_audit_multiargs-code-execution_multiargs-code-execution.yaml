rules:
  - id: >-
      javascript.thenify.security.audit.multiargs-code-execution.multiargs-code-execution
    message: Potential arbitrary code execution, piped to eval
    metadata:
      cwe:
        - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
      owasp:
        - A03:2021 - Injection
        - A05:2025 - Injection
      category: security
      technology:
        - thenify
      cwe2022-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: HIGH
      confidence: LOW
      references:
        - https://owasp.org/Top10/A03_2021-Injection
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Code Injection
      source: >-
        https://semgrep.dev/r/javascript.thenify.security.audit.multiargs-code-execution.multiargs-code-execution
      shortlink: https://sg.run/BkER
      semgrep.dev:
        rule:
          r_id: 9351
          rv_id: 1263247
          rule_id: oqUeDG
          version_id: QkTGqLd
          url: >-
            https://semgrep.dev/playground/r/QkTGqLd/javascript.thenify.security.audit.multiargs-code-execution.multiargs-code-execution
          origin: community
    languages:
      - javascript
      - typescript
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: |
              $THENIFY($FN, {multiArgs: ...},...)
          - pattern: |
              $OPTS = {multiArgs: ...};
              ...
              $THENIFY($FN,$OPTS,...);
      - pattern-not: |
          $THENIFY($FN, {multiArgs: false},...)
      - pattern-not: |
          $OPTS = {multiArgs: false};
          ...
          $THENIFY($FN,$OPTS,...)
      - pattern-either:
          - pattern-inside: |
              $THENIFY = require('thenify');
              ...
          - pattern-inside: |
              import 'thenify';
              ...
