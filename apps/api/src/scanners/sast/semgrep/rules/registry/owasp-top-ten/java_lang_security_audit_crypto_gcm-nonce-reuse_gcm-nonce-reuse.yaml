rules:
  - id: java.lang.security.audit.crypto.gcm-nonce-reuse.gcm-nonce-reuse
    metadata:
      functional-categories:
        - crypto::search::randomness::javax.crypto
      cwe:
        - 'CWE-323: Reusing a Nonce, Key Pair in Encryption'
      category: security
      source-rule-url: https://www.youtube.com/watch?v=r1awgAl90wM
      technology:
        - java
      owasp:
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      references:
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: HIGH
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/java.lang.security.audit.crypto.gcm-nonce-reuse.gcm-nonce-reuse
      shortlink: https://sg.run/Dww2
      semgrep.dev:
        rule:
          r_id: 11908
          rv_id: 1263000
          rule_id: GdUZZ3
          version_id: 0bTKzGk
          url: >-
            https://semgrep.dev/playground/r/0bTKzGk/java.lang.security.audit.crypto.gcm-nonce-reuse.gcm-nonce-reuse
          origin: community
    languages:
      - java
    message: 'GCM IV/nonce is reused: encryption can be totally useless'
    patterns:
      - pattern-either:
          - pattern: new GCMParameterSpec(..., "...".getBytes(...), ...);
          - pattern: >-
              byte[] $NONCE = "...".getBytes(...); ... new GCMParameterSpec(...,
              $NONCE, ...);
    severity: ERROR
