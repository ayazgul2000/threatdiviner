rules:
  - id: >-
      javascript.puppeteer.security.audit.puppeteer-evaluate-arg-injection.puppeteer-evaluate-arg-injection
    message: >-
      If unverified user data can reach the `evaluate` method it can result in
      Server-Side Request Forgery vulnerabilities
    metadata:
      owasp:
        - A10:2021 - Server-Side Request Forgery (SSRF)
        - A01:2025 - Broken Access Control
      cwe:
        - 'CWE-918: Server-Side Request Forgery (SSRF)'
      category: security
      technology:
        - puppeteer
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      references:
        - >-
          https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Server-Side Request Forgery (SSRF)
      source: >-
        https://semgrep.dev/r/javascript.puppeteer.security.audit.puppeteer-evaluate-arg-injection.puppeteer-evaluate-arg-injection
      shortlink: https://sg.run/gLQ5
      semgrep.dev:
        rule:
          r_id: 9341
          rv_id: 1263233
          rule_id: AbUzdX
          version_id: kbTzGrb
          url: >-
            https://semgrep.dev/playground/r/kbTzGrb/javascript.puppeteer.security.audit.puppeteer-evaluate-arg-injection.puppeteer-evaluate-arg-injection
          origin: community
    languages:
      - javascript
      - typescript
    severity: WARNING
    patterns:
      - pattern-inside: |
          require('puppeteer');
          ...
      - pattern-either:
          - pattern-inside: function $FUNC (...,$INPUT,...) {...}
          - pattern-inside: function (...,$INPUT,...) {...}
      - pattern-either:
          - pattern: $PAGE.evaluate($CODE,...,<... $INPUT ...>,...)
          - pattern: $PAGE.evaluateHandle($CODE,...,<... $INPUT ...>,...)
          - pattern: $PAGE.evaluateOnNewDocument($CODE,...,<... $INPUT ...>,...)
