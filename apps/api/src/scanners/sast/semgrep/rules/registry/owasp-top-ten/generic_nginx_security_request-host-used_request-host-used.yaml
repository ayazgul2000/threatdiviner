rules:
  - id: generic.nginx.security.request-host-used.request-host-used
    pattern-either:
      - pattern: $http_host
      - pattern: $host
    paths:
      include:
        - '*conf*'
        - '*nginx*'
        - '*vhost*'
        - '**/sites-available/*'
        - '**/sites-enabled/*'
    languages:
      - generic
    severity: WARNING
    message: >-
      '$http_host' and '$host' variables may contain a malicious value from
      attacker controlled 'Host' request header. Use an explicitly configured
      host value or a allow list for validation.
    metadata:
      cwe:
        - 'CWE-290: Authentication Bypass by Spoofing'
      references:
        - >-
          https://github.com/yandex/gixy/blob/master/docs/en/plugins/hostspoofing.md
        - https://portswigger.net/web-security/host-header
      category: security
      technology:
        - nginx
      confidence: MEDIUM
      owasp:
        - A07:2021 - Identification and Authentication Failures
        - A07:2025 - Authentication Failures
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authentication
      source: >-
        https://semgrep.dev/r/generic.nginx.security.request-host-used.request-host-used
      shortlink: https://sg.run/4x3Z
      semgrep.dev:
        rule:
          r_id: 9044
          rv_id: 1262680
          rule_id: qNUjGg
          version_id: ExTExrN
          url: >-
            https://semgrep.dev/playground/r/ExTExrN/generic.nginx.security.request-host-used.request-host-used
          origin: community
