rules:
  - id: >-
      generic.html-templates.security.unquoted-attribute-var.unquoted-attribute-var
    message: >-
      Detected a unquoted template variable as an attribute. If unquoted, a
      malicious actor could inject custom JavaScript handlers. To fix this, add
      quotes around the template expression, like this: "{{ expr }}".
    metadata:
      cwe:
        - >-
          CWE-79: Improper Neutralization of Input During Web Page Generation
          ('Cross-site Scripting')
      owasp:
        - A07:2017 - Cross-Site Scripting (XSS)
        - A03:2021 - Injection
        - A05:2025 - Injection
      references:
        - >-
          https://flask.palletsprojects.com/en/1.1.x/security/#cross-site-scripting-xss
      category: security
      technology:
        - html-templates
      confidence: LOW
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cross-Site-Scripting (XSS)
      source: >-
        https://semgrep.dev/r/generic.html-templates.security.unquoted-attribute-var.unquoted-attribute-var
      shortlink: https://sg.run/weNX
      semgrep.dev:
        rule:
          r_id: 9029
          rv_id: 1262666
          rule_id: gxU1jy
          version_id: 9lT4bZK
          url: >-
            https://semgrep.dev/playground/r/9lT4bZK/generic.html-templates.security.unquoted-attribute-var.unquoted-attribute-var
          origin: community
    languages:
      - generic
    paths:
      include:
        - '*.html'
        - '*.mustache'
        - '*.hbs'
    severity: WARNING
    patterns:
      - pattern-inside: <$TAG ...>
      - pattern-not-inside: '="..."'
      - pattern-not-inside: '=''...'''
      - pattern: '{{ ... }}'
    fix-regex:
      regex: '{{(.*?)}}'
      replacement: '"{{\1}}"'
