rules:
  - id: java.lang.security.audit.weak-ssl-context.weak-ssl-context
    metadata:
      cwe:
        - 'CWE-326: Inadequate Encryption Strength'
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      source_rule_url: https://find-sec-bugs.github.io/bugs.htm#SSL_CONTEXT
      references:
        - https://tools.ietf.org/html/rfc7568
        - https://tools.ietf.org/id/draft-ietf-tls-oldversions-deprecate-02.html
      category: security
      technology:
        - java
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      confidence: HIGH
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/java.lang.security.audit.weak-ssl-context.weak-ssl-context
      shortlink: https://sg.run/4x7E
      semgrep.dev:
        rule:
          r_id: 9188
          rv_id: 1263050
          rule_id: KxUb1k
          version_id: 5PTo1rW
          url: >-
            https://semgrep.dev/playground/r/5PTo1rW/java.lang.security.audit.weak-ssl-context.weak-ssl-context
          origin: community
    message: >-
      An insecure SSL context was detected. TLS versions 1.0, 1.1, and all SSL
      versions are considered weak encryption and are deprecated. Use
      SSLContext.getInstance("TLSv1.2") for the best security.
    severity: WARNING
    languages:
      - java
    patterns:
      - pattern-not: SSLContext.getInstance("TLSv1.3")
      - pattern-not: SSLContext.getInstance("TLSv1.2")
      - pattern: SSLContext.getInstance("...")
    fix-regex:
      regex: (.*?)\.getInstance\(.*?\)
      replacement: \1.getInstance("TLSv1.2")
