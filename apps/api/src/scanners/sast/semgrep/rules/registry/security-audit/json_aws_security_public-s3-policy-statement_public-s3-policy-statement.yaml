rules:
  - id: json.aws.security.public-s3-policy-statement.public-s3-policy-statement
    pattern: |
      {
        "Effect": "Allow",
        "Principal": "*",
        "Resource": [
          ..., "=~/arn:aws:s3.*/", ...
        ],
        ...
      }
    message: >-
      Detected public S3 bucket policy. This policy allows anyone to access
      certain properties of or items in the bucket. Do not do this unless you
      will never have sensitive data inside the bucket.
    metadata:
      owasp:
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      cwe:
        - 'CWE-264: CWE CATEGORY: Permissions, Privileges, and Access Controls'
      references:
        - >-
          https://docs.aws.amazon.com/AmazonS3/latest/dev/WebsiteAccessPermissionsReqd.html
      category: security
      technology:
        - aws
      subcategory:
        - vuln
      likelihood: LOW
      impact: HIGH
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authorization
      source: >-
        https://semgrep.dev/r/json.aws.security.public-s3-policy-statement.public-s3-policy-statement
      shortlink: https://sg.run/Yv1d
      semgrep.dev:
        rule:
          r_id: 9358
          rv_id: 1263255
          rule_id: 9AU1br
          version_id: A8Tgdxq
          url: >-
            https://semgrep.dev/playground/r/A8Tgdxq/json.aws.security.public-s3-policy-statement.public-s3-policy-statement
          origin: community
    severity: WARNING
    languages:
      - json
