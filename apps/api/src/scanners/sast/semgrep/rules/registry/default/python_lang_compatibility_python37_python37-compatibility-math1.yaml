rules:
  - id: python.lang.compatibility.python37.python37-compatibility-math1
    pattern: math.remainder($X, $Y)
    message: >-
      math.remainder is only available on Python 3.7+ and is therefore not
      backwards compatible. Instead, use math.fmod() or calculate $X - n* $Y.
    languages:
      - python
    severity: ERROR
    metadata:
      category: compatibility
      technology:
        - python
