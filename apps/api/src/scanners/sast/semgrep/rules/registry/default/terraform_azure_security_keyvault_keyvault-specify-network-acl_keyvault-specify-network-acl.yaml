rules:
  - id: >-
      terraform.azure.security.keyvault.keyvault-specify-network-acl.keyvault-specify-network-acl
    message: >-
      Network ACLs allow you to reduce your exposure to risk by limiting what
      can access your key vault. The default action of the Network ACL should be
      set to deny for when IPs are not matched. Azure services can be allowed to
      bypass.
    patterns:
      - pattern: resource
      - pattern-not-inside: |
          resource "azurerm_key_vault" "..." {
          ...
          network_acls {
              ...
              default_action = "Deny"
              ...
          }
          ...
          }
      - pattern-either:
          - pattern-inside: |
              resource "azurerm_key_vault" "..." {
              ...
              }
          - pattern-inside: |
              resource "azurerm_key_vault" "..." {
              ...
              network_acls {
                  ...
                  default_action = "Allow"
                  ...
              }
              ...
              }
    metadata:
      cwe:
        - 'CWE-1220: Insufficient Granularity of Access Control'
      category: security
      technology:
        - terraform
        - azure
      references:
        - >-
          https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/key_vault#network_acls
        - >-
          https://docs.microsoft.com/en-us/azure/key-vault/general/network-security
      owasp:
        - A05:2017 - Broken Access Control
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Other
      source: >-
        https://semgrep.dev/r/terraform.azure.security.keyvault.keyvault-specify-network-acl.keyvault-specify-network-acl
      shortlink: https://sg.run/nKgX
      semgrep.dev:
        rule:
          r_id: 15136
          rv_id: 1263802
          rule_id: 4bU1jy
          version_id: GxTkeEE
          url: >-
            https://semgrep.dev/playground/r/GxTkeEE/terraform.azure.security.keyvault.keyvault-specify-network-acl.keyvault-specify-network-acl
          origin: community
    languages:
      - hcl
    severity: ERROR
