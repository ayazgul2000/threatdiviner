rules:
  - id: >-
      terraform.azure.security.functionapp.functionapp-enable-http2.functionapp-enable-http2
    message: >-
      Use the latest version of HTTP to ensure you are benefiting from security
      fixes. Add `http2_enabled = true` to your function app resource block
    patterns:
      - pattern: resource
      - pattern-not-inside: |
          resource "azurerm_function_app" "..." {
          ...
            site_config {
              ...
              http2_enabled = true
              ...
            }
          ...
          }
      - pattern-either:
          - pattern-inside: |
              resource "azurerm_function_app" "..." {
              ...
              }
          - pattern-inside: |
              resource "azurerm_function_app" "..." {
              ...
                site_config {
                  ...
                  http2_enabled = false
                  ...
                }
              ...
              }
    metadata:
      cwe:
        - >-
          CWE-444: Inconsistent Interpretation of HTTP Requests ('HTTP
          Request/Response Smuggling')
      category: security
      technology:
        - terraform
        - azure
      references:
        - >-
          https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/function_app#http2_enabled
      owasp:
        - A04:2021 - Insecure Design
        - A06:2025 - Insecure Design
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Validation
      source: >-
        https://semgrep.dev/r/terraform.azure.security.functionapp.functionapp-enable-http2.functionapp-enable-http2
      shortlink: https://sg.run/DzDY
      semgrep.dev:
        rule:
          r_id: 15108
          rv_id: 1263801
          rule_id: oqU41L
          version_id: 5PTo1Dg
          url: >-
            https://semgrep.dev/playground/r/5PTo1Dg/terraform.azure.security.functionapp.functionapp-enable-http2.functionapp-enable-http2
          origin: community
    languages:
      - hcl
    severity: INFO
