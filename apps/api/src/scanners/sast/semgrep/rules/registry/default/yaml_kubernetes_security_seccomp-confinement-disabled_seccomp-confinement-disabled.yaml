rules:
  - id: >-
      yaml.kubernetes.security.seccomp-confinement-disabled.seccomp-confinement-disabled
    patterns:
      - pattern-inside: |
          containers:
            ...
      - pattern: |
          image: ...
          ...
          securityContext:
            ...
            seccompProfile: unconfined
    message: >-
      Container is explicitly disabling seccomp confinement. This runs the
      service in an unrestricted state. Remove 'seccompProfile: unconfined' to
      prevent this.
    metadata:
      cwe:
        - 'CWE-284: Improper Access Control'
      references:
        - >-
          https://kubernetes.io/docs/concepts/policy/pod-security-policy/#seccomp
        - >-
          https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
      category: security
      technology:
        - kubernetes
      owasp:
        - A05:2017 - Broken Access Control
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authorization
      source: >-
        https://semgrep.dev/r/yaml.kubernetes.security.seccomp-confinement-disabled.seccomp-confinement-disabled
      shortlink: https://sg.run/6rgY
      semgrep.dev:
        rule:
          r_id: 10059
          rv_id: 1263941
          rule_id: zdUynw
          version_id: w8TRoL3
          url: >-
            https://semgrep.dev/playground/r/w8TRoL3/yaml.kubernetes.security.seccomp-confinement-disabled.seccomp-confinement-disabled
          origin: community
    languages:
      - yaml
    severity: WARNING
