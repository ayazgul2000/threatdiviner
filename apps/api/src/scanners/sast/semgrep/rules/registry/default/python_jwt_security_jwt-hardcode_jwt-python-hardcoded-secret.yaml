rules:
  - id: python.jwt.security.jwt-hardcode.jwt-python-hardcoded-secret
    message: >-
      Hardcoded JWT secret or private key is used. This is a Insufficiently
      Protected Credentials weakness:
      https://cwe.mitre.org/data/definitions/522.html Consider using an
      appropriate security mechanism to protect the credentials (e.g. keeping
      secrets in environment variables)
    metadata:
      cwe:
        - 'CWE-522: Insufficiently Protected Credentials'
      owasp:
        - A02:2017 - Broken Authentication
        - A04:2021 - Insecure Design
        - A06:2025 - Insecure Design
      references:
        - >-
          https://semgrep.dev/blog/2020/hardcoded-secrets-unverified-tokens-and-other-common-jwt-mistakes/
      category: security
      technology:
        - jwt
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: HIGH
      impact: MEDIUM
      confidence: HIGH
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/python.jwt.security.jwt-hardcode.jwt-python-hardcoded-secret
      shortlink: https://sg.run/l2E9
      semgrep.dev:
        rule:
          r_id: 9557
          rv_id: 1263452
          rule_id: X5U8P5
          version_id: PkTR3X3
          url: >-
            https://semgrep.dev/playground/r/PkTR3X3/python.jwt.security.jwt-hardcode.jwt-python-hardcoded-secret
          origin: community
    patterns:
      - pattern: |
          jwt.encode($_, "...", ...)
    languages:
      - python
    severity: ERROR
