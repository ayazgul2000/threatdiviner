rules:
  - id: python.lang.compatibility.python37.python37-compatibility-os2-ok2
    patterns:
      - pattern-not-inside: |
          if hasattr(os, 'pwritev'):
              ...
      - pattern: os.pwritev(...)
    message: >-
      os.pwritev() is only available on Python 3.3+ and is therefore not
      backwards compatible. Instead, use a combination of pwrite() and writev().
    languages:
      - python
    severity: ERROR
    metadata:
      category: compatibility
      technology:
        - python
