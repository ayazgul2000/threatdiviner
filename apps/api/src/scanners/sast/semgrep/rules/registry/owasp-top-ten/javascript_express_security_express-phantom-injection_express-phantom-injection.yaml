rules:
  - id: >-
      javascript.express.security.express-phantom-injection.express-phantom-injection
    message: >-
      If unverified user data can reach the `phantom` methods it can result in
      Server-Side Request Forgery vulnerabilities
    metadata:
      owasp:
        - A10:2021 - Server-Side Request Forgery (SSRF)
        - A01:2025 - Broken Access Control
      cwe:
        - 'CWE-918: Server-Side Request Forgery (SSRF)'
      category: security
      technology:
        - express
      references:
        - https://phantomjs.org/page-automation.html
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Server-Side Request Forgery (SSRF)
      source: >-
        https://semgrep.dev/r/javascript.express.security.express-phantom-injection.express-phantom-injection
      shortlink: https://sg.run/W8BL
      semgrep.dev:
        rule:
          r_id: 9253
          rv_id: 1263167
          rule_id: 2ZUbx3
          version_id: 2KTv26p
          url: >-
            https://semgrep.dev/playground/r/2KTv26p/javascript.express.security.express-phantom-injection.express-phantom-injection
          origin: community
    languages:
      - javascript
      - typescript
    severity: ERROR
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: function ... ($REQ, $RES) {...}
              - pattern-inside: function ... ($REQ, $RES, $NEXT) {...}
              - patterns:
                  - pattern-either:
                      - pattern-inside: $APP.$METHOD(..., function $FUNC($REQ, $RES) {...})
                      - pattern-inside: >-
                          $APP.$METHOD(..., function $FUNC($REQ, $RES, $NEXT)
                          {...})
                  - metavariable-regex:
                      metavariable: $METHOD
                      regex: ^(get|post|put|head|delete|options)$
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.body
              - pattern: $REQ.params
              - pattern: $REQ.cookies
              - pattern: $REQ.headers
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  ({ $REQ }: Request,$RES: Response, $NEXT: NextFunction) =>
                  {...}
              - pattern-inside: |
                  ({ $REQ }: Request,$RES: Response) => {...}
          - focus-metavariable: $REQ
          - pattern-either:
              - pattern: params
              - pattern: query
              - pattern: cookies
              - pattern: headers
              - pattern: body
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  require('phantom');
                  ...
              - pattern-inside: |
                  import 'phantom';
                  ...
          - pattern-either:
              - pattern: $PAGE.open($SINK,...)
              - pattern: $PAGE.setContent($SINK,...)
              - pattern: $PAGE.openUrl($SINK,...)
              - pattern: $PAGE.evaluateJavaScript($SINK,...)
              - pattern: $PAGE.property("content",$SINK,...)
          - focus-metavariable: $SINK
