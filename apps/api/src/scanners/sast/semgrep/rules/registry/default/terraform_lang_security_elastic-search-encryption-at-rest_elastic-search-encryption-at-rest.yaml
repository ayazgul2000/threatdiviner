rules:
  - id: >-
      terraform.lang.security.elastic-search-encryption-at-rest.elastic-search-encryption-at-rest
    patterns:
      - pattern: |
          resource
      - pattern-not-inside: |
          resource "aws_elasticsearch_domain" "..."{
            ...
            encrypt_at_rest{
              ...
              enabled = true
              ...
            }
            ...
          }
      - pattern-inside: |
          resource "aws_elasticsearch_domain" "..." {...}
    languages:
      - hcl
    message: Encryption at rest is not enabled for the elastic search domain resource
    severity: WARNING
    metadata:
      category: security
      cwe:
        - 'CWE-311: Missing Encryption of Sensitive Data'
      technology:
        - terraform
        - aws
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A04:2021 - Insecure Design
        - A06:2025 - Insecure Design
      references:
        - https://owasp.org/Top10/A04_2021-Insecure_Design
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/terraform.lang.security.elastic-search-encryption-at-rest.elastic-search-encryption-at-rest
      shortlink: https://sg.run/B4Yb
