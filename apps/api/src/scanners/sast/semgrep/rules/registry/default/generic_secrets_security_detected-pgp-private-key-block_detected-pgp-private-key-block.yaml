rules:
  - id: >-
      generic.secrets.security.detected-pgp-private-key-block.detected-pgp-private-key-block
    pattern-regex: '-----BEGIN PGP PRIVATE KEY BLOCK-----'
    languages:
      - regex
    message: >-
      Something that looks like a PGP private key block is detected. This is a
      potential hardcoded secret that could be leaked if this code is committed.
      Instead, remove this code block from the commit.
    severity: ERROR
    metadata:
      cwe:
        - 'CWE-798: Use of Hard-coded Credentials'
      source-rule-url: >-
        https://github.com/dxa4481/truffleHogRegexes/blob/master/truffleHogRegexes/regexes.json
      category: security
      technology:
        - secrets
      confidence: LOW
      owasp:
        - A07:2021 - Identification and Authentication Failures
        - A07:2025 - Authentication Failures
      references:
        - >-
          https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Hard-coded Secrets
      source: >-
        https://semgrep.dev/r/generic.secrets.security.detected-pgp-private-key-block.detected-pgp-private-key-block
      shortlink: https://sg.run/ydKd
      semgrep.dev:
        rule:
          r_id: 9068
          rv_id: 1262886
          rule_id: nJUzXz
          version_id: gETB7O4
          url: >-
            https://semgrep.dev/playground/r/gETB7O4/generic.secrets.security.detected-pgp-private-key-block.detected-pgp-private-key-block
          origin: community
