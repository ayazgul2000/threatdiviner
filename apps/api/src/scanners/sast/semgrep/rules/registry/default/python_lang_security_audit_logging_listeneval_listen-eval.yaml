rules:
  - id: python.lang.security.audit.logging.listeneval.listen-eval
    languages:
      - python
    message: >-
      Because portions of the logging configuration are passed through eval(),
      use of this function may open its users to a security risk. While the
      function only binds to a socket on localhost, and so does not accept
      connections from remote machines, there are scenarios where untrusted code
      could be run under the account of the process which calls listen(). To
      avoid this happening, use the `verify()` argument to `listen()` to prevent
      unrecognized configurations.
    metadata:
      cwe:
        - >-
          CWE-95: Improper Neutralization of Directives in Dynamically Evaluated
          Code ('Eval Injection')
      owasp:
        - A03:2021 - Injection
        - A05:2025 - Injection
      references:
        - >-
          https://docs.python.org/3/library/logging.config.html?highlight=security#logging.config.listen
      category: security
      technology:
        - python
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Code Injection
      source: >-
        https://semgrep.dev/r/python.lang.security.audit.logging.listeneval.listen-eval
      shortlink: https://sg.run/9okY
      semgrep.dev:
        rule:
          r_id: 9667
          rv_id: 1263500
          rule_id: wdUJQY
          version_id: RGT0L6X
          url: >-
            https://semgrep.dev/playground/r/RGT0L6X/python.lang.security.audit.logging.listeneval.listen-eval
          origin: community
    severity: WARNING
    pattern: logging.config.listen(...)
