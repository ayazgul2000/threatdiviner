rules:
  - id: kotlin.lang.security.bad-hexa-conversion.bad-hexa-conversion
    metadata:
      cwe:
        - 'CWE-704: Incorrect Type Conversion or Cast'
      owasp: A03:2017 - Sensitive Data Exposure
      source-rule-url: https://find-sec-bugs.github.io/bugs.htm#BAD_HEXA_CONVERSION
      category: security
      technology:
        - kotlin
      references:
        - https://cwe.mitre.org/data/definitions/704.html
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Validation
      source: >-
        https://semgrep.dev/r/kotlin.lang.security.bad-hexa-conversion.bad-hexa-conversion
      shortlink: https://sg.run/b25p
      semgrep.dev:
        rule:
          r_id: 15126
          rv_id: 945937
          rule_id: d8UegG
          version_id: xyTqnDy
          url: >-
            https://semgrep.dev/playground/r/xyTqnDy/kotlin.lang.security.bad-hexa-conversion.bad-hexa-conversion
          origin: community
    message: >-
      'Integer.toHexString()' strips leading zeroes from each byte if read
      byte-by-byte. This mistake weakens the hash value computed since it
      introduces more collisions. Use 'String.format("%02X", ...)' instead.
    severity: WARNING
    languages:
      - kt
    pattern: |-
      fun $METHOD(...) {
        ...
        val $MD: MessageDigest = ...
        ...
        $MD.digest(...)
        ...
        Integer.toHexString(...)
      }
