rules:
  - id: >-
      terraform.aws.security.aws-db-instance-no-logging.aws-db-instance-no-logging
    patterns:
      - pattern: |
          resource "aws_db_instance" $ANYTHING {
            ...
          }
      - pattern-not-inside: |
          resource "aws_db_instance" $ANYTHING {
            ...
            enabled_cloudwatch_logs_exports = [$SOMETHING, ...]
            ...
          }
    message: >-
      Database instance has no logging. Missing logs can cause missing important
      event information.
    languages:
      - hcl
    severity: WARNING
    metadata:
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A04:2021 - Insecure Design
        - A06:2025 - Insecure Design
      cwe:
        - 'CWE-311: Missing Encryption of Sensitive Data'
      technology:
        - aws
        - terraform
      category: security
      references:
        - https://owasp.org/Top10/A04_2021-Insecure_Design
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: LOW
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/terraform.aws.security.aws-db-instance-no-logging.aws-db-instance-no-logging
      shortlink: https://sg.run/GyAp
      semgrep.dev:
        rule:
          r_id: 17348
          rv_id: 1263704
          rule_id: d8U4RA
          version_id: BjTkZ6j
          url: >-
            https://semgrep.dev/playground/r/BjTkZ6j/terraform.aws.security.aws-db-instance-no-logging.aws-db-instance-no-logging
          origin: community
