rules:
  - id: >-
      ruby.rails.security.brakeman.check-rails-session-secret-handling.check-rails-session-secret-handling
    patterns:
      - pattern-either:
          - patterns:
              - pattern: |
                  :$KEY => "$LITERAL"
              - pattern-inside: |
                  ActionController::Base.session = {...}
          - pattern: |
              $RAILS::Application.config.$KEY = "$LITERAL"
          - pattern: |
              Rails.application.config.$KEY = "$LITERAL"
      - metavariable-regex:
          metavariable: $KEY
          regex: ^secret(_(token|key_base))?$
    message: >-
      Found a string literal assignment to a Rails session secret `$KEY`. Do not
      commit secret values to source control! Any user in possession of this
      value may falsify arbitrary session data in your application. Read this
      value from an environment variable, KMS, or file on disk outside of source
      control.
    languages:
      - ruby
    severity: WARNING
    metadata:
      source-rule-url: >-
        https://github.com/presidentbeef/brakeman/blob/main/lib/brakeman/checks/check_session_settings.rb
      category: security
      cwe:
        - 'CWE-540: Inclusion of Sensitive Information in Source Code'
      owasp:
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      technology:
        - ruby
        - rails
      references:
        - >-
          https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/06-Session_Management_Testing/02-Testing_for_Cookies_Attributes
        - >-
          https://github.com/presidentbeef/brakeman/blob/main/test/apps/rails4_with_engines/config/initializers/secret_token.rb
        - >-
          https://github.com/presidentbeef/brakeman/blob/main/test/apps/rails3/config/initializers/secret_token.rb
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Mishandled Sensitive Information
      source: >-
        https://semgrep.dev/r/ruby.rails.security.brakeman.check-rails-session-secret-handling.check-rails-session-secret-handling
      shortlink: https://sg.run/KyJd
      semgrep.dev:
        rule:
          r_id: 20155
          rv_id: 1263656
          rule_id: lBUX1r
          version_id: 5PTo1ZY
