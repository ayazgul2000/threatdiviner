rules:
  - id: javascript.ajv.security.audit.ajv-allerrors-true.ajv-allerrors-true
    message: >-
      By setting `allErrors: true` in `Ajv` library, all error objects will be
      allocated without limit. This allows the attacker to produce a huge number
      of errors which can lead to denial of service. Do not use `allErrors:
      true` in production.
    metadata:
      cwe:
        - 'CWE-400: Uncontrolled Resource Consumption'
      category: security
      technology:
        - ajv
      references:
        - https://ajv.js.org/options.html#allerrors
      cwe2022-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Denial-of-Service (DoS)
      source: >-
        https://semgrep.dev/r/javascript.ajv.security.audit.ajv-allerrors-true.ajv-allerrors-true
      shortlink: https://sg.run/d2jY
      semgrep.dev:
        rule:
          r_id: 13578
          rv_id: 945749
          rule_id: PeUo5X
          version_id: 44TZkJ6
          url: >-
            https://semgrep.dev/playground/r/44TZkJ6/javascript.ajv.security.audit.ajv-allerrors-true.ajv-allerrors-true
          origin: community
    languages:
      - javascript
      - typescript
    severity: WARNING
    pattern-either:
      - pattern: |
          new Ajv({...,allErrors: true,...},...)
      - patterns:
          - pattern: |
              new Ajv($SETTINGS,...)
          - pattern-inside: |
              $SETTINGS = {...,allErrors: true,...}
              ...
