rules:
  - id: python.jwt.security.unverified-jwt-decode.unverified-jwt-decode
    patterns:
      - pattern-either:
          - patterns:
              - pattern: >
                  jwt.decode(..., options={..., "verify_signature": $BOOL, ...},
                  ...)
              - metavariable-pattern:
                  metavariable: $BOOL
                  pattern: |
                    False
              - focus-metavariable: $BOOL
          - patterns:
              - pattern: |
                  $OPTS = {..., "verify_signature": $BOOL, ...}
                  ...
                  jwt.decode(..., options=$OPTS, ...)
              - metavariable-pattern:
                  metavariable: $BOOL
                  pattern: |
                    False
              - focus-metavariable: $BOOL
    message: >-
      Detected JWT token decoded with 'verify=False'. This bypasses any
      integrity checks for the token which means the token could be tampered
      with by malicious actors. Ensure that the JWT token is verified.
    metadata:
      owasp:
        - A02:2017 - Broken Authentication
        - A07:2021 - Identification and Authentication Failures
        - A07:2025 - Authentication Failures
      cwe:
        - 'CWE-287: Improper Authentication'
      references:
        - >-
          https://github.com/we45/Vulnerable-Flask-App/blob/752ee16087c0bfb79073f68802d907569a1f0df7/app/app.py#L96
      category: security
      technology:
        - jwt
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authentication
      source: >-
        https://semgrep.dev/r/python.jwt.security.unverified-jwt-decode.unverified-jwt-decode
      shortlink: https://sg.run/6nyB
      semgrep.dev:
        rule:
          r_id: 9559
          rv_id: 1263454
          rule_id: 10UKjo
          version_id: 5PTo12w
          url: >-
            https://semgrep.dev/playground/r/5PTo12w/python.jwt.security.unverified-jwt-decode.unverified-jwt-decode
          origin: community
    fix: |
      True
    severity: ERROR
    languages:
      - python
