rules:
  - id: solidity.security.proxy-storage-collision.proxy-storage-collision
    message: >-
      Proxy declares a state var that may override a storage slot of the
      implementation
    metadata:
      category: security
      technology:
        - solidity
      cwe: 'CWE-787: Out-of-bounds Write'
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      subcategory:
        - vuln
      references:
        - >-
          https://blog.audius.co/article/audius-governance-takeover-post-mortem-7-23-22
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Other
      source: >-
        https://semgrep.dev/r/solidity.security.proxy-storage-collision.proxy-storage-collision
      shortlink: https://sg.run/2GXr
      semgrep.dev:
        rule:
          r_id: 67663
          rv_id: 946626
          rule_id: BYU0EL
          version_id: qkT4jqp
          url: >-
            https://semgrep.dev/playground/r/qkT4jqp/solidity.security.proxy-storage-collision.proxy-storage-collision
          origin: community
    patterns:
      - pattern-either:
          - pattern: |
              contract $CONTRACT is ..., $PROXY, ... {
                  ...
                  $TYPE $VAR;
                  ...
                  constructor(...) {
                      ...
                  }
                  ...
              }
          - pattern: |
              contract $CONTRACT is ..., $PROXY, ... {
                  ...
                  $TYPE $VAR = ...;
                  ...
                  constructor(...) {
                      ...
                  }
                  ...
              }
      - pattern-not: |
          contract $CONTRACT is ..., $PROXY, ... {
              $TYPE immutable $VAR;
              ...
              constructor(...) {
                  ...
              }
              ...
          }
      - pattern-not: |
          contract $CONTRACT is ..., $PROXY, ... {
              $TYPE immutable $VAR = ...;
              ...
              constructor(...) {
                  ...
              }
              ...
          }
      - pattern-not: |
          contract $CONTRACT is ..., $PROXY, ... {
              $TYPE constant $VAR = ...;
              ...
              constructor(...) {
                  ...
              }
              ...
          }
      - metavariable-regex:
          metavariable: $CONTRACT
          regex: ^(?!AdminUpgradeabilityProxy|OwnedUpgrade*abilityProxy).*$
      - metavariable-regex:
          metavariable: $PROXY
          regex: >-
            (UpgradeabilityProxy|AdminUpgradeabilityProxy|OwnedUpgrade*abilityProxy|TransparentUpgradeableProxy|ERC1967Proxy)
      - focus-metavariable: $PROXY
    languages:
      - solidity
    severity: WARNING
