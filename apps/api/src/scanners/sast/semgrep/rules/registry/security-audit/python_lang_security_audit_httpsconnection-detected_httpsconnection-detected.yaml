rules:
  - id: >-
      python.lang.security.audit.httpsconnection-detected.httpsconnection-detected
    message: >-
      The HTTPSConnection API has changed frequently with minor releases of
      Python. Ensure you are using the API for your version of Python securely.
      For example, Python 3 versions prior to 3.4.3 will not verify SSL
      certificates by default. See
      https://docs.python.org/3/library/http.client.html#http.client.HTTPSConnection
      for more information.
    metadata:
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A07:2021 - Identification and Authentication Failures
        - A07:2025 - Authentication Failures
      cwe:
        - 'CWE-295: Improper Certificate Validation'
      references:
        - >-
          https://docs.python.org/3/library/http.client.html#http.client.HTTPSConnection
      category: security
      technology:
        - python
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authentication
      source: >-
        https://semgrep.dev/r/python.lang.security.audit.httpsconnection-detected.httpsconnection-detected
      shortlink: https://sg.run/8yby
      semgrep.dev:
        rule:
          r_id: 9640
          rv_id: 1263481
          rule_id: JDUy7y
          version_id: xyTjzg9
          url: >-
            https://semgrep.dev/playground/r/xyTjzg9/python.lang.security.audit.httpsconnection-detected.httpsconnection-detected
          origin: community
    severity: WARNING
    languages:
      - python
    pattern-either:
      - pattern: httplib.HTTPSConnection(...)
      - pattern: http.client.HTTPSConnection(...)
      - pattern: six.moves.http_client.HTTPSConnection(...)
