rules:
  - id: >-
      terraform.aws.security.aws-ebs-volume-encrypted-with-cmk.aws-ebs-volume-encrypted-with-cmk
    patterns:
      - pattern: |
          resource "aws_ebs_volume" $ANYTHING {
            ...
            encrypted = true
            ...
          }
      - pattern-not-inside: |
          resource "aws_ebs_volume" $ANYTHING {
            ...
            encrypted = true
            kms_key_id = ...
            ...
          }
    message: >-
      Ensure EBS Volume is encrypted at rest using KMS CMKs. CMKs gives you
      control over the encryption key in terms of access and rotation.
    metadata:
      category: security
      technology:
        - terraform
        - aws
      owasp:
        - A03:2017 - Sensitive Data Exposure
      cwe:
        - 'CWE-320: CWE CATEGORY: Key Management Errors'
      references:
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: >-
        https://semgrep.dev/r/terraform.aws.security.aws-ebs-volume-encrypted-with-cmk.aws-ebs-volume-encrypted-with-cmk
      shortlink: https://sg.run/WW14
      semgrep.dev:
        rule:
          r_id: 17353
          rv_id: 946679
          rule_id: L1UPY9
          version_id: DkTNpzv
          url: >-
            https://semgrep.dev/playground/r/DkTNpzv/terraform.aws.security.aws-ebs-volume-encrypted-with-cmk.aws-ebs-volume-encrypted-with-cmk
          origin: community
    languages:
      - hcl
    severity: WARNING
