rules:
  - id: python.lang.compatibility.python37.python37-compatibility-importlib3
    pattern: import importlib.abc.ResourceReader
    message: >-
      Found usage of 'importlib.abc.ResourceReader'. This module is only
      available on Python 3.7+ and is therefore not backwards compatible.
      Instead, use another loader.
