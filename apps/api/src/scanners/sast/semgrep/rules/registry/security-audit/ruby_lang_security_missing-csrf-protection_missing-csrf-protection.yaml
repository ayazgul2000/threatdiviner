rules:
  - id: ruby.lang.security.missing-csrf-protection.missing-csrf-protection
    patterns:
      - pattern: |
          class $CONTROLLER < ActionController::Base
            ...
          end
      - pattern-not: |
          class $CONTROLLER < ActionController::Base
            ...
            protect_from_forgery :with => :exception
          end
      - pattern-not: |
          class $CONTROLLER < ActionController::Base
            ...
            protect_from_forgery prepend: true, with: :exception
          end
    message: >-
      Detected controller which does not enable cross-site request forgery
      protections using 'protect_from_forgery'. Add 'protect_from_forgery :with
      => :exception' to your controller class.
    severity: ERROR
    metadata:
      cwe:
        - 'CWE-352: Cross-Site Request Forgery (CSRF)'
      owasp:
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      source-rule-url: >-
        https://github.com/presidentbeef/brakeman/blob/main/docs/warning_types/cross-site_request_forgery/index.markdown
      category: security
      technology:
        - ruby
      references:
        - https://owasp.org/Top10/A01_2021-Broken_Access_Control
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cross-Site Request Forgery (CSRF)
      source: >-
        https://semgrep.dev/r/ruby.lang.security.missing-csrf-protection.missing-csrf-protection
      shortlink: https://sg.run/XLel
      semgrep.dev:
        rule:
          r_id: 9720
          rv_id: 1263612
          rule_id: r6UkO5
          version_id: 5PTo1WY
          url: >-
            https://semgrep.dev/playground/r/5PTo1WY/ruby.lang.security.missing-csrf-protection.missing-csrf-protection
          origin: community
    languages:
      - ruby
