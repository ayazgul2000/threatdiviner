rules:
  - id: yaml.kubernetes.security.hostpid-pod.hostpid-pod
    patterns:
      - pattern-inside: |
          spec:
            ...
      - pattern: |
          hostPID: true
    message: >-
      Pod is sharing the host process ID namespace. When paired with ptrace this
      can be used to escalate privileges outside of the container. Remove the
      'hostPID' key to disable this functionality.
    metadata:
      cwe:
        - 'CWE-269: Improper Privilege Management'
      references:
        - >-
          https://kubernetes.io/docs/concepts/policy/pod-security-policy/#host-namespaces
      category: security
      technology:
        - kubernetes
      owasp:
        - A04:2021 - Insecure Design
        - A06:2025 - Insecure Design
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authorization
      source: https://semgrep.dev/r/yaml.kubernetes.security.hostpid-pod.hostpid-pod
      shortlink: https://sg.run/708R
      semgrep.dev:
        rule:
          r_id: 10238
          rv_id: 1263934
          rule_id: 7KUeo0
          version_id: 1QTypvL
          url: >-
            https://semgrep.dev/playground/r/1QTypvL/yaml.kubernetes.security.hostpid-pod.hostpid-pod
          origin: community
    languages:
      - yaml
    severity: WARNING
