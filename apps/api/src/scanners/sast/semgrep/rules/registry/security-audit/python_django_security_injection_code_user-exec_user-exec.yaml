rules:
  - id: python.django.security.injection.code.user-exec.user-exec
    message: >-
      Found user data in a call to 'exec'. This is extremely dangerous because
      it can enable an attacker to execute arbitrary remote code on the system.
      Instead, refactor your code to not use 'eval' and instead use a safe
      library for the specific functionality you need.
    metadata:
      cwe:
        - >-
          CWE-95: Improper Neutralization of Directives in Dynamically Evaluated
          Code ('Eval Injection')
      owasp:
        - A03:2021 - Injection
        - A05:2025 - Injection
      category: security
      technology:
        - django
      references:
        - https://owasp.org/www-community/attacks/Code_Injection
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: HIGH
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Code Injection
      source: >-
        https://semgrep.dev/r/python.django.security.injection.code.user-exec.user-exec
      shortlink: https://sg.run/5Q3X
      semgrep.dev:
        rule:
          r_id: 9503
          rv_id: 1263386
          rule_id: 0oU5AW
          version_id: nWT2LA2
          url: >-
            https://semgrep.dev/playground/r/nWT2LA2/python.django.security.injection.code.user-exec.user-exec
          origin: community
    patterns:
      - pattern-inside: |
          def $F(...):
            ...
      - pattern-either:
          - pattern: exec(..., request.$W.get(...), ...)
          - pattern: |
              $V = request.$W.get(...)
              ...
              exec(..., $V, ...)
          - pattern: exec(..., request.$W(...), ...)
          - pattern: |
              $V = request.$W(...)
              ...
              exec(..., $V, ...)
          - pattern: exec(..., request.$W[...], ...)
          - pattern: |
              $V = request.$W[...]
              ...
              exec(..., $V, ...)
          - pattern: |
              loop = asyncio.get_running_loop()
              ...
              await loop.run_in_executor(None, exec, request.$W[...])
          - pattern: |
              $V = request.$W[...]
              ...
              loop = asyncio.get_running_loop()
              ...
              await loop.run_in_executor(None, exec, $V)
          - pattern: |
              loop = asyncio.get_running_loop()
              ...
              await loop.run_in_executor(None, exec, request.$W.get(...))
          - pattern: |
              $V = request.$W.get(...)
              ...
              loop = asyncio.get_running_loop()
              ...
              await loop.run_in_executor(None, exec, $V)
    languages:
      - python
    severity: WARNING
