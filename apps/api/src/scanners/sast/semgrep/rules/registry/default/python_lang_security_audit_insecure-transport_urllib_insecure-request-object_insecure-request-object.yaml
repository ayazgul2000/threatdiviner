rules:
  - id: >-
      python.lang.security.audit.insecure-transport.urllib.insecure-request-object.insecure-request-object
    message: >-
      Detected a 'urllib.request.Request()' object using an insecure transport
      protocol, 'http://'. This connection will not be encrypted. Use 'https://'
      instead.
    metadata:
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      cwe:
        - 'CWE-319: Cleartext Transmission of Sensitive Information'
      references:
        - >-
          https://docs.python.org/3/library/urllib.request.html#urllib.request.Request
      category: security
      technology:
        - urllib
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Mishandled Sensitive Information
      source: >-
        https://semgrep.dev/r/python.lang.security.audit.insecure-transport.urllib.insecure-request-object.insecure-request-object
      shortlink: https://sg.run/YvAe
      semgrep.dev:
        rule:
          r_id: 9658
          rv_id: 1263491
          rule_id: X5U8Bp
          version_id: 8KT5rJD
          url: >-
            https://semgrep.dev/playground/r/8KT5rJD/python.lang.security.audit.insecure-transport.urllib.insecure-request-object.insecure-request-object
          origin: community
    severity: WARNING
    languages:
      - python
    fix-regex:
      regex: '[Hh][Tt][Tt][Pp]://'
      replacement: https://
      count: 1
    pattern-either:
      - pattern: urllib.request.Request("=~/[Hh][Tt][Tt][Pp]://.*/", ...)
      - pattern: |
          $URL = "=~/[Hh][Tt][Tt][Pp]://.*/"
          ...
          urllib.request.Request($URL, ...)
      - pattern: |
          def $FUNC(..., $URL = "=~/[Hh][Tt][Tt][Pp]://.*/", ...):
            ...
            urllib.request.Request($URL, ...)
