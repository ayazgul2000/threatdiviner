rules:
  - id: python.lang.security.deserialization.avoid-jsonpickle.avoid-jsonpickle
    patterns:
      - pattern: |
          jsonpickle.decode($PAYLOAD,...)
      - pattern-not: |
          jsonpickle.decode("...",...)
    metadata:
      owasp:
        - A08:2017 - Insecure Deserialization
        - A08:2021 - Software and Data Integrity Failures
        - A08:2025 - Software or Data Integrity Failures
      cwe:
        - 'CWE-502: Deserialization of Untrusted Data'
      references:
        - https://github.com/jsonpickle/jsonpickle#jsonpickle
        - https://www.exploit-db.com/exploits/49585
      category: security
      technology:
        - jsonpickle
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - 'Insecure Deserialization '
      source: >-
        https://semgrep.dev/r/python.lang.security.deserialization.avoid-jsonpickle.avoid-jsonpickle
      shortlink: https://sg.run/rkNP
      semgrep.dev:
        rule:
          r_id: 12069
          rv_id: 1263529
          rule_id: BYU7Kp
          version_id: jQTn58A
          url: >-
            https://semgrep.dev/playground/r/jQTn58A/python.lang.security.deserialization.avoid-jsonpickle.avoid-jsonpickle
          origin: community
    message: >-
      Avoid using `jsonpickle`, which is known to lead to code execution
      vulnerabilities. When unpickling, the serialized data could be manipulated
      to run arbitrary code. Instead, consider serializing the relevant data
      using `json` module.
    languages:
      - python
    severity: WARNING
