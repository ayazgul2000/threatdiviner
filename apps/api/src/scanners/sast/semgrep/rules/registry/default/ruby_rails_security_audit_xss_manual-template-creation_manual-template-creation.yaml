rules:
  - id: >-
      ruby.rails.security.audit.xss.manual-template-creation.manual-template-creation
    metadata:
      source-rule-url: >-
        https://github.com/presidentbeef/brakeman/blob/main/lib/brakeman/checks/check_template_injection.rb
      owasp:
        - A07:2017 - Cross-Site Scripting (XSS)
        - A03:2021 - Injection
        - A05:2025 - Injection
      cwe:
        - >-
          CWE-79: Improper Neutralization of Input During Web Page Generation
          ('Cross-site Scripting')
      references:
        - >-
          https://github.com/presidentbeef/brakeman/blob/main/docs/warning_types/template_injection/index.markdown
      category: security
      technology:
        - rails
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cross-Site-Scripting (XSS)
      source: >-
        https://semgrep.dev/r/ruby.rails.security.audit.xss.manual-template-creation.manual-template-creation
      shortlink: https://sg.run/L01L
      semgrep.dev:
        rule:
          r_id: 9739
          rv_id: 1263638
          rule_id: 4bUzR9
          version_id: w8TRoY6
          url: >-
            https://semgrep.dev/playground/r/w8TRoY6/ruby.rails.security.audit.xss.manual-template-creation.manual-template-creation
          origin: community
    message: >-
      Detected manual creation of an ERB template. Manual creation of templates
      may expose your application to server-side template injection (SSTI) or
      cross-site scripting (XSS) attacks if user input is used to create the
      template. Instead, create a '.erb' template file and use 'render'.
    languages:
      - ruby
    severity: WARNING
    pattern: ERB.new(...)
