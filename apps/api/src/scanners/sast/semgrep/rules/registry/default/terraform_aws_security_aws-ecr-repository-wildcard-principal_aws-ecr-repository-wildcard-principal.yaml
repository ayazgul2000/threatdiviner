rules:
  - id: >-
      terraform.aws.security.aws-ecr-repository-wildcard-principal.aws-ecr-repository-wildcard-principal
    patterns:
      - pattern-inside: |
          resource "aws_ecr_repository_policy" $ANYTHING {
            ...
          }
      - pattern-either:
          - patterns:
              - pattern: policy = "$JSONPOLICY"
              - metavariable-pattern:
                  metavariable: $JSONPOLICY
                  language: json
                  patterns:
                    - pattern-not-inside: |
                        {..., "Effect": "Deny", ...}
                    - pattern-either:
                        - pattern: |
                            {..., "Principal": "*", ...}
                        - pattern: |
                            {..., "Principal": [..., "*", ...], ...}
                        - pattern: |
                            {..., "Principal": { "AWS": "*" }, ...}
                        - pattern: |
                            {..., "Principal": { "AWS": [..., "*", ...] }, ...}
          - patterns:
              - pattern-inside: policy = jsonencode(...)
              - pattern-not-inside: |
                  {..., Effect = "Deny", ...}
              - pattern-either:
                  - pattern: |
                      {..., Principal = "*", ...}
                  - pattern: |
                      {..., Principal = [..., "*", ...], ...}
                  - pattern: |
                      {..., Principal = { AWS = "*" }, ...}
                  - pattern: |
                      {..., Principal = { AWS = [..., "*", ...] }, ...}
    message: >-
      Detected wildcard access granted in your ECR repository policy principal.
      This grants access to all users, including anonymous users (public
      access). Instead, limit principals, actions and resources to what you need
      according to least privilege.
    metadata:
      category: security
      technology:
        - aws
        - terraform
      owasp:
        - A05:2021 - Security Misconfiguration
        - A02:2025 - Security Misconfiguration
      cwe:
        - 'CWE-732: Incorrect Permission Assignment for Critical Resource'
      references:
        - >-
          https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/ecr_repository_policy
        - >-
          https://docs.aws.amazon.com/lambda/latest/operatorguide/wildcard-permissions-iam.html
        - >-
          https://docs.aws.amazon.com/prescriptive-guidance/latest/patterns/monitor-amazon-ecr-repositories-for-wildcard-permissions-using-aws-cloudformation-and-aws-config.html
        - https://cwe.mitre.org/data/definitions/732.html
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authorization
      source: >-
        https://semgrep.dev/r/terraform.aws.security.aws-ecr-repository-wildcard-principal.aws-ecr-repository-wildcard-principal
      shortlink: https://sg.run/nzqb
      semgrep.dev:
        rule:
          r_id: 48636
          rv_id: 1263717
          rule_id: qNUzov
          version_id: BjTkZ6A
          url: >-
            https://semgrep.dev/playground/r/BjTkZ6A/terraform.aws.security.aws-ecr-repository-wildcard-principal.aws-ecr-repository-wildcard-principal
          origin: community
    languages:
      - hcl
    severity: WARNING
