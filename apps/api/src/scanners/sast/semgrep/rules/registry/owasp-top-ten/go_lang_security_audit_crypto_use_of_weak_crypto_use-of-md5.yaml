rules:
  - id: go.lang.security.audit.crypto.use_of_weak_crypto.use-of-md5
    message: >-
      Detected MD5 hash algorithm which is considered insecure. MD5 is not
      collision resistant and is therefore not suitable as a cryptographic
      signature. Use SHA256 or SHA3 instead.
    languages:
      - go
    severity: WARNING
    metadata:
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      cwe:
        - 'CWE-328: Use of Weak Hash'
      source-rule-url: https://github.com/securego/gosec#available-rules
      category: security
      technology:
        - go
      confidence: MEDIUM
      references:
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Insecure Hashing Algorithm
      source: >-
        https://semgrep.dev/r/go.lang.security.audit.crypto.use_of_weak_crypto.use-of-md5
      shortlink: https://sg.run/2xB5
      semgrep.dev:
        rule:
          r_id: 9119
          rv_id: 1262928
          rule_id: x8Un6q
          version_id: bZT535Y
          url: >-
            https://semgrep.dev/playground/r/bZT535Y/go.lang.security.audit.crypto.use_of_weak_crypto.use-of-md5
          origin: community
    patterns:
      - pattern-inside: |
          import "crypto/md5"
          ...
      - pattern-either:
          - pattern: |
              md5.New()
          - pattern: |
              md5.Sum(...)
