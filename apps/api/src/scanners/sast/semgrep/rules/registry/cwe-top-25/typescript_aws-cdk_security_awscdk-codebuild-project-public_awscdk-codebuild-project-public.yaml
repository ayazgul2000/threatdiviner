rules:
  - id: >-
      typescript.aws-cdk.security.awscdk-codebuild-project-public.awscdk-codebuild-project-public
    message: >-
      CodeBuild Project $X is set to have a public URL. This will make the build
      results, logs, artifacts publically accessible, including builds prior to
      the project being public. Ensure this is acceptable for the project.
    metadata:
      category: security
      cwe:
        - 'CWE-306: Missing Authentication for Critical Function'
      technology:
        - AWS-CDK
      references:
        - >-
          https://docs.aws.amazon.com/codebuild/latest/userguide/public-builds.html
      owasp:
        - A07:2021 - Identification and Authentication Failures
        - A07:2025 - Authentication Failures
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authentication
      source: >-
        https://semgrep.dev/r/typescript.aws-cdk.security.awscdk-codebuild-project-public.awscdk-codebuild-project-public
      shortlink: https://sg.run/nK7G
      semgrep.dev:
        rule:
          r_id: 15280
          rv_id: 1263907
          rule_id: x8UxXZ
          version_id: DkTRbj1
          url: >-
            https://semgrep.dev/playground/r/DkTRbj1/typescript.aws-cdk.security.awscdk-codebuild-project-public.awscdk-codebuild-project-public
          origin: community
    languages:
      - ts
    severity: WARNING
    pattern-either:
      - patterns:
          - pattern-inside: |
              import {Project} from '@aws-cdk/aws-codebuild'
              ...
          - pattern: |
              const $X = new Project(..., {..., badge: true, ...})
      - patterns:
          - pattern-inside: |
              import * as $Y from '@aws-cdk/aws-codebuild'
              ...
          - pattern: |
              const $X = new $Y.Project(..., {..., badge: true, ...})
