rules:
  - id: >-
      terraform.aws.security.aws-transfer-server-is-public.aws-transfer-server-is-public
    patterns:
      - pattern: |
          resource "aws_transfer_server" $ANYTHING {
            ...
          }
      - pattern-not-inside: |
          resource "aws_transfer_server" $ANYTHING {
            ...
            endpoint_type = "VPC"
            ...
          }
    message: >-
      Transfer Server endpoint type should not have public or null configured in
      order to block public access. To fix this, set your `endpoint_type` to
      `"VPC"`.
    metadata:
      category: security
      technology:
        - terraform
        - aws
      owasp:
        - A05:2017 - Broken Access Control
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      cwe:
        - 'CWE-1220: Insufficient Granularity of Access Control'
      references:
        - https://owasp.org/Top10/A01_2021-Broken_Access_Control
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Other
      source: >-
        https://semgrep.dev/r/terraform.aws.security.aws-transfer-server-is-public.aws-transfer-server-is-public
      shortlink: https://sg.run/L39r
      semgrep.dev:
        rule:
          r_id: 17383
          rv_id: 1263745
          rule_id: qNUWl1
          version_id: ZRTKAYB
          url: >-
            https://semgrep.dev/playground/r/ZRTKAYB/terraform.aws.security.aws-transfer-server-is-public.aws-transfer-server-is-public
          origin: community
    languages:
      - hcl
    severity: WARNING
