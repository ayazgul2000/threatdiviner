rules:
  - id: python.flask.security.dangerous-template-string.dangerous-template-string
    message: >-
      Found a template created with string formatting. This is susceptible to
      server-side template injection and cross-site scripting attacks.
    metadata:
      cwe:
        - >-
          CWE-96: Improper Neutralization of Directives in Statically Saved Code
          ('Static Code Injection')
      owasp:
        - A03:2021 - Injection
        - A05:2025 - Injection
      references:
        - >-
          https://nvisium.com/blog/2016/03/09/exploring-ssti-in-flask-jinja2.html
        - https://pequalsnp-team.github.io/cheatsheet/flask-jinja2-ssti
      category: security
      technology:
        - flask
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Code Injection
      source: >-
        https://semgrep.dev/r/python.flask.security.dangerous-template-string.dangerous-template-string
      shortlink: https://sg.run/b79E
      semgrep.dev:
        rule:
          r_id: 9526
          rv_id: 1263427
          rule_id: v8UnZJ
          version_id: X0Tzy0L
          url: >-
            https://semgrep.dev/playground/r/X0Tzy0L/python.flask.security.dangerous-template-string.dangerous-template-string
          origin: community
    languages:
      - python
    severity: ERROR
    pattern-either:
      - pattern: |
          $V = "...".format(...)
          ...
          flask.render_template_string($V, ...)
      - pattern: |
          $V = "...".format(...)
          ...
          return flask.render_template_string($V, ...), $MORE
      - pattern: |
          $V = "..." % $S
          ...
          flask.render_template_string($V, ...)
      - pattern: |
          $V = "..." % $S
          ...
          return flask.render_template_string($V, ...), $MORE
      - pattern: |
          $V = "..."
          ...
          $V += $O
          ...
          flask.render_template_string($V, ...)
      - pattern: |
          $V = "..."
          ...
          $V += $O
          ...
          return flask.render_template_string($V, ...), $MORE
      - pattern: |
          $V = f"...{$X}..."
          ...
          flask.render_template_string($V, ...)
      - pattern: |
          $V = f"...{$X}..."
          ...
          return flask.render_template_string($V, ...), $CODE
