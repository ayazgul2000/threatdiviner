rules:
  - id: java.jjwt.security.jwt-none-alg.jjwt-none-alg
    message: >-
      Detected use of the 'none' algorithm in a JWT token. The 'none' algorithm
      assumes the integrity of the token has already been verified. This would
      allow a malicious actor to forge a JWT token that will automatically be
      verified. Do not explicitly use the 'none' algorithm. Instead, use an
      algorithm such as 'HS256'.
    metadata:
      cwe:
        - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      source-rule-url: >-
        https://semgrep.dev/blog/2020/hardcoded-secrets-unverified-tokens-and-other-common-jwt-mistakes/
      asvs:
        section: 'V3: Session Management Verification Requirements'
        control_id: 3.5.3 Insecue Stateless Session Tokens
        control_url: >-
          https://github.com/OWASP/ASVS/blob/master/4.0/en/0x12-V3-Session-management.md#v35-token-based-session-management
        version: '4'
      category: security
      technology:
        - jwt
      confidence: LOW
      references:
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Cryptographic Issues
      source: https://semgrep.dev/r/java.jjwt.security.jwt-none-alg.jjwt-none-alg
      shortlink: https://sg.run/0Q7b
      semgrep.dev:
        rule:
          r_id: 9154
          rv_id: 1262987
          rule_id: j2Uvol
          version_id: gETB7re
          url: >-
            https://semgrep.dev/playground/r/gETB7re/java.jjwt.security.jwt-none-alg.jjwt-none-alg
          origin: community
    languages:
      - java
    severity: ERROR
    patterns:
      - pattern: |
          io.jsonwebtoken.Jwts.builder();
      - pattern-not-inside: |-
          $RETURNTYPE $FUNC(...) {
            ...
            $JWTS.signWith(...);
            ...
          }
