rules:
  - id: java.spring.security.audit.spring-sqli.spring-sqli
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: $ARG
          - pattern-inside: |
              public $T $M (..., String $ARG,...){...}
    pattern-sanitizers:
      - not_conflicting: true
        pattern-either:
          - patterns:
              - focus-metavariable: $A
              - pattern-inside: |
                  new $TYPE(...,$A,...);
    pattern-sinks:
      - patterns:
          - pattern-either:
              - patterns:
                  - focus-metavariable: $A
                  - pattern: |
                      new PreparedStatementCreatorFactory($A,...);
              - patterns:
                  - focus-metavariable: $A
                  - pattern: |
                      (JdbcTemplate $T).$M($A,...)
              - patterns:
                  - pattern: (String $A)
                  - pattern-inside: |
                      (JdbcTemplate $T).batchUpdate(...)
              - patterns:
                  - focus-metavariable: $A
                  - pattern: |
                      NamedParameterBatchUpdateUtils.$M($A,...)
              - patterns:
                  - focus-metavariable: $A
                  - pattern: |
                      BatchUpdateUtils.$M($A,...)
    message: >-
      Detected a string argument from a public method contract in a raw SQL
      statement. This could lead to SQL injection if variables in the SQL
      statement are not properly sanitized. Use a prepared statements
      (java.sql.PreparedStatement) instead. You can obtain a PreparedStatement
      using 'connection.prepareStatement'.
    languages:
      - java
    severity: WARNING
    options:
      taint_assume_safe_numbers: true
      taint_assume_safe_booleans: true
    metadata:
      cwe:
        - >-
          CWE-89: Improper Neutralization of Special Elements used in an SQL
          Command ('SQL Injection')
      category: security
      technology:
        - spring
      owasp:
        - A01:2017 - Injection
        - A03:2021 - Injection
        - A05:2025 - Injection
      references:
        - https://owasp.org/Top10/A03_2021-Injection
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - SQL Injection
      source: https://semgrep.dev/r/java.spring.security.audit.spring-sqli.spring-sqli
      shortlink: https://sg.run/1Z3x
      semgrep.dev:
        rule:
          r_id: 9222
          rv_id: 1263082
          rule_id: eqU8N2
          version_id: ZRTKAWW
