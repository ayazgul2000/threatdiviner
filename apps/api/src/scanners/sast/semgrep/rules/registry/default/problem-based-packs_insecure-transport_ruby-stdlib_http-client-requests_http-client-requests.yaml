rules:
  - id: >-
      problem-based-packs.insecure-transport.ruby-stdlib.http-client-requests.http-client-requests
    message: >-
      Checks for requests to http (unencrypted) sites using some of ruby's most
      popular REST/HTTP libraries, including httparty and restclient.
    severity: WARNING
    metadata:
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      category: security
      cwe: 'CWE-319: Cleartext Transmission of Sensitive Information'
      owasp: A03:2017 - Sensitive Data Exposure
      references:
        - https://github.com/rest-client/rest-client
        - https://github.com/jnunemaker/httparty/tree/master/docs
      subcategory:
        - vuln
      technology:
        - httparty
        - rest-client
      vulnerability: Insecure Transport
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Mishandled Sensitive Information
      source: >-
        https://semgrep.dev/r/problem-based-packs.insecure-transport.ruby-stdlib.http-client-requests.http-client-requests
      shortlink: https://sg.run/OPQL
      semgrep.dev:
        rule:
          r_id: 9431
          rv_id: 946075
          rule_id: L1UyKG
          version_id: 0bT15Bn
          url: >-
            https://semgrep.dev/playground/r/0bT15Bn/problem-based-packs.insecure-transport.ruby-stdlib.http-client-requests.http-client-requests
          origin: community
    languages:
      - ruby
    pattern-either:
      - pattern: |
          HTTParty.$PARTYVERB("=~/[hH][tT][tT][pP]://.*/", ...)
      - pattern: |
          $STRING = "=~/[hH][tT][tT][pP]://.*/"
          ...
          HTTParty.$PARTYVERB($STRING, ...)
      - pattern: |
          RestClient.$RESTVERB "=~/[hH][tT][tT][pP]://.*/", ...
      - pattern: >
          RestClient::Request.execute(..., url: "=~/[hH][tT][tT][pP]://.*/",
          ...)
