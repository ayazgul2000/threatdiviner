              }
          - pattern-inside: |
              function $F(..., string $A, ..., string $B, ...) external {
                ...
              }
          - pattern-inside: |
              function $F(..., bytes $A, ..., string $B, ...) external {
                ...
              }
          - pattern-inside: |
