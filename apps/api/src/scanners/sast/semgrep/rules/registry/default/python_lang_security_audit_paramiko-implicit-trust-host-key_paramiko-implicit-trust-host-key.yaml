rules:
  - id: >-
      python.lang.security.audit.paramiko-implicit-trust-host-key.paramiko-implicit-trust-host-key
    patterns:
      - pattern-inside: |
          $CLIENT = paramiko.client.SSHClient(...)
          ...
          $CLIENT.set_missing_host_key_policy(...)
      - pattern-either:
          - pattern: paramiko.client.AutoAddPolicy
          - pattern: paramiko.client.WarningPolicy
    message: >-
      Detected a paramiko host key policy that implicitly trusts a server's host
      key. Host keys should be verified to ensure the connection is not to a
      malicious server. Use RejectPolicy or a custom subclass instead.
    metadata:
      cwe:
        - 'CWE-322: Key Exchange without Entity Authentication'
      owasp:
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      source-rule-url: >-
        https://github.com/PyCQA/bandit/blob/b1411bfb43795d3ffd268bef17a839dee954c2b1/bandit/plugins/ssh_no_host_key_verification.py
      references:
        - >-
          http://docs.paramiko.org/en/stable/api/client.html#paramiko.client.AutoAddPolicy
      category: security
      technology:
        - paramiko
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      confidence: LOW
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Improper Authentication
      source: >-
        https://semgrep.dev/r/python.lang.security.audit.paramiko-implicit-trust-host-key.paramiko-implicit-trust-host-key
      shortlink: https://sg.run/4xpl
      semgrep.dev:
        rule:
          r_id: 9644
          rv_id: 1263510
          rule_id: AbUzbe
          version_id: JdTzxEQ
          url: >-
            https://semgrep.dev/playground/r/JdTzxEQ/python.lang.security.audit.paramiko-implicit-trust-host-key.paramiko-implicit-trust-host-key
          origin: community
    languages:
      - python
    severity: WARNING
