rules:
  - id: >-
      scala.lang.security.audit.scala-dangerous-process-run.scala-dangerous-process-run
    patterns:
      - pattern-either:
          - pattern: $X.!
          - pattern: $X.!!
          - pattern: $X.lazyLines
      - pattern-inside: |
          import sys.process
          ...
      - pattern-not: |
          "...".!
      - pattern-not: |
          "...".!!
      - pattern-not: |
          "...".lazyLines
      - pattern-not: |
          Seq(...).!
      - pattern-not: |
          Seq(...).!!
      - pattern-not: |
          Seq(...).lazyLines
      - pattern-not-inside: |
          val $X = "..."
          ...
      - pattern-not-inside: |
          val $X = Seq(...)
          ...
    message: >-
      Found dynamic content used for the external process. This is dangerous if
      arbitrary data can reach this function call because it allows a malicious
      actor to execute commands. Use `Seq(...)` for dynamically generated
      commands.
    languages:
      - scala
    severity: ERROR
    metadata:
      category: security
      cwe:
        - >-
          CWE-78: Improper Neutralization of Special Elements used in an OS
          Command ('OS Command Injection')
      owasp:
        - A01:2017 - Injection
        - A03:2021 - Injection
        - A05:2025 - Injection
      technology:
        - scala
      confidence: LOW
      references:
        - https://owasp.org/Top10/A03_2021-Injection
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Command Injection
      source: >-
        https://semgrep.dev/r/scala.lang.security.audit.scala-dangerous-process-run.scala-dangerous-process-run
      shortlink: https://sg.run/wZBY
      semgrep.dev:
        rule:
          r_id: 17329
          rv_id: 1263679
          rule_id: 6JUEeo
          version_id: bZT53y0
          url: >-
            https://semgrep.dev/playground/r/bZT53y0/scala.lang.security.audit.scala-dangerous-process-run.scala-dangerous-process-run
          origin: community
