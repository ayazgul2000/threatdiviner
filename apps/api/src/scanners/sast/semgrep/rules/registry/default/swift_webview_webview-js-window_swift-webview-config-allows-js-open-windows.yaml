rules:
  - id: >-
      swift.webview.webview-js-window.swift-webview-config-allows-js-open-windows
    message: >-
      Webviews were observed that explictly allow JavaScript in an WKWebview to
      open windows automatically. Consider disabling this functionality if not
      required, following the principle of least privelege.
    severity: WARNING
    metadata:
      likelihood: LOW
      impact: LOW
      confidence: HIGH
      category: security
      cwe:
        - 'CWE-272: Least Privilege Violation'
      masvs:
        - 'MASVS-PLATFORM-2: The app uses WebViews securely'
      references:
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-2/
        - >-
          https://developer.apple.com/documentation/webkit/wkpreferences/1536573-javascriptcanopenwindowsautomati
      subcategory:
        - audit
      technology:
        - ios
        - macos
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Other
      source: >-
        https://semgrep.dev/r/swift.webview.webview-js-window.swift-webview-config-allows-js-open-windows
      shortlink: https://sg.run/YWLd
      semgrep.dev:
        rule:
          r_id: 66514
          rv_id: 946637
          rule_id: lBUOZk
          version_id: 9lTy1KE
          url: >-
            https://semgrep.dev/playground/r/9lTy1KE/swift.webview.webview-js-window.swift-webview-config-allows-js-open-windows
          origin: community
    languages:
      - swift
    patterns:
      - pattern: |
          $P = WKPreferences()
          ...
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  $P.JavaScriptCanOpenWindowsAutomatically  = $FALSE
                  ...
                  $P.JavaScriptCanOpenWindowsAutomatically  = $TRUE
              - pattern-not-inside: |
                  ...
                  $P.JavaScriptCanOpenWindowsAutomatically  = $TRUE
                  ...
                  $P.JavaScriptCanOpenWindowsAutomatically = $FALSE
              - pattern: |
                  $P.JavaScriptCanOpenWindowsAutomatically  = true
              - metavariable-regex:
                  metavariable: $TRUE
                  regex: ^(true)$
              - metavariable-regex:
                  metavariable: $TRUE
                  regex: (.*(?!true))
          - patterns:
              - pattern: |
                  $P.JavaScriptCanOpenWindowsAutomatically  = true
              - pattern-not-inside: |
                  ...
                  $P.JavaScriptCanOpenWindowsAutomatically  = ...
                  ...
                  $P.JavaScriptCanOpenWindowsAutomatically  = ...
