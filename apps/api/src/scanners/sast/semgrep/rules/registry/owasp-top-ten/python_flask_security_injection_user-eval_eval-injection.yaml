rules:
  - id: python.flask.security.injection.user-eval.eval-injection
    languages:
      - python
    severity: ERROR
    message: >-
      Detected user data flowing into eval. This is code injection and should be
      avoided.
    metadata:
      cwe:
        - >-
          CWE-95: Improper Neutralization of Directives in Dynamically Evaluated
          Code ('Eval Injection')
      owasp:
        - A03:2021 - Injection
        - A05:2025 - Injection
      references:
        - https://nedbatchelder.com/blog/201206/eval_really_is_dangerous.html
      category: security
      technology:
        - flask
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Code Injection
      source: >-
        https://semgrep.dev/r/python.flask.security.injection.user-eval.eval-injection
      shortlink: https://sg.run/5QpX
      semgrep.dev:
        rule:
          r_id: 9547
          rv_id: 1263436
          rule_id: 0oU54W
          version_id: w8TRoB0
          url: >-
            https://semgrep.dev/playground/r/w8TRoB0/python.flask.security.injection.user-eval.eval-injection
          origin: community
    pattern-either:
      - patterns:
          - pattern: eval(...)
          - pattern-either:
              - pattern-inside: |
                  @$APP.route($ROUTE, ...)
                  def $FUNC(..., $ROUTEVAR, ...):
                    ...
                    eval(..., <... $ROUTEVAR ...>, ...)
              - pattern-inside: |
                  @$APP.route($ROUTE, ...)
                  def $FUNC(..., $ROUTEVAR, ...):
                    ...
                    $INTERM = <... $ROUTEVAR ...>
                    ...
                    eval(..., <... $INTERM ...>, ...)
      - pattern: eval(..., <... flask.request.$W.get(...) ...>, ...)
      - pattern: eval(..., <... flask.request.$W[...] ...>, ...)
      - pattern: eval(..., <... flask.request.$W(...) ...>, ...)
      - pattern: eval(..., <... flask.request.$W ...>, ...)
      - patterns:
          - pattern-inside: |
              $INTERM = <... flask.request.$W.get(...) ...>
              ...
              eval(..., <... $INTERM ...>, ...)
          - pattern: eval(...)
      - patterns:
          - pattern-inside: |
              $INTERM = <... flask.request.$W[...] ...>
              ...
              eval(..., <... $INTERM ...>, ...)
          - pattern: eval(...)
      - patterns:
          - pattern-inside: |
              $INTERM = <... flask.request.$W(...) ...>
              ...
              eval(..., <... $INTERM ...>, ...)
          - pattern: eval(...)
      - patterns:
          - pattern-inside: |
              $INTERM = <... flask.request.$W ...>
              ...
              eval(..., <... $INTERM ...>, ...)
          - pattern: eval(...)
