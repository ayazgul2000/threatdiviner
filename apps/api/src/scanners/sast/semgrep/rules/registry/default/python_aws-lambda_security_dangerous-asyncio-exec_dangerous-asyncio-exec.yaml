rules:
  - id: python.aws-lambda.security.dangerous-asyncio-exec.dangerous-asyncio-exec
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: event
          - pattern-inside: |
              def $HANDLER(event, context):
                ...
    pattern-sinks:
      - patterns:
          - focus-metavariable: $CMD
          - pattern-either:
              - pattern: $LOOP.subprocess_exec($PROTOCOL, $CMD, ...)
              - pattern: $LOOP.subprocess_exec($PROTOCOL, [$CMD, ...], ...)
              - pattern: >-
                  $LOOP.subprocess_exec($PROTOCOL,
                  "=~/(sh|bash|ksh|csh|tcsh|zsh)/", "-c", $CMD, ...)
              - pattern: >-
                  $LOOP.subprocess_exec($PROTOCOL,
                  ["=~/(sh|bash|ksh|csh|tcsh|zsh)/", "-c", $CMD, ...], ...)
    message: >-
      Detected subprocess function '$LOOP.subprocess_exec' with argument tainted
      by `event` object. If this data can be controlled by a malicious actor, it
      may be an instance of command injection. Audit the use of this call to
      ensure it is not controllable by an external resource. You may consider
      using 'shlex.escape()'.
    metadata:
      owasp:
        - A01:2017 - Injection
        - A03:2021 - Injection
        - A05:2025 - Injection
      cwe:
        - >-
          CWE-78: Improper Neutralization of Special Elements used in an OS
          Command ('OS Command Injection')
      asvs:
        section: 'V5: Validation, Sanitization and Encoding Verification Requirements'
        control_id: 5.3.8 OS Command Injection
        control_url: >-
          https://github.com/OWASP/ASVS/blob/master/4.0/en/0x13-V5-Validation-Sanitization-Encoding.md#v53-output-encoding-and-injection-prevention-requirements
        version: '4'
      references:
        - >-
          https://docs.python.org/3/library/asyncio-eventloop.html#asyncio.loop.subprocess_exec
        - https://docs.python.org/3/library/shlex.html
      category: security
      technology:
        - python
        - aws-lambda
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: HIGH
      impact: MEDIUM
      confidence: MEDIUM
      license: >-
        Semgrep Rules License v1.0. For more details, visit
        semgrep.dev/legal/rules-license
      vulnerability_class:
        - Command Injection
      source: >-
        https://semgrep.dev/r/python.aws-lambda.security.dangerous-asyncio-exec.dangerous-asyncio-exec
      shortlink: https://sg.run/z14d
      semgrep.dev:
        rule:
          r_id: 18261
          rv_id: 1263332
          rule_id: 7KUxXg
          version_id: bZT53Ww
          url: >-
            https://semgrep.dev/playground/r/bZT53Ww/python.aws-lambda.security.dangerous-asyncio-exec.dangerous-asyncio-exec
          origin: community
    languages:
      - python
    severity: ERROR
